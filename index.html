与机会均等；后处理最优性；策略性分类"}, {"n": "Jon Kleinberg（Cornell）& Sendhil Mullainathan（Chicago）", "r": "公平指标的不可能性定理"}, {"n": "Alexandra Chouldechova（CMU）", "r": "独立证明校准与错误率均衡不可兼得，并将其与真实司法工具对接"}, {"n": "Michael Kearns & Aaron Roth（Penn）", "r": "子群公平与公平操纵；把公平审计归约为不可知学习"}, {"n": "Omer Reingold（Stanford）& Michael P. Kim", "r": "多重校准与 omnipredictor"}, {"n": "Solon Barocas（Microsoft／Cornell）", "r": "差别影响的技术—法律对应框架"}, {"n": "Suresh Venkatasubramanian & Sorelle Friedler", "r": "公平定义背后的世界观假设；公平的（不）可能性论证"}]}, {"id": "B12", "p": "B1", "num": "1.2", "name": "因果公平理论", "kind": "leaf", "pillar": "ii", "summary": "研究利用因果模型区分真正的歧视效应与表面统计相关。核心工具是把敏感属性对结果的总影响分解到不同因果路径上，只禁止那些被认为不合理的路径。", "why": "纯统计的公平指标无法区分「因为性别被歧视」和「因为选择了不同专业而结果不同」这两种情形（辛普森悖论式的伯克利招生案例）。因果公平提供了唯一能表述这一区分的语言，代价是需要一个因果图，而图本身往往不可验证。", "phases": [{"t": "中介分析的数学基础（1992–2001）", "d": "流行病学与统计学发展出直接效应与间接效应的定义，Pearl 用反事实给出自然直接／间接效应的严格定义与识别条件。这套工具原本用于研究「治疗通过什么机制起作用」，后来被整体搬用到公平上。"}, {"t": "爆发年（2017）", "d": "三篇工作同年出现：反事实公平要求「若反事实地改变个体的敏感属性，预测不变」；因果推理避免歧视把歧视定义为敏感属性经不合理路径的因果影响；路径特定效应被用作可优化的公平约束并纳入识别理论框架。这一年确立了整个子方向。"}, {"t": "分解与放松（2018–2021）", "d": "提出因果解释公式，把观测到的群体差异分解为直接、间接与伪相关三部分并给出识别条件；当因果量不可识别时，转向给出区间而非点值。同时出现路径特定的反事实公平等更精细的判据。"}, {"t": "批评与统一（2021–2023）", "d": "出现本体论层面的批评：种族、性别这类构成性属性在反事实上「改变」意味着什么并不清楚，操纵它们的假设可能不成立。作为回应，出现统一的因果公平分析框架，把各类判据组织为一个标准家族，并明确每种判据需要什么假设。"}, {"t": "大模型期（2023– ）", "d": "因果公平在生成模型上的应用刚起步：反事实数据增强、用反事实提示测量偏见。但语言模型中「因果图」是什么、敏感属性如何干预，都还没有公认的形式化。"}], "papers": [{"c": "Pearl (2001)", "t": "Direct and indirect effects", "n": "用反事实给出自然直接效应与间接效应的严格定义与识别条件，解决了传统回归中「控制中介变量」会引入偏倚的问题。这是所有路径分解式公平判据的数学底座。", "k": 1, "v": "UAI 2001"}, {"c": "Kusner, Loftus, Russell & Silva (2017)", "t": "Counterfactual fairness", "n": "提出：若在反事实世界中改变个体的敏感属性、预测保持不变，则该预测是公平的。它第一次把公平定义在个体的反事实层面，而非群体的统计层面。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Kilbertus, Rojas-Carulla, Parascandolo, Hardt, Janzing & Schölkopf (2017)", "t": "Avoiding discrimination through causal reasoning", "n": "把歧视定义为敏感属性经「不合理路径」传递的因果影响，并给出在给定因果图下判定与消除的准则。它明确指出统计判据无法区分合理与不合理的差异来源。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Nabi & Shpitser (2018)", "t": "Fair inference on outcomes", "n": "用路径特定效应作为约束，并把它放进完整的识别理论框架中，给出不可识别时的处理方式。它是因果公平里技术上最严格的一支。", "v": "AAAI 2018"}, {"c": "Zhang & Bareinboim (2018)", "t": "Fairness in decision-making — the causal explanation formula", "n": "给出因果解释公式，把观测到的总差异精确分解为直接歧视、间接歧视与伪相关三部分，并给出各部分的识别条件。它让「这个差距里有多少是歧视」成为一个可计算的量。", "k": 1, "v": "AAAI 2018"}, {"c": "Chiappa (2019)", "t": "Path-specific counterfactual fairness", "n": "允许指定哪些路径是可接受的，只对不可接受路径施加反事实不变性，并给出深度隐变量模型的推断方法。它把反事实公平从全有全无变成可细调。", "v": "AAAI 2019"}, {"c": "Wu, Zhang, Wu & Tong (2019)", "t": "PC-fairness: a unified framework for measuring causality-based fairness", "n": "统一了此前各类因果公平判据，并在因果量不可识别时给出紧的上下界。它使因果公平在图信息不完整时仍然可用。", "v": "NeurIPS 2019"}, {"c": "Karimi, von Kügelgen, Schölkopf & Valera (2020)", "t": "Algorithmic recourse under imperfect causal knowledge", "n": "处理因果图未知或部分已知时的干预效果推断，用概率保证代替点估计。它直面因果方法最大的软肋——图从哪来。", "v": "NeurIPS 2020"}, {"c": "Kasirzadeh & Smart (2021)", "t": "The use and misuse of counterfactuals in ethical machine learning", "n": "从哲学层面指出：对种族、性别等构成性社会属性做反事实操纵，在本体论上可疑，可能把社会结构问题误置为个体属性问题。这是对整条路线最重要的外部批评。", "v": "FAccT 2021"}, {"c": "Plecko & Bareinboim (2022)", "t": "Causal fairness analysis", "n": "提出统一框架，把各类因果公平判据组织成标准家族，并给出「给定什么假设可以回答什么问题」的对照表。它是目前进入该领域最系统的入口。", "k": 1, "v": "Foundations and Trends in Machine Learning"}], "people": [{"n": "Judea Pearl", "r": "自然直接／间接效应的定义与识别——因果中介分析"}, {"n": "Matt Kusner & Ricardo Silva（UCL）", "r": "反事实公平"}, {"n": "Bernhard Schölkopf & Niki Kilbertus（MPI／TU Munich）", "r": "用因果推理定义与避免歧视；路径层面的公平判据"}, {"n": "Ilya Shpitser & Razieh Nabi（JHU／Emory）", "r": "路径特定效应的公平推断与识别理论"}, {"n": "Elias Bareinboim & Drago Plecko（Columbia）", "r": "因果解释公式；因果公平分析的统一框架"}, {"n": "Silvia Chiappa（DeepMind）", "r": "路径特定反事实公平"}, {"n": "Lu Zhang & Yongkai Wu（Arkansas／Clemson）", "r": "PC-fairness——因果公平判据的统一与界"}, {"n": "Atoosa Kasirzadeh（Edinburgh／CMU）", "r": "对反事实公平的本体论批评"}]}, {"id": "B13", "p": "B1", "num": "1.3", "name": "公平约束学习理论", "kind": "leaf", "pillar": "ii", "summary": "研究在控制预测风险的同时如何满足公平约束，以及这类约束优化的算法、统计一致性、泛化保证与精度代价。", "why": "前两个子方向定义公平，这个子方向负责实现它。核心难点是公平约束通常是不可微、数据依赖甚至非凸的，且在有限样本上满足约束不等于在总体上满足——公平本身需要泛化保证，这一点长期被忽视。", "phases": [{"t": "三类干预路线成型（2013–2017）", "d": "预处理（改数据或表示）、处理中（改目标函数）、后处理（改阈值）三条路线确立。后处理被证明在已有分数最优时即可达到最优公平分类器；处理中路线则用协方差等代理把不可微约束凸化，使标准求解器可用。"}, {"t": "归约与统一（2017–2018）", "d": "证明「先学一个准确模型再修正」的两阶段做法一般不最优，必须联合优化。随后出现归约框架：把满足任意群体公平定义的分类问题化为一系列代价敏感分类问题，用鞍点方法求解，同时给出精度与公平违反度的双重保证。这是该方向最干净的理论成果。"}, {"t": "泛化与统计理论（2018–2020）", "d": "建立公平约束经验风险最小化的一致性与泛化界，说明需要多少样本才能保证总体上也公平；并处理不可微、数据依赖、比例型约束的优化理论。"}, {"t": "代价的量化（2018–2022）", "d": "用代价敏感视角给出公平的精度代价闭式；用最优传输给出公平回归的极小极大最优解及其代价；并证明表示层公平存在信息论下界——只要各群体的标签分布不同，强行对齐表示必然带来无法消除的精度损失。"}, {"t": "稳健性问题（2021– ）", "d": "发现公平性在分布偏移下不保持：在源域满足的公平约束迁移到目标域后普遍失效。这把公平与分布偏移两个分支连了起来，也说明部署时的公平审计不能只做一次。"}], "papers": [{"c": "Hardt, Price & Srebro (2016)", "t": "Equality of opportunity in supervised learning", "n": "证明在已有分数是贝叶斯最优时，最优的均等几率分类器可由逐群体阈值化与随机化得到。它给出后处理路线的最优性依据，也是所有约束方法的比较基准。", "k": 1, "v": "NeurIPS 2016"}, {"c": "Zafar, Valera, Gomez-Rodriguez & Gummadi (2017)", "t": "Fairness constraints: mechanisms for fair classification", "n": "用敏感属性与决策边界距离的协方差作为代理，把不可微的公平约束凸化为可用标准求解器处理的形式。它是处理中路线第一个实用且可扩展的方案。", "v": "AISTATS 2017"}, {"c": "Woodworth, Gunasekar, Ohannessian & Srebro (2017)", "t": "Learning non-discriminatory predictors", "n": "证明「先学最优预测器再做后处理」在一般情形下严格次优，必须在学习阶段就考虑约束；并给出非歧视预测器的样本复杂度分析。", "k": 1, "v": "COLT 2017"}, {"c": "Agarwal, Beygelzimer, Dudík, Langford & Wallach (2018)", "t": "A reductions approach to fair classification", "n": "把满足任意线性群体公平定义的分类问题归约为一系列代价敏感分类，用无悔博弈求解，并给出精度与约束违反的收敛保证。它使任何现成分类器都能被套上公平约束。", "k": 1, "v": "ICML 2018"}, {"c": "Donini, Oneto, Ben-David, Shawe-Taylor & Pontil (2018)", "t": "Empirical risk minimization under fairness constraints", "n": "建立公平约束下 ERM 的一致性与泛化界，明确指出公平本身也需要泛化——训练集上满足约束不蕴含总体上满足。", "k": 1, "v": "NeurIPS 2018"}, {"c": "Cotter, Jiang, Gupta et al. (2019)", "t": "Optimization with non-differentiable constraints with applications to fairness", "n": "用两玩家博弈处理不可微与数据依赖的约束，并给出随机分类器意义下的收敛与泛化保证。它解决了实际公平约束几乎都不可微这一工程障碍。", "v": "JMLR"}, {"c": "Menon & Williamson (2018)", "t": "The cost of fairness in binary classification", "n": "用代价敏感学习的语言给出公平约束带来的精度损失的显式刻画，说明代价如何随群体基率差异变化。它把「公平要付多少钱」变成可计算的量。", "v": "FAT* 2018（现 FAccT）"}, {"c": "Zhao & Gordon (2019, 2022)", "t": "Inherent tradeoffs in learning fair representations", "n": "给出表示层公平的信息论下界：当各群体的标签边缘分布不同时，任何满足人口均等的表示都会带来正的联合误差下界。它解释了对抗式去偏方法为何总是损失精度。", "k": 1, "v": "NeurIPS 2019 / JMLR 2022"}, {"c": "Chzhen, Denis, Hebiri, Oneto & Pontil (2020)", "t": "Fair regression with Wasserstein barycenters", "n": "证明满足人口均等的最优公平回归函数是各群体条件分布的 Wasserstein 重心，并给出精度代价的闭式与极小极大最优估计。这是公平学习中最优美的统计结果之一。", "k": 1, "v": "NeurIPS 2020"}, {"c": "Schrouff et al. (2022)", "t": "Diagnosing failures of fairness transfer across distribution shift in real-world medical settings", "n": "在真实医疗数据上证明源域满足的公平约束迁移到目标域后普遍失效，并分类了失效的机制。它说明一次性的公平认证在部署中不成立。", "v": "NeurIPS 2022"}], "people": [{"n": "Nathan Srebro（TTIC）", "r": "非歧视预测器理论；证明两阶段做法次优"}, {"n": "Alekh Agarwal、Miroslav Dudík & John Langford（Microsoft）", "r": "公平分类的归约框架——把公平约束化为代价敏感分类序列"}, {"n": "Massimiliano Pontil & Michele Donini（UCL／Amazon）", "r": "公平约束 ERM 的一致性与泛化理论"}, {"n": "Robert Williamson & Aditya Menon（Tübingen／Google）", "r": "公平的精度代价的代价敏感刻画"}, {"n": "Philippe Rigollet（MIT）& Jean-Michel Loubes", "r": "公平回归的 Wasserstein 重心解与极小极大最优性"}, {"n": "Han Zhao（UIUC）", "r": "公平表示学习的信息论下界"}, {"n": "Krishna Gummadi & Muhammad Bilal Zafar（MPI-SWS）", "r": "公平约束的凸代理与不同影响／不同处理的区分"}, {"n": "Maya Gupta & Andrew Cotter（Google）", "r": "不可微与数据依赖约束的两玩家优化理论"}]}, {"id": "B2", "p": "B", "num": "2", "name": "隐私保护学习理论", "kind": "group", "pillar": "ii", "summary": "研究机器学习过程中如何限制对训练数据和个人信息的泄露。", "extra": "三个子方向分别回答：怎样严格定义隐私并设计满足它的算法（差分隐私）、为此必须付出多少精度与样本代价（隐私—效用权衡）、以及事后如何撤回某条数据的影响（机器遗忘）。这一支是可信 AI 里数学最成熟的部分——隐私有一个被普遍接受的形式化定义，这在其他方向上都还没做到。"}, {"id": "B21", "p": "B2", "num": "2.1", "name": "差分隐私学习理论", "kind": "leaf", "pillar": "ii", "summary": "研究用严格的概率定义限制单个样本对模型输出的影响：改变数据集中任意一条记录，输出分布的变化被 e^ε 因子界住。核心内容包括机制设计、组合定理、隐私放大与私有学习算法。", "why": "差分隐私之所以成为标准，在于它有三条其他隐私概念不具备的性质：不依赖攻击者的背景知识、对后处理封闭、可组合。这使得复杂系统的隐私损失可以像预算一样被累加与管理，从而第一次让「隐私」成为一个可工程化的量。", "phases": [{"t": "定义与基本机制（2006–2010）", "d": "ε-差分隐私被提出，配合拉普拉斯机制与敏感度概念，给出第一批可证明的算法；随后指数机制把它推广到非数值输出。高级组合定理证明多次访问的隐私损失以根号而非线性增长，使复杂算法在可接受预算内成为可能。"}, {"t": "私有学习的理论框架（2008–2014）", "d": "私有 PAC 学习被定义，并证明本地模型下的私有学习能力恰好等于统计查询学习——这给出了本地差分隐私的能力上限。同期私有经验风险最小化的目标扰动方法给出凸问题上的最优率。"}, {"t": "深度学习的可行化（2016）", "d": "DP-SGD 通过逐样本梯度裁剪加噪声，配合矩会计精确追踪隐私损失，第一次让深度模型的私有训练在可用精度下实现。这是整个方向从理论走向实践的转折点。"}, {"t": "精细会计与新变体（2017–2021）", "d": "Rényi 差分隐私与高斯差分隐私用更适合组合的散度或假设检验权衡函数刻画隐私，得到显著更紧的界；子采样、洗牌与迭代带来的隐私放大被系统化，使同样的噪声换来更强的保证。"}, {"t": "与学习理论的深层连接（2019– ）", "d": "证明私有 PAC 可学等价于有限 Littlestone 维，即等价于在线可学。这是学习理论近十年最漂亮的等价刻画之一，把隐私、在线学习与稳定性统一起来。同时大模型时代的抽取攻击证明无保护的模型确实会逐字泄露训练数据，把差分隐私从可选项推向必需项。"}], "papers": [{"c": "Dwork, McSherry, Nissim & Smith (2006)", "t": "Calibrating noise to sensitivity in private data analysis", "n": "提出 ε-差分隐私定义与拉普拉斯机制，第一次给「隐私」一个不依赖攻击者知识、对后处理封闭且可组合的数学定义。这是整个领域的公理。", "k": 1, "v": "TCC 2006"}, {"c": "McSherry & Talwar (2007)", "t": "Mechanism design via differential privacy", "n": "提出指数机制，把差分隐私从数值查询推广到任意输出空间上的选择问题。它使私有的模型选择、私有的拍卖设计等成为可能。", "v": "FOCS 2007"}, {"c": "Dwork, Rothblum & Vadhan (2010)", "t": "Boosting and differential privacy", "n": "证明高级组合定理：k 次 ε-DP 访问的总隐私损失约为 √k·ε 而非 k·ε。它把隐私预算的消耗速度降低了一个数量级，是复杂私有算法可行的关键。", "k": 1, "v": "FOCS 2010"}, {"c": "Kasiviswanathan, Lee, Nissim, Raskhodnikova & Smith (2011)", "t": "What can we learn privately?", "n": "定义私有 PAC 学习，并证明本地差分隐私下可学的概念类恰为统计查询可学的类。这既给出本地模型的能力上限，也解释了为何本地 DP 在高维上代价巨大。", "k": 1, "v": "SIAM Journal on Computing（FOCS 2008 会议版）"}, {"c": "Chaudhuri, Monteleoni & Sarwate (2011)", "t": "Differentially private empirical risk minimization", "n": "提出目标扰动：向优化目标而非输出加噪，给出凸 ERM 上更优的隐私—效用权衡。它是私有学习算法设计的基本范式之一。", "v": "JMLR"}, {"c": "Abadi, Chu, Goodfellow, McMahan, Mironov, Talwar & Zhang (2016)", "t": "Deep learning with differential privacy", "n": "提出 DP-SGD 与矩会计：逐样本裁剪梯度并加高斯噪声，同时精确追踪隐私损失。它第一次让深度模型的差分隐私训练在可接受的精度下变得可行。", "k": 1, "v": "ACM CCS 2016"}, {"c": "Mironov (2017)", "t": "Rényi differential privacy", "n": "用 Rényi 散度重新表述隐私损失，使高斯机制的多次组合有闭式且更紧的会计。它现在是几乎所有 DP 训练库的默认会计方式。", "v": "IEEE CSF 2017"}, {"c": "Bassily, Smith & Thakurta (2014)", "t": "Private empirical risk minimization: efficient algorithms and tight error bounds", "n": "给出私有凸 ERM 误差的匹配上下界（约 √d/(nε)），确定了这一基本问题的最优率。它是隐私—效用权衡最干净的定量结果。", "k": 1, "v": "FOCS 2014"}, {"c": "Dong, Roth & Su (2022)", "t": "Gaussian differential privacy", "n": "用假设检验的权衡函数刻画隐私，得到在组合下封闭且渐近为高斯型的 f-DP 框架，并给出中心极限定理。它是差分隐私会计理论的当代形态。", "k": 1, "v": "JRSS-B"}, {"c": "Alon, Livni, Malliaris & Moran (2019)", "t": "Private PAC learning implies finite Littlestone dimension", "n": "证明可私有 PAC 学习的概念类必有有限 Littlestone 维，即必然在线可学；后续工作证明反向也成立。这把隐私与在线学习完全等价起来，是学习理论近年最深刻的结果之一。", "k": 1, "v": "STOC 2019"}], "people": [{"n": "Cynthia Dwork（Harvard）", "r": "差分隐私的定义者；高级组合定理；获 Gödel 奖与 Knuth 奖"}, {"n": "Frank McSherry", "r": "指数机制；差分隐私的可组合编程框架"}, {"n": "Kobbi Nissim（Georgetown）& Adam Smith（BU）", "r": "敏感度框架；私有 PAC 学习；重构攻击的理论"}, {"n": "Salil Vadhan（Harvard）", "r": "组合定理与差分隐私的复杂性理论基础"}, {"n": "Aaron Roth（Penn）", "r": "差分隐私与算法公平、自适应数据分析的交叉；f-DP"}, {"n": "Kunal Talwar & Abhradeep Thakurta（Apple／Google）", "r": "私有凸优化的最优率；DP-SGD"}, {"n": "Ilya Mironov", "r": "Rényi 差分隐私"}, {"n": "Shay Moran & Roi Livni（Technion／TAU）", "r": "私有可学与在线可学的等价刻画"}, {"n": "苏炜杰 Weijie Su（Penn）", "r": "高斯差分隐私（f-DP）框架与中心极限定理"}, {"n": "Nicholas Carlini（Anthropic）", "r": "从语言模型中逐字抽取训练数据，证明记忆化的现实风险"}]}, {"id": "B22", "p": "B2", "num": "2.2", "name": "隐私—效用与样本复杂度理论", "kind": "leaf", "pillar": "ii", "summary": "研究达到一定隐私强度必须付出多少精度和样本代价：上界与下界、极小极大率、以及什么任务在给定隐私预算下根本不可学。", "why": "这个方向的结果大多是负面的，但正因如此才有价值——它划定了隐私保护的物理边界。例如本地差分隐私把有效样本量从 n 降到 nε²，在高维下代价是灾难性的；而在无限定义域上，纯差分隐私连最简单的阈值函数都学不了。这些结论直接决定了系统架构该选中心模型还是本地模型。", "phases": [{"t": "隐私的基本定律（2003–2008）", "d": "重构攻击证明：如果对数据库的查询回答得太多太准，攻击者可以近似重构整个数据库。这一结果先于差分隐私出现，并解释了为什么必须加噪——它是隐私领域的第一条不可能性定理，后来被用于分析美国人口普查数据发布。"}, {"t": "私有学习代价的刻画（2011–2015）", "d": "证明本地模型的能力等于统计查询学习；用表示维刻画纯差分隐私学习的样本复杂度；并证明在无限定义域上私有学习阈值函数需要与定义域规模相关的样本量，即纯差分隐私下不可学。这批结果说明隐私的代价有时是定性的而非定量的。"}, {"t": "凸优化与统计估计的紧界（2013–2018）", "d": "私有凸经验风险最小化的误差上下界被匹配；本地差分隐私下的统计极小极大率被系统建立，给出「隐私把有效样本量从 n 变成 nε²」这一简洁而深刻的结论。"}, {"t": "中间模型与放大（2019–2021）", "d": "洗牌模型被证明介于中心与本地之间，能以本地模型的信任假设换取接近中心模型的精度；子采样、迭代与洗牌带来的隐私放大被系统量化，成为实际系统降低代价的主要手段。"}, {"t": "根本冲突与大模型（2020– ）", "d": "证明在长尾分布下，泛化必须依赖对稀有样本的记忆，而记忆正是隐私要防止的——这揭示了隐私与效用之间一个结构性而非技术性的冲突。大模型时代则发现差分隐私微调的效用差距主要来自特征质量，预训练充分时隐私代价显著下降。"}], "papers": [{"c": "Dinur & Nissim (2003)", "t": "Revealing information while preserving privacy", "n": "证明若对数据库回答足够多的近似查询，攻击者可重构几乎全部记录。这条「隐私的基本定律」说明任何有用的数据发布都必须引入足够的噪声。", "k": 1, "v": "PODS 2003"}, {"c": "Kasiviswanathan, Lee, Nissim, Raskhodnikova & Smith (2011)", "t": "What can we learn privately?", "n": "证明本地差分隐私下的私有学习恰等价于统计查询学习，从而给出本地模型能力的精确上限，并解释了它在高维任务上的固有劣势。", "k": 1, "v": "SIAM Journal on Computing"}, {"c": "Beimel, Nissim & Stemmer (2013, 2019)", "t": "Characterizing the sample complexity of pure private learners", "n": "用表示维给出纯 ε-差分隐私学习样本复杂度的刻画，说明它可能远高于非私有学习。它是第一批把「隐私的样本代价」精确化的结果。", "v": "ITCS 2013 / JMLR 2019"}, {"c": "Bassily, Smith & Thakurta (2014)", "t": "Private ERM: efficient algorithms and tight error bounds", "n": "给出私有凸经验风险最小化误差的匹配上下界，确定这一基础问题的最优率。此后所有私有优化算法都以这个界为标尺。", "k": 1, "v": "FOCS 2014"}, {"c": "Duchi, Jordan & Wainwright (2013, 2018)", "t": "Local privacy and statistical minimax rates", "n": "建立本地差分隐私下的统计极小极大理论，给出「隐私把有效样本量从 n 降为 nε²」这一核心结论，并在均值估计、密度估计等问题上给出精确代价。", "k": 1, "v": "JASA（FOCS 2013 会议版）"}, {"c": "Bun, Nissim, Stemmer & Vadhan (2015)", "t": "Differentially private release and learning of threshold functions", "n": "证明私有学习阈值函数的样本复杂度与定义域规模呈 log* 关系，因而在无限定义域上纯差分隐私不可学。这是隐私代价定性化的最著名例子。", "k": 1, "v": "FOCS 2015"}, {"c": "Alon, Livni, Malliaris & Moran (2019)", "t": "Private PAC learning implies finite Littlestone dimension", "n": "证明可私有学习蕴含有限 Littlestone 维。它把「什么能被私有地学」这一问题化归为一个纯组合的在线学习量。", "k": 1, "v": "STOC 2019"}, {"c": "Bun, Livni & Moran (2020)", "t": "An equivalence between private classification and online prediction", "n": "给出反方向：有限 Littlestone 维蕴含可私有学习，从而完成等价刻画。私有可学与在线可学被证明是同一件事。", "k": 1, "v": "FOCS 2020"}, {"c": "Feldman (2020)", "t": "Does learning require memorization? A short tale about a long tail", "n": "证明在长尾分布下，接近最优的泛化必须记住大量只出现一次的样本。这说明隐私与效用的冲突不是算法不够好，而是问题本身的结构性质。", "k": 1, "v": "STOC 2020"}, {"c": "Tramèr & Boneh (2021)", "t": "Differentially private learning needs better features (not more data)", "n": "证明差分隐私深度学习的效用差距主要源自特征表示而非优化或噪声，用好的手工或预训练特征可大幅缩小差距。它改变了该领域的研究重心。", "v": "ICLR 2021"}], "people": [{"n": "Irit Dinur & Kobbi Nissim", "r": "重构攻击——隐私的基本定律"}, {"n": "Adam Smith（BU）", "r": "私有 PAC 学习框架；私有优化的紧界"}, {"n": "Mark Bun（BU）& Uri Stemmer（TAU）", "r": "阈值函数的私有学习下界；私有可学与在线可学的等价"}, {"n": "Shay Moran & Roi Livni", "r": "私有分类与在线预测的等价定理"}, {"n": "John Duchi、Michael I. Jordan & Martin Wainwright（Berkeley／Stanford）", "r": "本地差分隐私的统计极小极大理论"}, {"n": "Raef Bassily & Abhradeep Thakurta", "r": "私有凸 ERM 的匹配上下界"}, {"n": "Vitaly Feldman（Apple）", "r": "证明长尾泛化必须依赖记忆——隐私与效用的结构性冲突"}, {"n": "Florian Tramèr（ETH）", "r": "指出私有深度学习的瓶颈在特征而非噪声；隐私攻击的系统化评估"}]}, {"id": "B23", "p": "B2", "num": "2.3", "name": "机器遗忘理论", "kind": "leaf", "pillar": "ii", "summary": "研究如何让模型有理论保证地消除特定训练数据的影响，使删除后的模型与从未见过该数据训练出的模型不可区分（或近似不可区分），并刻画其计算、存储与精度代价。", "why": "这是被遗忘权在技术上的对应物。它与差分隐私的关键区别在于：差分隐私要求对所有样本一视同仁地保护，代价高昂；遗忘只要求事后撤回被点名的样本，因此原则上可以便宜得多。这个「严格更弱因而更便宜」的关系是该方向存在的理由，也已被严格证明。", "phases": [{"t": "问题的提出（2015–2018）", "d": "最早把「让系统忘记」形式化：如果学习算法能写成统计查询的求和形式，就能通过增量更新精确撤销某条数据。GDPR 的被遗忘权随后使这个学术问题变成了合规需求，需求端推动了整个方向的爆发。"}, {"t": "精确遗忘与定义（2019–2021）", "d": "给出删除操作的形式化定义（删除后模型分布与重训分布相同）与摊还代价下界；工程上提出分片—切片—聚合的架构，把重训代价限制在受影响的分片内。这成为精确遗忘至今的标准方案。"}, {"t": "近似与认证遗忘（2020–2021）", "d": "借用差分隐私的语言定义 (ε,δ)-认证遗忘：删除后的模型与重训模型的分布不可区分。凸模型上用影响函数近似加噪声即可颁发证书；同时给出基于梯度下降的遗忘算法及其在对抗性删除请求序列下的摊还保证。"}, {"t": "可审计性与困难性（2022–2023）", "d": "证明在算法层面定义的遗忘无法被审计——同一个模型参数可以由「删过」和「没删过」两条路径得到，因此遗忘只能在模型分布层面定义。同时出现针对遗忘系统的攻击：精心构造的删除请求可使系统的重训代价爆炸。"}, {"t": "大模型期（2023– ）", "d": "大模型遗忘成为热点（有害知识移除、版权数据移除），出现专门基准。但研究普遍发现：当前方法只是抑制了输出而非移除了知识，被遗忘的内容常能通过上下文、微调或改写提示重新引出。因此严格意义上的 LLM 遗忘目前尚不构成安全保证。"}], "papers": [{"c": "Cao & Yang (2015)", "t": "Towards making systems forget with machine unlearning", "n": "提出机器遗忘概念，指出把学习算法改写为统计查询的求和形式后，删除一条数据只需减去它的贡献。它定义了这个研究方向。", "k": 1, "v": "IEEE S&P 2015"}, {"c": "Ginart, Guan, Valiant & Zou (2019)", "t": "Making AI forget you: data deletion in machine learning", "n": "给出数据删除的形式化定义（删除后与重训同分布）与摊还计算代价的下界，并在 k-means 上给出高效算法。它把遗忘从工程技巧变成有理论的问题。", "k": 1, "v": "NeurIPS 2019"}, {"c": "Bourtoule, Chandrasekaran, Choquette-Choo, Jia, Travers, Zhang, Lie & Papernot (2021)", "t": "Machine unlearning (SISA)", "n": "用分片、切片与聚合的训练架构，使删除只需重训受影响的分片，把精确遗忘的代价降到可接受范围。它是至今工程上最被采用的方案。", "k": 1, "v": "IEEE S&P 2021"}, {"c": "Guo, Goldstein, Hannun & van der Maaten (2020)", "t": "Certified data removal from machine learning models", "n": "借差分隐私的语言定义认证移除，用牛顿步近似加噪声，在凸模型上给出与重训不可区分的证书。它开创了近似遗忘这一更实用的路线。", "k": 1, "v": "ICML 2020"}, {"c": "Neel, Roth & Sharifi-Malvajerdi (2021)", "t": "Descent-to-delete: gradient-based methods for machine unlearning", "n": "给出基于梯度下降的遗忘算法，并首次考虑对抗性构造的删除请求序列，给出摊还的精度与计算保证。它把遗忘放进了在线对抗的框架。", "v": "ALT 2021"}, {"c": "Sekhari, Acharya, Kamath & Suresh (2021)", "t": "Remember what you want to forget: algorithms for machine unlearning", "n": "从泛化而非经验风险的角度分析遗忘，给出在不损失总体精度前提下可删除样本数的上界，并证明遗忘严格弱于差分隐私因而可以更便宜。", "k": 1, "v": "NeurIPS 2021"}, {"c": "Gupta, Jung, Neel, Roth, Sharifi-Malvajerdi & Waites (2021)", "t": "Adaptive machine unlearning", "n": "处理删除请求依赖于已发布模型（自适应）的情形，给出仍然成立的保证。这是现实场景——用户看到模型输出后才决定要求删除。", "v": "NeurIPS 2021"}, {"c": "Thudi, Jia, Shumailov & Papernot (2022)", "t": "On the necessity of auditable algorithmic definitions for machine unlearning", "n": "证明任何在算法层面定义的遗忘都无法被审计：同一组参数可由删过与未删过两条路径得到。因此遗忘必须在模型分布层面定义。", "k": 1, "v": "USENIX Security 2022"}, {"c": "Maini, Feng, Schwarzschild, Lipton & Kolter (2024)", "t": "TOFU: a task of fictitious unlearning for LLMs", "n": "用虚构人物的合成传记构造可控的遗忘评测基准，避免了「模型是否本来就不知道」的混淆。它使 LLM 遗忘第一次可以被公平比较。", "v": "COLM 2024"}, {"c": "Shumailov, Hayes, Triantafillou et al. (2024)", "t": "UnUnlearning: unlearning is not sufficient for content regulation in advanced generative AI", "n": "证明被遗忘的知识可通过上下文重新引入，因而参数层面的遗忘不能作为内容管控的手段。它给当前 LLM 遗忘研究划定了能力边界。", "k": 1, "v": "arXiv 预印本"}], "people": [{"n": "Yinzhi Cao（JHU）", "r": "提出机器遗忘问题与统计查询形式的撤销"}, {"n": "James Zou & Gregory Valiant（Stanford）", "r": "数据删除的形式化定义与摊还代价下界"}, {"n": "Nicolas Papernot（Toronto／Vector）", "r": "SISA 分片遗忘架构；证明算法层遗忘定义不可审计"}, {"n": "Aaron Roth & Seth Neel（Penn／Harvard）", "r": "descent-to-delete；自适应与对抗性删除请求下的保证"}, {"n": "Ayush Sekhari & Ananda Theertha Suresh", "r": "遗忘的泛化理论；证明遗忘严格弱于差分隐私"}, {"n": "Chuan Guo & Laurens van der Maaten（Meta）", "r": "认证数据移除"}, {"n": "Zico Kolter & Zachary Lipton（CMU）", "r": "TOFU——LLM 遗忘的可控评测基准"}, {"n": "Ilia Shumailov & Eleni Triantafillou（DeepMind）", "r": "证明参数层遗忘不足以实现内容管控"}]}, {"id": "B3", "p": "B", "num": "3", "name": "可解释与可审计学习理论", "kind": "group", "pillar": "ii", "summary": "研究如何从模型的输入输出行为中理解、验证和检查黑箱模型。", "extra": "三个子方向对应三种不同的追问：为什么是这个结果（特征归因）、要改变什么才能得到别的结果（反事实与补救）、以及外部第三方能否在有限访问下验证模型确实满足某项性质（审计与性质检验）。前两者面向被决策的个人，后者面向监管者。这一支的近年主旋律是自我批评——多个曾被广泛采用的解释方法被证明并不比随机猜测更能揭示模型行为。"}, {"id": "B31", "p": "B3", "num": "3.1", "name": "特征归因理论", "kind": "leaf", "pillar": "ii", "summary": "研究如何严格量化不同输入特征对模型预测的贡献。主要路线是博弈论的 Shapley 值分配、梯度与路径积分的公理化方法，以及局部代理模型。", "why": "归因的困难不在于计算，而在于「贡献」本身没有唯一定义：必须先规定「特征缺席」是什么意思（用什么基线、按边缘还是条件分布积分），而不同规定给出不同答案。这个方向近五年最重要的结果是一系列不可能性与失效证明，说明许多广泛使用的归因图对模型参数并不敏感。", "phases": [{"t": "博弈论基础（1953）", "d": "Shapley 值被证明是唯一同时满足有效性、对称性、虚拟性与可加性的合作博弈收益分配方案。半个世纪后它被直接搬来做特征贡献分配——特征即玩家，预测值即总收益。"}, {"t": "深度模型的归因方法（2013–2017）", "d": "梯度显著图、逐层相关性传播、DeepLIFT 相继出现，但缺乏统一标准。随后两条主线确立：积分梯度用路径积分同时满足完备性、敏感性与实现不变性；SHAP 证明 LIME、DeepLIFT、LRP 等方法都可纳入 Shapley 加性解释的统一框架，并给出高效近似。"}, {"t": "失效检验（2018–2019）", "d": "发现许多显著图在模型权重被随机化后几乎不变，说明它们更像边缘检测器而非模型解释；也发现对输入做常数平移会使归因剧变。同期在 NLP 中证明注意力权重与模型实际依赖不一致。这批工作让社区从「造方法」转向「验方法」。"}, {"t": "理论化与不唯一性（2020–2021）", "d": "证明 Shapley 值在模型解释中不唯一：按条件期望还是边缘期望定义缺席、选什么基线，会给出实质不同甚至矛盾的归因，且没有原则性的理由偏好某一种。同时归因方法被统一为「移除特征再看差异」这一大类并给出统计分析。"}, {"t": "不可能性与转向机制（2022– ）", "d": "证明满足完备性与线性性的整类归因方法，在推断模型行为（如反事实结果）这一任务上不优于随机猜测。研究重心随之从「哪个特征重要」转向机制可解释性——用因果中介、激活修补去定位承担特定功能的内部电路。"}], "papers": [{"c": "Shapley (1953)", "t": "A value for n-person games", "n": "证明存在唯一满足四条公理的合作博弈收益分配。它给「贡献」一个不依赖具体算法的规范定义，是所有归因方法的公理来源。", "k": 1, "v": "Contributions to the Theory of Games II（Princeton University Press）"}, {"c": "Ribeiro, Singh & Guestrin (2016)", "t": "Why should I trust you? Explaining the predictions of any classifier (LIME)", "n": "提出在待解释样本邻域内拟合一个稀疏线性代理模型。它把解释形式化为「局部保真 + 自身可理解」的优化问题，并对任何黑箱适用。", "k": 1, "v": "KDD 2016"}, {"c": "Sundararajan, Taly & Yan (2017)", "t": "Axiomatic attribution for deep networks (Integrated Gradients)", "n": "先提出归因应满足的公理（敏感性、实现不变性、完备性），证明朴素梯度违反它们，再构造沿基线到输入路径积分梯度的方法唯一地满足它们。这是归因方法公理化的范本。", "k": 1, "v": "ICML 2017"}, {"c": "Lundberg & Lee (2017)", "t": "A unified approach to interpreting model predictions (SHAP)", "n": "证明 LIME、DeepLIFT、LRP 等方法在特定参数下都是 Shapley 加性解释的实例，并给出针对树模型的精确高效算法。它统一了碎片化的方法生态。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Adebayo, Gilmer, Muelly, Goodfellow, Hardt & Kim (2018)", "t": "Sanity checks for saliency maps", "n": "提出用模型参数随机化与标签随机化做对照，发现多数显著图在模型被彻底破坏后几乎不变。这是该领域最重要的负面结果，直接淘汰了一批方法。", "k": 1, "v": "NeurIPS 2018"}, {"c": "Kindermans et al. (2019)", "t": "The (un)reliability of saliency methods", "n": "证明对输入做与预测无关的常数平移会使多种归因方法给出完全不同的结果，说明它们缺乏基本的输入不变性。", "v": "Explainable AI（Springer LNCS）"}, {"c": "Jain & Wallace (2019)", "t": "Attention is not explanation", "n": "证明存在与原注意力分布差异很大、却给出相同预测的替代注意力，因而注意力权重不能作为模型依据的解释。它纠正了 NLP 中一个流行的误用。", "v": "NAACL 2019"}, {"c": "Sundararajan & Najmi (2020)", "t": "The many Shapley values for model explanation", "n": "系统比较基于条件期望与边缘期望的多种 Shapley 变体，证明它们互不一致且各自违反某些直觉性质，没有原则性的最优选择。它揭示了归因的本质不唯一性。", "k": 1, "v": "ICML 2020"}, {"c": "Covert, Lundberg & Lee (2021)", "t": "Explaining by removing: a unified framework for model explanation", "n": "把二十余种解释方法统一为「如何移除特征、用什么模型行为、如何汇总」三个维度的组合，并给出统计性质。它是理解整个归因方法空间的地图。", "v": "JMLR"}, {"c": "Bilodeau, Jaques, Koh & Kim (2024)", "t": "Impossibility theorems for feature attribution", "n": "证明任何满足完备性与线性性的归因方法，在推断模型对未见输入的行为这一任务上，其表现不优于随机猜测。它给整类方法划定了能力上限。", "k": 1, "v": "PNAS"}], "people": [{"n": "Lloyd Shapley（诺贝尔经济学奖）", "r": "Shapley 值的公理化唯一性"}, {"n": "Scott Lundberg & Su-In Lee（华盛顿大学）", "r": "SHAP——归因方法的统一框架与高效树算法"}, {"n": "Mukund Sundararajan（Google）", "r": "积分梯度；揭示 Shapley 式解释的不唯一性"}, {"n": "Marco Tulio Ribeiro & Carlos Guestrin", "r": "LIME 局部代理解释；Anchors 规则解释"}, {"n": "Been Kim（Google DeepMind）", "r": "TCAV 概念激活向量；显著图的合理性检验；归因的不可能性定理"}, {"n": "Julius Adebayo（MIT）", "r": "显著图的参数随机化检验"}, {"n": "Cynthia Rudin（Duke）", "r": "主张高风险场景应直接用可解释模型而非事后解释；可解释模型的最优化理论"}, {"n": "Ian Covert（Stanford）", "r": "移除式解释的统一框架与统计分析"}]}, {"id": "B32", "p": "B3", "num": "3.2", "name": "反事实解释与算法补救理论", "kind": "leaf", "pillar": "ii", "summary": "研究最小改变哪些可操作因素能够改变模型决策，以及这种建议是否真的可行、可实施、在模型更新后是否仍然有效。", "why": "这个方向的核心洞察是：离决策边界最近的那个点，通常不是当事人能真正达到的状态。改变收入会连带改变储蓄，改变学历会连带改变工作年限——因此有效的补救建议必须建立在结构因果模型上，是干预问题而非距离问题。这一区分把该方向从最优化问题变成了因果推断问题。", "phases": [{"t": "提出与法律动因（2017–2019）", "d": "反事实解释被提出作为 GDPR 意义下无需打开黑箱的解释形式：给出最近的、能翻转决策的输入。随后指出解释必须限制在可操作特征上（不能建议改变年龄或种族），并用整数规划给出可行补救的计算与「补救是否可达」的审计。"}, {"t": "因果转向（2020–2021）", "d": "明确区分反事实解释（找一个点）与算法补救（做一次干预）：由于特征间存在因果依赖，把某个特征改到目标值会连带改变下游特征，因此最近的反事实点往往既非最省力也非可达。补救被重述为在结构因果模型上求最小代价干预，并给出因果图不完整时的概率保证版本。"}, {"t": "鲁棒性问题（2021–2023）", "d": "发现给出的补救在模型微小更新或数据轻微偏移后大量失效——当事人按建议努力后，决策仍未翻转。于是出现对模型变化鲁棒的补救算法，把补救的有效性作为一个需要保证的性质而非一次性输出。"}, {"t": "与策略性行为合流（2016– ，2020 后加速）", "d": "策略性分类研究个体为通过而操纵特征，补救研究如何指导个体改变——两者是同一枚硬币的两面。关键区分是操纵（改变特征但不改变真实结果）与改进（真实结果确实变好），而这个区分只有因果模型能做出。这条线把公平、因果与激励设计连了起来。"}, {"t": "大模型期（2023– ）", "d": "自然语言形式的反事实解释易于生成却难以验证：模型给出的「如果你当时……就会……」缺乏可检验的因果基础，可能是流畅的编造。如何为生成式解释建立忠实性标准是当前的开放问题。"}], "papers": [{"c": "Wachter, Mittelstadt & Russell (2017)", "t": "Counterfactual explanations without opening the black box", "n": "提出用「最近的能翻转决策的输入」作为解释，并论证这满足 GDPR 对自动化决策说明的要求而无需公开模型。它开创了这一方向并确立了它的法律动因。", "k": 1, "v": "Harvard Journal of Law & Technology"}, {"c": "Ustun, Spangher & Liu (2019)", "t": "Actionable recourse in linear classification", "n": "把补救限制在当事人真正能改变的特征上，用整数规划求最小代价的可行改变，并提出对整个人群做「补救可达性」审计。它引入了 actionability 这一关键约束。", "k": 1, "v": "FAT* 2019（现 FAccT）"}, {"c": "Hardt, Megiddo, Papadimitriou & Wootters (2016)", "t": "Strategic classification", "n": "把分类建模为决策者与被分类者之间的博弈：个体会按已知规则操纵特征。它给出斯塔克尔伯格均衡下的最优分类器，是补救问题的镜像。", "k": 1, "v": "ITCS 2016"}, {"c": "Karimi, Schölkopf & Valera (2021)", "t": "Algorithmic recourse: from counterfactual explanations to interventions", "n": "证明由于特征间的因果依赖，最近的反事实点一般不对应可实施的最小干预，必须在结构因果模型上求解。这是该方向最重要的概念澄清。", "k": 1, "v": "FAccT 2021"}, {"c": "Karimi, von Kügelgen, Schölkopf & Valera (2020)", "t": "Algorithmic recourse under imperfect causal knowledge: a probabilistic approach", "n": "在因果图或机制未知时，用贝叶斯平均给出以高概率生效的补救建议。它让因果补救在图不可得的现实条件下仍然可用。", "v": "NeurIPS 2020"}, {"c": "Miller, Milli & Hardt (2020)", "t": "Strategic classification is causal modeling in disguise", "n": "证明区分「操纵」与「真实改进」在数学上等价于识别因果结构：只有知道哪些特征因果地影响结果，才能设计出鼓励改进而非博弈的规则。", "k": 1, "v": "ICML 2020"}, {"c": "Rawal, Kamar & Lakkaraju (2021)", "t": "Algorithmic recourse in the wild: understanding the impact of data and model shifts", "n": "系统证明补救建议在模型重训或数据偏移后大量失效，并刻画失效与偏移幅度的关系。它把鲁棒性提为补救的必要性质。", "v": "arXiv 预印本"}, {"c": "Upadhyay, Joshi & Lakkaraju (2021)", "t": "Towards robust and reliable algorithmic recourse (ROAR)", "n": "用极小极大优化生成对模型参数扰动鲁棒的补救，给出在一类模型变化下仍然有效的保证。", "v": "NeurIPS 2021"}, {"c": "von Kügelgen, Karimi, Bhatt, Valera, Weller & Schölkopf (2022)", "t": "On the fairness of causal algorithmic recourse", "n": "指出即使预测本身满足公平判据，不同群体达成补救所需的代价仍可能悬殊，并给出补救层面的公平定义。它把公平从预测扩展到救济。", "v": "AIES 2022"}, {"c": "Barocas, Selbst & Raghavan (2020)", "t": "The hidden assumptions behind counterfactual explanations and principal reasons", "n": "梳理反事实解释隐含的假设（特征可独立改变、代价可度量、模型稳定），指出多数在现实中不成立。它是该方向最有分量的批评性综述。", "v": "FAccT 2020"}], "people": [{"n": "Sandra Wachter & Brent Mittelstadt（Oxford）", "r": "反事实解释；GDPR 语境下的技术—法律对接"}, {"n": "Berk Ustun（UCSD）", "r": "actionable recourse——可操作性约束与整数规划求解"}, {"n": "Isabel Valera（Saarland）& Amir-Hossein Karimi", "r": "算法补救的因果理论：从反事实解释到最小代价干预"}, {"n": "Bernhard Schölkopf（MPI-IS）", "r": "把结构因果模型引入补救与公平救济"}, {"n": "Moritz Hardt（MPI-IS）", "r": "策略性分类；证明区分操纵与改进等价于因果建模"}, {"n": "Himabindu Lakkaraju（Harvard）", "r": "补救的鲁棒性；解释方法的对抗脆弱性"}, {"n": "Solon Barocas（Microsoft）", "r": "反事实解释隐含假设的系统梳理"}]}, {"id": "B33", "p": "B3", "num": "3.3", "name": "黑箱审计与性质检验理论", "kind": "leaf", "pillar": "ii", "summary": "研究仅通过有限次查询能否判断模型是否满足公平、安全等指定性质，包括查询复杂度、统计推断的严格性，以及被审计方能否察觉并规避审计。", "why": "这是可管这一支唯一直接面向监管者的方向。它的特殊困难在于对抗性：被审计者知道自己在被审计，可以在审计样本上表现良好而在真实流量上不然。因此审计不只是估计问题，还是一个博弈问题——这使它与统计估计有本质区别。", "phases": [{"t": "性质检验的理论根源（1996–2000s）", "d": "计算机科学中的性质检验研究：用亚线性的查询次数判断一个对象具有某性质还是远离该性质。它提供了「有限访问下能验证什么」的一般框架，也确立了查询复杂度这一度量。"}, {"t": "早期算法审计（2014–2018）", "d": "提出通过干预输入分布来量化各特征对输出的影响，作为透明度报告的技术手段；并出现针对间接影响（敏感属性通过代理泄露）的黑箱检测方法。这一阶段主要是把解释方法改造成审计工具。"}, {"t": "审计的形式化归约（2018–2021）", "d": "证明「在指数多个子群上检查公平」可归约为不可知学习问题，从而审计的难度有了明确的学习理论刻画，也说明审计与学习一样受计算与样本的限制。同时出现无法获得敏感属性时用代理进行审计的理论。"}, {"t": "对抗性审计（2020–2024）", "d": "构造性地证明被审计方可以通过精心挑选提交给审计者的样本，在保持真实歧视的同时通过公平审计。随后系统论证仅有黑箱访问不足以支撑严格审计，需要不同层级的访问权限（权重、训练数据、内部激活）。这把审计从技术问题变成了制度设计问题。"}, {"t": "统计严格化与大模型（2022– ）", "d": "用同时置信界与多重检验，把审计变成对众多子群公平差距的严格统计推断，控制整体错误率；主动学习被用来降低审计所需的标注查询量。大模型时代新增困难：评测数据污染、模型可识别评测环境、以及危险能力评估缺乏统计学基础。"}], "papers": [{"c": "Goldreich, Goldwasser & Ron (1998)", "t": "Property testing and its connection to learning and approximation", "n": "建立性质检验框架：用远少于读取全部数据的查询次数，区分「具有性质」与「远离性质」。它是所有有限访问验证问题的理论母体。", "k": 1, "v": "Journal of the ACM"}, {"c": "Datta, Sen & Zick (2016)", "t": "Algorithmic transparency via quantitative input influence", "n": "通过对输入分布做干预来量化单个或一组特征对输出的因果影响，并给出可用于透明度报告的度量。它是审计工具化的早期代表。", "v": "IEEE S&P 2016"}, {"c": "Kearns, Neel, Roth & Wu (2018)", "t": "Preventing fairness gerrymandering", "n": "把在指数多子群上审计公平归约为不可知学习问题，给出可用的算法与样本复杂度。它使子群审计第一次有了严格的复杂度刻画。", "k": 1, "v": "ICML 2018"}, {"c": "Bastani, Zhang & Solar-Lezama (2019)", "t": "Probabilistic verification of fairness properties via concentration", "n": "用集中不等式给出「模型以高概率满足某公平性质」的形式化验证，把程序验证的思路引入公平审计。", "v": "OOPSLA 2019（PACMPL）"}, {"c": "Fukuchi, Hara & Maehara (2020)", "t": "Faking fairness via stealthily biased sampling", "n": "构造性地证明被审计方可以挑选一个看似随机、实则精心偏置的样本集提交审计，从而在真实歧视存在时仍通过审计。它揭示审计的对抗本质。", "k": 1, "v": "AAAI 2020"}, {"c": "Diana, Gill, Kearns, Kenthapadi, Roth & Sharifi-Malvajerdi (2022)", "t": "Multiaccurate proxies for downstream fairness", "n": "在无法直接获得敏感属性时，用多精确度代理进行公平估计与保证。它解决了审计中最常见的现实障碍——法律往往禁止收集敏感属性。", "v": "FAccT 2022"}, {"c": "Yan & Zhang (2022)", "t": "Active fairness auditing", "n": "用主动学习选择最有信息量的查询，给出达到给定审计精度所需查询次数的上下界。它把审计成本作为一个可优化的量。", "k": 1, "v": "NeurIPS 2022"}, {"c": "Cherian & Candès (2023)", "t": "Statistical inference for fairness auditing", "n": "用自助法与多重检验给出对大量子群公平差距的同时置信界，控制族错误率。它把审计从点估计升级为严格的统计推断，是该方向近年最重要的方法论进展。", "k": 1, "v": "JASA"}, {"c": "Raji, Smart, White, Mitchell, Gebru, Hutchinson, Smith-Loud, Theron & Barnes (2020)", "t": "Closing the AI accountability gap: defining an end-to-end framework for internal algorithmic auditing", "n": "给出组织内部算法审计的完整流程框架（范围界定、映射、制品收集、测试、反思）。它虽非数学工作，却定义了审计作为一种实践的形态。", "v": "FAccT 2020"}, {"c": "Casper et al. (2024)", "t": "Black-box access is insufficient for rigorous AI audits", "n": "系统论证仅有黑箱查询无法支撑严格审计，并给出白箱、外框（训练数据、方法）等不同访问层级各自能支持的审计结论。它为监管访问权限的设计提供了技术依据。", "k": 1, "v": "FAccT 2024"}], "people": [{"n": "Oded Goldreich、Shafi Goldwasser & Dana Ron", "r": "性质检验框架——有限查询下的验证理论"}, {"n": "Anupam Datta（CMU）", "r": "量化输入影响（QII）——干预式的透明度度量"}, {"n": "Michael Kearns & Aaron Roth（Penn）", "r": "子群公平审计归约为不可知学习；无敏感属性下的代理审计"}, {"n": "Emmanuel Candès（Stanford）", "r": "公平审计的同时置信界与多重检验框架"}, {"n": "Chicheng Zhang（Arizona）", "r": "主动公平审计的查询复杂度界"}, {"n": "Kazuto Fukuchi & Satoshi Hara", "r": "构造性证明公平审计可被隐蔽偏置采样欺骗"}, {"n": "Deborah Raji & Timnit Gebru", "r": "端到端算法审计框架；把审计确立为一种制度实践"}, {"n": "Stephen Casper & Dylan Hadfield-Menell（MIT）", "r": "论证黑箱访问不足以支撑严格审计，提出访问层级方案"}]}, {"id": "B4", "p": "B", "num": "4", "name": "偏好学习与价值对齐理论", "kind": "group", "pillar": "ii", "summary": "研究如何从人类反馈中学习目标，使模型行为符合人类偏好和规范。", "extra": "三个子方向沿着一条技术链展开：目标能不能从行为或比较中被唯一恢复（可识别性）、只靠偏好反馈学策略要多少样本与多大遗憾（基于偏好的强化学习）、能否跳过奖励模型直接优化策略（直接偏好优化）。第一个问题是整条链的地基——如果奖励本身不可识别，后面的效率讨论就失去意义；而现有理论恰恰表明，多数反馈形式下奖励只能部分识别。"}, {"id": "B41", "p": "B4", "num": "4.1", "name": "奖励与偏好可识别性理论", "kind": "leaf", "pillar": "ii", "summary": "研究从有限的行为演示或比较数据中，能否唯一恢复真实的奖励函数与偏好结构，以及不可识别时能确定到什么程度（部分识别）。", "why": "这是价值对齐的地基问题，而结论从一开始就是负面的：逆强化学习被提出的同一篇论文就指出奖励不可识别——常数偏移、正比例缩放、以及势函数整形都不改变最优策略。这意味着从行为反推目标在原理上有多解，对齐失败常常不是算法不够好，而是数据里根本没有足够信息。", "phases": [{"t": "提出与不可识别性（1998–2000）", "d": "逆强化学习被正式提出：给定专家行为反推其奖励。同一批工作立刻指出该问题严重欠定——存在退化解（全零奖励使一切策略最优），而势函数整形给出了一整族保持最优策略不变的奖励变换。这个等价类是不可识别性的结构性来源。"}, {"t": "用额外原则消歧（2004–2010）", "d": "最大间隔方法要求专家策略优于其他策略一个间隔；最大熵方法在匹配特征期望的所有分布中选熵最大者，从而挑出唯一解；贝叶斯方法则用先验表达偏好。这些都不是恢复了可识别性，而是引入了额外的假设来选择一个代表元。"}, {"t": "目标的表达边界（2017–2021）", "d": "提出设计者给出的奖励只是真实目标在训练环境中的证据，应作贝叶斯推断而非照单执行，直接催生了奖励误设研究。随后证明许多自然任务根本无法用马尔可夫奖励表示，说明问题不只是识别，还有表达能力的上限。"}, {"t": "部分可识别性的系统刻画（2021–2023）", "d": "给出何时可识别的条件（例如需要多个折扣因子或多个环境），并系统刻画各类反馈（专家策略、轨迹比较、演示）各自把奖励确定到多大的等价类。奖励黑客也被形式化：当代理奖励与真实奖励的序关系不一致时，优化必然在某点开始损害真实目标。"}, {"t": "RLHF 时代（2023– ）", "d": "发现 Bradley–Terry 偏好模型在人群偏好异质时会隐式地做 Borda 计数式聚合，导致学到的既非任何个体的偏好也非合理的社会选择，并可被策略性操纵。人类反馈的可识别性成为对齐研究的核心议题。"}], "papers": [{"c": "Ng & Russell (2000)", "t": "Algorithms for inverse reinforcement learning", "n": "提出逆强化学习问题，同时指出它严重欠定：多个奖励函数能解释同一最优策略，包括平凡的全零解。这既开创了方向，也定义了它此后二十五年的核心困难。", "k": 1, "v": "ICML 2000"}, {"c": "Ng, Harada & Russell (1999)", "t": "Policy invariance under reward transformations: theory and application to reward shaping", "n": "证明基于势函数的奖励整形不改变最优策略，且这是唯一具有此性质的变换族。它精确刻画了奖励不可识别性的结构来源。", "k": 1, "v": "ICML 1999"}, {"c": "Abbeel & Ng (2004)", "t": "Apprenticeship learning via inverse reinforcement learning", "n": "绕开恢复奖励本身，只要求学到的策略在特征期望上匹配专家，从而给出有性能保证的算法。它把不可识别性从障碍变成可以回避的问题。", "v": "ICML 2004"}, {"c": "Ziebart, Maas, Bagnell & Dey (2008)", "t": "Maximum entropy inverse reinforcement learning", "n": "在所有匹配专家特征期望的轨迹分布中选熵最大者，从而唯一确定解并自然处理次优演示。最大熵原则至今是逆强化学习的默认消歧方式。", "k": 1, "v": "AAAI 2008"}, {"c": "Hadfield-Menell, Milli, Abbeel, Russell & Dragan (2017)", "t": "Inverse reward design", "n": "提出设计者写下的奖励只是真实目标在训练环境下的证据，应对真实目标做贝叶斯推断并在不确定时保守行动。它把奖励误设从工程事故变成一个推断问题。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Hadfield-Menell, Dragan, Abbeel & Russell (2016)", "t": "Cooperative inverse reinforcement learning", "n": "把价值对齐建模为人与机器的合作博弈，机器不知道奖励而必须从人的行为中推断，同时人也知道机器在学。它给出对齐问题的第一个博弈论形式化。", "v": "NeurIPS 2016"}, {"c": "Cao, Cohen & Szpruch (2021)", "t": "Identifiability in inverse reinforcement learning", "n": "给出奖励可识别的充分条件，例如观察到同一专家在多个折扣因子或多个环境下的行为。它是第一批正面的可识别性结果。", "v": "NeurIPS 2021"}, {"c": "Abel, Dabney, Harutyunyan, Ho, Littman, Precup & Singh (2021)", "t": "On the expressivity of Markov reward", "n": "证明存在大量自然任务（如某些行为约束与偏序目标）无法用任何马尔可夫奖励函数表示。它说明对齐的困难不止于识别，还在于奖励这一表达形式本身有界。", "k": 1, "v": "NeurIPS 2021（杰出论文）"}, {"c": "Skalse, Howe, Krasheninnikov & Krueger (2022)", "t": "Defining and characterizing reward hacking", "n": "形式化定义奖励黑客（优化代理奖励导致真实奖励下降），并给出不可黑客的充要条件——结论是除非极强的条件，否则黑客不可避免。", "k": 1, "v": "NeurIPS 2022"}, {"c": "Siththaranjan, Laidlaw & Hadfield-Menell (2024)", "t": "Distributional preference learning: understanding and accounting for hidden context in RLHF", "n": "证明当标注者群体偏好异质时，标准 RLHF 隐式地在做 Borda 计数式聚合，因而结果既不代表任何个体也不具备好的社会选择性质，并给出可检测该问题的方法。", "k": 1, "v": "ICLR 2024"}], "people": [{"n": "Stuart Russell（Berkeley）", "r": "逆强化学习的提出；合作逆强化学习与价值对齐纲领"}, {"n": "Andrew Ng（Stanford）", "r": "IRL 算法与不可识别性；势函数整形的唯一性定理"}, {"n": "Brian Ziebart & Drew Bagnell（CMU）", "r": "最大熵逆强化学习"}, {"n": "Anca Dragan & Dylan Hadfield-Menell（Berkeley／MIT）", "r": "逆奖励设计；合作逆强化学习；RLHF 中的隐藏上下文"}, {"n": "Pieter Abbeel（Berkeley）", "r": "学徒学习——绕开奖励恢复的特征期望匹配"}, {"n": "David Abel & Michael Littman & Satinder Singh", "r": "马尔可夫奖励的表达边界（奖励假设的边界）"}, {"n": "Joar Skalse & David Krueger（Oxford／Cambridge）", "r": "奖励黑客的形式化；各类反馈下奖励的部分可识别集刻画"}, {"n": "Alessandro Abate（Oxford）", "r": "逆强化学习可识别性的正面条件"}]}, {"id": "B42", "p": "B4", "num": "4.2", "name": "基于偏好的强化学习理论", "kind": "leaf", "pillar": "ii", "summary": "研究只依赖偏好（成对或多元比较）反馈来学习策略时的样本复杂度、遗憾界与收敛性质，以及它与使用数值奖励的标准强化学习相比难在哪里。", "why": "人类给数值分数不可靠但做比较很可靠，因此偏好反馈是对齐的现实接口。理论要回答的是：放弃数值信息要付出多少代价。目前的结论较为乐观——多数设定下偏好反馈的样本复杂度与标准强化学习同阶；但当人群偏好非传递时，奖励最大化本身就不是正确的解概念，需要换成博弈的均衡。", "phases": [{"t": "决斗赌博机（2009–2015）", "d": "最早的形式化出现在赌博机设定：每轮选两个臂做比较、只观察谁更好，目标是最小化与最优臂的遗憾。这一时期建立了比较反馈下的遗憾下界与近最优算法，并处理了偏好可能非传递的情形。"}, {"t": "偏好强化学习的提出（2012–2017）", "d": "把比较反馈推广到序贯决策：从轨迹比较中学奖励模型再做强化学习。深度版本用极少量人类比较训练出复杂行为，成为后来 RLHF 的技术原型。这一阶段以经验为主，理论几乎空白。"}, {"t": "理论化（2020–2023）", "d": "给出轨迹偏好下的遗憾界与一般函数逼近下的样本复杂度；在离线设定中证明悲观最大似然估计的次优性界，并指出关键量是数据对最优策略的覆盖系数。同时给出归约，说明在多数标准设定下偏好反馈并不比数值奖励更难。"}, {"t": "非传递偏好与博弈解（2023– ）", "d": "当人群偏好不满足传递性时，不存在与之一致的奖励函数，Bradley–Terry 模型必然误设。正确的解概念被改为偏好博弈的纳什均衡，出现了以极小极大而非奖励最大化为目标的算法。这是该方向近年最重要的概念转变。"}], "papers": [{"c": "Yue, Broder, Kleinberg & Joachims (2012)", "t": "The K-armed dueling bandits problem", "n": "提出只观察成对比较结果的赌博机模型，给出遗憾下界与近最优算法。它是所有偏好学习理论的原型问题。", "k": 1, "v": "Journal of Computer and System Sciences（COLT 2009 会议版）"}, {"c": "Wirth, Akrour, Neumann & Fürnkranz (2017)", "t": "A survey of preference-based reinforcement learning methods", "n": "系统梳理偏好反馈的类型（动作、状态、轨迹偏好）与三类学习范式，统一了此前分散的工作。它是进入该领域的标准入口。", "v": "JMLR"}, {"c": "Christiano, Leike, Brown, Martic, Legg & Amodei (2017)", "t": "Deep reinforcement learning from human preferences", "n": "用不到千次人类比较训练奖励模型再做强化学习，在复杂控制任务上学到难以手写奖励的行为。它是 RLHF 的直接技术原型，深刻影响了后来的大模型对齐。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Pacchiano, Saha & Lee (2021)", "t": "Dueling RL: reinforcement learning with trajectory preferences", "n": "给出轨迹偏好设定下的算法与遗憾界，第一次把决斗赌博机的理论推广到有状态转移的序贯决策。", "k": 1, "v": "AISTATS 2023"}, {"c": "Chen, Zhong, Yang, Wang & Wang (2022)", "t": "Human-in-the-loop: provably efficient preference-based RL with general function approximation", "n": "在一般函数逼近下给出偏好强化学习的样本复杂度，把理论从表格情形推进到深度模型适用的设定。", "v": "ICML 2022"}, {"c": "Zhu, Jordan & Jiao (2023)", "t": "Principled reinforcement learning with human feedback from pairwise or K-wise comparisons", "n": "分析 RLHF 中最大似然奖励估计加悲观策略优化的统计性质，给出次优性界，并指出关键在数据覆盖而非样本量。它是 RLHF 第一篇严格的统计分析。", "k": 1, "v": "ICML 2023"}, {"c": "Zhan, Uehara, Kallus, Lee & Sun (2023)", "t": "Provable offline preference-based reinforcement learning", "n": "给出离线偏好强化学习可行的条件（单策略集中性），说明什么样的历史数据足以支撑对齐，什么样的不行。", "v": "NeurIPS 2023"}, {"c": "Wang, Liu & Jin (2023)", "t": "Is RLHF more difficult than standard RL? A theoretical perspective", "n": "通过归约证明在多数标准设定下，偏好反馈的样本复杂度与数值奖励同阶。它给出了「放弃数值信息代价有多大」这一问题的乐观答案。", "k": 1, "v": "ICML 2023"}, {"c": "Munos et al. (2023)", "t": "Nash learning from human feedback", "n": "指出当偏好非传递时不存在一致的奖励函数，应把对齐目标改为偏好博弈的纳什均衡，并给出求解算法。这是解概念层面的转变。", "k": 1, "v": "arXiv 2023 / ICML 2024"}, {"c": "Swamy, Dann, Kidambi, Wu & Agarwal (2024)", "t": "A minimaximalist approach to reinforcement learning from human feedback (SPO)", "n": "用自博弈求解偏好博弈的极小极大解，无需奖励模型也无需对手网络，并给出收敛保证。它是 Nash 路线的简洁实现。", "v": "ICML 2024"}], "people": [{"n": "Thorsten Joachims & Yisong Yue（Cornell／Caltech）", "r": "决斗赌博机——比较反馈学习的原型模型与遗憾理论"}, {"n": "Paul Christiano & Jan Leike", "r": "深度偏好强化学习——RLHF 的技术原型"}, {"n": "Michael I. Jordan、Jiantao Jiao & Banghua Zhu（Berkeley）", "r": "RLHF 的统计理论：悲观 MLE 的次优性界与覆盖条件"}, {"n": "金驰 Chi Jin（Princeton）", "r": "证明 RLHF 在多数设定下不比标准强化学习更难"}, {"n": "Rémi Munos（DeepMind／Meta）", "r": "Nash learning from human feedback——非传递偏好下的均衡解"}, {"n": "Aldo Pacchiano & Aadirupa Saha", "r": "轨迹偏好强化学习的遗憾界"}, {"n": "Wen Sun & Nathan Kallus（Cornell）", "r": "离线偏好强化学习的可行性条件"}, {"n": "Eyke Hüllermeier & Johannes Fürnkranz", "r": "偏好学习的早期系统化与分类"}]}, {"id": "B43", "p": "B4", "num": "4.3", "name": "直接偏好优化理论", "kind": "leaf", "pillar": "ii", "summary": "研究无需显式奖励模型时，直接利用偏好数据优化策略的统计与优化性质：与经典 RLHF 的等价条件、过优化机制、对数据覆盖的敏感性、以及各类目标函数变体的差异。", "why": "关键洞察是：在 KL 约束下，最优策略与奖励函数一一对应，因此奖励可以被参数化为策略与参考策略的对数比，整个 RLHF 就塌缩成一个分类损失。这个变换在数学上是精确的，但它成立的前提（无限数据、完美覆盖）在实践中不满足，由此产生的偏差正是这个方向此后全部理论工作的对象。", "phases": [{"t": "前身：KL 正则策略优化（2010–2022）", "d": "带 KL 约束的策略优化有闭式最优解这一事实早在相对熵策略搜索与优势加权回归中被使用。标准 RLHF 采用监督微调、奖励建模、近端策略优化三段式，工程复杂且训练不稳定，这是直接方法出现的动因。"}, {"t": "直接偏好优化（2023）", "d": "利用 KL 约束下奖励与策略的一一对应，把奖励重参数化为对数比，从而把偏好学习变成一个二分类问题，完全去掉奖励模型与在线采样。方法极简且效果好，迅速成为开源模型对齐的默认做法。"}, {"t": "变体爆发与理论分析（2024）", "d": "指出当偏好接近确定时目标会无界外推，从而给出有界的替代目标与统一的理论范式；也出现用前景理论效用替代 Bradley–Terry、去掉参考模型、加入长度归一化等变体。同时理论与实证都发现：离线偏好数据的覆盖不足会使直接方法给分布外响应分配过高概率。"}, {"t": "回到在线（2024– ）", "d": "共识逐渐形成：直接方法的主要弱点是离线，解决办法是迭代或在线地用当前策略采样并重新标注偏好，从而在保持简洁的同时恢复覆盖。同时奖励过优化的标度律被推广到直接对齐算法上，说明它并未消除过优化，只是换了形式。"}], "papers": [{"c": "Rafailov, Sharma, Mitchell, Ermon, Manning & Finn (2023)", "t": "Direct preference optimization: your language model is secretly a reward model", "n": "证明 KL 约束下最优策略与奖励一一对应，从而把 RLHF 重写为对策略参数的二分类损失，去掉奖励模型与强化学习循环。它是近年对齐领域影响最大的单篇方法论文。", "k": 1, "v": "NeurIPS 2023"}, {"c": "Azar, Guo, Piot, Munos, Rowland, Valko & Calandriello (2024)", "t": "A general theoretical paradigm to understand learning from human preferences (IPO)", "n": "给出涵盖 RLHF 与 DPO 的统一目标族，并指出 DPO 在偏好接近确定时因对数比无界而过拟合，提出有界的 IPO 目标。这是该方向最重要的理论分析。", "k": 1, "v": "AISTATS 2024"}, {"c": "Ethayarajh, Xu, Muennighoff, Jurafsky & Kiela (2024)", "t": "KTO: model alignment as prospect theoretic optimization", "n": "用前景理论的人类效用函数替代 Bradley–Terry 假设，使方法只需二元的好／坏标注而非成对比较，大幅降低数据成本。", "v": "ICML 2024"}, {"c": "Zhao, Joshi, Liu, Khalman, Saleh & Liu (2023)", "t": "SLiC-HF: sequence likelihood calibration with human feedback", "n": "用序列似然校准的排序损失做对齐，是与 DPO 同期独立提出的直接方法，说明这一思路的收敛性。", "v": "arXiv 预印本"}, {"c": "Xu, Fu, Gao et al. (2024)", "t": "Is DPO superior to PPO for LLM alignment? A comprehensive study", "n": "系统比较后指出 DPO 易被分布外响应误导：它可能给训练数据中未出现的差回答分配高概率，而在线方法不会。它纠正了 DPO 全面优于 PPO 的流行看法。", "k": 1, "v": "ICML 2024"}, {"c": "Tajwar, Singh, Sharma, Rafailov, Schneider, Xie, Ermon, Finn & Kumar (2024)", "t": "Preference fine-tuning of LLMs should leverage suboptimal, on-policy data", "n": "从理论与实验两面说明，用当前策略自己采样的数据做偏好微调显著优于纯离线数据，并解释了原因在于负梯度对错误模式的针对性。", "k": 1, "v": "ICML 2024"}, {"c": "Rafailov, Chittepu, Park, Sikchi, Hejna, Knox, Finn & Niekum (2024)", "t": "Scaling laws for reward model overoptimization in direct alignment algorithms", "n": "证明直接对齐算法同样存在奖励过优化，并给出其随 KL 预算变化的标度律。它说明去掉奖励模型并未去掉过优化问题。", "k": 1, "v": "NeurIPS 2024"}, {"c": "Meng, Xia & Chen (2024)", "t": "SimPO: simple preference optimization with a reference-free reward", "n": "用长度归一化的平均对数概率作隐式奖励，去掉参考模型并消除长度偏置，在多个基准上超过 DPO。它揭示了 DPO 目标中长度项的影响。", "v": "NeurIPS 2024"}, {"c": "Xiong, Dong, Ye, Wang, Zhong, Jiang & Zhang (2024)", "t": "Iterative preference learning from human feedback: bridging theory and practice for RLHF under KL-constraint", "n": "给出在线迭代 DPO 的理论框架与遗憾分析，说明迭代采样如何恢复覆盖并给出收敛保证。它连接了直接方法与偏好强化学习理论。", "k": 1, "v": "ICML 2024"}, {"c": "Gao, Schulman & Hilton (2023)", "t": "Scaling laws for reward model overoptimization", "n": "给出代理奖励与真实奖励随 KL 距离背离的经验标度律，是所有过优化研究的参照系与度量方式来源。", "v": "ICML 2023"}], "people": [{"n": "Rafael Rafailov、Chelsea Finn & Stefano Ermon（Stanford）", "r": "直接偏好优化（DPO）；直接对齐算法的过优化标度律"}, {"n": "Mohammad Gheshlaghi Azar、Rémi Munos & Bilal Piot（DeepMind）", "r": "偏好学习的统一理论范式与 IPO——指出并修正 DPO 的无界外推"}, {"n": "Douwe Kiela & Dan Jurafsky（Stanford／Contextual）", "r": "KTO——用前景理论效用替代 Bradley–Terry"}, {"n": "Aviral Kumar（CMU／DeepMind）", "r": "论证在线策略数据对偏好微调的必要性"}, {"n": "张潼 Tong Zhang & Wei Xiong（UIUC）", "r": "迭代／在线 DPO 的理论框架与遗憾分析"}, {"n": "陈丹琦 Danqi Chen（Princeton）", "r": "SimPO——去参考模型与长度偏置的分析"}, {"n": "John Schulman & Leo Gao（OpenAI）", "r": "奖励过优化的标度律；PPO 与 RLHF 的工程范式"}]}, {"id": "C", "p": "root", "num": "三", "name": "可控 Controllability", "kind": "branch", "pillar": "iii", "summary": "研究大量人和智能体相互作用形成的复杂动态系统是否会失稳，以及如何干预。", "extra": "提问对象再次放大：从「一个模型 + 一群人」变成「一群会学习的主体 + 一个动态系统」。这一支的数学来源不再是统计学习理论，而是博弈论、动力系统与随机控制。它的核心发现是反直觉的：即使每个个体都在做完全合理的学习，群体层面也可能永不收敛，甚至进入混沌——因此可控不是个体可信的简单叠加，而是一个独立的系统性质。"}, {"id": "C1", "p": "C", "num": "1", "name": "多主体交互与群体演化理论", "kind": "group", "pillar": "iii", "summary": "研究多个自主决策主体相互学习和博弈后，群体行为如何形成。", "extra": "三个子方向按系统规模递进：无状态的重复博弈（学习动力学与均衡的对应）、有状态转移的随机博弈（多智能体强化学习的样本复杂度）、以及主体数趋于无穷时用群体分布近似的平均场极限。规模变大反而使问题在某种意义上变简单——平均场极限消除了个体间的复杂耦合，这是处理大规模智能体系统的主要数学出路。"}, {"id": "C11", "p": "C1", "num": "1.1", "name": "博弈学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究理性主体采用学习算法反复博弈时是否以及如何收敛到均衡，核心是无悔学习与各类均衡概念之间的对应关系。", "why": "这个方向的中心结论是一组对应与一组不可能性：所有主体各自使用无外部后悔算法，其经验分布收敛到粗相关均衡；使用无交换后悔算法则收敛到相关均衡。但纳什均衡不在此列——它既计算困难，也没有自然的分布式学习动力学能普遍到达。这直接说明用纳什均衡预测多智能体系统的行为是不恰当的。", "phases": [{"t": "虚拟博弈与后悔的起源（1951–1997）", "d": "虚拟博弈被证明在零和与某些特殊结构的博弈中收敛，但在一般博弈中可能循环。Hannan 一致性（即无外部后悔）的概念被提出，为「学习不必知道对手、只需不后悔」这一分布式思路奠定基础。"}, {"t": "无悔与均衡的对应（1997–2007）", "d": "证明简单的自适应过程（后悔匹配）能使联合经验分布收敛到相关均衡；乘性权重算法在零和博弈中使平均策略收敛到极小极大值。随后建立外部后悔到内部／交换后悔的一般转换，完成了「后悔类型 ↔ 均衡类型」的对应表。"}, {"t": "负面结果（2003–2009）", "d": "证明不存在自然的无耦合动力学能在所有博弈中收敛到纳什均衡；纳什均衡的计算被证明是 PPAD 完全的，因而在复杂性意义上不可行。这两条结果共同把研究目标从纳什移向相关均衡与粗相关均衡。"}, {"t": "动力学的几何刻画（2018–2021）", "d": "发现零和博弈中连续时间无悔学习是保守系统，产生庞加莱回复——轨迹永远绕圈而非收敛；乘性权重在零和博弈中甚至发散到边界。相应地出现乐观镜像下降等具有最后迭代收敛保证的方法，把「平均收敛」升级为「实际轨迹收敛」。"}, {"t": "不可能性的普遍化（2023– ）", "d": "证明任何满足自然性质的博弈动力学都不可能在所有博弈中收敛到纳什均衡，极限环与混沌是不可避免的。这为「多智能体系统能否被引导到预期均衡」给出了否定性的一般答案。"}], "papers": [{"c": "Hart & Mas-Colell (2000)", "t": "A simple adaptive procedure leading to correlated equilibrium", "n": "给出后悔匹配这一极简的分布式规则，证明所有人都用它时联合经验分布收敛到相关均衡集。它确立了「无悔学习产生均衡」这一整个方向的核心范式。", "k": 1, "v": "Econometrica"}, {"c": "Freund & Schapire (1999)", "t": "Adaptive game playing using multiplicative weights", "n": "证明乘性权重算法在零和博弈中使双方平均策略收敛到极小极大值，从而给出冯·诺依曼极小极大定理的一个学习论证明。它连接了在线学习与博弈论。", "k": 1, "v": "Games and Economic Behavior"}, {"c": "Blum & Mansour (2007)", "t": "From external to internal regret", "n": "给出把任意无外部后悔算法转换为无内部后悔算法的一般归约，从而使收敛到相关均衡（而非仅粗相关均衡）成为可能。它补全了后悔与均衡的对应表。", "v": "JMLR"}, {"c": "Hart & Mas-Colell (2003)", "t": "Uncoupled dynamics do not lead to Nash equilibrium", "n": "证明如果每个主体的调整规则只依赖自己的收益函数（无耦合），则不存在能在所有博弈中收敛到纳什均衡的连续时间动力学。这是纳什作为学习目标的第一个否定结果。", "k": 1, "v": "American Economic Review"}, {"c": "Daskalakis, Goldberg & Papadimitriou (2009)", "t": "The complexity of computing a Nash equilibrium", "n": "证明计算纳什均衡是 PPAD 完全的，因而在合理的复杂性假设下没有高效算法。它使「纳什均衡是行为的合理预测」这一经济学基本假设在计算上站不住脚，获哥德尔奖。", "k": 1, "v": "SIAM Journal on Computing（哥德尔奖）"}, {"c": "Mertikopoulos, Papadimitriou & Piliouras (2018)", "t": "Cycles in adversarial regularized learning", "n": "证明零和博弈中连续时间的正则化学习是保守（哈密顿）系统，轨迹呈庞加莱回复而非收敛。它解释了为什么 GAN 等对抗训练会持续振荡。", "k": 1, "v": "SODA 2018"}, {"c": "Bailey & Piliouras (2018)", "t": "Multiplicative weights update in zero-sum games (EC)", "n": "证明离散时间的乘性权重在零和博弈中不仅不收敛，还会发散到策略单纯形的边界。它说明离散化本身会引入新的不稳定性。", "v": "ACM EC 2018"}, {"c": "Daskalakis & Panageas (2019)", "t": "Last-iterate convergence: zero-sum games and constrained min-max optimization", "n": "证明乐观镜像下降等方法具有最后迭代收敛性，即实际策略而非时间平均收敛到均衡。这对训练生成模型这类需要最终参数的场景至关重要。", "k": 1, "v": "ITCS 2019"}, {"c": "Brown & Sandholm (2019)", "t": "Superhuman AI for multiplayer poker", "n": "用反事实后悔最小化在六人德州扑克上达到超人水平，证明无悔学习范式能扩展到极大规模的不完美信息博弈。它是该理论最有说服力的实证顶点。", "v": "Science"}, {"c": "Milionis, Papadimitriou, Piliouras & Spendlove (2023)", "t": "An impossibility theorem in game dynamics", "n": "用微分拓扑证明任何满足合理性质的博弈动力学都必然在某些博弈中不收敛到纳什均衡。这把此前的具体反例提升为一般不可能性定理。", "k": 1, "v": "PNAS"}], "people": [{"n": "Sergiu Hart & Andreu Mas-Colell", "r": "后悔匹配与相关均衡的自适应达成；无耦合动力学不可能收敛到纳什"}, {"n": "Christos Papadimitriou（Columbia）", "r": "纳什均衡的 PPAD 完全性；博弈动力学的不可能性定理"}, {"n": "Constantinos Daskalakis（MIT）", "r": "纳什计算复杂性；极小极大优化的最后迭代收敛"}, {"n": "Georgios Piliouras（SUTD／DeepMind）", "r": "学习动力学的庞加莱回复、极限环与混沌；博弈动力学不可能性"}, {"n": "Yoav Freund & Robert Schapire", "r": "乘性权重与零和博弈的学习论证明；AdaBoost"}, {"n": "Avrim Blum（TTIC）", "r": "外部后悔到内部后悔的一般转换"}, {"n": "Noam Brown & Tuomas Sandholm（CMU）", "r": "反事实后悔最小化；扑克上的超人水平"}, {"n": "Panayotis Mertikopoulos（CNRS）", "r": "连续时间学习动力学的几何与收敛分析"}]}, {"id": "C12", "p": "C1", "num": "1.2", "name": "随机博弈与多智能体强化学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究具有动态状态转移的多主体系统中的学习、均衡与样本复杂度，即把单体强化学习推广到多个同时学习的主体。", "why": "两个结构性困难主导了这个方向：一是非平稳性——其他主体也在学习，每个主体面对的环境不断变化，单体强化学习的收敛保证全部失效；二是维数灾难——联合动作空间随主体数指数增长。近年最重要的突破正是绕开这两点：放弃纳什而求粗相关均衡，并用去中心化的无悔学习避免枚举联合动作。", "phases": [{"t": "随机博弈的提出（1953）", "d": "随机博弈被定义为状态在博弈过程中随机转移的多人博弈，并证明折扣零和随机博弈的值存在。这个模型比马尔可夫决策过程早出现，是多智能体强化学习的数学母体。"}, {"t": "早期多智能体强化学习（1994–2003）", "d": "把 Q 学习推广到马尔可夫博弈：零和情形用极小极大算子替换最大值算子，收敛性可证；一般和情形试图用纳什算子，但收敛只在极强的假设下成立。这一时期确立了问题设定，也暴露了一般和情形的困难。"}, {"t": "负面结果（2006）", "d": "证明一大类基于值迭代的算法不能收敛到平稳纳什均衡，它们收敛到的是循环均衡。这说明困难不在于算法设计不够精巧，而在于目标本身选错了。"}, {"t": "深度多智能体强化学习（2016–2020）", "d": "集中训练分散执行、值分解、多智能体策略梯度等方法在星际争霸等基准上取得成功，但理论几乎空白——大多数方法没有收敛保证，效果依赖大量工程调优。"}, {"t": "样本复杂度理论的建立（2020–2023）", "d": "两人零和马尔可夫博弈的近最优样本复杂度被确定。更关键的是，对一般和情形放弃纳什改求粗相关均衡后，去中心化的无悔学习可以用关于主体数多项式的样本达成，从根本上避开了联合动作空间的指数爆炸。随后又证明马尔可夫型的粗相关均衡计算仍是困难的，从而精确划定了什么目标可达。"}], "papers": [{"c": "Shapley (1953)", "t": "Stochastic games", "n": "提出随机博弈模型并证明折扣零和情形值的存在性。它比马尔可夫决策过程更早，是多智能体序贯决策的数学起点。", "k": 1, "v": "PNAS"}, {"c": "Littman (1994)", "t": "Markov games as a framework for multi-agent reinforcement learning", "n": "把 Q 学习推广到零和马尔可夫博弈，用极小极大算子替换最大化算子并给出收敛性。它定义了多智能体强化学习这一研究领域。", "k": 1, "v": "ICML 1994"}, {"c": "Hu & Wellman (2003)", "t": "Nash Q-learning for general-sum stochastic games", "n": "把纳什算子引入 Q 学习以处理一般和博弈，但收敛条件要求每阶段博弈的均衡唯一，实际几乎不成立。它既是重要尝试也暴露了路线的根本困难。", "v": "JMLR"}, {"c": "Zinkevich, Greenwald & Littman (2006)", "t": "Cyclic equilibria in Markov games", "n": "证明一大类基于值的多智能体算法不可能收敛到平稳纳什均衡，它们收敛到的是循环均衡。这一负面结果终结了当时的主流路线。", "k": 1, "v": "NeurIPS 2006"}, {"c": "Bai & Jin (2020)", "t": "Provable self-play algorithms for competitive reinforcement learning", "n": "给出零和马尔可夫博弈中自博弈算法的样本复杂度上界，是深度学习时代第一批有严格保证的多智能体强化学习结果。", "v": "ICML 2020"}, {"c": "Liu, Yu, Bai & Jin (2021)", "t": "A sharp analysis of model-based reinforcement learning with self-play", "n": "给出两人零和马尔可夫博弈近最优的样本复杂度，基本关闭了这一基础设定的理论问题。", "v": "ICML 2021"}, {"c": "Jin, Liu, Wang & Yu (2021)", "t": "V-learning: a simple, efficient, decentralized algorithm for multiagent reinforcement learning", "n": "用去中心化的无悔学习求粗相关均衡，样本复杂度只与单个主体的动作数相关而非联合动作空间。它是绕开多智能体维数灾难的关键突破。", "k": 1, "v": "arXiv 2021 / Mathematics of Operations Research 2024"}, {"c": "Daskalakis, Golowich & Zhang (2023)", "t": "The complexity of Markov equilibrium in stochastic games", "n": "证明在一般和马尔可夫博弈中计算马尔可夫型粗相关均衡是 PPAD 困难的，只有允许非马尔可夫（历史依赖）策略时才高效可达。它精确划定了可达目标的边界。", "k": 1, "v": "STOC 2023"}, {"c": "Zhang, Yang & Başar (2021)", "t": "Multi-agent reinforcement learning: a selective overview of theories and algorithms", "n": "系统梳理多智能体强化学习的理论谱系（零和、一般和、合作、平均场）与各自的收敛结果。它是该领域公认的权威综述。", "v": "Handbook of RL and Control（Springer）"}, {"c": "Rashid, Samvelyan, de Witt, Farquhar, Foerster & Whiteson (2018)", "t": "QMIX: monotonic value function factorisation", "n": "用单调的值分解实现集中训练、分散执行，在合作任务上成为长期基准。它代表了实践侧的主流范式，也提出了值分解表达能力这一理论问题。", "v": "ICML 2018 / JMLR 2020"}], "people": [{"n": "Lloyd Shapley", "r": "随机博弈模型与值的存在性"}, {"n": "Michael Littman（Brown）", "r": "马尔可夫博弈框架与 Minimax-Q"}, {"n": "金驰 Chi Jin（Princeton）", "r": "V-learning——去中心化学习避开联合动作空间的维数灾难"}, {"n": "Constantinos Daskalakis（MIT）", "r": "马尔可夫均衡的计算复杂性刻画"}, {"n": "Tamer Başar（UIUC）& Kaiqing Zhang（Maryland）", "r": "多智能体强化学习的理论体系与权威综述；去中心化 MARL 的收敛分析"}, {"n": "Yu Bai（Salesforce／OpenAI）", "r": "自博弈算法的可证明样本复杂度"}, {"n": "Shimon Whiteson（Oxford）", "r": "QMIX 与值分解范式"}, {"n": "Michael Wellman（Michigan）", "r": "一般和随机博弈的 Nash Q 学习；经验博弈论分析"}]}, {"id": "C13", "p": "C1", "num": "1.3", "name": "平均场博弈与平均场强化学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究主体数量巨大时，如何用群体分布近似个体之间的交互，从而把不可解的 N 体博弈化为一个个体对分布的最优反应加一个分布的一致性条件。", "why": "这是处理大规模智能体系统的核心数学出路。当主体同质且互相只通过群体分布发生作用时，N 趋于无穷的极限使问题从指数复杂降为两个耦合的偏微分方程（描述个体最优的 HJB 与描述群体演化的 Fokker–Planck）。有限 N 的纳什均衡收敛到这个极限，且误差以 1/√N 量级递减，这为「用宏观模型指导微观系统」提供了严格依据。", "phases": [{"t": "独立创立（2006–2007）", "d": "数学界与工程控制界同年独立提出同一框架：一边用耦合的 HJB–Fokker–Planck 方程组刻画极限均衡，另一边提出纳什确定性等价原理并给出 ε-纳什性质。两条线后来合流成为平均场博弈。"}, {"t": "数学基础的建立（2013–2019）", "d": "发展出概率方法（前后向随机微分方程）与主方程方法两套工具；证明了收敛问题——有限 N 人博弈的纳什均衡确实收敛到平均场极限，并给出收敛速率。这使平均场近似从启发式变成有严格依据的方法。"}, {"t": "与强化学习结合（2019–2022）", "d": "当模型未知时，用强化学习求解平均场均衡：虚拟博弈在单调性条件下被证明收敛，在线镜像下降给出可扩展的算法，Q 学习被推广到概率测度空间。这一阶段把平均场从解析工具变成了可学习的框架。"}, {"t": "放松同质性假设（2019– ）", "d": "现实中主体并不同质、交互也非全对全。图元博弈用图极限刻画异质的网络交互，主要主体加众多小主体的模型刻画平台与用户的不对称结构。这些推广正在把理论推向更接近真实系统的设定。"}], "papers": [{"c": "Lasry & Lions (2007)", "t": "Mean field games", "n": "用耦合的 HJB 与 Fokker–Planck 方程刻画无穷多同质主体的均衡，创立平均场博弈。它把不可解的 N 体博弈问题化为一对偏微分方程。", "k": 1, "v": "Japanese Journal of Mathematics"}, {"c": "Huang, Malhamé & Caines (2006)", "t": "Large population stochastic dynamic games: closed-loop McKean–Vlasov systems and the Nash certainty equivalence principle", "n": "在控制论框架下独立提出同一思想，给出纳什确定性等价原理，并证明基于极限解构造的策略在有限 N 时构成 ε-纳什均衡。它为工程应用提供了直接依据。", "k": 1, "v": "Communications in Information and Systems"}, {"c": "Cardaliaguet, Delarue, Lasry & Lions (2019)", "t": "The master equation and the convergence problem in mean field games", "n": "引入测度空间上的主方程并用它证明有限 N 人博弈的纳什均衡收敛到平均场解。它解决了该领域最重要的基础问题——极限的合法性。", "k": 1, "v": "Annals of Mathematics Studies（Princeton University Press）"}, {"c": "Carmona & Delarue (2018)", "t": "Probabilistic Theory of Mean Field Games with Applications", "n": "用前后向随机微分方程系统建立平均场博弈的概率论方法，并明确区分竞争型与合作型。它是该领域的标准参考书。", "v": "Springer（两卷本专著）"}, {"c": "Guo, Hu, Xu & Zhang (2019)", "t": "Learning mean-field games", "n": "给出模型未知时求解平均场均衡的强化学习算法与收敛性证明，是把平均场博弈学习化的开创工作。", "k": 1, "v": "NeurIPS 2019"}, {"c": "Perrin, Perolat, Laurière, Geist, Elie & Pietquin (2020)", "t": "Fictitious play for mean field games: continuous time analysis and applications", "n": "证明连续时间虚拟博弈在单调性条件下收敛到平均场均衡，给出第一个有全局收敛保证的学习算法。", "v": "NeurIPS 2020"}, {"c": "Perolat et al. (2022)", "t": "Scaling mean field games by online mirror descent", "n": "用在线镜像下降求解平均场均衡，收敛更快且能与深度网络结合，使平均场方法可用于大规模问题。", "v": "AAMAS 2022"}, {"c": "Yang, Luo, Li, Zhou, Zhang & Wang (2018)", "t": "Mean field multi-agent reinforcement learning", "n": "把每个主体与所有其他主体的交互近似为与邻居平均动作的交互，使多智能体 Q 学习的复杂度不随主体数增长。它是平均场思想在深度多智能体强化学习中的代表实现。", "k": 1, "v": "ICML 2018"}, {"c": "Parise & Ozdaglar (2023)", "t": "Graphon games: a statistical framework for network games and interventions", "n": "用图元刻画异质的网络交互结构，把平均场从全对全推广到任意稠密图极限，并研究干预设计。它放松了同质全连接这一最强的假设。", "v": "Econometrica"}, {"c": "Laurière, Perrin, Geist & Pietquin (2022)", "t": "Learning mean field games: a survey", "n": "系统梳理平均场博弈的学习方法（虚拟博弈、镜像下降、Q 学习、深度方法）及其收敛条件。它是进入这一交叉领域的标准入口。", "v": "arXiv 预印本"}], "people": [{"n": "Pierre-Louis Lions（Collège de France，菲尔兹奖）& Jean-Michel Lasry", "r": "平均场博弈的创立；测度空间上的微分与主方程"}, {"n": "Peter Caines & Minyi Huang（McGill／Carleton）", "r": "纳什确定性等价原理；有限 N 下的 ε-纳什性质"}, {"n": "René Carmona & François Delarue（Princeton／Nice）", "r": "平均场博弈的概率论方法与两卷本专著"}, {"n": "Pierre Cardaliaguet（Paris Dauphine）", "r": "主方程与收敛问题的解决"}, {"n": "Xin Guo（Berkeley）", "r": "平均场博弈与平均场控制的强化学习理论"}, {"n": "Olivier Pietquin、Matthieu Geist & Julien Perolat（DeepMind）", "r": "平均场博弈的可扩展学习算法（虚拟博弈、镜像下降）"}, {"n": "杨耀东 Yaodong Yang（北京大学）", "r": "平均场多智能体强化学习——把平均场近似引入深度 MARL"}, {"n": "Asuman Ozdaglar（MIT）", "r": "图元博弈——异质网络交互的极限刻画"}]}, {"id": "C2", "p": "C", "num": "2", "name": "系统稳定性与临界行为理论", "kind": "group", "pillar": "iii", "summary": "研究多主体学习系统何时保持稳定，以及何时出现突变、振荡或失稳。", "extra": "如果说上一组问「会收敛到哪里」，这一组问「会不会收敛、以及不收敛时是什么样子」。三个子方向依次是：把学习算法当作动力系统分析其不动点与稳定性；环境本身随时间变化时能否跟踪移动的均衡；以及参数变化如何导致系统从稳定经由分岔进入周期振荡与混沌。这一组的结论对 AI 安全最具警示性——不稳定不是工程缺陷，而是多主体学习的内在属性。"}, {"id": "C21", "p": "C2", "num": "2.1", "name": "学习动力学稳定性与收敛理论", "kind": "leaf", "pillar": "iii", "summary": "研究多主体策略更新所形成的动力系统是否收敛，以及它收敛到的不动点是否真的是均衡、是否稳定。", "why": "关键结构性发现是：多主体的梯度场一般不是任何函数的梯度，因此不存在可以单调下降的势函数。把博弈的雅可比矩阵分解后，对称部分对应可以下降的势博弈成分，反对称部分对应产生旋转的哈密顿成分——后者正是训练振荡的来源。更严重的是，梯度动力学的稳定吸引子可能根本不是纳什均衡，也就是说算法会稳定地停在一个没人满意的点上。", "phases": [{"t": "演化博弈动力学（1978–2003）", "d": "复制动力学被提出，把策略频率的演化写成常微分方程，并与演化稳定策略建立联系。此后发展出一整套population games的动力学理论，明确了势博弈、稳定博弈等可保证收敛的类别，以及一般博弈中循环与混沌的存在。"}, {"t": "随机逼近的桥梁（1990s–2000s）", "d": "证明带衰减步长的随机学习算法其渐近行为由对应的常微分方程的极限集决定。这使得离散的、随机的学习算法可以用连续动力系统的工具分析，是整个方向的方法论基础。"}, {"t": "局部均衡的微分刻画（2013–2016）", "d": "在连续动作空间上给出微分纳什均衡的一阶与二阶条件，使「均衡」成为可以用雅可比与海森矩阵检验的局部概念。这为后续把博弈学习当作动力系统分析铺平了道路。"}, {"t": "生成对抗训练推动的爆发（2017–2020）", "d": "GAN 训练不稳定使这一理论进入机器学习主流。博弈梯度场的哈密顿—势分解被提出，明确了旋转成分的来源并据此设计出抑制旋转的算法。同期证明梯度动力学的稳定吸引子未必是纳什均衡，揭示了一类此前未被认识的失败模式。"}, {"t": "可保证收敛的结构类（2021– ）", "d": "研究转向寻找具有良好收敛性的结构化子类：马尔可夫势博弈中独立策略梯度被证明全局收敛；单调博弈中乐观方法有最后迭代收敛率。思路是既然一般情形不可能，就刻画清楚哪些系统是可控的。"}], "papers": [{"c": "Taylor & Jonker (1978)", "t": "Evolutionarily stable strategies and game dynamics", "n": "提出复制动力学，把策略比例的演化写成微分方程并与演化稳定策略联系起来。它开创了用动力系统研究博弈的传统。", "k": 1, "v": "Mathematical Biosciences"}, {"c": "Hofbauer & Sigmund (2003)", "t": "Evolutionary game dynamics", "n": "系统梳理复制动力学、最优反应动力学等的收敛与不收敛结果，明确哪些博弈类别可保证收敛。它是该方向公认的权威综述。", "v": "Bulletin of the AMS"}, {"c": "Benaïm (1999)", "t": "Dynamics of stochastic approximation algorithms", "n": "证明随机逼近算法的渐近行为由对应常微分方程的内链回复集刻画。它把离散随机学习与连续动力系统严格连接，是整套分析方法的基础。", "k": 1, "v": "Séminaire de Probabilités XXXIII（Springer LNM）"}, {"c": "Ratliff, Burden & Sastry (2016)", "t": "On the characterization of local Nash equilibria in continuous games", "n": "给出微分纳什均衡的一阶与二阶充分条件，使连续博弈中的局部均衡可用雅可比与海森矩阵检验。它把博弈均衡变成可计算的局部性质。", "k": 1, "v": "IEEE Transactions on Automatic Control"}, {"c": "Mescheder, Nowozin & Geiger (2017)", "t": "The numerics of GANs", "n": "把 GAN 训练视为向量场的数值积分，用雅可比矩阵的特征值分析解释训练振荡，并提出一致最优化方法。它开启了用动力系统工具分析对抗训练的路线。", "v": "NeurIPS 2017"}, {"c": "Balduzzi, Racanière, Martens, Foerster, Tuyls & Graepel (2018)", "t": "The mechanics of n-player differentiable games", "n": "把博弈梯度场的雅可比分解为对称（势博弈）与反对称（哈密顿）两部分，指出后者产生旋转，并据此设计辛梯度调整算法。这是理解多主体不收敛最重要的结构性结果。", "k": 1, "v": "ICML 2018"}, {"c": "Letcher, Balduzzi, Racanière, Martens, Foerster, Tuyls & Graepel (2019)", "t": "Differentiable game mechanics", "n": "把上述分解发展为完整理论，给出各类算法在分解视角下的统一比较与收敛分析。", "v": "JMLR"}, {"c": "Mazumdar, Ratliff & Sastry (2020)", "t": "On gradient-based learning in continuous games", "n": "证明梯度动力学的稳定吸引子集合与纳什均衡集合一般不重合，存在稳定但非纳什的吸引子。它揭示了一类新的失败模式：算法稳定地收敛到没人满意的点。", "k": 1, "v": "SIAM Journal on Mathematics of Data Science"}, {"c": "Daskalakis & Panageas (2018)", "t": "The limit points of (optimistic) gradient descent in min-max optimization", "n": "刻画普通与乐观梯度下降在极小极大问题上的极限点集合，证明乐观版本排除了一大类非均衡吸引子。", "v": "NeurIPS 2018"}, {"c": "Leonardos, Overman, Panageas & Piliouras (2022)", "t": "Global convergence of multi-agent policy gradient in Markov potential games", "n": "证明在马尔可夫势博弈这一结构化类别中，独立策略梯度全局收敛到纳什均衡。它给出了「什么样的多智能体系统是可控的」的正面答案。", "k": 1, "v": "ICLR 2022"}], "people": [{"n": "Josef Hofbauer & Karl Sigmund（Vienna）", "r": "演化博弈动力学的系统理论"}, {"n": "William Sandholm（Wisconsin）", "r": "population games 与演化动力学的统一框架"}, {"n": "Michel Benaïm（Neuchâtel）", "r": "随机逼近的动力系统理论——离散学习与 ODE 的桥梁"}, {"n": "S. Shankar Sastry & Lillian Ratliff（Berkeley／UW）", "r": "微分纳什均衡的刻画；梯度动力学存在非纳什稳定吸引子"}, {"n": "David Balduzzi、Karl Tuyls & Thore Graepel（DeepMind）", "r": "可微博弈的哈密顿—势分解与辛梯度调整"}, {"n": "Constantinos Daskalakis & Ioannis Panageas", "r": "乐观方法的极限点刻画与最后迭代收敛"}, {"n": "Georgios Piliouras", "r": "马尔可夫势博弈中策略梯度的全局收敛；学习动力学的全局分析"}]}, {"id": "C22", "p": "C2", "num": "2.2", "name": "时变博弈与非平稳多主体学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究环境和其他主体持续变化时，系统能否跟踪不断移动的动态均衡，以及跟踪误差如何随变化速度增长。", "why": "这是「非平稳性是多智能体学习根本困难」这一直觉的严格版本。单体在线学习早已建立动态后悔理论——与逐时刻最优比较而非与固定最优比较，且最优率由环境的累积变化量决定。把它推广到博弈需要新的概念：不再是跟踪一个移动的最优点，而是跟踪一个移动的均衡集合，而均衡本身可能不唯一甚至不存在。", "phases": [{"t": "单体动态后悔的建立（2003–2018）", "d": "在线凸优化中提出动态后悔概念；随后引入变差预算刻画环境变化量并给出极小极大最优率；再进一步给出无需预知变化量的自适应算法与通用动态后悔的最优界。这套工具是整个方向的基础。"}, {"t": "时变博弈的形式化（2018–2023）", "d": "把博弈本身的收益函数设为随时间变化，定义均衡跟踪问题，证明当均衡的累积漂移次线性增长时，无悔学习能够跟踪到均衡序列，并给出跟踪误差与漂移量的定量关系。同期在对抗变化的零和博弈中提出以纳什值为基准的后悔概念。"}, {"t": "多智能体非平稳性的系统化（2017– ）", "d": "把「其他主体在学习」造成的非平稳性单独作为研究对象，梳理出建模对手、元学习、经验博弈分析等应对路线，并明确指出单体强化学习的收敛性证明在此全部失效。"}, {"t": "与非平稳强化学习合流（2021– ）", "d": "单体非平稳强化学习给出了无需预知变化预算的最优动态遗憾算法，这些技术正被移植到博弈设定。同时对时变博弈中无悔动力学的最后迭代行为与收敛速率给出更精细的刻画。"}, {"t": "大模型智能体生态（2023– ）", "d": "持续在线、互相影响、不断被更新的智能体群体是典型的时变博弈；模型的部署本身改变数据与用户行为（表演性效应）使非平稳性内生化。目前尚无适配这一设定的理论。"}], "papers": [{"c": "Zinkevich (2003)", "t": "Online convex programming and generalized infinitesimal gradient ascent", "n": "提出在线梯度下降并同时引入动态后悔概念——与逐时刻最优比较。它是所有非平稳在线学习与时变博弈研究的起点。", "k": 1, "v": "ICML 2003"}, {"c": "Besbes, Gur & Zeevi (2015)", "t": "Non-stationary stochastic optimization", "n": "引入变差预算刻画环境的累积变化量，给出动态后悔的极小极大率。它确立了「跟踪能力由变化速度决定」这一定量框架。", "k": 1, "v": "Operations Research"}, {"c": "张利军, 卢帅 & 周志华 (2018)", "t": "Adaptive online learning in dynamic environments", "n": "给出通用动态后悔的极小极大最优界，且算法无需事先知道变化量。它解决了此前方法必须预知变差预算这一实用障碍。", "k": 1, "v": "NeurIPS 2018"}, {"c": "Cardoso, Abernethy, Wang & Xu (2019)", "t": "Competing against Nash equilibria in adversarially changing zero-sum games", "n": "在收益矩阵被对抗性改变的零和博弈中，提出以每轮纳什值为基准的后悔概念并给出次线性算法。它是时变博弈中第一个恰当的性能度量。", "k": 1, "v": "ICML 2019"}, {"c": "Duvocelle, Mertikopoulos, Staudigl & Vermeulen (2023)", "t": "Multiagent online learning in time-varying games", "n": "定义均衡跟踪问题，证明当均衡序列的累积漂移次线性时无悔学习可跟踪到均衡，并给出跟踪误差的定量界。这是该方向的核心理论论文。", "k": 1, "v": "Mathematics of Operations Research"}, {"c": "Hernandez-Leal, Kaisers, Baarslag & de Cote (2017)", "t": "A survey of learning in multiagent environments: dealing with non-stationarity", "n": "系统梳理多智能体非平稳性的来源与应对策略，指出单体强化学习收敛保证在此全部失效。它是这一问题意识的标准参考。", "v": "arXiv 预印本"}, {"c": "Wei & Luo (2021)", "t": "Non-stationary reinforcement learning without prior knowledge: an optimal black-box approach", "n": "给出把任意平稳强化学习算法转为非平稳最优算法的黑箱归约，无需预知变化预算。它是单体非平稳强化学习的最优解，并可迁移到博弈设定。", "k": 1, "v": "COLT 2021"}, {"c": "Anagnostides, Panageas, Farina & Sandholm (2022)", "t": "On last-iterate convergence beyond zero-sum games", "n": "把最后迭代收敛的分析推广到零和之外的博弈类别，给出收敛速率。它填补了时变与一般博弈中轨迹行为的理论空白。", "v": "ICML 2022"}, {"c": "Mertikopoulos & Zhou (2019)", "t": "Learning in games with continuous action sets and unknown payoff functions", "n": "在连续动作空间与未知收益的设定下给出对偶平均类算法的收敛条件，是把博弈学习推向现实信息条件的关键工作。", "v": "Mathematical Programming"}, {"c": "赵鹏, 张宇辉, 张利军 & 周志华 (2020, 2024)", "t": "Dynamic regret of convex and smooth functions / Non-stationary online learning: a comprehensive survey", "n": "把动态后悔从一般凸推广到光滑函数与赌博机反馈，并系统化整个非平稳在线学习的理论体系。它是该方向目前最完整的综述。", "v": "NeurIPS 2020 / arXiv 综述 2024"}], "people": [{"n": "Martin Zinkevich", "r": "在线凸优化与动态后悔概念"}, {"n": "Omar Besbes（Columbia）", "r": "变差预算下非平稳优化的极小极大率"}, {"n": "周志华、张利军、赵鹏（南京大学 LAMDA）", "r": "通用动态后悔的最优界与自适应算法——该方向的世界主要中心"}, {"n": "Panayotis Mertikopoulos（CNRS）", "r": "时变博弈中的均衡跟踪理论"}, {"n": "Jacob Abernethy（Georgia Tech）", "r": "对抗变化零和博弈中的纳什后悔概念"}, {"n": "Chen-Yu Wei & Haipeng Luo（Virginia／USC）", "r": "非平稳强化学习的最优黑箱归约"}, {"n": "Tuomas Sandholm & Gabriele Farina（CMU／MIT）", "r": "一般博弈中无悔动力学的最后迭代收敛速率"}, {"n": "Karl Tuyls（DeepMind）", "r": "多智能体非平稳性的系统化与经验博弈论分析"}]}, {"id": "C23", "p": "C2", "num": "2.3", "name": "非平衡、分岔与混沌学习动力学", "kind": "leaf", "pillar": "iii", "summary": "研究参数（学习率、主体数、耦合强度）变化是否导致系统从稳定状态发生相变、周期振荡或混沌，以及这种不可预测性有多普遍。", "why": "这个方向给出了整棵树上对 AI 安全最有警示意义的结论：在随机生成的多人博弈中，随着主体数增加，混沌是常态而非例外；即使最简单的两人博弈配上最简单的学习规则，增大学习率也会经由倍周期分岔进入混沌。这意味着大规模智能体系统的长期行为在原理上不可预测，可控性必须建立在别的机制上，而不能指望系统自己收敛。", "phases": [{"t": "发现混沌（2002）", "d": "证明两个玩家用最简单的强化学习反复玩一个类似石头剪刀布的博弈就会产生混沌轨道，且轨道的李雅普诺夫指数为正。这个极简反例说明混沌不需要复杂的模型或大量主体。"}, {"t": "复杂博弈中的普遍性（2013）", "d": "在随机生成的复杂博弈中系统研究学习动力学，发现当收益的耦合与不对称程度增大时，混沌成为主导行为，收敛反而是特例。这把混沌从奇异反例提升为一般现象。"}, {"t": "学习率导致的分岔（2017–2020）", "d": "证明在拥塞博弈中乘性权重算法随着步长增大依次经历收敛、极限环、倍周期分岔直到李–约克混沌。这个结果的意义在于：混沌不是博弈的性质而是学习算法参数的性质，同一个系统调大学习率就会失稳。"}, {"t": "守恒结构与回复（2018）", "d": "证明零和博弈中连续时间正则化学习保有一个守恒量，因而轨迹呈庞加莱回复——永远回到初始状态附近而不收敛。这从结构上解释了对抗训练的持续振荡。"}, {"t": "主体数与混沌的普遍性（2018–2023）", "d": "在随机多人博弈中证明玩家数增多时混沌的出现概率趋近于一，且这一结论对多种学习规则稳健。最终一般性的不可能性定理证明：没有任何满足自然性质的动力学能在所有博弈中收敛。"}], "papers": [{"c": "Sato, Akiyama & Farmer (2002)", "t": "Chaos in learning a simple two-person game", "n": "证明两个主体用最简单的强化学习玩非零和的石头剪刀布类博弈即产生混沌。这个极简反例说明不可预测性不需要复杂系统，是该方向的引爆点。", "k": 1, "v": "PNAS"}, {"c": "Galla & Farmer (2013)", "t": "Complex dynamics in learning complicated games", "n": "在随机生成的复杂博弈中系统刻画学习动力学的相图，发现收益耦合与不对称增大时混沌成为主导。它把混沌从个例提升为普遍现象。", "k": 1, "v": "PNAS"}, {"c": "Palaiopanos, Panageas & Piliouras (2017)", "t": "Multiplicative weights update with constant step-size in congestion games: convergence, limit cycles and chaos", "n": "证明同一个拥塞博弈中，随着学习率增大系统依次经历收敛、极限环、倍周期分岔到李–约克混沌。它说明失稳可以纯粹由算法超参数引起。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Mertikopoulos, Papadimitriou & Piliouras (2018)", "t": "Cycles in adversarial regularized learning", "n": "证明零和博弈的连续时间正则化学习是保守系统，存在守恒量因而轨迹庞加莱回复。它给出对抗训练不收敛的结构性解释。", "k": 1, "v": "SODA 2018"}, {"c": "Bailey & Piliouras (2018)", "t": "Multiplicative weights update in zero-sum games", "n": "证明离散时间乘性权重在零和博弈中发散到单纯形边界，与连续时间的回复行为形成对照。它说明离散化本身引入了额外的不稳定。", "v": "ACM EC 2018"}, {"c": "Sanders, Farmer & Galla (2018)", "t": "The prevalence of chaotic dynamics in games with many players", "n": "证明在随机生成的多人博弈中，玩家数增加时出现混沌的概率趋于一。它是「大规模智能体系统会自发稳定」这一直觉最强的反驳。", "k": 1, "v": "Scientific Reports"}, {"c": "Chotibut, Falniowski, Misiurewicz & Piliouras (2020)", "t": "The route to chaos in routing games", "n": "在路由博弈中精确刻画从稳定到混沌的完整分岔路径，并给出解析的分岔点。它把混沌的出现变成可以定量预测的现象。", "v": "NeurIPS 2020"}, {"c": "Pangallo, Heinrich & Farmer (2019)", "t": "Best reply structure and equilibrium convergence in generic games", "n": "证明最优反应图的循环结构决定了学习是否收敛，给出可从收益矩阵直接判断的指标。它为「哪些博弈会失稳」提供了可操作的判据。", "v": "Science Advances"}, {"c": "Milionis, Papadimitriou, Piliouras & Spendlove (2023)", "t": "An impossibility theorem in game dynamics", "n": "用微分拓扑证明任何满足自然性质的博弈动力学都必然在某些博弈中不收敛到纳什均衡。它把此前的具体反例提升为一般定理。", "k": 1, "v": "PNAS"}, {"c": "Skyrms (1992)", "t": "Chaos and the explanatory significance of equilibrium", "n": "从科学哲学角度提出：如果学习动力学不收敛，用均衡解释和预测行为的整套方法论就需要重新审视。这个警告先于技术结果三十年。", "v": "PSA: Philosophy of Science Association"}], "people": [{"n": "J. Doyne Farmer（Oxford INET）", "r": "博弈学习中的混沌；随机博弈中混沌的普遍性；复杂经济学"}, {"n": "Tobias Galla（Manchester／IFISC）", "r": "用统计物理方法刻画复杂博弈中学习动力学的相图"}, {"n": "Georgios Piliouras（SUTD／DeepMind）", "r": "学习率导致的倍周期分岔与混沌；庞加莱回复；博弈动力学不可能性定理"}, {"n": "Ioannis Panageas（UC Irvine）", "r": "乘性权重的极限环与混沌分析"}, {"n": "Christos Papadimitriou（Columbia）", "r": "博弈动力学的一般不可能性定理"}, {"n": "Yuzuru Sato（北海道大学）", "r": "最早构造出学习博弈中的混沌反例"}, {"n": "Marco Pangallo（Sant'Anna）", "r": "最优反应结构与收敛性的判据"}]}, {"id": "C3", "p": "C", "num": "3", "name": "系统风险约束与安全调控理论", "kind": "group", "pillar": "iii", "summary": "研究如何通过风险约束和控制机制，避免动态智能系统进入危险状态。", "extra": "前两组是描述性的——说明系统会怎样演化；这一组是规范性的——如何施加约束使它不进入危险区域。四个子方向对应四种「危险」的定义：违反显式的成本上限（约束强化学习）、尾部损失过大（风险敏感）、模型本身就有偏差（鲁棒）、以及群体分布整体偏移到坏区域（平均场控制）。它是整棵树上离控制工程最近、也最可能直接落地的一块。"}, {"id": "C31", "p": "C3", "num": "3.1", "name": "约束强化学习与安全决策理论", "kind": "leaf", "pillar": "iii", "summary": "研究在最大化长期收益的同时严格满足成本或安全约束，包括约束马尔可夫决策过程的对偶理论、原始对偶算法的收敛性，以及训练过程中能否做到零违反。", "why": "把安全写成约束而非奖励中的惩罚项，好处是不需要人为设定权重，且约束的含义可以被独立地审计与调整。理论上最重要的事实是：约束马尔可夫决策过程虽然在策略参数上非凸，但在占用测度空间上是线性规划，因此对偶间隙为零——这使拉格朗日方法有严格依据，而不只是启发式。", "phases": [{"t": "约束马尔可夫决策过程的奠基（1999）", "d": "系统建立约束 MDP 的理论：用占用测度把问题写成线性规划，证明最优策略一般是随机的（这与无约束 MDP 存在确定性最优策略截然不同），并给出对偶方法的基本框架。"}, {"t": "深度约束强化学习（2017–2019）", "d": "把信赖域策略优化推广到带约束情形，给出每次更新近似满足约束的保证；也出现用拉格朗日乘子自适应调节惩罚强度的方法，以及基于李雅普诺夫函数构造安全策略集的做法。同期出现标准基准，使方法可比较。"}, {"t": "理论保证的建立（2019–2021）", "d": "证明约束强化学习的对偶间隙为零，为拉格朗日方法提供了严格依据；随后给出自然策略梯度原始对偶方法的收敛速率，以及探索阶段的遗憾与约束违反的双重界。「学习过程中是否可能零违反」被证明需要额外的安全基线策略或可行性假设。"}, {"t": "硬约束与形式化方法（2018– ）", "d": "引入运行时屏蔽：用形式化验证得到的安全自动机在动作执行前拦截不安全动作，从而在整个学习过程中提供硬保证。控制屏障函数与李雅普诺夫方法把控制论的安全工具引入学习系统。"}, {"t": "大模型对齐（2023– ）", "d": "把有用性与无害性建模为约束优化而非加权求和，使二者的权衡可以被显式控制而不是隐藏在超参数里。这是约束强化学习进入大模型对齐的直接应用。"}], "papers": [{"c": "Altman (1999)", "t": "Constrained Markov Decision Processes", "n": "系统建立约束 MDP 理论：占用测度线性规划表述、最优策略的随机性、对偶方法框架。它是整个方向的奠基专著。", "k": 1, "v": "CRC Press（专著）"}, {"c": "Achiam, Held, Tamar & Abbeel (2017)", "t": "Constrained policy optimization", "n": "把信赖域策略优化推广到带约束情形，给出每次更新后约束违反量的上界。它是第一个在深度强化学习中提供近似约束保证的算法。", "k": 1, "v": "ICML 2017"}, {"c": "Chow, Nachum, Duenez-Guzman & Ghavamzadeh (2018)", "t": "A Lyapunov-based approach to safe reinforcement learning", "n": "用李雅普诺夫函数构造一个保证可行的策略集合，在其中做策略改进从而保持安全。它把控制论的稳定性工具引入约束强化学习。", "v": "NeurIPS 2018"}, {"c": "Tessler, Mankowitz & Mannor (2019)", "t": "Reward constrained policy optimization", "n": "用拉格朗日乘子自适应调节惩罚强度，避免手工设定权重，并给出收敛性分析。它是实践中最常用的基线方法。", "v": "ICLR 2019"}, {"c": "Paternain, Chamon, Calvo-Fullana & Ribeiro (2019)", "t": "Constrained reinforcement learning has zero duality gap", "n": "证明尽管在策略参数上非凸，约束强化学习的对偶间隙为零。这为一切拉格朗日方法提供了严格依据，是该方向最重要的理论结果。", "k": 1, "v": "NeurIPS 2019"}, {"c": "Efroni, Mannor & Pirotta (2020)", "t": "Exploration-exploitation in constrained MDPs", "n": "给出学习过程中的遗憾与累积约束违反的双重界，并分析零违反在什么条件下可能。它把约束从「最终满足」推进到「全程满足」。", "k": 1, "v": "arXiv 预印本"}, {"c": "Ding, Zhang, Başar & Jovanović (2020)", "t": "Natural policy gradient primal-dual method for constrained MDPs", "n": "证明自然策略梯度原始对偶方法的全局收敛率，给出最优性差距与约束违反的显式界。它是深度约束强化学习理论化的关键一步。", "k": 1, "v": "NeurIPS 2020"}, {"c": "Alshiekh, Bloem, Ehlers, Könighofer, Niekum & Topcu (2018)", "t": "Safe reinforcement learning via shielding", "n": "用形式化方法综合出一个屏蔽器，在动作执行前拦截会导致违反时序逻辑规范的动作，从而在整个学习过程中提供硬安全保证。它是形式化方法与强化学习结合的代表。", "k": 1, "v": "AAAI 2018"}, {"c": "Ray, Achiam & Amodei (2019)", "t": "Benchmarking safe exploration in deep reinforcement learning (Safety Gym)", "n": "给出标准化的安全探索基准与评测协议，使不同约束方法可以公平比较。它规范了整个子领域的实证研究。", "v": "OpenAI 技术报告"}, {"c": "Dai, Pan, Sun, Ji, Xu, Liu, Wang & 杨耀东 (2024)", "t": "Safe RLHF: safe reinforcement learning from human feedback", "n": "把有用性与无害性解耦为目标与约束，用拉格朗日方法在训练中动态平衡二者。它把约束强化学习理论直接用于大模型对齐。", "k": 1, "v": "ICLR 2024"}], "people": [{"n": "Eitan Altman（INRIA）", "r": "约束马尔可夫决策过程的奠基性理论与专著"}, {"n": "Joshua Achiam & Pieter Abbeel（OpenAI／Berkeley）", "r": "约束策略优化（CPO）；Safety Gym 基准"}, {"n": "Shie Mannor（Technion）", "r": "约束与风险敏感强化学习的系统性贡献；探索阶段的约束违反界"}, {"n": "Mohammad Ghavamzadeh（Amazon／Google）", "r": "基于李雅普诺夫的安全强化学习"}, {"n": "Alejandro Ribeiro & Santiago Paternain（Penn／RPI）", "r": "约束强化学习零对偶间隙定理"}, {"n": "Tamer Başar & Mihailo Jovanović（UIUC／USC）", "r": "自然策略梯度原始对偶方法的收敛率"}, {"n": "Ufuk Topcu（UT Austin）", "r": "运行时屏蔽——把形式化方法用于学习系统的硬安全保证"}, {"n": "杨耀东 Yaodong Yang（北京大学）", "r": "Safe RLHF——把约束强化学习用于大模型对齐"}]}, {"id": "C32", "p": "C3", "num": "3.2", "name": "风险敏感强化学习理论", "kind": "group", "pillar": "iii", "summary": "研究不只优化平均收益，而是显式控制尾部风险、方差与灾难性损失。", "extra": "期望值对灾难不敏感：一个千分之一概率的毁灭性结果只让期望下降一点点。两个子方向解决这件事的方式不同——一个换掉优化目标本身，用一致风险测度替代期望，主要困难是时间一致性；另一个不换目标而是换掉学习的对象，直接学回报的整个分布，任何风险测度都可以事后从中读出。后者已发展成一个有自己专著的独立子领域，且反过来在风险中性任务上也提升了性能，因此值得单列。"}, {"id": "C321", "p": "C32", "num": "3.2.1", "name": "风险测度与风险规避决策", "kind": "leaf", "pillar": "iii", "summary": "用一致风险测度（如条件风险价值）或效用函数替代期望作为优化目标，研究相应的贝尔曼方程、时间一致性、算法与遗憾界。", "why": "核心数学困难是时间一致性：大多数静态风险测度在序贯决策中不满足动态规划原理，今天认为最优的计划明天会想反悔。解决它需要重新构造风险测度本身——把风险按阶段逐步复合成马尔可夫风险测度——这是这个方向最深刻的理论内容，也是它与单期风险管理的根本区别。", "phases": [{"t": "效用函数时期（1972–2002）", "d": "用指数效用刻画风险偏好，得到风险敏感的贝尔曼方程。这类熵风险测度的好处是天然满足时间一致性，动态规划可直接套用；缺点是风险态度只能由单一参数控制，无法表达对特定分位的关注。随后 Q 学习被推广到这一设定。"}, {"t": "一致风险测度（1999–2010）", "d": "提出风险测度应满足的四条公理（单调、平移不变、正齐次、次可加），证明方差不是一致风险测度而条件风险价值是。随即发现关键困难：静态风险测度在多阶段问题中不满足动态规划原理，必须构造逐步复合的马尔可夫风险测度才能恢复贝尔曼方程。"}, {"t": "算法化与对偶（2013–2017）", "d": "给出条件风险价值的策略梯度与采样估计，使风险敏感目标可以用标准策略优化流程求解。同时证明条件风险价值优化与一类鲁棒马尔可夫决策过程等价——对最坏分位优化等同于对某个分布不确定集做鲁棒优化，这条对偶把风险与鲁棒两个分支连了起来。"}, {"t": "遗憾理论（2020– ）", "d": "给出指数效用与条件风险价值下的遗憾界，明确了风险敏感相对于风险中性要付出的额外样本代价，把这个方向纳入现代强化学习理论的标准框架。同时出现针对条件风险价值只用尾部样本导致数据效率低下的改进。"}, {"t": "与安全对齐（2023– ）", "d": "尾部风险控制开始被用于避免大模型的灾难性输出，但把语言模型的输出风险写成一个可优化的风险测度仍缺乏公认形式，这一块理论明显落后于需求。"}], "papers": [{"c": "Howard & Matheson (1972)", "v": "Management Science", "t": "Risk-sensitive Markov decision processes", "n": "用指数效用刻画风险偏好并推导风险敏感的贝尔曼方程，得到一个天然时间一致的框架。它是风险敏感序贯决策的起点。", "k": 1}, {"c": "Artzner, Delbaen, Eber & Heath (1999)", "v": "Mathematical Finance", "t": "Coherent measures of risk", "n": "提出风险测度应满足的四条公理，证明方差不是一致风险测度而条件风险价值是。它规定了此后所有风险敏感研究使用什么目标函数。", "k": 1}, {"c": "Borkar (2002)", "v": "Systems & Control Letters", "t": "Q-learning for risk-sensitive control", "n": "把 Q 学习推广到指数效用的风险敏感设定并给出收敛性，是这一目标下第一个无模型算法。"}, {"c": "Ruszczyński (2010)", "v": "Mathematical Programming", "t": "Risk-averse dynamic programming for Markov decision processes", "n": "指出静态风险测度在序贯决策中不满足动态规划原理，并构造马尔可夫风险测度使贝尔曼方程重新成立。这是该方向最重要的理论修正。", "k": 1}, {"c": "Bäuerle & Ott (2011)", "v": "Mathematical Methods of Operations Research", "t": "Markov decision processes with average-value-at-risk criteria", "n": "证明在条件风险价值准则下，只要把风险水平作为额外状态变量，最优策略仍可由动态规划求出。它给出了处理时间不一致性的另一条技术路径。"}, {"c": "Chow, Tamar, Mannor & Pavone (2015)", "v": "NeurIPS 2015", "t": "Risk-sensitive and robust decision-making: a CVaR optimization approach", "n": "证明条件风险价值优化与一类鲁棒马尔可夫决策过程等价，并给出值迭代算法。它把风险敏感与鲁棒决策统一在一个对偶关系下。", "k": 1}, {"c": "Tamar, Glassner & Mannor (2015)", "v": "AAAI 2015", "t": "Optimizing the CVaR via sampling", "n": "给出条件风险价值的采样式策略梯度估计与收敛性，使风险敏感目标可以用标准策略优化流程求解。", "k": 1}, {"c": "Prashanth & Ghavamzadeh (2013)", "v": "NeurIPS 2013", "t": "Actor-critic algorithms for risk-sensitive MDPs", "n": "给出方差约束下的演员—评论家算法与收敛分析，是把风险约束嵌入策略梯度的早期系统工作。"}, {"c": "Fei, Yang, Chen & Wang (2021)", "v": "NeurIPS 2021", "t": "Exponential Bellman equation and improved regret bounds for risk-sensitive reinforcement learning", "n": "提出指数贝尔曼方程并给出改进的遗憾界，明确了风险敏感相对风险中性的样本代价如何随风险参数变化。", "k": 1}, {"c": "Greenberg, Chow, Ghavamzadeh & Mannor (2022)", "v": "NeurIPS 2022", "t": "Efficient risk-averse reinforcement learning", "n": "解决条件风险价值优化中只用尾部样本导致的数据效率低下问题，用交叉熵式采样显著提高效率。"}], "people": [{"n": "Ronald Howard（Stanford）", "r": "风险敏感马尔可夫决策过程与指数效用框架"}, {"n": "Philippe Artzner & Freddy Delbaen", "r": "一致风险测度的公理化——确立条件风险价值的标准地位"}, {"n": "Andrzej Ruszczyński（罗格斯大学）", "r": "马尔可夫风险测度与风险规避动态规划的时间一致性"}, {"n": "Shie Mannor（Technion）", "r": "条件风险价值强化学习的算法与理论；风险与鲁棒的对偶"}, {"n": "Aviv Tamar（Technion）", "r": "条件风险价值的策略梯度与采样估计"}, {"n": "Marco Pavone（Stanford）", "r": "风险敏感规划及其在自动驾驶与机器人中的应用"}, {"n": "Mohammad Ghavamzadeh（Amazon）", "r": "方差约束的演员—评论家算法；风险敏感与安全强化学习"}, {"n": "Nicole Bäuerle（卡尔斯鲁厄理工）", "r": "把风险水平作为状态变量以恢复动态规划的技术路径"}, {"n": "王昭然 Zhaoran Wang & 杨卓然 Zhuoran Yang（西北大学／耶鲁大学）", "r": "风险敏感强化学习的遗憾理论与指数贝尔曼方程"}]}, {"id": "C322", "p": "C32", "num": "3.2.2", "name": "分布强化学习", "kind": "leaf", "pillar": "iii", "summary": "不学回报的期望，而学回报的完整分布。研究分布贝尔曼算子的压缩性、分布的参数化方式（类别、分位数、隐式）、以及从学到的分布中导出任意风险测度。", "why": "它与上一个子方向的关系是：那里换目标，这里换学习对象。学到分布之后，条件风险价值、扭曲风险测度等都可以事后读出，不必为每种风险偏好重新设计算法。有意思的是，即便在纯风险中性的任务上，学分布也持续带来性能提升，原因至今没有定论——这使它成为一个独立的理论问题而不只是风险敏感的工具。", "phases": [{"t": "提出与理论基础（2017）", "d": "提出学习回报的完整分布，给出分布贝尔曼算子，并证明它在最大 Wasserstein 度量下是压缩映射、但在 KL 等常用度量下不是。这个压缩性结果是整个方向的数学地基，也解释了为什么参数化方式必须小心选择。"}, {"t": "参数化方式的演进（2017–2018）", "d": "从固定支撑的类别分布，到用分位数回归学固定分位点，再到用隐式分位数网络对任意分位做连续参数化。后者的意义在于：任何扭曲风险测度都可以通过改变分位采样分布直接导出，风险偏好变成一个推断时的选择。"}, {"t": "理论澄清（2018–2019）", "d": "分析类别分布强化学习的收敛性，指出它实际优化的是投影后的分布贝尔曼算子；并系统比较期望型与分布型方法，发现分布型的增益在表格情形下消失，因而必然来自与函数逼近的相互作用。这把「为什么有用」变成了一个明确的开放问题。"}, {"t": "与神经科学的交汇（2020）", "d": "在小鼠多巴胺神经元中发现不同细胞编码不同乐观程度的价值预测，与分布强化学习的理论预测一致。这是机器学习理论反哺神经科学的标志性成果，也大大提升了这一框架的可信度。"}, {"t": "体系化（2023– ）", "d": "分位数时序差分学习的收敛性被严格建立，整个方向被写成专著，确立为强化学习的一个标准分支。风险敏感控制、探索与表示学习都开始把分布作为默认的学习对象。"}], "papers": [{"c": "Bellemare, Dabney & Munos (2017)", "v": "ICML 2017", "t": "A distributional perspective on reinforcement learning", "n": "提出学习回报的完整分布，给出分布贝尔曼算子并证明其在最大 Wasserstein 度量下的压缩性。它开创了分布强化学习并立刻带来显著的性能提升。", "k": 1}, {"c": "Dabney, Rowland, Bellemare & Munos (2018)", "v": "AAAI 2018", "t": "Distributional reinforcement learning with quantile regression", "n": "用分位数回归学固定分位点，绕开了固定支撑带来的投影误差，使分布参数化第一次与理论上的 Wasserstein 压缩性对齐。", "k": 1}, {"c": "Dabney, Ostrovski, Silver & Munos (2018)", "v": "ICML 2018", "t": "Implicit quantile networks for distributional reinforcement learning", "n": "用隐式网络对任意分位连续参数化，使任何扭曲风险测度都能通过改变分位采样直接导出。风险偏好由此变成推断时的一个选择。", "k": 1}, {"c": "Rowland, Bellemare, Dabney, Munos & Teh (2018)", "v": "AISTATS 2018", "t": "An analysis of categorical distributional reinforcement learning", "n": "分析类别分布强化学习的收敛性，指出它优化的实际上是投影后的分布贝尔曼算子，并给出相应的不动点刻画。它补上了第一代方法缺失的理论。"}, {"c": "Lyle, Bellemare & Castro (2019)", "v": "AAAI 2019", "t": "A comparative analysis of expected and distributional reinforcement learning", "n": "证明在表格与线性情形下分布型与期望型方法等价，因而分布强化学习的增益必然来自与非线性函数逼近的相互作用。它把「为什么有用」变成一个明确的开放问题。", "k": 1}, {"c": "Bellemare, Le Roux, Castro & Moitra (2019)", "v": "AISTATS 2019", "t": "Distributional reinforcement learning with linear function approximation", "n": "给出线性函数逼近下分布强化学习的收敛分析，明确了投影与逼近误差如何叠加。"}, {"c": "Barth-Maron et al. (2018)", "v": "ICLR 2018", "t": "Distributed distributional deterministic policy gradients", "n": "把分布视角引入连续控制的演员—评论家框架，说明分布学习的收益不限于离散动作空间。"}, {"c": "Dabney, Kurth-Nelson, Uchida, Starkweather, Hassabis, Munos & Botvinick (2020)", "v": "Nature", "t": "A distributional code for value in dopamine-based reinforcement learning", "n": "在小鼠多巴胺神经元中发现不同细胞编码不同乐观程度的价值预测，与分布强化学习的理论预测一致。这是机器学习理论反哺神经科学的标志性成果。", "k": 1}, {"c": "Rowland, Munos, Azar, Tang, Ostrovski, Harutyunyan, Tuyls, Bellemare & Dadashi (2023)", "v": "ICML 2023", "t": "An analysis of quantile temporal-difference learning", "n": "严格建立分位数时序差分学习的收敛性，填补了这一被广泛使用的算法长期缺乏收敛证明的空白。", "k": 1}, {"c": "Bellemare, Dabney & Rowland (2023)", "v": "MIT Press（专著）", "t": "Distributional Reinforcement Learning", "n": "把整个方向写成系统专著，涵盖算子理论、参数化、收敛性与风险应用。它标志分布强化学习成为强化学习的一个标准分支。", "k": 1}], "people": [{"n": "Marc G. Bellemare（Mila／Reliant AI）", "r": "分布强化学习的提出；分布贝尔曼算子的压缩性；领域专著"}, {"n": "Will Dabney（Google DeepMind）", "r": "分位数回归与隐式分位数网络；多巴胺系统中的分布式价值编码"}, {"n": "Rémi Munos（Meta，前 DeepMind）", "r": "分布强化学习的理论基础；从人类反馈的纳什学习"}, {"n": "Mark Rowland（Google DeepMind）", "r": "类别分布强化学习的收敛分析；分位数时序差分学习的收敛性证明"}, {"n": "Clare Lyle（Google DeepMind）", "r": "证明分布型增益来自与函数逼近的相互作用，而非分布本身"}, {"n": "Pablo Samuel Castro（Google DeepMind）", "r": "分布强化学习的实证分析与表示学习视角"}, {"n": "Matthew Botvinick & Demis Hassabis（Google DeepMind）", "r": "把分布强化学习与神经科学中的多巴胺编码联系起来"}, {"n": "Yee Whye Teh（牛津大学）", "r": "分布强化学习的概率与算子理论分析"}]}, {"id": "C33", "p": "C3", "num": "3.3", "name": "鲁棒与分布鲁棒强化学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究环境动力学存在模型误差或分布变化时如何仍能保证决策性能，即在一个转移概率的不确定集上做最坏情况优化。", "why": "仿真到现实的差距、非平稳环境、估计误差都表现为转移核的偏差。这个方向的关键技术条件是矩形性——不确定集必须能按状态动作分解，鲁棒贝尔曼方程才成立；一旦允许跨状态耦合的不确定集，问题立刻变成 NP 难。这个条件既是理论可行的边界，也是建模时最需要小心的假设。", "phases": [{"t": "鲁棒马尔可夫决策过程的奠基（2005）", "d": "两组作者同年独立提出鲁棒 MDP：把转移概率放进一个不确定集，对最坏情况做优化。关键贡献是识别出矩形性假设——不确定性按状态动作独立分解时，鲁棒贝尔曼算子仍是压缩映射，动态规划成立。"}, {"t": "复杂性边界与推广（2010–2013）", "d": "证明非矩形不确定集下鲁棒 MDP 是 NP 难的，从而确定了矩形性不只是技术方便而是必要条件。同时提出分布鲁棒版本：不确定集不是转移核的集合而是其分布的集合，用先验信息缩小保守性。"}, {"t": "深度鲁棒强化学习（2017–2020）", "d": "用对抗性扰动环境训练策略，把鲁棒性建模为智能体与环境扰动者的零和博弈；工程上更常用的是域随机化——在大量随机变化的仿真环境中训练。后者极其有效但没有保证，这一理论与实践的落差长期存在。"}, {"t": "样本复杂度理论（2021–2023）", "d": "给出分布鲁棒强化学习在生成模型下的极小极大样本复杂度，并发现一个反直觉的结论：在某些不确定集下，鲁棒问题的样本复杂度不高于甚至低于标准问题，因为鲁棒值函数对模型误差更不敏感。这修正了「鲁棒必然更贵」的直觉。"}, {"t": "与离线强化学习结合（2022– ）", "d": "离线数据本身就带有分布偏移，鲁棒性与悲观主义在数学上高度相关。研究转向刻画不同不确定集（KL、χ²、Wasserstein）下的最优率，以及离线数据覆盖条件如何影响鲁棒策略的可学性。"}], "papers": [{"c": "Iyengar (2005)", "t": "Robust dynamic programming", "n": "提出鲁棒马尔可夫决策过程，识别出矩形性条件并证明在此条件下鲁棒贝尔曼算子是压缩映射。它奠定了整个方向的数学基础。", "k": 1, "v": "Mathematics of Operations Research"}, {"c": "Nilim & El Ghaoui (2005)", "t": "Robust control of Markov decision processes with uncertain transition matrices", "n": "同年独立给出等价框架，并针对似然与相对熵型不确定集给出高效的内层求解方法。两篇共同确立了鲁棒 MDP。", "k": 1, "v": "Operations Research"}, {"c": "Xu & Mannor (2010)", "t": "Distributionally robust Markov decision processes", "n": "把不确定集从转移核集合推广到转移核的分布集合，用先验信息显著降低保守性。它是分布鲁棒强化学习的起点。", "k": 1, "v": "NeurIPS 2010 / Mathematics of Operations Research 2012"}, {"c": "Wiesemann, Kuhn & Rustem (2013)", "t": "Robust Markov decision processes", "n": "证明非矩形不确定集下鲁棒 MDP 是 NP 难的，同时给出更一般的可解结构（s-矩形与 s,a-矩形的区分）。它精确划定了可解性的边界。", "k": 1, "v": "Mathematics of Operations Research"}, {"c": "Pinto, Davidson, Sukthankar & Gupta (2017)", "t": "Robust adversarial reinforcement learning", "n": "把鲁棒性建模为智能体与施加扰动的对手之间的零和博弈，用对抗训练获得对环境变化不敏感的策略。它是深度鲁棒强化学习的代表方法。", "v": "ICML 2017"}, {"c": "Tobin, Fong, Ray, Schneider, Zaremba & Abbeel (2017)", "t": "Domain randomization for transferring deep neural networks from simulation to the real world", "n": "在随机变化的仿真环境中训练，使真实世界成为训练分布的一个样本。它是仿真到现实迁移中最有效的工程方法，但缺乏理论保证。", "v": "IROS 2017"}, {"c": "Zhou, Zhou, Bai, Qiu, Blanchet & Glynn (2021)", "t": "Finite-sample regret bound for distributionally robust offline tabular reinforcement learning", "n": "给出离线分布鲁棒强化学习的有限样本遗憾界，把鲁棒性与离线数据覆盖条件联系起来。", "v": "ICML 2021"}, {"c": "Panaganti & Kalathil (2022)", "t": "Sample complexity of robust reinforcement learning with a generative model", "n": "给出鲁棒强化学习在生成模型下的样本复杂度上界，是这一基础问题的第一批定量结果。", "v": "AISTATS 2022"}, {"c": "Shi, Li, Wei, Chen, Geist & Chi (2023)", "t": "The curious price of distributional robustness in reinforcement learning with a generative model", "n": "给出分布鲁棒强化学习的极小极大样本复杂度，并发现在某些不确定集下鲁棒问题反而比标准问题更省样本。它修正了鲁棒必然昂贵的直觉。", "k": 1, "v": "NeurIPS 2023"}, {"c": "Moos, Hansel, Abdulsamad, Stark, Clever & Peters (2022)", "t": "Robust reinforcement learning: a review of foundations and recent advances", "n": "系统梳理鲁棒强化学习的问题设定（转移、观测、动作、奖励的不确定性）与方法谱系。它是该领域的标准综述。", "v": "Machine Learning and Knowledge Extraction"}], "people": [{"n": "Garud Iyengar（Columbia）", "r": "鲁棒动态规划与矩形性条件"}, {"n": "Laurent El Ghaoui（Berkeley）& Arnab Nilim", "r": "不确定转移矩阵下的鲁棒 MDP 与高效内层求解"}, {"n": "Shie Mannor（Technion）& Huan Xu", "r": "分布鲁棒马尔可夫决策过程"}, {"n": "Daniel Kuhn & Wolfram Wiesemann（EPFL／Imperial）", "r": "鲁棒 MDP 的复杂性刻画；Wasserstein 分布鲁棒优化"}, {"n": "Yuejie Chi（CMU／Yale）", "r": "分布鲁棒强化学习的极小极大样本复杂度"}, {"n": "Jose Blanchet（Stanford）", "r": "分布鲁棒优化的对偶理论与在强化学习中的应用"}, {"n": "Pieter Abbeel & Lerrel Pinto（Berkeley／NYU）", "r": "对抗鲁棒强化学习与域随机化"}]}, {"id": "C34", "p": "C3", "num": "3.4", "name": "平均场控制理论", "kind": "leaf", "pillar": "iii", "summary": "研究如何从系统层面对大规模主体群体的状态分布进行整体调控，即以概率测度本身作为被控对象。", "why": "与平均场博弈的关键区别在于优化与取极限的顺序：博弈是每个主体先各自最优再取极限（竞争、纳什），控制是先对群体整体做最优再取极限（合作、社会最优）。两者一般不相等，这个差距正是「个体理性导致集体非理性」的数学表述。对 AI 安全而言，这一方向给出的是最直接的调控语言——不试图控制每个智能体，而是控制群体分布的演化。", "phases": [{"t": "与平均场博弈的分野（2013）", "d": "明确区分 McKean–Vlasov 控制（合作、社会最优）与平均场博弈（竞争、纳什），证明两者的解一般不同，并刻画了差异的来源。这个区分是整个方向存在的前提。"}, {"t": "测度空间上的动态规划（2014–2019）", "d": "在 Wasserstein 空间上定义值函数与导数，建立相应的 HJB 方程与粘性解理论，使动态规划原理在以分布为状态的问题上成立。这是技术上最困难的部分。"}, {"t": "学习化（2019–2023）", "d": "当模型未知时，把 Q 学习推广到概率测度空间：以群体分布为状态、以分布上的策略为动作，证明相应算子的压缩性与算法收敛性。也出现能同时求解博弈与控制两种解概念的统一算法。"}, {"t": "离散化与深度方法（2021– ）", "d": "连续测度空间不可直接计算，于是发展有限主体近似、分布的离散化表示与深度网络参数化，并给出近似误差随主体数的收敛速率。这使平均场控制开始能用于实际规模的问题。"}, {"t": "应用与 AI 安全含义（2020– ）", "d": "典型应用包括电网充电调度、交通流引导、机器人集群与流行病干预。在智能体大规模部署的语境下，它提供了一种可行的治理数学：把监管目标写成对群体分布的约束，而不是对每个智能体的规则。"}], "papers": [{"c": "Carmona, Delarue & Lachapelle (2013)", "t": "C
