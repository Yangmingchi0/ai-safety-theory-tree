<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人工智能安全理论分类树</title>
<style>
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --surface2:#FAFBF9;
  --ink:#141816; --ink2:#39423D; --muted:#5D6762; --faint:#8C968F;
  --hair:#D7DCD5; --hair2:#E7EBE5;
  --i:#2C5B4B;   --i-tint:#E6EFE9;  --i-line:#98BEAF;
  --ii:#3A4C78;  --ii-tint:#E6EAF3; --ii-line:#A1AECD;
  --iii:#7A4A2E; --iii-tint:#F3E9E2; --iii-line:#CFAA92;
  --root:#5A5560;--root-tint:#EDEBEF;--root-line:#B4AFBB;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0F1211; --surface:#171B19; --surface2:#1C211F;
  --ink:#E6EAE5; --ink2:#C7CEC8; --muted:#98A29B; --faint:#6E7873;
  --hair:#2A302D; --hair2:#222724;
  --i:#7FBBA1;   --i-tint:#1A2923;  --i-line:#3C6353;
  --ii:#95AADE;  --ii-tint:#1A2030; --ii-line:#404E72;
  --iii:#D0996F; --iii-tint:#2A1F18; --iii-line:#6A4B36;
  --root:#B0A8B8;--root-tint:#232128;--root-line:#4B4652;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:1680px;margin:0 auto;padding:0 22px 46px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:24px 0 14px;border-bottom:1px solid var(--hair)}
.top h1{margin:0;font-size:1.4rem;font-weight:700}
.tag{margin:.28rem 0 0;color:var(--muted);font-size:.82rem}
.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.77rem;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:block}
.lg--i i{background:var(--i)} .lg--ii i{background:var(--ii)} .lg--iii i{background:var(--iii)}
.btns{display:flex;gap:7px}
.btns button{font:inherit;font-size:.76rem;cursor:pointer;background:var(--surface);border:1px solid var(--hair);border-radius:5px;padding:3px 11px;color:var(--muted)}
.btns button:hover{border-color:var(--ink2);color:var(--ink)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:24px;align-items:start;padding-top:18px}
.treebox{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:8px 4px}
.treescroll{overflow-x:auto}
#tree{display:block;margin:0 auto;max-width:100%;height:auto}

.lnk{fill:none;stroke-width:1.4}
.lnk--root{stroke:var(--root-line)} .lnk--i{stroke:var(--i-line)} .lnk--ii{stroke:var(--ii-line)} .lnk--iii{stroke:var(--iii-line)}
.node{cursor:pointer}
.node rect.box{fill:var(--surface2);stroke-width:1.3;transition:fill .12s}
.node text{fill:var(--ink2)}
.node .nn{font-family:var(--mono);font-size:.76em;fill:var(--faint)}
.node--root rect.box{stroke:var(--root-line)}
.node--i rect.box{stroke:var(--i-line)}
.node--ii rect.box{stroke:var(--ii-line)}
.node--iii rect.box{stroke:var(--iii-line)}
.node--d0 text,.node--d1 text{font-weight:700}
.node--d2 text{font-weight:600}
.node:hover rect.box{fill:var(--hair2)}
.node:focus{outline:none}
.node:focus-visible rect.box{stroke-width:2.6}
.node.on rect.box{stroke-width:2.4}
.node--root.on rect.box{fill:var(--root-tint);stroke:var(--root)}
.node--i.on rect.box{fill:var(--i-tint);stroke:var(--i)}
.node--ii.on rect.box{fill:var(--ii-tint);stroke:var(--ii)}
.node--iii.on rect.box{fill:var(--iii-tint);stroke:var(--iii)}
.node--root.on text,.node--root.on .nn{fill:var(--root)}
.node--i.on text,.node--i.on .nn{fill:var(--i)}
.node--ii.on text,.node--ii.on .nn{fill:var(--ii)}
.node--iii.on text,.node--iii.on .nn{fill:var(--iii)}
.tog circle{fill:var(--surface);stroke-width:1.2}
.node--root .tog circle{stroke:var(--root-line)} .node--i .tog circle{stroke:var(--i-line)}
.node--ii .tog circle{stroke:var(--ii-line)} .node--iii .tog circle{stroke:var(--iii-line)}
.tog path{stroke-width:1.5;stroke-linecap:round;fill:none}
.node--root .tog path{stroke:var(--root)} .node--i .tog path{stroke:var(--i)}
.node--ii .tog path{stroke:var(--ii)} .node--iii .tog path{stroke:var(--iii)}
.tog:hover circle{fill:var(--hair2)}

.panel{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:22px 24px 26px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto}
.panel:focus{outline:none}
.panel[data-p="i"]{--ac:var(--i);--ac-tint:var(--i-tint)}
.panel[data-p="ii"]{--ac:var(--ii);--ac-tint:var(--ii-tint)}
.panel[data-p="iii"]{--ac:var(--iii);--ac-tint:var(--iii-tint)}
.panel[data-p="root"]{--ac:var(--root);--ac-tint:var(--root-tint)}
.crumb{font-size:.73rem;color:var(--faint);margin:0 0 8px;line-height:1.6}
.p-num{font-family:var(--mono);font-size:.79rem;color:var(--ac);letter-spacing:.1em}
.p-title{margin:.1rem 0 4px;font-size:1.28rem;font-weight:700;line-height:1.35;color:var(--ink)}
.p-kind{display:inline-block;font-size:.67rem;letter-spacing:.09em;color:var(--ac);border:1px solid var(--ac);border-radius:20px;padding:1px 9px;vertical-align:3px;margin-left:3px;font-weight:400}
.sec{margin-top:19px}
.sec-h{font-size:.7rem;font-weight:700;letter-spacing:.16em;color:var(--ac);margin:0 0 7px}
.sec p{margin:0 0 8px;color:var(--ink2);font-size:.885rem;line-height:1.86}
.sec p:last-child{margin-bottom:0}
.why{background:var(--ac-tint);border-left:3px solid var(--ac);border-radius:0 4px 4px 0;padding:9px 13px}
.why p{margin:0;font-size:.865rem}

.ph{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--hair2)}
.ph:last-child{border-bottom:0}
.ph-t{flex:0 0 auto;width:9.2rem;font-size:.75rem;font-weight:700;color:var(--ac);line-height:1.65;padding-top:2px}
.ph-d{flex:1 1 auto;font-size:.85rem;line-height:1.8;color:var(--ink2)}

.pp{padding:9px 0;border-bottom:1px dashed var(--hair2)}
.pp:last-child{border-bottom:0}
.pp-c{color:var(--ink);font-weight:700;font-size:.86rem}
.pp-t{display:block;color:var(--muted);font-size:.795rem;line-height:1.55;margin:1px 0 4px;font-style:italic}
.pp-n{font-size:.83rem;line-height:1.78;color:var(--ink2);margin:0}
.star{color:var(--ac);font-size:.8rem;margin-right:3px}
.pp.key .pp-c{color:var(--ac)}
.note{margin:9px 0 0;font-size:.71rem;color:var(--faint)}

.pe{padding:7px 0;border-bottom:1px dashed var(--hair2)}
.pe:last-child{border-bottom:0}
.pe-n{font-weight:700;font-size:.855rem;color:var(--ink)}
.pe-r{display:block;font-size:.82rem;line-height:1.72;color:var(--ink2);margin-top:1px}

.kids{display:flex;flex-wrap:wrap;gap:7px}
.kid{font:inherit;font-size:.815rem;cursor:pointer;background:var(--surface2);border:1px solid var(--hair);border-radius:5px;padding:4px 11px;color:var(--ink2)}
.kid:hover{border-color:var(--ac);color:var(--ac)}
.kid .kn{font-family:var(--mono);font-size:.76em;color:var(--faint);margin-right:5px}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:13px;border-top:1px solid var(--hair2)}
.nav button{font:inherit;font-size:.78rem;cursor:pointer;background:none;border:1px solid var(--hair);border-radius:5px;padding:5px 11px;color:var(--muted);max-width:47%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.nav button:disabled{opacity:.35;cursor:default}
.foot{margin-top:20px;padding-top:13px;border-top:1px solid var(--hair);font-size:.74rem;color:var(--faint)}

@media (max-width:1240px){
  .stage{grid-template-columns:minmax(0,1fr);gap:16px}
  .panel{position:static;max-height:none}
}
@media (max-width:640px){
  .wrap{padding:0 11px 32px}
  .top h1{font-size:1.16rem}
  .panel{padding:17px 15px 21px}
  .ph{flex-direction:column;gap:1px}
  .ph-t{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- search + list refinements --- */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:4px 11px}
.search svg{flex:0 0 auto;opacity:.55}
.search input{font:inherit;font-size:.83rem;border:0;background:none;color:var(--ink);width:15rem;outline:none;padding:2px 0}
.search input::placeholder{color:var(--faint)}
.node.dim{opacity:.22}
.node.hit rect.box{stroke-width:2}
.rsl{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.rs button{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;background:var(--surface2);border:1px solid var(--hair);border-radius:6px;padding:9px 12px}
.rs button:hover{border-color:var(--ink2)}
.rs-p{display:block;font-size:.7rem;color:var(--faint);line-height:1.5}
.rs-n{display:block;font-size:.9rem;font-weight:700;color:var(--ink);margin:1px 0 3px}
.rs-s{display:block;font-size:.775rem;color:var(--muted);line-height:1.6}
.none{color:var(--muted);font-size:.87rem;margin:14px 0 0}
.phl,.ppl,.pel{list-style:none;margin:0;padding:0}
.ph{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--hair2)}
.ph:last-child{border-bottom:0}
.ph-t{flex:0 0 auto;width:9.2rem;font-size:.75rem;font-weight:700;color:var(--ac);line-height:1.65;padding-top:2px}
.ph-d{flex:1 1 auto;font-size:.85rem;line-height:1.8;color:var(--ink2)}
.pp{padding:10px 0;border-bottom:1px dashed var(--hair2)}
.pp:last-child{border-bottom:0}
.pp-c{font-weight:700;font-size:.865rem;color:var(--ink)}
.pp.key .pp-c{color:var(--ac)}
.pp-v{display:inline-block;margin-left:7px;font-size:.7rem;line-height:1.5;padding:1px 7px;border-radius:3px;background:var(--ac-tint);color:var(--ac);vertical-align:1px;white-space:nowrap}
.pp-t{display:block;color:var(--muted);font-size:.79rem;line-height:1.55;margin:3px 0 4px;font-style:italic}
.pp-n{font-size:.83rem;line-height:1.78;color:var(--ink2);margin:0}
.pe{padding:7px 0;border-bottom:1px dashed var(--hair2)}
.pe:last-child{border-bottom:0}
.sec-h{font-size:.7rem;font-weight:700;letter-spacing:.16em;color:var(--ac);margin:0 0 7px}
.crumb{margin:0 0 8px}
.p-num{margin:0}

</style></head><body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>人工智能安全理论分类树</h1>
      <p class="tag">可信 · 可管 · 可控　｜　点击节点查看研究内容、发展脉络、代表性论文与代表学者</p>
    </div>
    <div class="tools">
      <label class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="检索方向、论文、学者" autocomplete="off" aria-label="检索" />
      </label>
      <div class="legend">
        <span class="lg lg--i"><i></i>可信</span>
        <span class="lg lg--ii"><i></i>可管</span>
        <span class="lg lg--iii"><i></i>可控</span>
      </div>
      <div class="btns">
        <button id="expandAll" type="button">全部</button>
        <button id="mainOnly" type="button">主方向</button>
        <button id="groupsOnly" type="button">方向组</button>
        <button id="collapseAll" type="button">三支</button>
      </div>
    </div>
  </header>
  <div class="stage">
    <div class="treebox"><div class="treescroll"><svg id="tree" xmlns="http://www.w3.org/2000/svg" role="tree" aria-label="分类树"></svg></div></div>
    <aside class="panel" id="panel" tabindex="-1"></aside>
  </div>
</div>
<noscript><p style="padding:20px">此页面需要启用 JavaScript 才能显示分类树。</p></noscript>
<script>
var NODES = [{"id": "root", "p": null, "num": "", "name": "人工智能安全", "kind": "root", "pillar": "root", "summary": "整棵树把「AI 安全」的理论问题按作用对象分成三层：单个模型是否可靠（可信）、模型进入社会后行为是否可被约束（可管）、大量智能体互动形成的系统是否会失稳（可控）。", "extra": "三支的规模逐级放大：可信面对的是「一个模型 + 一个数据分布」，可管面对的是「一个模型 + 一群人」，可控面对的是「一群智能体 + 一个动态系统」。数学工具也随之更换——从统计学习理论，到因果与算法博弈论，再到动力系统与随机控制。三支的失败模式互不覆盖：一个完全可信的模型仍可能不公平，一群各自可信可管的智能体仍可能让系统失稳。"}, {"id": "A", "p": "root", "num": "一", "name": "可信 Trustworthiness", "kind": "branch", "pillar": "i", "summary": "研究单个模型或学习算法本身，在不确定的数据与环境下是否可靠。", "extra": "这一支的提问对象是「模型 + 数据分布」这一对。它被拆成两半：一半问模型为什么能学到可靠规律（机理），另一半问怎么定量判断当前这次预测能不能信（判定与保证）。前者需要打开模型分析，后者原则上把模型当黑盒、只对输出的统计性质提要求——模型越大越不可解析，后者的地位越重要。"}, {"id": "A1", "p": "A", "num": "1", "name": "可信基础机理理论", "kind": "group", "pillar": "i", "summary": "研究模型为什么能够学到可靠规律，以及可靠性的数学来源是什么。", "extra": "三个来源对应三个方向：可靠性来自模型与算法本身（表达、优化、稳定性）、来自数据编码的真实结构（因果）、来自训练与部署环境的接近程度（泛化与鲁棒）。共同信念是：可信不是事后加装的，而是由这三者共同决定的。"}, {"id": "A11", "p": "A1", "num": "1.1", "name": "模型机理与学习理论", "kind": "group", "pillar": "i", "summary": "研究神经网络的表达能力、优化收敛、训练动力学与稳定性。", "extra": "经典学习理论把误差拆成逼近、优化、估计三部分，分别对应下面三个子方向，且假定三者可以独立分析再相加。深度学习推翻了这个假定：过参数化下有无穷多个零训练误差解，是优化算法的隐式偏好在其中选解，因此优化与泛化不再可分。这也是为什么这三个子方向虽然工具不同，却必须放在一起看。"}, {"id": "A111", "p": "A11", "num": "1.1.1", "name": "表达与逼近理论", "kind": "leaf", "pillar": "i", "summary": "给定网络结构，它能表示哪些函数？达到精度 ε 需要多少参数？深比浅好在哪？近年还包括：给定架构（如 Transformer），它在计算复杂性意义上能算什么。", "why": "表达能力是可信性的上界。目标函数若不在假设类的可达范围内，任何鲁棒性与校准性讨论都建立在系统性偏差之上。反过来表达能力过强则意味着可以拟合任意噪声。这个方向的结果几乎都是构造性的，因而结论比其他分支更硬。", "phases": [{"t": "稠密性时代（1989–1993）", "d": "证明「能表示」。单隐层网络在紧集上稠密，且充要条件是激活函数非多项式——关键在结构而非某个具体激活函数。Barron 随后给出与维数无关的逼近率，说明维数灾难取决于目标函数所在的函数空间而非维数本身。"}, {"t": "沉寂期（1995–2015）", "d": "稠密性问题已解决而深度网络尚未成功，逼近论转向小波与稀疏表示。这一时期积累的 Besov 空间与非线性逼近工具，后来被直接搬去分析 ReLU 网络。"}, {"t": "深度的价值（2016–2019）", "d": "问题从「能不能」变成「深比浅好多少」。锯齿函数与径向函数两类构造分别从深度叠加与维度两个角度给出指数级的深度分离；ReLU 网络逼近 Sobolev 函数的最优率被确定，并证明深度必须随精度对数增长。"}, {"t": "体系化（2019–2021）", "d": "逼近率被纳入经典非线性逼近论框架，用编码复杂度给出信息论下界，明确了网络逼近的最优性边界。中国学者以 Barron 空间与流诱导函数空间把逼近、泛化、优化统一在函数空间视角下。"}, {"t": "架构表达力（2020– ）", "d": "工具从逼近论换成电路复杂度与形式语言：证明硬注意力无法识别 PARITY 等语言，对数精度 Transformer 的单次前向被 TC⁰ 严格包含，而思维链把表达力提升到 P。这把「推理为什么要一步步写出来」变成了可证明的复杂度命题。"}], "papers": [{"c": "Cybenko (1989)", "v": "Mathematics of Control, Signals and Systems", "t": "Approximation by superpositions of a sigmoidal function", "n": "证明单隐层 sigmoid 网络在紧集上稠密，彻底解决神经网络表达力够不够的疑虑。它把争论从「能不能表示」推进到「要多大代价才能表示」。", "k": 1}, {"c": "Hornik, Stinchcombe & White (1989)", "v": "Neural Networks", "t": "Multilayer feedforward networks are universal approximators", "n": "同期独立得到通用逼近结论，并强调关键在于多层前馈这一结构而非某个具体激活函数。两篇合起来确立了整个方向的起点。"}, {"c": "Barron (1993)", "v": "IEEE Transactions on Information Theory", "t": "Universal approximation bounds for superpositions of a sigmoidal function", "n": "给出第一个与维数无关的逼近率 O(1/√n)，条件是目标函数傅立叶变换的一阶矩有限。它说明维数灾难不是必然的，而取决于目标函数所在的函数空间（后称 Barron 空间）。", "k": 1}, {"c": "Leshno, Lin, Pinkus & Schocken (1993)", "v": "Neural Networks", "t": "Multilayer feedforward networks with a nonpolynomial activation function can approximate any function", "n": "给出通用逼近的充要条件：激活函数非多项式。这是稠密性问题的终结性定理，此后该子问题再无实质进展空间。"}, {"c": "Telgarsky (2016)", "v": "COLT 2016", "t": "Benefits of depth in neural networks", "n": "用锯齿函数构造出深度 L 的网络能表示、而浅网络需要指数多单元才能逼近的函数。这是深度分离的开山之作，第一次把「深有什么用」变成定量命题。", "k": 1}, {"c": "Eldan & Shamir (2016)", "v": "COLT 2016", "t": "The power of depth for feedforward neural networks", "n": "构造出三层可高效表示、两层必须指数宽的径向函数。与 Telgarsky 互补：一个靠深度叠加，一个靠高维几何，说明深度优势有多个独立来源。"}, {"c": "Yarotsky (2017)", "v": "Neural Networks", "t": "Error bounds for approximations with deep ReLU networks", "n": "给出 ReLU 网络逼近 Sobolev 函数的最优率，并证明深度必须随精度对数增长。这是深度逼近论最被引用的技术性结果，此后几乎所有率的比较都以它为基准。", "k": 1}, {"c": "Bölcskei, Grohs, Kutyniok & Petersen (2019)", "v": "SIAM Journal on Mathematics of Data Science", "t": "Optimal approximation with sparsely connected deep neural networks", "n": "把逼近率、稀疏连接与编码复杂度统一起来，给出网络逼近的信息论下界。它说明前面那些率在什么意义上已经最优。"}, {"c": "DeVore, Hanin & Petrova (2021)", "v": "Acta Numerica", "t": "Neural network approximation", "n": "把神经网络逼近纳入经典非线性逼近论框架，指出网络参数化流形的非线性宽度性质。它是这个方向的权威综述，也澄清了大量率之间的关系。", "k": 1}, {"c": "Merrill & Sabharwal (2024)", "v": "ICLR 2024", "t": "The expressive power of transformers with chain of thought", "n": "证明对数精度 Transformer 的单次前向被 TC⁰ 严格包含，而允许生成中间步骤后表达力提升到 P。它把推理能力的必要性从经验观察变成复杂度定理。", "k": 1}], "people": [{"n": "George Cybenko（Dartmouth）", "r": "sigmoid 网络的通用逼近定理"}, {"n": "Kurt Hornik（WU Wien）", "r": "多层前馈网络的通用逼近；强调结构而非激活函数是关键"}, {"n": "Andrew Barron（Yale）", "r": "Barron 空间与不受维数影响的逼近率——规避维数灾难的函数类刻画"}, {"n": "Allan Pinkus（Technion）", "r": "通用逼近的充要条件（激活函数非多项式）；逼近论中 n-宽度理论"}, {"n": "Matus Telgarsky（NYU）", "r": "深度分离定理；隐式偏差的精细速率分析"}, {"n": "Ohad Shamir（Weizmann）", "r": "径向函数的深度分离；一系列关于学习困难性的下界"}, {"n": "Dmitry Yarotsky（Skoltech）", "r": "ReLU 网络逼近 Sobolev 函数的最优率与深度—精度关系"}, {"n": "Gitta Kutyniok（LMU）", "r": "稀疏连接网络的最优逼近与信息论下界；shearlet 与深度学习的结合"}, {"n": "Ronald DeVore（Texas A&M）", "r": "非线性逼近论；把神经网络逼近纳入经典框架"}, {"n": "鄂维南 E Weinan（北大／普林斯顿）", "r": "Barron 空间与流诱导函数空间，把逼近、泛化、优化统一在函数空间视角"}, {"n": "沈佐伟 Zuowei Shen（新加坡国立）", "r": "ReLU 网络逼近率的深度—宽度显式刻画"}, {"n": "William Merrill（NYU）", "r": "Transformer 表达力的电路复杂度刻画；思维链提升表达力的证明"}]}, {"id": "A112", "p": "A11", "num": "1.1.2", "name": "优化与收敛理论", "kind": "leaf", "pillar": "i", "summary": "非凸损失面上一阶随机算法为何能收敛到好解？包含四层：能否收敛、损失面有什么结构、过参数化为何反而好优化、以及在无穷多个零训练误差解中算法偏好哪一个（隐式正则化）。", "why": "隐式正则化是这个方向最重要的观念转变：可信性不是函数类的属性，而是「函数类 + 算法」的联合属性。同一个假设类里既有鲁棒解也有脆弱解，是算法的偏好在做选择——这意味着换一个优化器就可能换掉模型的全部可信性质。", "phases": [{"t": "凸的时代（–2011）", "d": "随机逼近与加速梯度法确立了凸优化的完整理论，机器学习刻意把问题设计成凸的（SVM、Lasso）。凸性本身被当作可信性保证：解唯一、可复现、有对偶证书。当时的共识是非凸不可解。"}, {"t": "地貌研究（2015–2016）", "d": "深度学习成功后理论界先去研究损失曲面结构：证明加噪 SGD 能在多项式时间逃离严格鞍点、扰动梯度下降的逃逸速率几乎与维数无关，并用自旋玻璃类比论证高维下坏局部极小很少。这批工作解除了社区对非凸的恐惧。"}, {"t": "过参数化机制（2018–2020）", "d": "两条平行主线：神经正切核证明无穷宽下训练等价于固定核回归，把非凸问题凸化；平均场视角把训练写成概率测度上的 Wasserstein 梯度流，同样给出全局收敛。随后指出前者属于惰性训练区、网络并不学特征，这一批评直接催生了特征学习理论与 μ 参数化。"}, {"t": "隐式正则化（2017–2021）", "d": "证明梯度下降在可分数据上收敛到最大间隔解、在矩阵分解中偏好最小核范数、在深度分解中偏好低秩——深度本身就是一种正则化。这条线给出了泛化之谜的核心答案：不是假设类小，而是算法只在其中的一个小角落里搜索。"}, {"t": "大模型尺度（2021– ）", "d": "μ 参数化使超参数可以从小模型迁移到大模型，是深度学习理论少见的直接落地。同时发现实际训练长期处于稳定性边缘：Hessian 最大特征值卡在 2/η 附近，违反经典下降引理却仍在下降，至今没有完整解释。"}], "papers": [{"c": "Robbins & Monro (1951)", "v": "The Annals of Mathematical Statistics", "t": "A stochastic approximation method", "n": "提出随机逼近，给出用带噪声的观测迭代求根的收敛条件。它是随机梯度下降的数学源头，今天所有关于步长衰减的条件都可回溯到这里。"}, {"c": "Ge, Huang, Jin & Yuan (2015)", "v": "COLT 2015", "t": "Escaping from saddle points — online stochastic gradient for tensor decomposition", "n": "第一次严格证明加噪随机梯度能在多项式时间逃离严格鞍点，并提出严格鞍性质这一分析范式。它把非凸优化的主要障碍从局部极小改判为鞍点。", "k": 1}, {"c": "Jin, Ge, Netrapalli, Kakade & Jordan (2017)", "v": "ICML 2017", "t": "How to escape saddle points efficiently", "n": "给出扰动梯度下降逃离鞍点的近乎维数无关的速率，是这一技术路线的顶峰。它说明高维本身不构成逃逸的障碍。"}, {"c": "Jacot, Gabriel & Hongler (2018)", "v": "NeurIPS 2018", "t": "Neural tangent kernel: convergence and generalization in neural networks", "n": "证明无穷宽极限下训练等价于固定核的核回归，把非凸问题凸化，从而第一次给出深度网络全局收敛的严格证明。代价是这一极限下网络不学特征。", "k": 1}, {"c": "Du, Zhai, Póczos & Singh (2019)", "v": "ICLR 2019", "t": "Gradient descent provably optimizes over-parameterized neural networks", "n": "在有限但足够宽的网络上证明梯度下降线性收敛到全局最优，把无穷宽的理想化结果落到可验证的宽度条件上。"}, {"c": "Chizat & Bach (2018)", "v": "NeurIPS 2018", "t": "On the global convergence of gradient descent for over-parameterized models using optimal transport", "n": "把两层网络的训练写成概率测度上的 Wasserstein 梯度流并证明全局收敛。这是与核方法完全不同的第二条极限路径，且保留了特征学习。", "k": 1}, {"c": "Mei, Montanari & Nguyen (2018)", "v": "PNAS", "t": "A mean field view of the landscape of two-layer neural networks", "n": "用平均场刻画两层网络训练的极限动力学，给出有限宽度下的偏差估计。它与上一篇共同确立了平均场这一分析范式。"}, {"c": "Chizat, Oyallon & Bach (2019)", "v": "NeurIPS 2019", "t": "On lazy training in differentiable programming", "n": "指出神经正切核对应的是惰性训练区——此时网络参数几乎不动、不学特征，因而无法解释深度学习的真实优势。这是对 NTK 范式最重要的批评。", "k": 1}, {"c": "Soudry, Hoffer, Nacson, Gunasekar & Srebro (2018)", "v": "ICLR 2018 / JMLR", "t": "The implicit bias of gradient descent on separable data", "n": "证明梯度下降在可分数据上收敛到最大间隔解，速率极慢（对数级）。它回答了核心悖论：零训练误差解有无穷多个，泛化好是因为算法做了隐式选择。", "k": 1}, {"c": "Cohen, Kaur, Li, Kolter & Talwalkar (2021)", "v": "ICLR 2021", "t": "Gradient descent on neural networks typically occurs at the edge of stability", "n": "发现实际训练中 Hessian 最大特征值稳定在 2/η 附近，长期违反经典下降引理却仍在下降。这一现象彻底改变了社区对深度学习优化的图像，理论解释至今不完整。", "k": 1}], "people": [{"n": "Michael I. Jordan（Berkeley）", "r": "鞍点逃逸的效率理论；变分与优化视角下的统计学习"}, {"n": "Nathan Srebro（TTIC）", "r": "隐式正则化纲领：矩阵分解偏好最小核范数、梯度下降偏好最大间隔"}, {"n": "Daniel Soudry（Technion）", "r": "可分数据上梯度下降的最大间隔隐式偏差；持续学习的遗忘理论"}, {"n": "Francis Bach（INRIA）", "r": "平均场极限下的全局收敛；提出惰性训练判据指出 NTK 的局限"}, {"n": "Lénaïc Chizat（EPFL）", "r": "Wasserstein 梯度流的全局收敛；惰性训练与特征学习的分界"}, {"n": "Andrea Montanari（Stanford）", "r": "两层网络的平均场刻画；高维统计中的精确渐近分析"}, {"n": "Arthur Jacot（NYU）", "r": "神经正切核"}, {"n": "Rong Ge（Duke）", "r": "严格鞍性质与鞍点逃逸；张量分解的非凸优化理论"}, {"n": "Chi Jin（Princeton）", "r": "高效鞍点逃逸的维数无关速率；强化学习的样本复杂度理论"}, {"n": "Simon S. Du（华盛顿大学）", "r": "有限宽度下过参数化网络的全局收敛证明"}, {"n": "Zico Kolter（CMU）", "r": "稳定性边缘现象的发现与刻画"}, {"n": "Greg Yang（xAI）", "r": "μ 参数化与 Tensor Programs——保持特征学习的无穷宽极限与超参迁移"}]}, {"id": "A113", "p": "A11", "num": "1.1.3", "name": "稳定性与学习动力学", "kind": "leaf", "pillar": "i", "summary": "两件交织的事：算法稳定性——训练集换一个样本，输出假设变多少（稳定性蕴含泛化）；学习动力学——训练过程中表示与特征如何演化、何时发生相变。", "why": "稳定性是唯一一条不依赖假设类复杂度的泛化路径，因而在参数量远超样本量时仍然有效；它同时是可复现性与差分隐私的共同数学基础。动力学则揭示模型学东西的顺序——先学低频、先学简单、先学捷径——这直接解释了伪相关与分布偏移下的崩溃。", "phases": [{"t": "稳定性泛化的建立（2002–2010）", "d": "均匀稳定性框架给出「稳定性加上界即泛化」的定理，并证明正则化经验风险最小化是稳定的。随后在一般学习问题中证明均匀收敛不再必要，稳定性才是可学习性的本质刻画——这是学习理论基础层面的一次重构。"}, {"t": "引入深度（2016–2019）", "d": "证明随机梯度下降的均匀稳定性随训练步数增长，从而为「早停即正则化」给出严格版本。随后把稳定性泛化界从期望改进到近最优的高概率界，解决了长期悬置的技术问题。"}, {"t": "经验定律的爆发（2017–2020）", "d": "随机标签实验宣告基于容量的经典理论失效，随即出现一批稳定的新经验规律：频率原则（先拟合低频）、双下降、良性过拟合、神经坍缩。它们共同说明过拟合与泛化的关系必须重写。"}, {"t": "记忆与隐私的冲突（2020）", "d": "证明在长尾分布下，接近最优的泛化必须记住大量只出现一次的样本。这说明记忆不是缺陷而是必需，也说明隐私与效用的冲突是结构性的而非算法不够好。"}, {"t": "大模型相变（2022– ）", "d": "发现归纳头的形成对应损失曲线上一个明确的相变并因果性地支撑上下文学习；grokking 被用机制分析还原为可测量的连续进展；涌现是否只是度量选择的产物成为争论焦点。相变的可预测性现在是 AI 安全最想要的理论。"}], "papers": [{"c": "Bousquet & Elisseeff (2002)", "v": "JMLR", "t": "Stability and generalization", "n": "定义均匀稳定性并证明它直接给出泛化界，同时给出正则化经验风险最小化的稳定性上界。这条路径不依赖假设类复杂度，因而在过参数化下仍然有效。", "k": 1}, {"c": "Mukherjee, Niyogi, Poggio & Rifkin (2006)", "v": "Advances in Computational Mathematics", "t": "Learning theory: stability is sufficient for generalization and necessary and sufficient for consistency of ERM", "n": "证明稳定性是经验风险最小化一致性的充要条件，把稳定性从一种技巧提升为基本概念。"}, {"c": "Shalev-Shwartz, Shamir, Srebro & Sridharan (2010)", "v": "JMLR", "t": "Learnability, stability and uniform convergence", "n": "证明在一般学习问题中均匀收敛不再是可学习性的必要条件，而稳定性是。这是对统计学习理论基础的一次重构。", "k": 1}, {"c": "Hardt, Recht & Singer (2016)", "v": "ICML 2016", "t": "Train faster, generalize better: stability of stochastic gradient descent", "n": "证明随机梯度下降的稳定性随步数增长，从而把早停即正则化这一经验做法变成定理。它是稳定性理论进入深度学习的关键一篇。", "k": 1}, {"c": "Feldman & Vondrák (2019)", "v": "COLT 2019", "t": "High probability generalization bounds for uniformly stable algorithms with nearly optimal rate", "n": "把稳定性泛化界从期望意义改进到近最优的高概率界，解决了长期存在的根号因子缺口。"}, {"c": "Zhang, Bengio, Hardt, Recht & Vinyals (2017)", "v": "ICLR 2017（最佳论文）", "t": "Understanding deep learning requires rethinking generalization", "n": "证明同一个网络能完美拟合随机标签，说明其容量足以记住一切、基于容量的界必然空洞。这是此后五年深度学习理论热潮的引信。", "k": 1}, {"c": "Rahaman et al. (2019) / 许志钦 et al. (2020)", "v": "ICML 2019 / Communications in Computational Physics", "t": "On the spectral bias of neural networks / Frequency principle: Fourier analysis sheds light on DNNs", "n": "独立发现网络在训练中先拟合低频成分再拟合高频。它解释了早停为何有效、网络为何偏好简单函数，是中国学者在深度学习动力学上最具国际影响力的贡献之一。", "k": 1}, {"c": "Belkin, Hsu, Ma & Mandal (2019)", "v": "PNAS", "t": "Reconciling modern machine-learning practice and the classical bias–variance trade-off", "n": "揭示双下降曲线：参数越过插值阈值后测试误差二次下降。它把「过拟合必然有害」改写为只在特定参数区间成立。", "k": 1}, {"c": "Bartlett, Long, Lugosi & Tsigler (2020)", "v": "PNAS", "t": "Benign overfitting in linear regression", "n": "在线性回归上精确刻画了什么样的协方差谱使得完美插值噪声数据仍能泛化。它给双下降提供了第一个完全严格的解释性模型。", "k": 1}, {"c": "Papyan, Han & Donoho (2020)", "v": "PNAS", "t": "Prevalence of neural collapse during the terminal phase of deep learning training", "n": "发现训练末期类内特征坍缩到均值、类均值构成单纯形等角紧框架、分类器与均值对偶。这是深度网络表示几何最干净的经验定律。", "k": 1}], "people": [{"n": "Olivier Bousquet（Google DeepMind）", "r": "均匀稳定性与泛化的等价框架"}, {"n": "Shai Shalev-Shwartz（希伯来大学）", "r": "证明稳定性而非均匀收敛才是一般学习问题中可学习性的刻画"}, {"n": "Moritz Hardt（MPI-IS）", "r": "随机梯度下降的稳定性；早停即正则化的严格版本"}, {"n": "Vitaly Feldman（Apple）", "r": "稳定性泛化的高概率最优界；证明长尾泛化必须依赖记忆"}, {"n": "Peter Bartlett（Berkeley）", "r": "良性过拟合的精确刻画；Rademacher 复杂度与间隔理论"}, {"n": "Mikhail Belkin（UCSD）", "r": "双下降与插值学习——重写偏差方差叙事"}, {"n": "David Donoho & Vardan Papyan（Stanford／多伦多）", "r": "神经坍缩（NC1–NC4）"}, {"n": "Andrew Saxe（UCL）", "r": "深度线性网络训练动力学的精确解；阶梯式学习现象"}, {"n": "许志钦 Zhi-Qin John Xu（上海交大）", "r": "频率原则——网络先拟合低频，解释早停与简单性偏好"}, {"n": "Neel Nanda（Google DeepMind）", "r": "用机制可解释性把 grokking 还原为可测量的连续进展"}]}, {"id": "A12", "p": "A1", "num": "1.2", "name": "数据与因果理论", "kind": "group", "pillar": "i", "summary": "研究从有限、不完备或有偏的数据中，能否识别真实的因果结构与规律。", "extra": "统一主题是可识别性：目标量能否被观测唯一确定。识别不成立时再多数据也无用，这是信息论级别的不可能性，比统计误差严重得多。三个子方向按「变量是否已知、数据是否干净」递进：变量已知且数据干净（1.2.1）→ 变量已知但数据有系统性缺陷（1.2.2）→ 变量本身要从像素中学出来（1.2.3）。三者共享同一套证明套路：先给不可能性定理，再找最小的额外假设把可识别性换回来，实在换不回来就退到部分识别。"}, {"id": "A121", "p": "A12", "num": "1.2.1", "name": "因果结构与因果效应识别", "kind": "leaf", "pillar": "i", "summary": "给定因果图与观测分布，干预量 P(y | do(x)) 能否唯一表达为观测量的泛函？因果图能从数据恢复到什么程度？识别成立后如何以统计最优的方式估计？", "why": "可信 AI 的很多目标只有在因果语言里才能被正确表述——反事实公平、机制不变的泛化、干预后果预测。用相关性代替因果性做决策是 AI 系统最常见也最隐蔽的失效模式：模型学到「哮喘病人肺炎死亡率低」，因为他们被优先送进了重症监护。", "phases": [{"t": "两套语言并立（1974–1995）", "d": "统计学派把因果效应定义为个体在两种处理下潜在结果之差，从而把因果问题转成缺失数据问题；人工智能学派用因果图与 do-演算把干预定义为图上的手术。流行病学则独立发展 g-方法处理时变混杂。三条线后来被证明本质等价。"}, {"t": "识别问题被封闭（1995–2006）", "d": "后门与前门准则给出可操作的调整判据；2006 年两组人独立证明 do-演算对识别问题完备，并给出可判定的 ID 算法，不可识别时还能输出证据。至此「给定图，某个干预量能否识别」被彻底解决——这是整棵树上少数几个已封闭的问题。"}, {"t": "突破等价类（2006–2012）", "d": "结构学习原本只能恢复马尔可夫等价类。利用线性非高斯性与非线性加性噪声，因果方向变得完全可识别，开辟了「用分布的额外结构换可识别性」这条至今仍在扩展的路线。"}, {"t": "连续优化与自我纠错（2018–2021）", "d": "把无环约束写成光滑等式使结构学习变为连续优化，引爆大量可微因果发现工作；但随后发现合成数据中的方差排序性使这类方法的评测严重虚高。这是该领域最重要的一次自我纠错。"}, {"t": "半参数革命（2016– ）", "d": "用交叉拟合加 Neyman 正交化，使任意机器学习模型估计的冗余参数不污染因果参数的一阶渐近性，从而给出 √n 一致、渐近正态的效应估计。因果森林进一步把异质处理效应也配上置信区间。这是 ML 与因果结合最成功的落地。"}], "papers": [{"c": "Rubin (1974)", "v": "Journal of Educational Psychology", "t": "Estimating causal effects of treatments in randomized and nonrandomized studies", "n": "用潜在结果把因果效应定义为个体在两种处理下结果之差，从而把因果问题转化为缺失数据问题。这一转换让整个统计学的工具可以直接用于因果推断。", "k": 1}, {"c": "Rosenbaum & Rubin (1983)", "v": "Biometrika", "t": "The central role of the propensity score in observational studies for causal effects", "n": "证明在可忽略性下，按倾向得分这一个标量分层即足以消除混杂，把高维协变量调整降为一维问题。这可能是应用最广的因果推断工具。"}, {"c": "Pearl (1995)", "v": "Biometrika", "t": "Causal diagrams for empirical research", "n": "提出后门准则、前门准则与 do-演算，给出「哪些变量该调整、哪些不该」的图论判据。它把因果识别从个案技巧变成可机械执行的算法。", "k": 1}, {"c": "Spirtes, Glymour & Scheines (2000)", "v": "MIT Press（专著，第 2 版）", "t": "Causation, Prediction, and Search", "n": "给出因果发现的公理体系（因果马尔可夫条件加忠实性）与 PC 算法，第一次说明从纯观测数据恢复因果结构在什么意义上可行、可行到什么程度。", "k": 1}, {"c": "Shpitser & Pearl (2006)", "v": "AAAI 2006", "t": "Identification of joint interventional distributions in recursive semi-Markovian causal models", "n": "证明 do-演算对识别问题完备，并给出可判定的 ID 算法：不可识别时能输出具体的图结构证据。它把识别问题彻底封闭。", "k": 1}, {"c": "Shimizu, Hoyer, Hyvärinen & Kerminen (2006)", "v": "JMLR", "t": "A linear non-Gaussian acyclic model for causal discovery", "n": "证明在线性非高斯假设下因果图完全可识别而不只是等价类，开辟了用分布的额外结构换取可识别性这条路线。", "k": 1}, {"c": "Hoyer, Janzing, Mooij, Peters & Schölkopf (2008)", "v": "NeurIPS 2008", "t": "Nonlinear causal discovery with additive noise models", "n": "把可识别性从线性非高斯推广到非线性加性噪声，说明只要机制足够非线性，因果方向就在分布中留下可检测的痕迹。"}, {"c": "Zheng, Aragam, Ravikumar & Xing (2018)", "v": "NeurIPS 2018", "t": "DAGs with NO TEARS: continuous optimization for structure learning", "n": "把有向无环约束写成一个光滑等式，使结构学习从组合搜索变成连续优化。它引爆了整个可微因果发现方向，也因随后被揭示的评测缺陷而成为方法论反思的案例。"}, {"c": "Chernozhukov et al. (2018)", "v": "The Econometrics Journal", "t": "Double/debiased machine learning for treatment and structural parameters", "n": "用交叉拟合加 Neyman 正交化，使任意机器学习方法估计的冗余参数不污染因果参数的一阶渐近性。这是 ML 与因果结合最成功、应用最广的成果。", "k": 1}, {"c": "Wager & Athey (2018)", "v": "JASA", "t": "Estimation and inference of heterogeneous treatment effects using random forests", "n": "证明经过诚实分裂的随机森林给出的异质处理效应估计渐近正态，从而可以配上置信区间。它让「谁受益更多」这一问题第一次有了统计推断。"}], "people": [{"n": "Judea Pearl（UCLA，图灵奖）", "r": "因果图、do-演算与因果层级——把因果推断变成可计算的图论问题"}, {"n": "Donald B. Rubin（Harvard）", "r": "潜在结果框架、倾向得分、缺失数据三分法"}, {"n": "James Robins（Harvard）", "r": "g-公式、边际结构模型、双重稳健估计——处理时变混杂的标准工具"}, {"n": "Peter Spirtes & Clark Glymour（CMU）", "r": "因果发现的公理化与 PC／FCI 算法"}, {"n": "Ilya Shpitser（约翰霍普金斯）", "r": "ID 算法与 do-演算完备性的证明"}, {"n": "Elias Bareinboim（Columbia）", "r": "可迁移性与数据融合理论——把识别推广到多源异构数据"}, {"n": "Guido Imbens（Stanford，诺贝尔经济学奖）& Susan Athey", "r": "局部平均处理效应；因果森林与异质效应的推断"}, {"n": "Victor Chernozhukov（MIT）", "r": "Double／Debiased Machine Learning"}, {"n": "Bernhard Schölkopf & Jonas Peters", "r": "非线性加性噪声模型的可识别性；独立机制原则"}, {"n": "张坤 Kun Zhang（CMU／MBZUAI）", "r": "后非线性因果模型的可识别性；时序与领域自适应下的因果发现"}, {"n": "崔鹏 Peng Cui（清华大学）", "r": "稳定学习——用样本重加权去除特征间伪相关，连接因果与泛化"}]}, {"id": "A122", "p": "A12", "num": "1.2.2", "name": "不完备数据可识别理论", "kind": "leaf", "pillar": "i", "summary": "数据有系统性缺陷时识别是否还成立。四类缺陷各有一套理论：缺失数据（MCAR／MAR／MNAR）、选择偏倚、未测量混杂、以及弱与噪声标注。", "why": "这是「诚实地承认不知道」的数学。点识别失败时不投降，而是退到两条路：部分识别给出区间而非点值，敏感性分析量化「假设要被违反到什么程度结论才翻转」。它与第二支的不确定性量化在哲学上完全同构——一个说因果量只能定到一个区间，一个说预测只能定到一个集合。", "phases": [{"t": "缺失数据的经典框架（1976–1987）", "d": "定义 MCAR／MAR／MNAR 三分法并证明 MAR 下似然推断可忽略缺失机制。同期经济学发展出样本选择模型处理「只观察到被选中的人」这一结构，成为标准工具。"}, {"t": "部分识别（1990–2003）", "d": "提出核心主张：宁要弱假设下的宽区间，不要强假设下的精确错误。工具变量下的最紧界被用线性规划刻画出来，局部平均处理效应给出了工具变量方法的现代形式与它实际识别的是谁的效应。"}, {"t": "图论化（2013–2021）", "d": "把缺失机制画进因果图（m-graph），给出 MNAR 下可识别的图论条件——推翻了「MNAR 一律不可识别」这一长期误解。选择偏倚的可恢复性也获得了同样的图论判据。"}, {"t": "近端因果推断（2018– ）", "d": "证明只需两个满足条件的负控制代理变量，就能在存在未测量混杂时点识别因果效应。这是近十年识别理论最重要的新工具，由中国学者主导；配套的敏感性指标也在同期普及到医学界。"}, {"t": "弱监督的平行线（2013– ）", "d": "机器学习侧独立发展出噪声标签、正例无标注、互补标签等设定下的无偏风险估计与可学习性理论，最终被统一为风险重写框架。它回答的是同一个问题：标注不完备时，目标风险还能不能被无偏地估计。"}], "papers": [{"c": "Rubin (1976)", "v": "Biometrika", "t": "Inference and missing data", "n": "定义 MCAR／MAR／MNAR 三分法，并证明 MAR 下缺失机制可忽略。这是所有不完备数据分析的分类学起点，也划定了「什么时候可以假装数据是完整的」。", "k": 1}, {"c": "Heckman (1979)", "v": "Econometrica", "t": "Sample selection bias as a specification error", "n": "把样本选择偏倚形式化为一种模型设定错误，并给出两步估计法。它让「只观察到被选中的个体」这一普遍结构第一次可被系统纠正。"}, {"c": "Manski (1990)", "v": "American Economic Review", "t": "Nonparametric bounds on treatment effects", "n": "提出部分识别：在不加强假设的前提下给出目标量的取值区间。它确立了一种方法论立场——宁要弱假设下的宽区间，不要强假设下的精确错误。", "k": 1}, {"c": "Angrist, Imbens & Rubin (1996)", "v": "JASA", "t": "Identification of causal effects using instrumental variables", "n": "给出工具变量方法的现代形式，并明确它识别的是依从者这一子人群的效应。它澄清了工具变量到底在估计谁的因果效应。", "k": 1}, {"c": "Balke & Pearl (1997)", "v": "JASA", "t": "Bounds on treatment effects from studies with imperfect compliance", "n": "用线性规划给出工具变量设定下因果效应的最紧上下界。它是部分识别从原则走向可计算的关键一步。"}, {"c": "Mohan, Pearl & Tian (2013)", "v": "NeurIPS 2013", "t": "Graphical models for inference with missing data", "n": "提出 m-graph，把缺失机制作为节点画进因果图，从而可以用图论判据分析可恢复性。它把缺失数据问题接入了整套因果识别理论。", "k": 1}, {"c": "Mohan & Pearl (2021)", "v": "JASA", "t": "Graphical models for processing missing data", "n": "给出 MNAR 下可识别的图论充分条件与系统化处理，推翻了「非随机缺失一律不可识别」这一长期误解。", "k": 1}, {"c": "苗旺, 耿直 & Tchetgen Tchetgen (2018)", "v": "Biometrika", "t": "Identifying causal effects with proxy variables of an unmeasured confounder", "n": "证明只需两个满足条件的代理（负控制）变量，即可在存在未测量混杂时点识别因果效应。这是近十年识别理论最重要的新工具，由中国学者主导。", "k": 1}, {"c": "VanderWeele & Ding (2017)", "v": "Annals of Internal Medicine", "t": "Sensitivity analysis in observational research: introducing the E-value", "n": "给出一个无需分布假设的敏感性指标：未测混杂要强到什么程度才能解释掉观察到的关联。因为简单可算而被医学界广泛采纳。"}, {"c": "du Plessis, Niu & Sugiyama (2015)", "v": "ICML 2015", "t": "Convex formulation for learning from positive and unlabeled data", "n": "给出只有正例与无标注数据时的无偏风险估计与凸化形式。它是弱监督学习「风险重写」这一统一框架的代表工作。"}], "people": [{"n": "Donald Rubin（Harvard）", "r": "缺失机制三分法与可忽略性条件"}, {"n": "Roderick Little（Michigan）", "r": "缺失数据分析的系统化与标准教科书"}, {"n": "Charles Manski（Northwestern）", "r": "部分识别纲领——不加强假设时给出识别域"}, {"n": "Judea Pearl & Karthika Mohan（UCLA／UC Davis）", "r": "m-graph 与 MNAR 下的图论可识别条件"}, {"n": "Elias Bareinboim（Columbia）", "r": "选择偏倚的可恢复性判据"}, {"n": "Eric Tchetgen Tchetgen（宾大沃顿）", "r": "近端因果推断的完整框架；半参数因果推断"}, {"n": "苗旺 Wang Miao & 耿直 Zhi Geng（北京大学）", "r": "用负控制代理在未测混杂下实现点识别——近端因果推断"}, {"n": "Tyler VanderWeele & Peng Ding（Harvard／Berkeley）", "r": "E-value 敏感性指标；因果推断中的偏倚公式"}, {"n": "Masashi Sugiyama 杉山将（RIKEN／东京大学）", "r": "弱监督学习的风险重写统一框架与估计误差界"}, {"n": "周志华 Zhi-Hua Zhou（南京大学）", "r": "弱监督学习的三分法（不完全、不确切、不准确监督）"}]}, {"id": "A123", "p": "A12", "num": "1.2.3", "name": "因果表征学习理论", "kind": "leaf", "pillar": "i", "summary": "因果变量不在数据里（只有像素、token），要从观测 x = g(z) 中把潜在因子 z 及其因果结构学出来。核心仍是可识别性——而无监督情形下答案是否定的。", "why": "整个领域是一场系统搜索：最少加什么额外结构，可识别性就回来了？已知的来源包括辅助变量、时间结构、干预数据、稀疏机制、数据增强定义的不变性。这是表示层可信的理论基础——如果学到的表示混合了因果因子与伪相关因子，下游一切保证都建立在流沙上。", "phases": [{"t": "原罪（1994–1999）", "d": "线性独立成分分析在源非高斯时可识别；但随即证明非线性独立成分分析一般不可识别——存在无穷多个同分布的解。这个负面结果统治了此后近二十年，是整个领域的起点也是障碍。"}, {"t": "破局（2016–2020）", "d": "用时间结构与辅助变量恢复可识别性：只要存在一个辅助变量使源在给定它时条件独立且充分变化，非线性独立成分分析即可识别。随后这个条件被装进变分自编码器，第一次给深度生成模型配上可识别性证明。"}, {"t": "清醒时刻（2019）", "d": "大规模实证加不可能性定理证明：无归纳偏置或监督时解耦表示学习不可能，且当时的评测方式无效。它终结了一整代基于变分自编码器的解耦研究，把领域整体推向可识别性。"}, {"t": "立纲与新来源（2021–2023）", "d": "因果表征学习被正式命名并给出纲领（独立机制原则、稀疏机制偏移）。此后证明对比学习加数据增强可证明地分离内容与风格、稀疏机制本身可带来可识别性、每个潜变量有一个干预即可识别——干预路线目前理论上最干净。"}, {"t": "现状与质疑（2023– ）", "d": "绝大多数结果是无穷样本的分布层面可识别，有限样本需要多少数据尚无理论；所需假设几乎都无法从数据检验；实验也多在合成数据上。该领域至今没有一个「因可识别性而在真实任务上胜出」的说服性案例，这是它最受质疑之处。"}], "papers": [{"c": "Comon (1994)", "v": "Signal Processing", "t": "Independent component analysis, a new concept?", "n": "确立线性独立成分分析：源非高斯时，混合矩阵可识别至置换与尺度。它是整个可识别性谱系的起点。"}, {"c": "Hyvärinen & Pajunen (1999)", "v": "Neural Networks", "t": "Nonlinear independent component analysis: existence and uniqueness results", "n": "证明非线性独立成分分析一般不可识别——仅靠统计独立性无法定出解。这个负面结果定义了此后二十年该领域要绕开的障碍。", "k": 1}, {"c": "Hyvärinen & Morioka (2016)", "v": "NeurIPS 2016", "t": "Unsupervised feature extraction by time-contrastive learning and nonlinear ICA", "n": "用时间段作为辅助信息做对比学习，第一次给出破解不可识别性的建设性方案。它开启了「用额外结构换可识别性」的整条路线。"}, {"c": "Hyvärinen, Sasaki & Turner (2019)", "v": "AISTATS 2019", "t": "Nonlinear ICA using auxiliary variables and generalized contrastive learning", "n": "给出统一条件：只要存在辅助变量使源条件独立且充分变化，非线性独立成分分析即可识别。这是该方向的理论枢纽，后续工作大多是它的实例。", "k": 1}, {"c": "Khemakhem, Kingma, Monti & Hyvärinen (2020)", "v": "AISTATS 2020", "t": "Variational autoencoders and nonlinear ICA: a unifying framework", "n": "把上述可识别性条件装进变分自编码器，第一次让深度生成模型带上可识别性证明。它连接了理论条件与实际可训练的模型。", "k": 1}, {"c": "Locatello et al. (2019)", "v": "ICML 2019（最佳论文）", "t": "Challenging common assumptions in the unsupervised learning of disentangled representations", "n": "用不可能性定理加一万两千个模型的实证证明：无归纳偏置或监督时解耦不可能，且当时的评测指标无效。它是整个领域的分水岭。", "k": 1}, {"c": "Schölkopf et al. (2021)", "v": "Proceedings of the IEEE", "t": "Toward causal representation learning", "n": "为该领域命名并给出纲领：独立机制原则、稀疏机制偏移假设。它把「因果变量本身要被学出来」确立为一个独立方向。", "k": 1}, {"c": "von Kügelgen et al. (2021)", "v": "NeurIPS 2021", "t": "Self-supervised learning with data augmentations provably isolates content from style", "n": "证明对比学习加数据增强可证明地分离内容与风格。它把 SimCLR 这类主流方法纳入可识别性理论，影响很大。", "k": 1}, {"c": "Lachapelle et al. (2022)", "v": "CLeaR 2022（最佳论文）", "t": "Disentanglement via mechanism sparsity regularization", "n": "证明当因果机制足够稀疏时，稀疏性本身就能带来可识别性，不需要辅助变量。它给出了一个全新的可识别性来源。"}, {"c": "Squires, Seigal, Bhate & Uhler (2023)", "v": "ICML 2023", "t": "Linear causal disentanglement via interventions", "n": "证明在每个潜变量上各有一个干预时，潜在因果结构可识别。干预路线是目前理论上最干净的一条，也最贴近真实的科学实验设定。", "k": 1}], "people": [{"n": "Bernhard Schölkopf（MPI-IS）", "r": "独立机制原则；因果表征学习的命名与纲领"}, {"n": "Aapo Hyvärinen（赫尔辛基大学）", "r": "非线性独立成分分析的不可能性定理，以及用辅助变量破解它的统一条件"}, {"n": "Yoshua Bengio（Mila，图灵奖）", "r": "用适应速度作为因果方向信号的元迁移目标；把因果引入表示学习议程"}, {"n": "Francesco Locatello（ISTA）", "r": "无监督解耦的不可能性定理与大规模实证"}, {"n": "Julius von Kügelgen（MPI／剑桥）", "r": "证明对比学习加数据增强可分离内容与风格"}, {"n": "Caroline Uhler（MIT）", "r": "干预下线性因果解耦的可识别性"}, {"n": "Diederik Kingma", "r": "变分自编码器；可识别变分自编码器"}, {"n": "张坤 Kun Zhang（CMU／MBZUAI）", "r": "时序与领域变化下的因果表征可识别性；华人在该方向最系统的力量"}]}, {"id": "A13", "p": "A1", "num": "1.3", "name": "环境泛化与鲁棒理论", "kind": "group", "pillar": "i", "summary": "研究训练分布改变、出现分布外样本或对抗扰动之后，模型是否仍然可靠。", "extra": "四个子方向常被笼统地叫作「鲁棒」，但数学结构完全不同：分布偏移是平均情形分析，分布外检测是假设检验问题，对抗鲁棒是最坏情形分析，非平稳环境是在线序贯问题。它们的工具几乎不通用——这正是必须分开的理由。区分它们的最简判据是「偏移由谁造成」：自然、自然但带来新类别、敌手、时间。"}, {"id": "A131", "p": "A13", "num": "1.3.1", "name": "分布偏移与泛化理论", "kind": "leaf", "pillar": "i", "summary": "泛化理论本体（i.i.d. 下的界）、域适应理论（目标误差 ≤ 源误差 + 域距离）、偏移类型学（协变量／标签／概念偏移）、分布鲁棒优化，以及用不变性寻找可迁移机制。", "why": "这是「可信」最直接的操作定义——换了环境还能不能用。也是理论与现实差距最大的一块：漂亮的界在真实偏移下往往空洞，而这一分支近十年最有价值的产出恰恰是一批把过度乐观的方法证伪的负面结果。", "phases": [{"t": "泛化地基（1971–2002）", "d": "VC 维与均匀收敛给出「学习何时可能」的第一个定量答案；Rademacher 复杂度用数据依赖的量取代 VC 维成为主流工具。这一层是后面所有偏移分析的比较基准。"}, {"t": "偏移理论诞生（2000–2010）", "d": "协变量偏移被正式提出并配上重要性加权；域适应的散度界给出「目标误差 ≤ 源误差 + 域距离 + 联合最优误差」这一分解，其中域距离用分类器族能否区分两域来度量。这个界是此后全部对抗式域适应算法的理论依据。"}, {"t": "不变性与分布鲁棒（2016–2020）", "d": "一路直接优化分布球内最坏分布上的风险，并建立其统计理论与方差正则化的等价性；另一路用跨环境不变性寻找因果机制，从不变因果预测发展到不变风险最小化。标签偏移也在同期获得可估计的修正方法。"}, {"t": "集中纠错（2019–2021）", "d": "证明只对齐边缘分布不够——标签分布也偏移时对齐表示反而使误差下界为正；证明不变风险最小化在非线性下几乎必然失败、且所需环境数超出实际；统一调参下所有域泛化方法都打不过朴素经验风险最小化。这三记打击迫使整个领域重建评测标准。"}, {"t": "大模型期（2021– ）", "d": "偏移对象从图像风格变成任务、提示、时间。全量微调被证明会扭曲预训练特征、损害分布外性能，线性探测再微调更优；对比预训练模型打破了分布内外精度的线性关系，但原因至今没有理论解释——这是当前最重要的开放问题。"}], "papers": [{"c": "Vapnik & Chervonenkis (1971)", "v": "Theory of Probability & Its Applications", "t": "On the uniform convergence of relative frequencies of events to their probabilities", "n": "提出 VC 维与均匀收敛，第一次定量回答「学习在什么条件下可能」，把泛化从哲学问题变成组合几何问题。", "k": 1}, {"c": "Shimodaira (2000)", "v": "Journal of Statistical Planning and Inference", "t": "Improving predictive inference under covariate shift by weighting the log-likelihood function", "n": "正式提出协变量偏移概念并给出重要性加权修正，把「训练和测试不同分布」从工程麻烦变成有明确解法的统计问题。"}, {"c": "Ben-David, Blitzer, Crammer, Kulesza, Pereira & Vaughan (2010)", "v": "Machine Learning（期刊）", "t": "A theory of learning from different domains", "n": "给出目标域误差的三项上界，域距离用分类器族区分两域的能力度量。这个界直接催生了整类对抗式域适应算法，是该方向被引最多的结果。", "k": 1}, {"c": "Peters, Bühlmann & Meinshausen (2016)", "v": "JRSS-B（附讨论）", "t": "Causal inference by using invariant prediction: identification and confidence intervals", "n": "证明跨环境条件分布不变的变量集对应因果父集，从而把「找因果」和「找能泛化的预测器」变成同一件事。它是不变性路线的源头。", "k": 1}, {"c": "Lipton, Wang & Smola (2018)", "v": "ICML 2018", "t": "Detecting and correcting for label shift with black box predictors", "n": "用混淆矩阵估计标签分布的偏移比例，无需重新训练即可修正。它把标签偏移这一与协变量偏移性质迥异的情形变得可操作。"}, {"c": "Sagawa, Koh, Hashimoto & Liang (2020)", "v": "ICLR 2020", "t": "Distributionally robust neural networks for group shifts", "n": "最小化最差组风险并指出必须配合强正则化才有效，成为伪相关与子群鲁棒性的标准基线。它把分布鲁棒优化从抽象分布球落到可指定的群体上。"}, {"c": "Arjovsky, Bottou, Gulrajani & Lopez-Paz (2019)", "v": "arXiv 预印本", "t": "Invariant risk minimization", "n": "提出寻找在所有环境上同时最优的表示作为泛化目标，是影响最大也最有争议的分布外泛化方法。它的价值一半在提出问题，一半在被后续工作严格证伪。", "k": 1}, {"c": "Rosenfeld, Ravikumar & Risteski (2021)", "v": "ICLR 2021", "t": "The risks of invariant risk minimization", "n": "证明不变风险最小化在线性情形下需要的环境数超过变量维度，在非线性情形下几乎必然退化为经验风险最小化。这是对该方法决定性的理论批评。", "k": 1}, {"c": "Duchi & Namkoong (2021)", "v": "Annals of Statistics", "t": "Learning models with uniform performance via distributionally robust optimization", "n": "给出 f-散度球上分布鲁棒优化的完整统计理论，并揭示它与方差正则化的等价性，把最坏分布优化从启发式变成有渐近理论的估计方法。", "k": 1}, {"c": "Gulrajani & Lopez-Paz (2021)", "v": "ICLR 2021", "t": "In search of lost domain generalization", "n": "在统一的模型选择协议下重测所有域泛化方法，发现没有一个显著优于朴素的经验风险最小化。这次实证打击迫使整个领域重建评测标准。", "k": 1}], "people": [{"n": "Vladimir Vapnik", "r": "VC 维、结构风险最小化与统计学习理论的建立"}, {"n": "Shai Ben-David（滑铁卢大学）", "r": "域适应的散度界；学习理论中一系列不可能性结果"}, {"n": "Jonas Peters & Peter Bühlmann（ETH Zurich）", "r": "不变因果预测——把因果发现变成跨环境的假设检验"}, {"n": "John Duchi（Stanford）", "r": "分布鲁棒优化的统计理论；局部差分隐私的极小极大率"}, {"n": "Percy Liang（Stanford）", "r": "群体分布鲁棒优化；微调扭曲预训练特征的理论与实证"}, {"n": "Masashi Sugiyama（RIKEN／东京大学）", "r": "密度比估计与协变量偏移修正的系统理论"}, {"n": "David Lopez-Paz（Meta）", "r": "不变风险最小化；DomainBed 统一评测"}, {"n": "Zachary Lipton（CMU）", "r": "标签偏移的黑箱检测与修正"}, {"n": "Aditi Raghunathan（CMU）", "r": "鲁棒性与精度的权衡；微调与分布外性能的分析"}, {"n": "崔鹏 Peng Cui（清华大学）", "r": "稳定学习——样本重加权去除特征间伪相关"}, {"n": "龙明盛 Mingsheng Long（清华大学）", "r": "深度迁移学习的分布对齐方法体系（DAN／JAN／CDAN）"}]}, {"id": "A132", "p": "A13", "num": "1.3.2", "name": "分布外 / 开放环境理论", "kind": "leaf", "pillar": "i", "summary": "测试样本可能来自语义上全新的类别，此时正确行为不是预测得更准，而是识别出它超出知识范围并拒绝作答。含分布外检测、开放集识别、开放世界学习，以及可学习性理论。", "why": "这是可信 AI 的第一道闸门：前面所有理论都假定输入是合法的，分布外检测负责验证这个前提。它也是两支的交汇点——检测机制属于机理侧，检测的统计保证属于判定与保证侧。与分布偏移的关键区别在于支撑集是否被突破。", "phases": [{"t": "拒识与单类分类（1970–2005）", "d": "已知真实后验时的最优拒识规则被给出，同时刻画了错误率与拒识率的权衡。随后单类支持向量机与支持向量数据描述把新颖性检测形式化为支撑集估计，异常检测被严格等同于密度水平集估计并配上一致性理论。"}, {"t": "开放集识别的提出（2013–2016）", "d": "正式定义开放集识别与开放空间风险，指出闭集训练的分类器必然把未知类映射到已知类上；随后用极值理论重标定 softmax 输出，成为该问题的第一批专用方法。"}, {"t": "深度分布外检测（2017–2020）", "d": "最大 softmax 概率这一基线定义了整个领域的问题设定与评测协议，且出乎意料地难以击败。此后温度缩放加输入扰动、特征空间马氏距离、辅助异常数据训练、能量分数逐级推进，形成了今天的标准方法谱系。"}, {"t": "关键负面结果（2019–2022）", "d": "发现在 CIFAR-10 上训练的流模型给 SVHN 更高的似然，摧毁了用生成模型似然做检测的朴素信念；随后发现开放集识别性能主要由闭集精度决定，此前十年不少专用方法的增益可疑。两次纠错都指向同一件事：这个领域的评测比方法更需要被审视。"}, {"t": "理论化与开放环境（2022– ）", "d": "首次在 PAC 框架下证明一般情形下分布外检测不可学，并给出可学的充要条件——这是这个已有上千篇论文的子领域第一篇基础性理论工作。同期「开放环境机器学习」把类别、特征、分布、学习目标四个变化维度纳入统一框架。"}], "papers": [{"c": "Chow (1970)", "v": "IEEE Transactions on Information Theory", "t": "On optimum recognition error and reject tradeoff", "n": "给出已知真实后验时的最优拒识规则与错误—拒识权衡曲线。它是拒识、选择性预测与分布外检测三个方向共同的起点。", "k": 1}, {"c": "Schölkopf, Platt, Shawe-Taylor, Smola & Williamson (2001)", "v": "Neural Computation", "t": "Estimating the support of a high-dimensional distribution", "n": "提出单类支持向量机，把新颖性检测形式化为估计数据分布的支撑集。它给出了第一个有核方法理论支撑的检测框架。"}, {"c": "Scheirer, Rocha, Sapkota & Boult (2013)", "v": "IEEE TPAMI", "t": "Toward open set recognition", "n": "正式定义开放集识别与开放空间风险，指出闭集训练的分类器必然把未知类强行归入已知类。它把这个问题从工程直觉变成可优化的目标。", "k": 1}, {"c": "Hendrycks & Gimpel (2017)", "v": "ICLR 2017", "t": "A baseline for detecting misclassified and out-of-distribution examples in neural networks", "n": "用最大 softmax 概率作基线，实际上定义了深度分布外检测的问题设定与评测协议。它难以击败的程度成了衡量后续方法的尺子。", "k": 1}, {"c": "Lee, Lee, Lee & Shin (2018)", "v": "NeurIPS 2018", "t": "A simple unified framework for detecting out-of-distribution samples and adversarial attacks", "n": "在特征空间拟合类条件高斯并用马氏距离打分，长期是最强基线之一。它把检测从输出层推进到表示层。"}, {"c": "Hendrycks, Mazeika & Dietterich (2019)", "v": "ICLR 2019", "t": "Deep anomaly detection with outlier exposure", "n": "引入辅助异常数据参与训练以塑造模型对未知的反应，大幅提升性能，同时引出「依赖已知异常是否还算分布外」的方法论争议。"}, {"c": "Nalisnick, Matsukawa, Teh, Görür & Lakshminarayanan (2019)", "v": "ICLR 2019", "t": "Do deep generative models know what they don't know?", "n": "发现在 CIFAR-10 上训练的流模型给 SVHN 更高的似然，摧毁了用生成模型似然做检测的朴素信念。这是该领域最重要的负面结果。", "k": 1}, {"c": "Liu, Wang, Owens & Li (2020)", "v": "NeurIPS 2020", "t": "Energy-based out-of-distribution detection", "n": "用能量分数替代 softmax 概率，理论上与对数似然对齐且不受 softmax 归一化扭曲，成为新的标准基线。", "k": 1}, {"c": "Vaze, Han, Vedaldi & Zisserman (2022)", "v": "ICLR 2022", "t": "Open-set recognition: a good closed-set classifier is all you need?", "n": "证明开放集识别性能与闭集精度高度相关，说明此前十年许多专用方法的增益可能来自更好的训练而非方法本身。又一次重要的自我纠错。", "k": 1}, {"c": "Fang, Li, Lu, Dong, Han & Liu (2022)", "v": "NeurIPS 2022（杰出论文）", "t": "Is out-of-distribution detection learnable?", "n": "在 PAC 框架下证明一般情形下分布外检测不可学，并给出可学的充要条件。它是这个子领域第一篇基础性理论工作。", "k": 1}], "people": [{"n": "Yixuan (Sharon) Li（威斯康星大学麦迪逊分校）", "r": "能量分数分布外检测；深度检测方法的体系化与广义分布外检测综述"}, {"n": "Dan Hendrycks（CAIS）", "r": "最大 softmax 概率基线；异常暴露训练；一系列鲁棒性基准"}, {"n": "Walter Scheirer & Terrance Boult（圣母大学／科罗拉多大学）", "r": "开放集识别与开放空间风险的形式化；OpenMax"}, {"n": "Bernhard Schölkopf（MPI-IS）", "r": "单类支持向量机——支撑集估计式的新颖性检测"}, {"n": "Ingo Steinwart（斯图加特大学）", "r": "异常检测等价于密度水平集估计的一致性理论"}, {"n": "Balaji Lakshminarayanan（Google DeepMind）", "r": "揭示深度生成模型似然无法用于分布外检测"}, {"n": "Andrew Zisserman（Oxford）", "r": "证明开放集识别性能主要由闭集精度决定"}, {"n": "Zhen Fang、Feng Liu & Jie Lu（悉尼科技大学）", "r": "分布外检测的 PAC 可学性刻画"}, {"n": "Bo Han 韩波（香港浸会大学）", "r": "分布外检测可学性；噪声标签学习理论"}, {"n": "周志华 Zhi-Hua Zhou（南京大学）", "r": "开放环境机器学习框架：类别、特征、分布、目标四个变化维度"}]}, {"id": "A133", "p": "A13", "num": "1.3.3", "name": "对抗鲁棒理论", "kind": "leaf", "pillar": "i", "summary": "面对主动优化过的最坏情况扰动，性能的理论刻画：对抗风险最小化、鲁棒泛化、对抗样本是否不可避免，以及鲁棒性与精度、参数量、样本量之间的定量权衡。", "why": "该领域独特之处是攻防形成闭环——任何未经自适应攻击评估的防御都会被攻破。这使它的自我纠错机制异常强健，是整棵树上少数经验主张能被真正证伪的分支。代价是威胁模型（ℓp 球）过于狭窄，在大模型上几乎失效。", "phases": [{"t": "发现（2013–2015）", "d": "安全社区先在垃圾邮件与恶意软件检测中提出测试时逃逸攻击；随后对抗样本在视觉模型上被发现并引爆领域。线性假说与快速梯度符号法给出了第一个可扩展的攻击与「对抗训练」这一防御范式，框定了此后十年的问题形态。"}, {"t": "防御的信誉危机（2017–2018）", "d": "一个优化更强的攻击破掉当时几乎所有防御；随后一篇论文攻破了同届会议七成的防御论文，指出它们共同的问题是梯度混淆而非真正的鲁棒性。从此确立了「防御必须经过自适应攻击评估」这一规范。"}, {"t": "框架定型与代价定理（2018–2019）", "d": "对抗鲁棒被写成鞍点优化问题，投影梯度下降对抗训练至今未被根本超越。同期一批结果给出代价：鲁棒学习的样本复杂度显著更高，鲁棒性与标准精度在特定构造下存在本质权衡，高维几何使对抗样本几乎必然存在。"}, {"t": "观念转变与统一定理（2019–2021）", "d": "「对抗扰动利用的是真实但非鲁棒的特征」把问题从模型缺陷重新定义为数据性质。随后用等周不等式证明：平滑插值 n 个点至少需要 nd 个参数，即鲁棒性必须靠超额过参数化换取——这把表达理论与鲁棒理论焊在了一起。"}, {"t": "大模型期（2023– ）", "d": "通用可迁移的对抗后缀说明对齐不等于鲁棒；长上下文的多样本越狱甚至呈现出幂律式的攻击标度。但离散语义空间中「扰动集」如何定义仍无答案，基于 ℓp 球的整套理论在这里几乎全部失效，是当前最大的空白。"}], "papers": [{"c": "Biggio, Corona, Maiorca, Nelson, Šrndić, Laskov, Giacinto & Roli (2013)", "v": "ECML PKDD 2013", "t": "Evasion attacks against machine learning at test time", "n": "在安全社区最早系统研究测试时逃逸攻击，用梯度方法构造能骗过分类器的恶意样本。它比视觉领域的发现更早，确立了对抗机器学习这一议题。"}, {"c": "Szegedy, Zaremba, Sutskever, Bruna, Erhan, Goodfellow & Fergus (2014)", "v": "ICLR 2014", "t": "Intriguing properties of neural networks", "n": "发现人眼不可察觉的微小扰动能让高精度网络完全误分类，且扰动在不同模型间可迁移。它引爆了整个领域。", "k": 1}, {"c": "Goodfellow, Shlens & Szegedy (2015)", "v": "ICLR 2015", "t": "Explaining and harnessing adversarial examples", "n": "提出线性假说解释脆弱性来源，并给出单步的快速梯度符号法与对抗训练。虽然线性解释后被认为不完整，但这两个工具定义了此后的研究形态。", "k": 1}, {"c": "Carlini & Wagner (2017)", "v": "IEEE S&P 2017", "t": "Towards evaluating the robustness of neural networks", "n": "设计出更强的优化式攻击，破掉当时几乎所有防御（包括被认为有效的蒸馏防御）。它确立了「防御必须面对最强攻击」的评估标准。", "k": 1}, {"c": "Madry, Makelov, Schmidt, Tsipras & Vladu (2018)", "v": "ICLR 2018", "t": "Towards deep learning models resistant to adversarial attacks", "n": "把对抗鲁棒形式化为鞍点优化问题，并给出投影梯度下降对抗训练。这个框架至今没有被根本超越，是该方向唯一稳定有效的基线。", "k": 1}, {"c": "Athalye, Carlini & Wagner (2018)", "v": "ICML 2018（最佳论文）", "t": "Obfuscated gradients give a false sense of security", "n": "识别出梯度混淆这一共同缺陷，并攻破了同届会议七成的防御论文。它是该领域方法论规范的转折点。", "k": 1}, {"c": "Schmidt, Santurkar, Tsipras, Talwar & Mądry (2018)", "v": "NeurIPS 2018", "t": "Adversarially robust generalization requires more data", "n": "在高斯混合模型上证明鲁棒学习的样本复杂度比标准学习高一个维度因子。这是第一个说明鲁棒性有内在统计代价的严格结果。", "k": 1}, {"c": "Zhang, Yu, Jiao, Xing, El Ghaoui & Jordan (2019)", "v": "ICML 2019", "t": "Theoretically principled trade-off between robustness and accuracy", "n": "把鲁棒误差分解为自然误差加边界误差，并据此设计损失函数。它是该方向理论与算法结合最漂亮的一篇。", "k": 1}, {"c": "Ilyas, Santurkar, Tsipras, Engstrom, Tran & Mądry (2019)", "v": "NeurIPS 2019", "t": "Adversarial examples are not bugs, they are features", "n": "证明对抗扰动利用的是数据中真实存在但不鲁棒的特征，并用构造的数据集验证。它把问题从「模型坏了」重新定义为「数据里就有这些特征」。", "k": 1}, {"c": "Bubeck & Sellke (2021)", "v": "NeurIPS 2021（最佳论文）/ JACM 2023", "t": "A universal law of robustness via isoperimetry", "n": "用等周不等式证明在 n 个数据点上平滑插值至少需要 nd 个参数。它说明鲁棒性必须靠超额过参数化换取，把表达理论与鲁棒理论统一起来。", "k": 1}], "people": [{"n": "Aleksander Mądry（MIT／OpenAI）", "r": "对抗鲁棒的鞍点框架与 PGD 对抗训练；非鲁棒特征的观点"}, {"n": "Nicholas Carlini（Anthropic）", "r": "C&W 攻击与梯度混淆的识别——确立防御必须经自适应攻击评估"}, {"n": "Battista Biggio & Fabio Roli（卡利亚里大学）", "r": "对抗机器学习的最早系统化；测试时逃逸攻击"}, {"n": "Ian Goodfellow", "r": "快速梯度符号法与对抗训练范式；线性假说"}, {"n": "Sébastien Bubeck（OpenAI）", "r": "普适鲁棒律——鲁棒性的参数量下界"}, {"n": "Nathan Srebro & Omar Montasser（TTIC／Yale）", "r": "证明有限 VC 维类鲁棒可学但必须用非正常学习"}, {"n": "Zico Kolter（CMU）", "r": "凸外多面体认证训练；随机平滑的紧界；通用对抗后缀攻击"}, {"n": "张弘扬 Hongyang Zhang（滑铁卢大学）", "r": "TRADES——鲁棒性与精度权衡的分解与算法"}, {"n": "朱军 Jun Zhu & 苏航（清华 TSAIL）", "r": "对抗攻防的系统性方法与大规模评测基准"}, {"n": "谢宗易 Cho-Jui Hsieh（UCLA）", "r": "可扩展的攻击与认证算法；α,β-CROWN 验证器"}]}, {"id": "A134", "p": "A13", "num": "1.3.4", "name": "非平稳环境学习理论", "kind": "leaf", "pillar": "i", "summary": "环境随时间演化时的学习理论。核心量是动态后悔——与逐时刻最优比较而非与固定最优比较——以及它在给定变化预算下的最优率。另含概念漂移检测、持续学习的遗忘理论。", "why": "真实部署面对的是流动的世界：用户行为漂移、数据源更新、模型输出反过来改变环境。静态的训练—部署假设本身就不可信，这一分支提供了「随时间维持可信」的唯一数学语言。它与可控支的时变博弈是同一套工具在单体与多体两种设定下的分身。", "phases": [{"t": "在线学习框架（1988–2006）", "d": "专家算法与乘性权重确立了「不必知道环境、只需不后悔」的分布式思路；在线梯度下降给出 O(√T) 的静态后悔，并在同一篇文章中已提出动态后悔的概念。数据挖掘界则独立提出概念漂移，并给出带理论保证的自适应窗口算法。"}, {"t": "动态后悔成熟（2015–2018）", "d": "引入变差预算刻画环境的累积变化量并给出极小极大率；提出强自适应后悔，要求在任意时间区间上都近乎最优；随后给出无需事先知道变化量的通用动态后悔最优界，解决了此前方法必须预知预算这一实用障碍。"}, {"t": "持续学习理论化（2017–2022）", "d": "弹性权重固化等方法先行，随后理论跟上：证明最优持续学习等价于完美记忆且计算上 NP-难；并在线性回归上给出遗忘量的精确刻画，揭示任务顺序与任务相似度如何决定遗忘的严重程度。"}, {"t": "新的非平稳来源（2020– ）", "d": "表演性预测指出模型的部署本身会改变数据分布，从而非平稳性是内生的而非外部施加的；大模型的自消费训练循环则带来模型崩溃这一全新问题。两者都说明「环境」不再是外生变量。"}, {"t": "测试时适应（2020– ）", "d": "部署阶段用无标注数据在线更新模型成为实用做法，但如何避免适应到崩溃仍缺乏保证。这是理论明显落后于实践的一块。"}], "papers": [{"c": "Littlestone & Warmuth (1994)", "v": "Information and Computation", "t": "The weighted majority algorithm", "n": "给出专家问题的乘性权重算法与错误界，确立了「不必建模环境、只需相对最优专家不后悔」这一范式。它是整个在线学习的奠基。", "k": 1}, {"c": "Widmer & Kubat (1996)", "v": "Machine Learning（期刊）", "t": "Learning in the presence of concept drift and hidden contexts", "n": "第一次系统提出概念漂移，并区分了突变与渐变、以及隐藏上下文导致的反复。它开启了数据挖掘侧与在线学习平行发展的一条线。"}, {"c": "Zinkevich (2003)", "v": "ICML 2003", "t": "Online convex programming and generalized infinitesimal gradient ascent", "n": "提出在线梯度下降并给出 O(√T) 静态后悔，同时在同一篇中引入动态后悔概念。它是非平稳在线学习的正式起点。", "k": 1}, {"c": "Cesa-Bianchi & Lugosi (2006)", "v": "Cambridge University Press（专著）", "t": "Prediction, Learning, and Games", "n": "系统整理了预测、在线学习与博弈之间的对应关系，是这个方向的标准专著，也把无悔学习与博弈论正式接通。"}, {"c": "Gama, Žliobaitė, Bifet, Pechenizkiy & Bouchachia (2014)", "v": "ACM Computing Surveys", "t": "A survey on concept drift adaptation", "n": "系统梳理漂移的类型、检测方法与适应策略，是概念漂移领域最权威的整理，也统一了此前分散的术语。"}, {"c": "Besbes, Gur & Zeevi (2015)", "v": "Operations Research", "t": "Non-stationary stochastic optimization", "n": "引入变差预算刻画环境的累积变化量，给出动态后悔的极小极大率。它确立了「跟踪能力由变化速度决定」这一定量框架。", "k": 1}, {"c": "Daniely, Gonen & Shalev-Shwartz (2015)", "v": "ICML 2015", "t": "Strongly adaptive online learning", "n": "提出强自适应后悔：要求算法在任意时间区间上都近乎最优。它给出了刻画「局部平稳」的正确概念。"}, {"c": "张利军, 卢帅 & 周志华 (2018)", "v": "NeurIPS 2018", "t": "Adaptive online learning in dynamic environments", "n": "给出通用动态后悔的极小极大最优界，且算法无需事先知道变化量。它解决了此前方法必须预知变差预算这一实用障碍，是南大 LAMDA 在该方向的代表作。", "k": 1}, {"c": "Knoblauch, Husain & Diethe (2020)", "v": "ICML 2020", "t": "Optimal continual learning has perfect memory and is NP-hard", "n": "证明最优持续学习等价于完美记忆且计算上 NP-难。这个不可能性结果为持续学习划定了理论边界。", "k": 1}, {"c": "Perdomo, Zrnic, Mendler-Dünner & Hardt (2020)", "v": "ICML 2020", "t": "Performative prediction", "n": "指出模型的部署本身会改变它要预测的分布，定义了表演稳定点并给出收敛条件。它揭示了一种全新的、内生的非平稳性来源。", "k": 1}], "people": [{"n": "Nick Littlestone & Manfred Warmuth", "r": "乘性权重与专家问题的错误界"}, {"n": "Martin Zinkevich", "r": "在线凸优化框架与动态后悔概念"}, {"n": "Nicolò Cesa-Bianchi（米兰大学）& Gábor Lugosi（庞培法布拉大学）", "r": "预测、学习与博弈的统一理论；在线学习的标准专著"}, {"n": "Elad Hazan（Princeton）", "r": "在线凸优化的现代体系；自适应正则化与投影自由方法"}, {"n": "Omar Besbes（Columbia）", "r": "变差预算下非平稳优化的极小极大率"}, {"n": "Shai Shalev-Shwartz（希伯来大学）", "r": "强自适应后悔"}, {"n": "周志华、张利军、赵鹏（南京大学 LAMDA）", "r": "通用动态后悔的最优界与自适应算法——该方向的世界主要中心之一"}, {"n": "João Gama（波尔图大学）& Albert Bifet", "r": "概念漂移的检测与适应体系；自适应窗口算法"}, {"n": "Daniel Soudry（Technion）", "r": "线性回归上灾难性遗忘的精确刻画"}, {"n": "Moritz Hardt（MPI-IS）", "r": "表演性预测——模型部署改变数据分布的理论"}]}, {"id": "A2", "p": "A", "num": "2", "name": "可信判定与保证理论", "kind": "group", "pillar": "i", "summary": "研究如何定量判断当前这次预测到底能不能信，并给出数学保证。", "extra": "三个方向构成一条递进链：先产生一个表示不确定程度的数（2.1），再让这个数具有可验证的统计含义（2.2），最后据此采取行动并出具可被第三方检验的证书（2.3）。它与上一组的分工是白盒对黑盒——这里原则上把模型当作任意黑盒，只对输出的统计性质提要求，因此在模型不可解析时仍然有效。这也是它在大模型时代地位上升的原因。"}, {"id": "A21", "p": "A2", "num": "2.1", "name": "不确定性量化理论", "kind": "group", "pillar": "i", "summary": "研究模型如何度量自己对预测结果的不确定程度。", "extra": "两个子方向要的东西不同：一个要把不确定性分解成「数据本身就没有确定答案」与「我没学过这类样本」两部分，因为只有后者才指示应该拒答或多收数据；另一个不追求分解，只要求分数能把错的预测排在后面。前者是数值与语义问题，后者是排序问题，二者互不蕴含——一个完美分解的模型可能排序很差，反之亦然。"}, {"id": "A211", "p": "A21", "num": "2.1.1", "name": "认知与随机不确定性", "kind": "leaf", "pillar": "i", "summary": "把总不确定性分解为随机不确定性（数据本身的噪声与歧义，加数据也消不掉）与认知不确定性（对模型参数的无知，数据增加则趋于零），标准形式是互信息分解：总熵 = 互信息 + 期望条件熵。", "why": "只有认知不确定性才指示「应该拒答、求助或多收数据」。把两者混为一谈是实际系统最常见的错误：高噪声样本被误判为分布外，而真正的分布外样本因为模型过度自信反而被漏检。但这个分解本身的良定性近年受到严重质疑——认知不确定性没有可观测的标签。", "phases": [{"t": "贝叶斯基础（1992–2006）", "d": "证据框架与拉普拉斯近似把贝叶斯推断变成可在网络上执行的流程；哈密顿蒙特卡洛使精确后验采样可行，并证明无穷宽贝叶斯网络的先验收敛到高斯过程——这个结论二十年后成为神经正切核的源头。高斯过程同时确立为不确定性量化的黄金标准。"}, {"t": "可扩展化（2015–2017）", "d": "重参数化技巧使变分贝叶斯网络可训练；把已有的 dropout 重新解释为近似贝叶斯推断，使不确定性可以零成本地从现成模型中读出。而深度集成这一非贝叶斯、极简单的方法却在几乎所有基准上取胜，至今仍是黄金基线。同期两类不确定性的分解被正式引入深度学习。"}, {"t": "证据方法的兴起（2018–2020）", "d": "用 Dirichlet 分布参数化二阶不确定性，使单次前向传播就能输出认知不确定性，因高效而极流行。距离感知路线则要求不确定性随到训练数据的距离单调增长，把「我没学过这类样本」直接编码进架构。"}, {"t": "现实检验与理论质疑（2019–2022）", "d": "在分布偏移下系统评测显示：偏移越大所有方法越差，深度集成最稳健——这把不确定性量化与分布偏移正式接通。随后证明用任何损失最小化来学认知不确定性都无法保证一致性，因为它没有监督信号，这动摇了整条证据学习路线的理论基础。"}, {"t": "大模型期（2023– ）", "d": "问题从「预测分布的熵」变成「不同表述是否说了同一件事」。语义熵先把多次采样按语义等价聚类再算熵，从而区分「模型不知道」与「同一件事有多种说法」，用于幻觉检测并登上 Nature 正刊。"}], "papers": [{"c": "MacKay (1992)", "v": "Neural Computation", "t": "A practical Bayesian framework for backpropagation networks", "n": "用证据框架与拉普拉斯近似把贝叶斯推断变成可执行流程，并给出自动确定正则化强度的方法。这是贝叶斯神经网络的开山之作。"}, {"c": "Neal (1996)", "v": "Springer, Lecture Notes in Statistics（专著）", "t": "Bayesian Learning for Neural Networks", "n": "用哈密顿蒙特卡洛做精确贝叶斯推断，并证明无穷宽单隐层网络的先验收敛到高斯过程。后一结论是深度学习理论中罕见的领先二十年的结果。", "k": 1}, {"c": "Blundell, Cornebise, Kavukcuoglu & Wierstra (2015)", "v": "ICML 2015", "t": "Weight uncertainty in neural networks", "n": "用重参数化技巧使变分贝叶斯神经网络可以用标准反向传播训练，第一次让贝叶斯网络在现代规模上可行。"}, {"c": "Gal & Ghahramani (2016)", "v": "ICML 2016", "t": "Dropout as a Bayesian approximation", "n": "证明带 dropout 的网络等价于深度高斯过程的一种变分近似，于是不确定性可以零成本地从已有模型中读出。它让不确定性量化第一次进入普通从业者的工具箱。", "k": 1}, {"c": "Lakshminarayanan, Pritzel & Blundell (2017)", "v": "NeurIPS 2017", "t": "Simple and scalable predictive uncertainty estimation using deep ensembles", "n": "用几个独立初始化的网络取代复杂的贝叶斯近似，在几乎所有指标上取胜。它既说明当时的贝叶斯近似质量太差，也给了社区一个可靠基线。", "k": 1}, {"c": "Kendall & Gal (2017)", "v": "NeurIPS 2017", "t": "What uncertainties do we need in Bayesian deep learning for computer vision?", "n": "给出在深度模型中同时估计两类不确定性的可实现形式，并展示二者在视觉任务中的不同用途。这篇论文让这对概念在机器学习界普及。", "k": 1}, {"c": "Depeweg, Hernández-Lobato, Doshi-Velez & Udluft (2018)", "v": "ICML 2018", "t": "Decomposition of uncertainty in Bayesian deep learning for efficient and risk-sensitive learning", "n": "用互信息给出严格的分解式：总熵等于认知（互信息）加随机（期望条件熵）。这成为此后所有分解工作的标准定义。", "k": 1}, {"c": "Ovadia et al. (2019)", "v": "NeurIPS 2019", "t": "Can you trust your model's uncertainty? Evaluating predictive uncertainty under dataset shift", "n": "在分布偏移下系统评测所有主流方法，结论是偏移越大所有方法越差、深度集成最稳健。它把不确定性量化与分布偏移这两个分支正式接通。", "k": 1}, {"c": "Bengs, Hüllermeier & Waegeman (2022)", "v": "NeurIPS 2022", "t": "Pitfalls of epistemic uncertainty quantification through loss minimisation", "n": "证明用任何损失最小化来学习认知不确定性都不能保证一致性，因为它没有可观测的标签。这动摇了整条证据深度学习路线的理论基础。", "k": 1}, {"c": "Farquhar, Kossen, Kuhn & Gal (2024)", "v": "Nature", "t": "Detecting hallucinations in large language models using semantic entropy", "n": "先把多次采样按语义等价聚类再计算熵，从而区分「模型不知道」与「同一件事有多种说法」。这是不确定性量化在大模型时代的旗舰成果。", "k": 1}], "people": [{"n": "David MacKay（剑桥大学，已故）", "r": "贝叶斯证据框架与自动相关性确定"}, {"n": "Radford Neal（多伦多大学）", "r": "贝叶斯神经网络的哈密顿蒙特卡洛推断；无穷宽网络与高斯过程的对应"}, {"n": "Zoubin Ghahramani（剑桥／Google）", "r": "贝叶斯非参数方法与近似推断的系统化"}, {"n": "Yarin Gal（牛津 OATML）", "r": "MC Dropout；语义熵与大模型幻觉检测"}, {"n": "Balaji Lakshminarayanan（Google DeepMind）", "r": "深度集成；距离感知的谱归一化高斯过程"}, {"n": "Andrew Gordon Wilson（NYU）", "r": "论证深度集成实为更好的贝叶斯模型平均；深度核学习"}, {"n": "Eyke Hüllermeier（慕尼黑大学）& Willem Waegeman（根特大学）", "r": "两类不确定性的概念体系；指出损失最小化学认知不确定性的不一致性"}, {"n": "Alex Kendall（Wayve）", "r": "视觉任务中两类不确定性的建模与多任务加权"}, {"n": "José Miguel Hernández-Lobato（剑桥大学）", "r": "基于互信息的不确定性分解；贝叶斯优化与主动学习"}]}, {"id": "A212", "p": "A21", "num": "2.1.2", "name": "预测置信度估计", "kind": "leaf", "pillar": "i", "summary": "给每个预测一个分数，使错的预测分数更低。它要求的是排序性而非数值正确性，因此评价指标是风险—覆盖曲线下面积与错误检测的 AUROC，而不是校准误差。", "why": "这个方向最重要的概念澄清是：校准要求「说 80% 就真的 80% 对」（数值要求），失败预测要求「错的样本分数一定低于对的」（排序要求），二者互不蕴含。一个完美校准的常数输出器排序为零，一个排序完美的模型可能完全不校准。实践中这两件事长期被混为一谈，甚至有工作发现校准方法反而损害失败预测。", "phases": [{"t": "基线时期（2017）", "d": "最大 softmax 概率同时服务于分布外检测与错误预测两个任务，且出乎意料地难以击败。它的存在使这个方向的门槛很高——任何新方法都必须先说明自己为什么比它好。"}, {"t": "学习式置信度（2018–2020）", "d": "指出最大 softmax 概率的根本缺陷：对错误样本，最大概率对应的恰恰是错误类，因而天然偏高。于是改为显式学习「真类概率」，或用训练过程中样本被正确分类的频率作排序监督。同期基于高密度集距离比的信任分数给出了少数有理论保证的分数。"}, {"t": "架构层面的距离感知（2020）", "d": "要求表示空间保持双向 Lipschitz 从而不坍缩，再配上高斯过程输出层，使不确定性随到训练数据的距离单调增长。这条路线把「离训练数据多远」直接编码进模型，是置信度与可信域概念的交汇处。"}, {"t": "目标冲突被揭示（2023）", "d": "发现常用的校准方法会损害失败预测性能，因为二者优化的目标不同。这澄清了此前大量把 ECE 当作失败预测指标的混用。"}, {"t": "大模型期（2022– ）", "d": "出现让模型直接用语言说出置信度这一新范式，以及训练模型预测自身答案正确概率的探针方法。系统评测显示大模型普遍过度自信，且言语化置信度集中在少数几个整数档位。黑箱接口下（看不到 logits）如何估计置信度是当前最迫切的实际问题。"}], "papers": [{"c": "Hendrycks & Gimpel (2017)", "v": "ICLR 2017", "t": "A baseline for detecting misclassified and out-of-distribution examples in neural networks", "n": "用最大 softmax 概率同时做错误预测与分布外检测，确立了问题设定与评测协议。它难以击败的程度决定了整个方向的门槛。", "k": 1}, {"c": "Jiang, Kim, Guan & Gupta (2018)", "v": "NeurIPS 2018", "t": "To trust or not to trust a classifier", "n": "用样本到最近类高密度集与次近类的距离比作为信任分数，并证明它在密度水平集意义下渐近对齐贝叶斯最优。这是少数有理论保证的置信度分数。", "k": 1}, {"c": "Corbière, Thome, Bar-Hen, Cord & Pérez (2019)", "v": "NeurIPS 2019", "t": "Addressing failure prediction by learning model confidence", "n": "指出最大概率对错误样本天然偏高，改为显式学习真类概率。它明确了失败预测与分类是两个不同的学习目标。", "k": 1}, {"c": "Moon, Kim, Shin & Hwang (2020)", "v": "ICML 2020", "t": "Confidence-aware learning for deep neural networks", "n": "用训练过程中样本被正确分类的频率作为排序监督信号，把置信度的学习变成一个有明确标签的排序问题。"}, {"c": "van Amersfoort, Smith, Teh & Gal (2020)", "v": "ICML 2020", "t": "Uncertainty estimation using a single deep deterministic neural network", "n": "用径向基核到类中心的距离做不确定性，并用梯度惩罚保证表示不坍缩，单次前向即可给出可靠估计。"}, {"c": "Liu, Lin, Padhy, Tran, Bedrax-Weiss & Lakshminarayanan (2020)", "v": "NeurIPS 2020", "t": "Simple and principled uncertainty estimation with deterministic deep learning via distance awareness", "n": "用谱归一化保证表示空间的距离不坍缩，再配高斯过程输出层，使不确定性随输入距训练数据的距离单调增长。这条路线把可信域概念编码进了架构。", "k": 1}, {"c": "Granese, Romanelli, Gorla, Palamidessi & Piantanida (2021)", "v": "NeurIPS 2021", "t": "DOCTOR: a simple method for detecting misclassification errors", "n": "从假设检验角度导出错误检测判据，给出无需重新训练即可使用的判别式。它为这个偏经验的方向补上了统计视角。"}, {"c": "Zhu, Cheng, Zhang & Liu (2023)", "v": "ECCV 2023", "t": "Rethinking confidence calibration for failure prediction", "n": "发现常用校准方法会损害失败预测，因为二者目标不同：校准压低所有置信度，而失败预测需要拉开对错样本的差距。这是重要的反直觉结果。", "k": 1}, {"c": "Lin, Hilton & Evans (2022)", "v": "TMLR", "t": "Teaching models to express their uncertainty in words", "n": "训练模型用自然语言直接说出置信度，并证明这种言语化置信度可以被校准。它开辟了黑箱大模型下估计置信度的新范式。", "k": 1}, {"c": "Xiong, Hu, Lu, Li, Fu, He & Hooi (2024)", "v": "ICLR 2024", "t": "Can LLMs express their uncertainty? An empirical evaluation of confidence elicitation", "n": "系统评测各类置信度引出方法，发现大模型普遍过度自信、且言语化置信度集中在少数整数档位，并给出组合采样与提示的改进方案。"}], "people": [{"n": "Dan Hendrycks（CAIS）", "r": "最大 softmax 概率基线——同时定义了错误预测与分布外检测的问题形态"}, {"n": "Heinrich Jiang & Been Kim（Google）", "r": "信任分数——基于高密度集的、有理论保证的置信度"}, {"n": "Charles Corbière & Patrick Pérez（Valeo）", "r": "ConfidNet——揭示最大概率对错误样本的系统性偏高并给出替代目标"}, {"n": "Yarin Gal（牛津 OATML）", "r": "确定性单模型的不确定性估计（DUQ）；表示坍缩问题的识别"}, {"n": "Jeremiah Liu & Balaji Lakshminarayanan（Google）", "r": "距离感知不确定性（SNGP）——把「离训练数据多远」编码进架构"}, {"n": "Pablo Piantanida（CentraleSupélec）", "r": "错误检测的假设检验式判据"}, {"n": "Owain Evans（牛津／Truthful AI）", "r": "言语化置信度——让模型用语言表达不确定性"}, {"n": "Bryan Hooi（新加坡国立大学）", "r": "大模型置信度引出方法的系统评测"}]}, {"id": "A22", "p": "A2", "num": "2.2", "name": "校准与统计保证理论", "kind": "group", "pillar": "i", "summary": "研究预测置信度是否与真实正确概率一致，以及如何在不做分布假设的前提下给出有限样本的统计保证。", "extra": "两个子方向代表两种哲学。概率校准要求输出的数值与频率一致，需要 i.i.d. 假设、且只能渐近近似地达到；Conformal Prediction 干脆绕过概率数值，只要求数据可交换，就能给出有限样本精确成立的集合覆盖保证。但两者受同一个限制：都只给边缘（平均）保证，而用户想要的条件保证在分布无关设定下被证明不可能——这个不可能三角是整个统计侧最深刻的结构性事实，也是两个子方向近年共同的努力方向（多重校准与组条件覆盖是同一思路的两种实现）。"}, {"id": "A221", "p": "A22", "num": "2.2.1", "name": "概率校准理论", "kind": "leaf", "pillar": "i", "summary": "模型输出 0.8 时，这批样本是否真有 80% 为正？内容包括校准的层次（置信度校准 < 类别校准 < 分布校准 < 条件/多重校准）、度量及其估计偏差、后处理与训练时方法、以及分组公平下的多重校准。", "why": "这个方向的根不在机器学习而在天气预报：Brier 分数的「校准—锐度—不确定性」三项分解至今仍是所有校准分析的骨架，而「在校准的约束下最大化锐度」这句话是概率预测领域的中心原则。理解这一点就能看清为什么单纯追求低校准误差是错的——常数预测器完美校准但毫无用处。", "phases": [{"t": "气象学起源（1950–1983）", "d": "Brier 分数给概率预报第一个可累计的评分；随后的三项分解把它拆成校准、锐度与不确定性，明确了「校准好」和「有信息量」是两件事。同期确立了良好校准的贝叶斯预报者概念，以及校准与精炼的形式化比较。"}, {"t": "理论范式确立（1998–2007）", "d": "证明存在无需任何分布假设、即使面对对抗序列也渐近校准的预测策略（用可接近性定理），说明校准本身不难达到——难的是同时保持锐度。恰当评分规则理论随后把整套范式固定为「在校准约束下最大化锐度」。"}, {"t": "引入机器学习（1999–2005）", "d": "参数化的 Platt 缩放与非参数的保序回归确立了「模型归模型、概率归校准器」的分工。当时的系统比较发现提升树与支持向量机系统性不校准，而神经网络校准良好——这个结论在深度时代被推翻，形成有趣的历史对照。"}, {"t": "深度校准危机与度量反思（2017–2021）", "d": "发现现代深度网络严重过度自信，而单参数的温度缩放几乎最优。随后指出常用的期望校准误差经验估计有偏且常严重低估，并给出可验证的误差上界与样本复杂度。2021 年结论又被部分反转：更新的架构与更大的模型校准反而更好，说明不校准是特定时期特定架构的性质。"}, {"t": "从边缘走向条件（2017– ）", "d": "公平性的不可能性定理指出校准与均等错误率不可兼得；多重校准要求在所有可计算识别的子群上同时校准且证明可高效达成，绕开了完全条件校准的不可能性。大模型时代则发现预训练模型校准良好但对齐后显著变差，而生成式任务中校准如何定义仍无共识。"}], "papers": [{"c": "Brier (1950)", "v": "Monthly Weather Review", "t": "Verification of forecasts expressed in terms of probability", "n": "提出 Brier 分数，第一次给概率预报一个可操作、可累计的评分。它使「预报得准不准」从主观判断变成统计量。", "k": 1}, {"c": "Murphy (1973)", "v": "Journal of Applied Meteorology", "t": "A new vector partition of the probability score", "n": "把 Brier 分数分解为校准、锐度与不确定性三项，明确了「校准好」与「有信息量」是两个独立维度。这个分解至今是所有校准分析的骨架。", "k": 1}, {"c": "Dawid (1982)", "v": "JASA", "t": "The well-calibrated Bayesian", "n": "给出校准的贝叶斯基础与经验校准概念，指出一个融贯的贝叶斯预报者在自己的主观概率下必然认为自己是校准的。它奠定了校准的哲学与数学基础。"}, {"c": "Foster & Vohra (1998)", "v": "Biometrika", "t": "Asymptotic calibration", "n": "证明存在无需任何分布假设、即使面对对抗序列也渐近校准的预测策略。它说明校准本身容易达到，难的是同时保持锐度——这个结论重塑了整个方向的目标。", "k": 1}, {"c": "Platt (1999) / Zadrozny & Elkan (2002)", "v": "Advances in Large Margin Classifiers（MIT Press）/ KDD 2002", "t": "Probabilistic outputs for SVMs / Transforming classifier scores into accurate multiclass probability estimates", "n": "分别给出参数化（sigmoid 拟合）与非参数（保序回归）的后处理校准。它们确立了「模型归模型、概率归校准器」这一至今通用的分工。"}, {"c": "Gneiting, Balabdaoui & Raftery (2007)", "v": "JRSS-B", "t": "Probabilistic forecasts, calibration and sharpness", "n": "确立现代范式：预报应在满足校准的约束下最大化锐度，并给出相应的诊断工具。这句话此后成为整个概率预测领域的中心原则。", "k": 1}, {"c": "Guo, Pleiss, Sun & Weinberger (2017)", "v": "ICML 2017", "t": "On calibration of modern neural networks", "n": "揭示现代深度网络比早期浅网络严重得多的过度自信，并证明单参数的温度缩放几乎最优。它把校准问题带进深度学习主流，是该方向被引最多的论文。", "k": 1}, {"c": "Kumar, Liang & Ma (2019)", "v": "NeurIPS 2019", "t": "Verified uncertainty calibration", "n": "指出常用的期望校准误差经验估计有偏、常严重低估真实误差，并给出缩放—分箱校准器与可验证的误差上界。它把「报一个数字」升级为「给出有保证的界」。", "k": 1}, {"c": "Kleinberg, Mullainathan & Raghavan (2017)", "v": "ITCS 2017", "t": "Inherent trade-offs in the fair determination of risk scores", "n": "证明校准、均等假阴率、均等假阳率三者除平凡情形外不可兼得。它同时是算法公平最有影响力的结果，也约束了校准能承诺什么。", "k": 1}, {"c": "Hébert-Johnson, Kim, Reingold & Rothblum (2018)", "v": "ICML 2018", "t": "Multicalibration: calibration for the (computationally-identifiable) masses", "n": "要求在所有可被某计算类识别的子群上同时校准，并证明可高效达成。它在完全条件校准（不可能）与边缘校准（太弱）之间找到了正确的中间地带。", "k": 1}], "people": [{"n": "Glenn Brier & Allan Murphy", "r": "Brier 分数及其校准—锐度—不确定性分解（气象学奠基）"}, {"n": "A. Philip Dawid（剑桥大学）", "r": "良好校准的贝叶斯预报者；校准的哲学与数学基础"}, {"n": "Dean Foster & Rakesh Vohra（宾夕法尼亚大学）", "r": "渐近校准的存在性——对抗序列下仍可校准"}, {"n": "Tilmann Gneiting（HITS）& Adrian Raftery（华盛顿大学）", "r": "恰当评分规则理论；校准约束下最大化锐度的范式"}, {"n": "John Platt（Google）", "r": "Platt 缩放——判别分数到概率的后处理"}, {"n": "Kilian Weinberger（康奈尔大学）", "r": "温度缩放；揭示现代网络的校准危机"}, {"n": "Percy Liang & Ananya Kumar（Stanford）", "r": "可验证校准；指出期望校准误差估计的系统性偏差"}, {"n": "Omer Reingold（Stanford）、Michael P. Kim & Aaron Roth", "r": "多重校准与 omnipredictor——把校准提升为通用充分统计量"}, {"n": "Jon Kleinberg（康奈尔大学）", "r": "校准与错误率均衡的不可能性定理"}, {"n": "Peter Flach（布里斯托大学）", "r": "多类校准的一般框架（Dirichlet 校准）与校准诊断方法"}]}, {"id": "A222", "p": "A22", "num": "2.2.2", "name": "Conformal Prediction", "kind": "leaf", "pillar": "i", "summary": "对任意黑盒模型给出集合预测 C(x)，使 P(Y ∈ C(X)) ≥ 1−α 在有限样本下精确成立，唯一假设是数据可交换。研究内容包括基本构造、可交换性被破坏时的推广、条件覆盖的可能性边界，以及从覆盖率推广到任意单调风险的控制。", "why": "这是整棵树上假设最弱、保证最硬的结果，也是它近五年爆发的原因：机制极简（分位数加秩统计量的可交换性论证），却能包裹任意复杂的模型，正是大模型时代最需要的性质。它的代价写在一条不可能性定理里——分布无关、条件覆盖、区间有限，三者不可兼得。", "phases": [{"t": "创立（1998–2005）", "d": "从随机性检验与 Kolmogorov 复杂度的思路出发提出转导式 Conformal 预测；随后的分裂式变体把校准集与训练集分开，使计算代价从 n 次重训降到一次，这是它真正实用化的关键（今天绝大多数应用都用它）。2005 年的专著把整套理论系统化。"}, {"t": "进入统计与机器学习主流（2014–2019）", "d": "被引入主流统计学并给出无分布预测带的系统处理；随后以分位数回归作为基础分数，使区间宽度自适应于异方差——这是效率提升最重要的一步，也解决了早期方法区间等宽因而在困难区域过窄的缺陷。"}, {"t": "有效性的推广（2019–2021）", "d": "加权可交换性使协变量偏移下仍能精确覆盖，把 Conformal 与分布偏移分支接通；jackknife+ 与交叉验证变体免去数据分裂的效率损失；随后给出非可交换数据下覆盖率退化量的上界。"}, {"t": "不可能性与折中（2021）", "d": "证明在无分布假设下，任何具有非平凡条件覆盖的方法其区间必然无限宽。这个定理重新定向了整个领域：此后工作都转向近似条件覆盖、组条件覆盖，或用在线自适应换取长期平均覆盖。"}, {"t": "超越覆盖与大模型（2021– ）", "d": "在线自适应方法在任意甚至对抗漂移下保证长期覆盖率；风险控制预测集把「覆盖」推广到任意单调风险（如假阴率）。大模型时代则出现对生成集合的保证、通过逐步弱化陈述保证事实性、以及用机器学习预测辅助科学推断而保持有效性。"}], "papers": [{"c": "Papadopoulos, Proedrou, Vovk & Gammerman (2002)", "v": "ECML 2002", "t": "Inductive confidence machines for regression", "n": "提出分裂式 Conformal：把校准集与训练集分开，使计算代价从 n 次重训降到一次。这是 Conformal 从理论走向实用的决定性一步。", "k": 1}, {"c": "Vovk, Gammerman & Shafer (2005)", "v": "Springer（专著，第 2 版 2022）", "t": "Algorithmic Learning in a Random World", "n": "系统建立 Conformal Prediction：仅凭可交换性即可给任意黑箱模型配上有限样本精确成立的覆盖保证。它是整个方向的奠基文献。", "k": 1}, {"c": "Lei & Wasserman (2014)", "v": "JRSS-B", "t": "Distribution-free prediction bands for non-parametric regression", "n": "把 Conformal 引入主流统计学，给出无分布预测带的系统处理，并首次讨论条件覆盖的困难。它使这套方法进入统计学界视野。"}, {"c": "Lei, G'Sell, Rinaldo, Tibshirani & Wasserman (2018)", "v": "JASA", "t": "Distribution-free predictive inference for regression", "n": "给出分裂式 Conformal 的完整统计处理与局部加权变体，是统计学界的标准引用。它把方法、理论与实践细节一次讲清。", "k": 1}, {"c": "Romano, Patterson & Candès (2019)", "v": "NeurIPS 2019", "t": "Conformalized quantile regression", "n": "以分位数回归作为基础分数，使预测区间宽度自适应于异方差。它解决了早期方法区间等宽、在困难区域过窄的核心缺陷，是效率提升最重要的一步。", "k": 1}, {"c": "Tibshirani, Foygel Barber, Candès & Ramdas (2019)", "v": "NeurIPS 2019", "t": "Conformal prediction under covariate shift", "n": "提出加权可交换性，在似然比已知时协变量偏移下仍能精确覆盖。它把 Conformal 与分布偏移这两个分支正式接通。", "k": 1}, {"c": "Barber, Candès, Ramdas & Tibshirani (2021)", "v": "Annals of Statistics", "t": "Predictive inference with the jackknife+", "n": "给出免去数据分裂的 jackknife+ 与交叉验证变体，在略弱的保证下换回全部数据的使用效率。"}, {"c": "Barber, Candès, Ramdas & Tibshirani (2021)", "v": "Information and Inference（IMA）", "t": "The limits of distribution-free conditional predictive inference", "n": "证明在无分布假设下，任何具有非平凡条件覆盖的方法其区间必然无限宽。这个不可能性定理重新定向了整个领域。", "k": 1}, {"c": "Gibbs & Candès (2021)", "v": "NeurIPS 2021", "t": "Adaptive conformal inference under distribution shift", "n": "在线自适应调整显著性水平，在任意甚至对抗性的分布漂移下保证长期平均覆盖率。它是 Conformal 与非平稳环境的接口。", "k": 1}, {"c": "Bates, Angelopoulos, Lei, Malik & Jordan (2021)", "v": "Journal of the ACM", "t": "Distribution-free, risk-controlling prediction sets", "n": "把「覆盖」推广到任意单调风险（如假阴率、交并比），用同时置信界给出高概率保证。它是这套保证范式的当代形态，也最贴近实际的安全需求。", "k": 1}], "people": [{"n": "Vladimir Vovk（伦敦大学皇家霍洛威学院）", "r": "Conformal Prediction 的创立者；在线可交换性与随机性检验"}, {"n": "Alexander Gammerman & Glenn Shafer", "r": "Conformal 的共同创立与博弈论概率基础"}, {"n": "Emmanuel Candès（Stanford）", "r": "把 Conformal 带入主流统计；分位数回归 Conformal 与加权可交换性"}, {"n": "Rina Foygel Barber（芝加哥大学）", "r": "条件覆盖的不可能性定理；非可交换数据下覆盖退化的上界"}, {"n": "Ryan Tibshirani（Berkeley）", "r": "协变量偏移下的 Conformal；jackknife+"}, {"n": "Aaditya Ramdas（CMU）", "r": "任意时刻有效推断与 e-value；与 Conformal 的融合"}, {"n": "Jing Lei & Larry Wasserman（CMU）", "r": "无分布预测带的统计理论；分裂式 Conformal 的系统化"}, {"n": "Yaniv Romano（Technion）", "r": "分位数回归 Conformal——自适应区间宽度"}, {"n": "Michael I. Jordan、Anastasios Angelopoulos & Stephen Bates（Berkeley／MIT）", "r": "风险控制预测集与 conformal risk control；预测驱动推断"}, {"n": "Isaac Gibbs（Stanford）", "r": "在线自适应 Conformal——对抗漂移下的长期覆盖"}]}, {"id": "A23", "p": "A2", "num": "2.3", "name": "可信边界与认证理论", "kind": "group", "pillar": "i", "summary": "研究模型在什么条件下应当拒绝作答，以及如何给出可被第三方检验的形式化认证。", "extra": "前两组产生的是「数」与「保证」，这一组把它们变成行动与凭证。两个子方向的区别在于保证的对象与形式：拒识是逐样本的弃权决策，问的是「这一个我答不答」；认证是对输入邻域的数学证书，问的是「凭什么信」。证书的价值在于可传递——第三方无需信任生产者，只需检验证书。这里也是可信 AI 从技术属性走向工程凭证与监管接口的地方。\n\n附带说明：「可信域判定」（模型在输入空间哪片区域可信）在工程与监管中被大量使用（化学信息学的适用域、自动驾驶的运行设计域、大模型的知识边界），但学界至今没有公认的形式化定义与基准，文献分散在拒识、异常检测与水平集估计之间，因此这里不单列为一个节点，相关工作归入下面的拒识方向。"}, {"id": "A231", "p": "A23", "num": "2.3.1", "name": "选择性预测与拒识", "kind": "leaf", "pillar": "i", "summary": "允许模型输出「我不知道」。学习预测器与选择函数这一对，刻画风险—覆盖权衡曲线。三种设定：拒识有固定代价、给定目标风险下最大化覆盖率、以及拒识后交给人类专家（learning to defer）。", "why": "拒识是可信 AI 最直接的安全动作——它把不确定性从一个被动的数字变成主动的安全行为，是高风险场景落地的必要条件，也是这一支中理论与实践距离最近的一块。近年两个负面结果尤其重要：分布偏移下用模型自身置信度拒识严重失效，且拒识会放大群体间的性能差异。", "phases": [{"t": "最优拒识（1957–1970）", "d": "证明在已知真实后验概率时，最优规则是按最大后验概率阈值化，并刻画了错误率与拒识率的完整权衡曲线。此后半个世纪的工作，本质上都在处理「后验估计不准时该怎么办」这一个问题。"}, {"t": "代理损失与一致性（2006–2016）", "d": "给出对带拒识分类 Fisher 一致的凸代理损失，使拒识可以像普通分类一样用凸优化求解并保留统计最优性。随后的双函数框架同时学习预测器与拒识器，给出一致的代理损失族与泛化界，成为该方向最完整的现代形式。"}, {"t": "可学习性与深度实现（2010–2019）", "d": "先在可实现设定下建立选择性分类的可学习性理论，用分歧区域刻画可达覆盖率；随后给出带 PAC 保证的做法——给定目标风险与置信水平，用二项尾界选阈值——并进一步实现端到端联合训练。"}, {"t": "两个负面结果（2020–2021）", "d": "证明分布偏移下用模型自身置信度拒识会严重失效，需要训练专门的校准器；并证明拒识在降低整体风险的同时可能提高弱势群体的风险。后者揭示了安全机制与公平目标之间此前无人察觉的冲突。"}, {"t": "人机协同与大模型（2018– ）", "d": "当拒识后交给人类专家时，最优决策取决于模型与专家谁更强，由此发展出一致的代理损失与多专家推广。大模型时代弃权成为对齐的一部分，但生成式任务中风险—覆盖曲线如何定义仍无共识——「部分回答」和「降低断言强度」使二值拒识框架失效。"}], "papers": [{"c": "Chow (1970)", "v": "IEEE Transactions on Information Theory", "t": "On optimum recognition error and reject tradeoff", "n": "给出已知后验时的最优拒识规则与错误—拒识权衡曲线。此后半个世纪的工作本质上都在处理后验估计不准时该怎么办。", "k": 1}, {"c": "Herbei & Wegkamp (2006)", "v": "The Canadian Journal of Statistics", "t": "Classification with reject option", "n": "在统计框架下研究带拒识分类的极小极大收敛率，把拒识从工程做法纳入非参数统计的标准问题谱系。"}, {"c": "Bartlett & Wegkamp (2008)", "v": "JMLR", "t": "Classification with a reject option using a hinge loss", "n": "给出对带拒识分类 Fisher 一致的广义 hinge 损失，使拒识可以用凸优化求解并保留统计最优性。它把拒识纳入统计学习理论的标准框架。", "k": 1}, {"c": "El-Yaniv & Wiener (2010)", "v": "JMLR", "t": "On the foundations of noise-free selective classification", "n": "在可实现设定下建立选择性分类的可学习性理论，用版本空间的分歧区域刻画能以零错误覆盖多大区域。它给出了这个方向的理论基础。", "k": 1}, {"c": "Cortes, DeSalvo & Mohri (2016)", "v": "ALT 2016", "t": "Learning with rejection", "n": "提出预测器与拒识器联合学习的双函数框架，给出一致的代理损失族与基于 Rademacher 复杂度的泛化界。这是拒识理论最完整的现代框架。", "k": 1}, {"c": "Geifman & El-Yaniv (2017)", "v": "NeurIPS 2017", "t": "Selective classification for deep neural networks", "n": "给定目标风险与置信水平，用二项尾界选择阈值，输出带 PAC 保证的选择性分类器。这是深度模型上第一个有严格保证的拒识方法。", "k": 1}, {"c": "Geifman & El-Yaniv (2019)", "v": "ICML 2019", "t": "SelectiveNet: a deep neural network with an integrated reject option", "n": "把预测头与选择头放进同一个网络端到端训练，并用覆盖率约束控制取舍。它使拒识从后处理变成训练目标的一部分。"}, {"c": "Kamath, Jia & Liang (2020)", "v": "ACL 2020", "t": "Selective question answering under domain shift", "n": "证明分布偏移下用模型自身置信度拒识严重失效，必须训练专门的校准器来判断何时弃权。它把拒识与分布偏移两个分支接通。", "k": 1}, {"c": "Mozannar & Sontag (2020)", "v": "ICML 2020", "t": "Consistent estimators for learning to defer to an expert", "n": "给出拒识后交给人类专家这一设定下的一致代理损失（基于代价敏感 softmax），使联合优化「谁来答」成为可能。它是人机协同决策的理论奠基。", "k": 1}, {"c": "Jones, Sagawa, Koh, Kumar & Liang (2021)", "v": "ICLR 2021", "t": "Selective classification can magnify disparities across groups", "n": "证明拒识在降低整体风险的同时可能提高弱势群体的风险。它揭示了安全机制与公平目标之间此前未被察觉的冲突，对高风险部署有直接政策含义。", "k": 1}], "people": [{"n": "C. K. Chow（IBM）", "r": "最优拒识规则与错误—拒识权衡曲线（1957、1970）"}, {"n": "Peter Bartlett & Marten Wegkamp（Berkeley／康奈尔大学）", "r": "带拒识分类的一致凸代理损失与极小极大率"}, {"n": "Corinna Cortes & Mehryar Mohri（Google／NYU）", "r": "learning with rejection 的双函数框架与一致性理论"}, {"n": "Ran El-Yaniv & Yonatan Geifman（Technion）", "r": "选择性分类的可学习性理论；带 PAC 保证的深度拒识与 SelectiveNet"}, {"n": "Percy Liang（Stanford）", "r": "分布偏移下的选择性问答；证明拒识放大群体差异"}, {"n": "David Sontag & Hussein Mozannar（MIT）", "r": "learning to defer 的一致估计——人机协同的理论基础"}, {"n": "Clayton Scott（密歇根大学）", "r": "Neyman–Pearson 分类——在硬性错误率约束下学习的正确统计框架"}, {"n": "Ingo Steinwart（斯图加特大学）", "r": "密度水平集估计的一致性理论——刻画可信区域的现成统计工具"}]}, {"id": "A232", "p": "A23", "num": "2.3.2", "name": "形式化验证与认证保证", "kind": "leaf", "pillar": "i", "summary": "给出可被独立检验的数学证书，典型形式是「对所有 ‖x′−x‖ ≤ ε，f(x′) = f(x)」。三条路线：完备验证（确定性、无假阴，但 NP-难）、不完备的凸松弛（确定性但保守、可扩展到百万参数）、概率认证（高概率、模型无关、可到 ImageNet 规模）。", "why": "与前面一切的区别在于证书可传递、可审计：第三方无需信任生产者，只需检验证书。这是可信从主观陈述变为客观凭证的唯一途径，也是监管能够对接的技术形态。但它的适用边界很硬——大模型上确定性认证基本不可行，主流已退到统计保证。", "phases": [{"t": "形式化方法进入深度学习（2017–2018）", "d": "扩展单纯形法处理 ReLU 的分段线性约束，在真实的空中防撞网络上验证安全性质，标志形式化验证正式进入深度学习并确立了长期使用的基准。同期抽象解释框架把程序分析的成熟工具（区间、多面体、zonotope 域）移植过来。"}, {"t": "可扩展的界传播（2018–2021）", "d": "用线性规划对偶给出可微的鲁棒误差上界，第一次实现训练时直接优化认证界——认证从事后检验变成训练目标。随后线性松弛的界传播加分支定界成为事实上的最先进验证器，连年赢得国际验证竞赛。"}, {"t": "松弛的天花板（2019）", "d": "证明所有基于单神经元凸松弛的验证方法存在共同的精度上限，无论如何优化都无法突破。这个负面结果框定了整条技术路线的边界，并推动了多神经元松弛的发展。"}, {"t": "概率认证范式（2019–2020）", "d": "用高斯噪声平滑分类器，借 Neyman–Pearson 引理证明所得 ℓ₂ 认证半径是紧的。它完全模型无关且可扩展到 ImageNet 规模，是认证方向唯一在大模型尺度可用的路线。随后也证明了它在 ℓ∞ 下认证半径必然随维度衰减这一固有局限。"}, {"t": "框架移植与战略转移（2020– ）", "d": "认证被推广到投毒、补丁、公平性与机器遗忘，说明这套框架适用于鲁棒性之外的任何可信属性。但在大模型上，离散输入、万亿参数与语义威胁使确定性认证基本不可行，主流退到风险控制式的统计保证——这是可信 AI 保证范式最重要的一次战略转移。"}], "papers": [{"c": "Katz, Barrett, Dill, Julian & Kochenderfer (2017)", "v": "CAV 2017（2024 年 CAV 奖）", "t": "Reluplex: an efficient SMT solver for verifying deep neural networks", "n": "扩展单纯形法处理 ReLU 的分段线性约束，在真实的空中防撞网络上验证安全性质。它标志形式化验证进入深度学习，并确立了长期使用的基准。", "k": 1}, {"c": "Gehr, Mirman, Drachsler-Cohen, Tsankov, Chaudhuri & Vechev (2018)", "v": "IEEE S&P 2018", "t": "AI²: safety and robustness certification of neural networks with abstract interpretation", "n": "把程序分析中的抽象解释移植到神经网络，用抽象域传播输入集合。它开辟了与约束求解并行的第二条技术路线。", "k": 1}, {"c": "Singh, Gehr, Püschel & Vechev (2019)", "v": "POPL 2019", "t": "An abstract domain for certifying neural networks", "n": "设计出兼顾精度与效率的多面体抽象域，成为被引最多的抽象解释式验证器。它使抽象解释路线在实用规模上站住脚。"}, {"c": "Wong & Kolter (2018)", "v": "ICML 2018", "t": "Provable defenses against adversarial examples via the convex outer adversarial polytope", "n": "用线性规划对偶给出可微的鲁棒误差上界，从而第一次实现训练时直接优化认证界。认证由此从事后检验变成训练目标。", "k": 1}, {"c": "Raghunathan, Steinhardt & Liang (2018)", "v": "ICLR 2018", "t": "Certified defenses against adversarial examples", "n": "用半定规划松弛给出更紧的认证界，代价是计算成本高。它与线性松弛共同界定了凸松弛路线的精度—效率权衡。"}, {"c": "Zhang, Weng, Chen, Hsieh & Daniel (2018)", "v": "NeurIPS 2018", "t": "Efficient neural network robustness certification with general activation functions", "n": "提出 CROWN 线性松弛界传播，高效且适用于一般激活函数。它是此后一整条最先进验证器技术线的起点。", "k": 1}, {"c": "Wang, Zhang, Xu, Lin, Jana, Hsieh & Kolter (2021)", "v": "NeurIPS 2021", "t": "Beta-CROWN: efficient bound propagation with per-neuron split constraints", "n": "把分支定界与线性松弛结合，做到既完备又高效，连年赢得国际神经网络验证竞赛。它是当前事实上的最先进验证器。", "k": 1}, {"c": "Lécuyer, Atlidakis, Geambasu, Hsu & Jana (2019)", "v": "IEEE S&P 2019", "t": "Certified robustness to adversarial examples with differential privacy", "n": "用差分隐私的稳定性论证给出第一个可扩展的概率鲁棒性认证。它把两个原本无关的领域连了起来，也是随机平滑的先声。"}, {"c": "Cohen, Rosenfeld & Kolter (2019)", "v": "ICML 2019", "t": "Certified adversarial robustness via randomized smoothing", "n": "用高斯噪声平滑分类器，并用 Neyman–Pearson 引理证明所得 ℓ₂ 认证半径是紧的。它完全模型无关且可扩展到 ImageNet，是认证方向唯一在大规模上可用的路线。", "k": 1}, {"c": "Salman, Yang, Zhang, Hsieh & Zhang (2019)", "v": "NeurIPS 2019", "t": "A convex relaxation barrier to tight robustness verification of neural networks", "n": "证明所有基于单神经元凸松弛的验证方法存在共同的精度上限。这个负面结果框定了整条技术路线的天花板，推动了多神经元松弛的发展。", "k": 1}], "people": [{"n": "Guy Katz & Clark Barrett（希伯来大学／Stanford）", "r": "Reluplex 与 Marabou——神经网络的完备形式化验证"}, {"n": "Mykel Kochenderfer（Stanford）", "r": "空中防撞网络的安全验证；决策系统的形式化保证"}, {"n": "Martin Vechev（苏黎世联邦理工）", "r": "AI² 与 DeepPoly——抽象解释式验证的完整技术线"}, {"n": "J. Zico Kolter（CMU）", "r": "凸外多面体认证训练；随机平滑的紧界证明"}, {"n": "张欢 Huan Zhang（伊利诺伊大学厄巴纳-香槟分校）", "r": "CROWN 与 α,β-CROWN——当前最先进的神经网络验证器"}, {"n": "谢宗易 Cho-Jui Hsieh（UCLA）", "r": "可扩展界传播的算法体系；自动化到任意计算图的 auto-LiRPA"}, {"n": "Aditi Raghunathan & Percy Liang（CMU／Stanford）", "r": "半定规划认证；凸松弛的精度分析"}, {"n": "Soheil Feizi（马里兰大学）", "r": "认证框架向投毒、补丁等威胁的推广"}, {"n": "Suman Jana（哥伦比亚大学）", "r": "差分隐私式的概率鲁棒认证；系统安全与验证的结合"}, {"n": "李博 Bo Li（芝加哥大学）", "r": "认证鲁棒性的系统化与可信机器学习基准"}]}, {"id": "B", "p": "root", "num": "二", "name": "可管 Regulatability", "kind": "branch", "pillar": "ii", "summary": "研究模型进入社会应用后，其行为是否能够被度量、解释、审计和约束。", "extra": "提问对象从「模型 + 数据分布」变成「模型 + 一群人」。这一支的四个方向对应四种社会要求：对不同人是否一视同仁（公平）、是否泄露个人信息（隐私）、行为能否被外部理解与检查（可解释与可审计）、目标是否真的来自人类意图（价值对齐）。它们共享一个数学特征：几乎每个方向的核心结果都是不可能性定理——多个合理的要求无法同时满足，因此实践中必须显式地做取舍。"}, {"id": "B1", "p": "B", "num": "1", "name": "公平学习理论", "kind": "group", "pillar": "ii", "summary": "研究机器学习决策如何避免对不同个体或群体产生系统性不公平。", "extra": "三个子方向回答三个递进的问题：公平在数学上怎么定义、不同定义能否兼容（度量与相容性）；观察到的差距里有多少是真正的歧视（因果公平）；在给定公平约束下如何训练模型、代价多大（约束学习）。这个领域的成熟标志是它很早就证明了自己的核心不可能性，此后的工作都在这个约束下寻找可行的折中。"}, {"id": "B11", "p": "B1", "num": "1.1", "name": "公平性度量与相容性理论", "kind": "leaf", "pillar": "ii", "summary": "研究如何用数学定义公平，以及不同公平准则能否同时满足。主要有个体公平（相似的人应被相似对待）与群体公平（各群体的统计指标应相等）两大类，后者又分为人口均等、均等几率、预测均等等互不相容的版本。", "why": "这个方向最重要的产出是不可能性定理：校准、均等假阴率、均等假阳率三者除非基率相等或完美预测否则无法兼得。这意味着「公平」不是一个可以同时最大化的目标，而是一个必须公开选择立场的政策问题——技术无法替代这个选择。", "phases": [{"t": "教育测量学前史（1960s–1970s）", "d": "心理测量学界围绕入学考试是否对少数族裔不公展开争论，Cleary 模型（回归公平）与 Thorndike 模型（选拔率公平）已经互相矛盾。当时就已发现不同公平定义在数学上不可兼容，但这一教训在机器学习界被重新发现花了四十年。"}, {"t": "机器学习的形式化（2012–2015）", "d": "个体公平被公理化为对相似度度量的 Lipschitz 条件，同时指出「无视敏感属性」不等于公平（代理变量仍会泄露）。表示学习路线主张学一个抹掉敏感信息的中间表示，把公平推到表示层。"}, {"t": "群体指标与不可能性（2016–2017）", "d": "均等几率与机会均等被定义，并证明只需对已有分数做后处理即可达成，给出几何刻画。紧接着两篇独立工作证明校准与错误率均衡不可兼得，直接介入了美国司法风险评估（COMPAS）的公共辩论。这是算法公平最有影响力的时刻。"}, {"t": "细化与放松（2018–2021）", "d": "发现只在粗粒度群体上满足公平会被「公平操纵」——可以构造出在每个大群体上都公平、却在交叉子群上极不公平的模型。于是转向对指数多子群同时保证的多重校准与多精确度，并把公平视为一个计算受限的可识别性问题。同时出现对主流指标本身的批评。"}, {"t": "大模型期（2022– ）", "d": "分类指标失效：生成模型没有明确的标签与群体，伤害形式变成刻板印象、表征缺失与服务质量差异。评测转向基准探针与人工标注，理论工具尚未跟上，这是该方向当前最大的断层。"}], "papers": [{"c": "Dwork, Hardt, Pitassi, Reingold & Zemel (2012)", "t": "Fairness through awareness", "n": "提出个体公平：相似的个体应得到相似的输出，形式化为对任务相关相似度的 Lipschitz 约束。它同时指出「不看敏感属性」既不必要也不充分，奠定了整个领域的问题设定。", "k": 1, "v": "ITCS 2012"}, {"c": "Zemel, Wu, Swersky, Pitassi & Dwork (2013)", "t": "Learning fair representations", "n": "把公平推到表示层：学一个既保留任务信息又抹掉群体信息的中间表示。这是预处理路线的开创工作，也是后来所有对抗式去偏方法的原型。", "v": "ICML 2013"}, {"c": "Hardt, Price & Srebro (2016)", "t": "Equality of opportunity in supervised learning", "n": "定义均等几率与机会均等，并证明只需对已有分数做后处理（按群体调阈值或随机化）即可精确达成，给出 ROC 曲线上的几何刻画。它让群体公平从概念变成可计算的操作。", "k": 1, "v": "NeurIPS 2016"}, {"c": "Chouldechova (2017)", "t": "Fair prediction with disparate impact: a study of bias in recidivism prediction instruments", "n": "在再犯风险评分的真实背景下证明：当两群基率不同时，校准与错误率均衡在数学上不能同时成立。它把学术结论与 COMPAS 争议直接对接。", "k": 1, "v": "Big Data（期刊）"}, {"c": "Kleinberg, Mullainathan & Raghavan (2017)", "t": "Inherent trade-offs in the fair determination of risk scores", "n": "独立且更一般地证明三个公平条件除平凡情形外互斥。这个不可能性定理确立了此后所有公平研究的边界条件：必须选择放弃哪一个。", "k": 1, "v": "ITCS 2017"}, {"c": "Kearns, Neel, Roth & Wu (2018)", "t": "Preventing fairness gerrymandering: auditing and learning for subgroup fairness", "n": "揭示在粗粒度群体上的公平可被操纵，并给出对指数多子群同时保证公平的博弈论算法与审计归约。它把公平从少数几个受保护群体推广到丰富的子群结构。", "k": 1, "v": "ICML 2018"}, {"c": "Hébert-Johnson, Kim, Reingold & Rothblum (2018)", "t": "Multicalibration: calibration for the (computationally-identifiable) masses", "n": "要求在所有可被某计算类识别的子群上同时校准，并证明可高效达成。它给出了在个体公平（太强）与群体公平（太弱）之间的正确中间概念。", "k": 1, "v": "ICML 2018"}, {"c": "Corbett-Davies & Goel (2018)", "t": "The measure and mismeasure of fairness: a critical review of fair machine learning", "n": "指出主流群体指标存在 infra-marginality 问题——即使风险估计完全正确，指标仍会显示不公。主张回到「准确估计风险 + 公开阈值」的决策论视角。", "v": "arXiv 预印本"}, {"c": "Friedler, Scheidegger & Venkatasubramanian (2016, 2021)", "t": "The (im)possibility of fairness: different value systems require different mechanisms", "n": "指出所有公平定义都隐含了对「构念空间到观测空间」映射的世界观假设：认为观测就是真实，还是认为观测已被扭曲。不同世界观必然导出不同且互斥的公平机制。", "v": "Communications of the ACM"}, {"c": "Barocas & Selbst (2016)", "t": "Big data's disparate impact", "n": "系统梳理歧视如何在目标定义、标签、特征选择、样本采集等每一环节产生，并对应到美国反歧视法的差别影响原则。它是技术与法律之间被引用最多的桥梁。", "v": "California Law Review"}], "people": [{"n": "Cynthia Dwork（Harvard／Microsoft）", "r": "个体公平的公理化；同时也是差分隐私的提出者——两个领域的共同奠基人"}, {"n": "Moritz Hardt（MPI-IS）", "r": "均等几率
