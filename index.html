ontrol of McKean–Vlasov dynamics versus mean field games", "n": "严格区分合作型的 McKean–Vlasov 控制与竞争型的平均场博弈，证明两者解一般不同并刻画差异来源。这是该方向的定义性论文。", "k": 1, "v": "Mathematics and Financial Economics"}, {"c": "Bensoussan, Frehse & Yam (2013)", "t": "Mean Field Games and Mean Field Type Control Theory", "n": "系统给出平均场型控制的随机最大值原理与 HJB 方程，是最早把两类问题并置处理的专著。", "v": "SpringerBriefs in Mathematics"}, {"c": "Pham & Wei (2018)", "t": "Bellman equation and viscosity solutions for mean-field stochastic control problem", "n": "在 Wasserstein 空间上建立动态规划原理与 HJB 方程的粘性解理论，解决了以分布为状态时值函数的正则性问题。它是技术上的关键突破。", "k": 1, "v": "ESAIM: Control, Optimisation and Calculus of Variations"}, {"c": "Carmona & Delarue (2018)", "t": "Probabilistic Theory of Mean Field Games with Applications I–II", "n": "两卷本系统处理平均场博弈与平均场控制的概率方法，包含前后向随机微分方程与主方程。它是该领域的标准参考书。", "v": "Springer（两卷本专著）"}, {"c": "Carmona, Laurière & Tan (2023)", "t": "Model-free mean-field reinforcement learning: mean-field MDP and mean-field Q-learning", "n": "把马尔可夫决策过程提升到概率测度空间，定义平均场 MDP 与相应的 Q 学习并证明收敛。它给出了无模型平均场控制的理论基础。", "k": 1, "v": "Annals of Applied Probability"}, {"c": "Gu, Guo, Wei & Xu (2021)", "t": "Mean-field controls with Q-learning for cooperative MARL: convergence and complexity analysis", "n": "给出合作型多智能体问题的平均场 Q 学习算法、收敛性与复杂度分析，并给出有限主体近似的误差率。它把理论与多智能体强化学习实践连接起来。", "k": 1, "v": "SIAM Journal on Mathematics of Data Science"}, {"c": "Motte & Pham (2022)", "t": "Mean-field Markov decision processes with common noise and open-loop controls", "n": "处理存在共同噪声（所有主体共享的随机冲击）的情形并给出动态规划刻画。共同噪声是金融与流行病等现实系统的关键特征。", "v": "Annals of Applied Probability"}, {"c": "Angiuli, Fouque & Laurière (2022)", "t": "Unified reinforcement Q-learning for mean field game and control problems", "n": "用两个时间尺度的 Q 学习统一求解平均场博弈与平均场控制，只需调整学习率之比即可在两种解概念间切换。它清晰地展示了二者的关系。", "k": 1, "v": "Mathematics of Control, Signals, and Systems"}, {"c": "Cui & Koeppl (2021)", "t": "Approximately solving mean field games via entropy-regularized deep reinforcement learning", "n": "用熵正则化改善平均场问题中不动点迭代的稳定性，并给出深度实现。它解决了平均场学习中常见的振荡问题。", "v": "AISTATS 2021"}, {"c": "Laurière, Perrin, Élie, Pérolat, Pietquin et al. (2022)", "t": "Scalable deep reinforcement learning algorithms for mean field games", "n": "给出可扩展的深度算法（虚拟博弈与镜像下降的深度版本）及其收敛依据，使平均场方法能处理高维状态空间。", "v": "ICML 2022"}], "people": [{"n": "René Carmona & François Delarue（Princeton／Nice）", "r": "平均场控制与平均场博弈的严格区分；概率论方法的系统建立"}, {"n": "Pierre-Louis Lions（Collège de France）", "r": "测度空间上的导数概念，使 Wasserstein 空间上的 HJB 方程成为可能"}, {"n": "Huyên Pham（Paris Cité）", "r": "Wasserstein 空间上的动态规划与粘性解理论"}, {"n": "Xin Guo（Berkeley）", "r": "平均场控制的 Q 学习理论、收敛性与有限主体近似误差"}, {"n": "Mathieu Laurière（NYU 上海）", "r": "无模型平均场强化学习；统一求解博弈与控制的算法"}, {"n": "Alain Bensoussan（UT Dallas）", "r": "平均场型控制的最大值原理与早期系统化"}, {"n": "Jean-Pierre Fouque（UCSB）", "r": "两时间尺度 Q 学习统一平均场博弈与控制"}, {"n": "Heinz Koeppl & Kai Cui（TU Darmstadt）", "r": "熵正则化的深度平均场学习"}]}];

    if (!n) return;
    current = id;
    panel.setAttribute("data-p", n.pillar);
    var path = [], p = n.p;
    while (p) { path.unshift(p); p = byid[p].p; }

    var h = "";
    if (path.length) h += '<p class="crumb">' + path.map(function (q) {
      var m = byid[q]; return esc((m.num ? m.num + " " : "") + m.name);
    }).join(" › ") + "</p>";
    var kind = { leaf: "研究方向", group: "方向组", branch: "分支", root: "总纲" }[n.kind] || "方向组";
    if (n.num) h += '<p class="p-num">' + esc(n.num) + "</p>";
    h += '<h2 class="p-title">' + esc(n.name) + ' <span class="p-kind">' + kind + "</span></h2>";

    if (n.summary) h += sec(n.kind === "leaf" ? "研究内容" : "方向说明", "<p>" + esc(n.summary) + "</p>");
    if (n.why) h += sec("要点", '<div class="why"><p>' + esc(n.why) + "</p></div>");
    if (n.extra) h += sec("补充说明", "<p>" + esc(n.extra) + "</p>");

    if (n.phases) h += sec("发展脉络", '<ol class="phl">' + n.phases.map(function (x) {
      return '<li class="ph"><span class="ph-t">' + esc(x.t) + '</span><span class="ph-d">' + esc(x.d) + "</span></li>";
    }).join("") + "</ol>");

    if (n.papers) h += sec("代表性论文", '<ol class="ppl">' + n.papers.map(function (x) {
      return '<li class="pp' + (x.k ? " key" : "") + '">' +
        '<span class="pp-c">' + esc(x.c) + "</span>" +
        '<span class="pp-v">' + esc(x.v) + "</span>" +
        '<span class="pp-t">' + esc(x.t) + "</span>" +
        '<p class="pp-n">' + esc(x.n) + "</p></li>";
    }).join("") + "</ol>");

    if (n.people) h += sec("代表学者与代表性结果", '<ul class="pel">' + n.people.map(function (x) {
      return '<li class="pe"><span class="pe-n">' + esc(x.n) + '</span><span class="pe-r">' + esc(x.r) + "</span></li>";
    }).join("") + "</ul>");

    var ch = kids[id] || [];
    if (ch.length) h += sec("下级节点", '<div class="kids">' + ch.map(function (c) {
      var q = byid[c];
      return '<button class="kid" type="button" data-go="' + c + '">' +
        (q.num ? '<span class="kn">' + esc(q.num) + "</span>" : "") + esc(q.name) + "</button>";
    }).join("") + "</div>");

    var li = LEAVES.indexOf(id);
    var prev = li > 0 ? LEAVES[li - 1] : null;
    var next = li >= 0 ? (li < LEAVES.length - 1 ? LEAVES[li + 1] : null) : LEAVES[0];
    h += '<nav class="nav">' +
      '<button type="button" data-go="' + (prev || "") + '"' + (prev ? "" : " disabled") + '>← ' +
      (prev ? esc((byid[prev].num || "") + " " + byid[prev].name) : "") + "</button>" +
      '<button type="button" data-go="' + (next || "") + '"' + (next ? "" : " disabled") + '>' +
      (next ? esc((byid[next].num || "") + " " + byid[next].name) : "") + " →</button></nav>";

    panel.innerHTML = h;
    panel.scrollTop = 0;
    if (history.replaceState) history.replaceState(null, "", "#" + id);
  }

  function snippet(id, q) {
    var raw = IDX[id].raw, i = IDX[id].low.indexOf(q);
    if (i < 0) return "";
    var a = Math.max(0, i - 32), b = Math.min(raw.length, i + q.length + 56);
    return (a > 0 ? "…" : "") + raw.slice(a, b).replace(/\s+/g, " ") + (b < raw.length ? "…" : "");
  }

  function showResults(q) {
    var hits = filter.map(function (id) {
      var n = byid[id], path = [], p = n.p;
      while (p) { path.unshift(byid[p].name); p = byid[p].p; }
      return '<li class="rs"><button type="button" data-go="' + id + '">' +
        '<span class="rs-p">' + esc(path.join(" › ")) + "</span>" +
        '<span class="rs-n">' + esc((n.num ? n.num + " " : "") + n.name) + "</span>" +
        '<span class="rs-s">' + esc(snippet(id, q)) + "</span></button></li>";
    }).join("");
    panel.setAttribute("data-p", "root");
    panel.innerHTML = '<p class="p-num">检索</p><h2 class="p-title">' + esc(box.value) +
      ' <span class="p-kind">' + filter.length + " 个节点命中</span></h2>" +
      (filter.length ? '<ul class="rsl">' + hits + "</ul>" : '<p class="none">没有匹配的节点。</p>');
    panel.scrollTop = 0;
  }

  function search() {
    var q = box.value.trim().toLowerCase();
    if (!q) { filter = null; draw(); if (current) render(current); return; }
    filter = NODES.filter(function (n) { return IDX[n.id].low.indexOf(q) >= 0; }).map(function (n) { return n.id; });
    collapsed = {};
    draw();
    showResults(q);
  }

  function expandTo(id) { var p = byid[id].p; while (p) { delete collapsed[p]; p = byid[p].p; } }
  function pick(id) {
    if (!byid[id]) return;
    expandTo(id); render(id); draw();
    if (window.matchMedia("(max-width:1240px)").matches) panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  svg.addEventListener("click", function (e) {
    var tg = up(e.target, function (x) { return x.getAttribute && x.getAttribute("data-tog"); });
    if (tg) {
      var tid = tg.getAttribute("data-tog");
      if (collapsed[tid]) delete collapsed[tid]; else collapsed[tid] = 1;
      draw(); return;
    }
    var g = up(e.target, function (x) { return x.getAttribute && x.getAttribute("data-id"); });
    if (g) pick(g.getAttribute("data-id"));
  });
  svg.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var g = up(e.target, function (x) { return x.getAttribute && x.getAttribute("data-id"); });
    if (g) { e.preventDefault(); pick(g.getAttribute("data-id")); }
  });
  panel.addEventListener("click", function (e) {
    var b = e.target;
    while (b && b !== panel && !(b.getAttribute && b.getAttribute("data-go"))) b = b.parentNode;
    if (b && b !== panel && b.getAttribute("data-go")) pick(b.getAttribute("data-go"));
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    var li = LEAVES.indexOf(current);
    if (e.key === "ArrowDown") { e.preventDefault(); pick(li < 0 ? LEAVES[0] : LEAVES[Math.min(li + 1, LEAVES.length - 1)]); }
    if (e.key === "ArrowUp" && li > 0) { e.preventDefault(); pick(LEAVES[li - 1]); }
  });
  box.addEventListener("input", search);
  box.addEventListener("keydown", function (e) { if (e.key === "Escape") { box.value = ""; search(); } });

  function collapseAtDepth(d) {
    collapsed = {};
    if (d) NODES.forEach(function (n) { if (n._d === d && (kids[n.id] || []).length) collapsed[n.id] = 1; });
    draw();
  }
  document.getElementById("expandAll").addEventListener("click", function () { collapseAtDepth(0); });
  document.getElementById("mainOnly").addEventListener("click", function () { collapseAtDepth(3); });
  document.getElementById("groupsOnly").addEventListener("click", function () { collapseAtDepth(2); });
  document.getElementById("collapseAll").addEventListener("click", function () { collapseAtDepth(1); });

  NODES.forEach(function (n) { if (n._d === 3 && (kids[n.id] || []).length) collapsed[n.id] = 1; });
  var start = (location.hash || "").slice(1);
  if (!byid[start]) start = "root";
  expandTo(start); render(start); draw();
})();

</script>
</body></html>
