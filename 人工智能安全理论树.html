l. (2024)", "t": "Is DPO superior to PPO for LLM alignment? A comprehensive study", "n": "系统比较后指出 DPO 易被分布外响应误导：它可能给训练数据中未出现的差回答分配高概率，而在线方法不会。它纠正了 DPO 全面优于 PPO 的流行看法。", "k": 1, "v": "ICML 2024"}, {"c": "Tajwar, Singh, Sharma, Rafailov, Schneider, Xie, Ermon, Finn & Kumar (2024)", "t": "Preference fine-tuning of LLMs should leverage suboptimal, on-policy data", "n": "从理论与实验两面说明，用当前策略自己采样的数据做偏好微调显著优于纯离线数据，并解释了原因在于负梯度对错误模式的针对性。", "k": 1, "v": "ICML 2024"}, {"c": "Rafailov, Chittepu, Park, Sikchi, Hejna, Knox, Finn & Niekum (2024)", "t": "Scaling laws for reward model overoptimization in direct alignment algorithms", "n": "证明直接对齐算法同样存在奖励过优化，并给出其随 KL 预算变化的标度律。它说明去掉奖励模型并未去掉过优化问题。", "k": 1, "v": "NeurIPS 2024"}, {"c": "Meng, Xia & Chen (2024)", "t": "SimPO: simple preference optimization with a reference-free reward", "n": "用长度归一化的平均对数概率作隐式奖励，去掉参考模型并消除长度偏置，在多个基准上超过 DPO。它揭示了 DPO 目标中长度项的影响。", "v": "NeurIPS 2024"}, {"c": "Xiong, Dong, Ye, Wang, Zhong, Jiang & Zhang (2024)", "t": "Iterative preference learning from human feedback: bridging theory and practice for RLHF under KL-constraint", "n": "给出在线迭代 DPO 的理论框架与遗憾分析，说明迭代采样如何恢复覆盖并给出收敛保证。它连接了直接方法与偏好强化学习理论。", "k": 1, "v": "ICML 2024"}, {"c": "Gao, Schulman & Hilton (2023)", "t": "Scaling laws for reward model overoptimization", "n": "给出代理奖励与真实奖励随 KL 距离背离的经验标度律，是所有过优化研究的参照系与度量方式来源。", "v": "ICML 2023"}], "people": [{"n": "Rafael Rafailov、Chelsea Finn & Stefano Ermon（Stanford）", "r": "直接偏好优化（DPO）；直接对齐算法的过优化标度律"}, {"n": "Mohammad Gheshlaghi Azar、Rémi Munos & Bilal Piot（DeepMind）", "r": "偏好学习的统一理论范式与 IPO——指出并修正 DPO 的无界外推"}, {"n": "Douwe Kiela & Dan Jurafsky（Stanford／Contextual）", "r": "KTO——用前景理论效用替代 Bradley–Terry"}, {"n": "Aviral Kumar（CMU／DeepMind）", "r": "论证在线策略数据对偏好微调的必要性"}, {"n": "张潼 Tong Zhang & Wei Xiong（UIUC）", "r": "迭代／在线 DPO 的理论框架与遗憾分析"}, {"n": "陈丹琦 Danqi Chen（Princeton）", "r": "SimPO——去参考模型与长度偏置的分析"}, {"n": "John Schulman & Leo Gao（OpenAI）", "r": "奖励过优化的标度律；PPO 与 RLHF 的工程范式"}]}, {"id": "C", "p": "root", "num": "三", "name": "可控 Controllability", "kind": "branch", "pillar": "iii", "summary": "研究大量人和智能体相互作用形成的复杂动态系统是否会失稳，以及如何干预。", "extra": "提问对象再次放大：从「一个模型 + 一群人」变成「一群会学习的主体 + 一个动态系统」。这一支的数学来源不再是统计学习理论，而是博弈论、动力系统与随机控制。它的核心发现是反直觉的：即使每个个体都在做完全合理的学习，群体层面也可能永不收敛，甚至进入混沌——因此可控不是个体可信的简单叠加，而是一个独立的系统性质。"}, {"id": "C1", "p": "C", "num": "1", "name": "多主体交互与群体演化理论", "kind": "group", "pillar": "iii", "summary": "研究多个自主决策主体相互学习和博弈后，群体行为如何形成。", "extra": "三个子方向按系统规模递进：无状态的重复博弈（学习动力学与均衡的对应）、有状态转移的随机博弈（多智能体强化学习的样本复杂度）、以及主体数趋于无穷时用群体分布近似的平均场极限。规模变大反而使问题在某种意义上变简单——平均场极限消除了个体间的复杂耦合，这是处理大规模智能体系统的主要数学出路。"}, {"id": "C11", "p": "C1", "num": "1.1", "name": "博弈学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究理性主体采用学习算法反复博弈时是否以及如何收敛到均衡，核心是无悔学习与各类均衡概念之间的对应关系。", "why": "这个方向的中心结论是一组对应与一组不可能性：所有主体各自使用无外部后悔算法，其经验分布收敛到粗相关均衡；使用无交换后悔算法则收敛到相关均衡。但纳什均衡不在此列——它既计算困难，也没有自然的分布式学习动力学能普遍到达。这直接说明用纳什均衡预测多智能体系统的行为是不恰当的。", "phases": [{"t": "虚拟博弈与后悔的起源（1951–1997）", "d": "虚拟博弈被证明在零和与某些特殊结构的博弈中收敛，但在一般博弈中可能循环。Hannan 一致性（即无外部后悔）的概念被提出，为「学习不必知道对手、只需不后悔」这一分布式思路奠定基础。"}, {"t": "无悔与均衡的对应（1997–2007）", "d": "证明简单的自适应过程（后悔匹配）能使联合经验分布收敛到相关均衡；乘性权重算法在零和博弈中使平均策略收敛到极小极大值。随后建立外部后悔到内部／交换后悔的一般转换，完成了「后悔类型 ↔ 均衡类型」的对应表。"}, {"t": "负面结果（2003–2009）", "d": "证明不存在自然的无耦合动力学能在所有博弈中收敛到纳什均衡；纳什均衡的计算被证明是 PPAD 完全的，因而在复杂性意义上不可行。这两条结果共同把研究目标从纳什移向相关均衡与粗相关均衡。"}, {"t": "动力学的几何刻画（2018–2021）", "d": "发现零和博弈中连续时间无悔学习是保守系统，产生庞加莱回复——轨迹永远绕圈而非收敛；乘性权重在零和博弈中甚至发散到边界。相应地出现乐观镜像下降等具有最后迭代收敛保证的方法，把「平均收敛」升级为「实际轨迹收敛」。"}, {"t": "不可能性的普遍化（2023– ）", "d": "证明任何满足自然性质的博弈动力学都不可能在所有博弈中收敛到纳什均衡，极限环与混沌是不可避免的。这为「多智能体系统能否被引导到预期均衡」给出了否定性的一般答案。"}], "papers": [{"c": "Hart & Mas-Colell (2000)", "t": "A simple adaptive procedure leading to correlated equilibrium", "n": "给出后悔匹配这一极简的分布式规则，证明所有人都用它时联合经验分布收敛到相关均衡集。它确立了「无悔学习产生均衡」这一整个方向的核心范式。", "k": 1, "v": "Econometrica"}, {"c": "Freund & Schapire (1999)", "t": "Adaptive game playing using multiplicative weights", "n": "证明乘性权重算法在零和博弈中使双方平均策略收敛到极小极大值，从而给出冯·诺依曼极小极大定理的一个学习论证明。它连接了在线学习与博弈论。", "k": 1, "v": "Games and Economic Behavior"}, {"c": "Blum & Mansour (2007)", "t": "From external to internal regret", "n": "给出把任意无外部后悔算法转换为无内部后悔算法的一般归约，从而使收敛到相关均衡（而非仅粗相关均衡）成为可能。它补全了后悔与均衡的对应表。", "v": "JMLR"}, {"c": "Hart & Mas-Colell (2003)", "t": "Uncoupled dynamics do not lead to Nash equilibrium", "n": "证明如果每个主体的调整规则只依赖自己的收益函数（无耦合），则不存在能在所有博弈中收敛到纳什均衡的连续时间动力学。这是纳什作为学习目标的第一个否定结果。", "k": 1, "v": "American Economic Review"}, {"c": "Daskalakis, Goldberg & Papadimitriou (2009)", "t": "The complexity of computing a Nash equilibrium", "n": "证明计算纳什均衡是 PPAD 完全的，因而在合理的复杂性假设下没有高效算法。它使「纳什均衡是行为的合理预测」这一经济学基本假设在计算上站不住脚，获哥德尔奖。", "k": 1, "v": "SIAM Journal on Computing（哥德尔奖）"}, {"c": "Mertikopoulos, Papadimitriou & Piliouras (2018)", "t": "Cycles in adversarial regularized learning", "n": "证明零和博弈中连续时间的正则化学习是保守（哈密顿）系统，轨迹呈庞加莱回复而非收敛。它解释了为什么 GAN 等对抗训练会持续振荡。", "k": 1, "v": "SODA 2018"}, {"c": "Bailey & Piliouras (2018)", "t": "Multiplicative weights update in zero-sum games (EC)", "n": "证明离散时间的乘性权重在零和博弈中不仅不收敛，还会发散到策略单纯形的边界。它说明离散化本身会引入新的不稳定性。", "v": "ACM EC 2018"}, {"c": "Daskalakis & Panageas (2019)", "t": "Last-iterate convergence: zero-sum games and constrained min-max optimization", "n": "证明乐观镜像下降等方法具有最后迭代收敛性，即实际策略而非时间平均收敛到均衡。这对训练生成模型这类需要最终参数的场景至关重要。", "k": 1, "v": "ITCS 2019"}, {"c": "Brown & Sandholm (2019)", "t": "Superhuman AI for multiplayer poker", "n": "用反事实后悔最小化在六人德州扑克上达到超人水平，证明无悔学习范式能扩展到极大规模的不完美信息博弈。它是该理论最有说服力的实证顶点。", "v": "Science"}, {"c": "Milionis, Papadimitriou, Piliouras & Spendlove (2023)", "t": "An impossibility theorem in game dynamics", "n": "用微分拓扑证明任何满足合理性质的博弈动力学都必然在某些博弈中不收敛到纳什均衡。这把此前的具体反例提升为一般不可能性定理。", "k": 1, "v": "PNAS"}], "people": [{"n": "Sergiu Hart & Andreu Mas-Colell", "r": "后悔匹配与相关均衡的自适应达成；无耦合动力学不可能收敛到纳什"}, {"n": "Christos Papadimitriou（Columbia）", "r": "纳什均衡的 PPAD 完全性；博弈动力学的不可能性定理"}, {"n": "Constantinos Daskalakis（MIT）", "r": "纳什计算复杂性；极小极大优化的最后迭代收敛"}, {"n": "Georgios Piliouras（SUTD／DeepMind）", "r": "学习动力学的庞加莱回复、极限环与混沌；博弈动力学不可能性"}, {"n": "Yoav Freund & Robert Schapire", "r": "乘性权重与零和博弈的学习论证明；AdaBoost"}, {"n": "Avrim Blum（TTIC）", "r": "外部后悔到内部后悔的一般转换"}, {"n": "Noam Brown & Tuomas Sandholm（CMU）", "r": "反事实后悔最小化；扑克上的超人水平"}, {"n": "Panayotis Mertikopoulos（CNRS）", "r": "连续时间学习动力学的几何与收敛分析"}]}, {"id": "C12", "p": "C1", "num": "1.2", "name": "随机博弈与多智能体强化学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究具有动态状态转移的多主体系统中的学习、均衡与样本复杂度，即把单体强化学习推广到多个同时学习的主体。", "why": "两个结构性困难主导了这个方向：一是非平稳性——其他主体也在学习，每个主体面对的环境不断变化，单体强化学习的收敛保证全部失效；二是维数灾难——联合动作空间随主体数指数增长。近年最重要的突破正是绕开这两点：放弃纳什而求粗相关均衡，并用去中心化的无悔学习避免枚举联合动作。", "phases": [{"t": "随机博弈的提出（1953）", "d": "随机博弈被定义为状态在博弈过程中随机转移的多人博弈，并证明折扣零和随机博弈的值存在。这个模型比马尔可夫决策过程早出现，是多智能体强化学习的数学母体。"}, {"t": "早期多智能体强化学习（1994–2003）", "d": "把 Q 学习推广到马尔可夫博弈：零和情形用极小极大算子替换最大值算子，收敛性可证；一般和情形试图用纳什算子，但收敛只在极强的假设下成立。这一时期确立了问题设定，也暴露了一般和情形的困难。"}, {"t": "负面结果（2006）", "d": "证明一大类基于值迭代的算法不能收敛到平稳纳什均衡，它们收敛到的是循环均衡。这说明困难不在于算法设计不够精巧，而在于目标本身选错了。"}, {"t": "深度多智能体强化学习（2016–2020）", "d": "集中训练分散执行、值分解、多智能体策略梯度等方法在星际争霸等基准上取得成功，但理论几乎空白——大多数方法没有收敛保证，效果依赖大量工程调优。"}, {"t": "样本复杂度理论的建立（2020–2023）", "d": "两人零和马尔可夫博弈的近最优样本复杂度被确定。更关键的是，对一般和情形放弃纳什改求粗相关均衡后，去中心化的无悔学习可以用关于主体数多项式的样本达成，从根本上避开了联合动作空间的指数爆炸。随后又证明马尔可夫型的粗相关均衡计算仍是困难的，从而精确划定了什么目标可达。"}], "papers": [{"c": "Shapley (1953)", "t": "Stochastic games", "n": "提出随机博弈模型并证明折扣零和情形值的存在性。它比马尔可夫决策过程更早，是多智能体序贯决策的数学起点。", "k": 1, "v": "PNAS"}, {"c": "Littman (1994)", "t": "Markov games as a framework for multi-agent reinforcement learning", "n": "把 Q 学习推广到零和马尔可夫博弈，用极小极大算子替换最大化算子并给出收敛性。它定义了多智能体强化学习这一研究领域。", "k": 1, "v": "ICML 1994"}, {"c": "Hu & Wellman (2003)", "t": "Nash Q-learning for general-sum stochastic games", "n": "把纳什算子引入 Q 学习以处理一般和博弈，但收敛条件要求每阶段博弈的均衡唯一，实际几乎不成立。它既是重要尝试也暴露了路线的根本困难。", "v": "JMLR"}, {"c": "Zinkevich, Greenwald & Littman (2006)", "t": "Cyclic equilibria in Markov games", "n": "证明一大类基于值的多智能体算法不可能收敛到平稳纳什均衡，它们收敛到的是循环均衡。这一负面结果终结了当时的主流路线。", "k": 1, "v": "NeurIPS 2006"}, {"c": "Bai & Jin (2020)", "t": "Provable self-play algorithms for competitive reinforcement learning", "n": "给出零和马尔可夫博弈中自博弈算法的样本复杂度上界，是深度学习时代第一批有严格保证的多智能体强化学习结果。", "v": "ICML 2020"}, {"c": "Liu, Yu, Bai & Jin (2021)", "t": "A sharp analysis of model-based reinforcement learning with self-play", "n": "给出两人零和马尔可夫博弈近最优的样本复杂度，基本关闭了这一基础设定的理论问题。", "v": "ICML 2021"}, {"c": "Jin, Liu, Wang & Yu (2021)", "t": "V-learning: a simple, efficient, decentralized algorithm for multiagent reinforcement learning", "n": "用去中心化的无悔学习求粗相关均衡，样本复杂度只与单个主体的动作数相关而非联合动作空间。它是绕开多智能体维数灾难的关键突破。", "k": 1, "v": "arXiv 2021 / Mathematics of Operations Research 2024"}, {"c": "Daskalakis, Golowich & Zhang (2023)", "t": "The complexity of Markov equilibrium in stochastic games", "n": "证明在一般和马尔可夫博弈中计算马尔可夫型粗相关均衡是 PPAD 困难的，只有允许非马尔可夫（历史依赖）策略时才高效可达。它精确划定了可达目标的边界。", "k": 1, "v": "STOC 2023"}, {"c": "Zhang, Yang & Başar (2021)", "t": "Multi-agent reinforcement learning: a selective overview of theories and algorithms", "n": "系统梳理多智能体强化学习的理论谱系（零和、一般和、合作、平均场）与各自的收敛结果。它是该领域公认的权威综述。", "v": "Handbook of RL and Control（Springer）"}, {"c": "Rashid, Samvelyan, de Witt, Farquhar, Foerster & Whiteson (2018)", "t": "QMIX: monotonic value function factorisation", "n": "用单调的值分解实现集中训练、分散执行，在合作任务上成为长期基准。它代表了实践侧的主流范式，也提出了值分解表达能力这一理论问题。", "v": "ICML 2018 / JMLR 2020"}], "people": [{"n": "Lloyd Shapley", "r": "随机博弈模型与值的存在性"}, {"n": "Michael Littman（Brown）", "r": "马尔可夫博弈框架与 Minimax-Q"}, {"n": "金驰 Chi Jin（Princeton）", "r": "V-learning——去中心化学习避开联合动作空间的维数灾难"}, {"n": "Constantinos Daskalakis（MIT）", "r": "马尔可夫均衡的计算复杂性刻画"}, {"n": "Tamer Başar（UIUC）& Kaiqing Zhang（Maryland）", "r": "多智能体强化学习的理论体系与权威综述；去中心化 MARL 的收敛分析"}, {"n": "Yu Bai（Salesforce／OpenAI）", "r": "自博弈算法的可证明样本复杂度"}, {"n": "Shimon Whiteson（Oxford）", "r": "QMIX 与值分解范式"}, {"n": "Michael Wellman（Michigan）", "r": "一般和随机博弈的 Nash Q 学习；经验博弈论分析"}]}, {"id": "C13", "p": "C1", "num": "1.3", "name": "平均场博弈与平均场强化学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究主体数量巨大时，如何用群体分布近似个体之间的交互，从而把不可解的 N 体博弈化为一个个体对分布的最优反应加一个分布的一致性条件。", "why": "这是处理大规模智能体系统的核心数学出路。当主体同质且互相只通过群体分布发生作用时，N 趋于无穷的极限使问题从指数复杂降为两个耦合的偏微分方程（描述个体最优的 HJB 与描述群体演化的 Fokker–Planck）。有限 N 的纳什均衡收敛到这个极限，且误差以 1/√N 量级递减，这为「用宏观模型指导微观系统」提供了严格依据。", "phases": [{"t": "独立创立（2006–2007）", "d": "数学界与工程控制界同年独立提出同一框架：一边用耦合的 HJB–Fokker–Planck 方程组刻画极限均衡，另一边提出纳什确定性等价原理并给出 ε-纳什性质。两条线后来合流成为平均场博弈。"}, {"t": "数学基础的建立（2013–2019）", "d": "发展出概率方法（前后向随机微分方程）与主方程方法两套工具；证明了收敛问题——有限 N 人博弈的纳什均衡确实收敛到平均场极限，并给出收敛速率。这使平均场近似从启发式变成有严格依据的方法。"}, {"t": "与强化学习结合（2019–2022）", "d": "当模型未知时，用强化学习求解平均场均衡：虚拟博弈在单调性条件下被证明收敛，在线镜像下降给出可扩展的算法，Q 学习被推广到概率测度空间。这一阶段把平均场从解析工具变成了可学习的框架。"}, {"t": "放松同质性假设（2019– ）", "d": "现实中主体并不同质、交互也非全对全。图元博弈用图极限刻画异质的网络交互，主要主体加众多小主体的模型刻画平台与用户的不对称结构。这些推广正在把理论推向更接近真实系统的设定。"}], "papers": [{"c": "Lasry & Lions (2007)", "t": "Mean field games", "n": "用耦合的 HJB 与 Fokker–Planck 方程刻画无穷多同质主体的均衡，创立平均场博弈。它把不可解的 N 体博弈问题化为一对偏微分方程。", "k": 1, "v": "Japanese Journal of Mathematics"}, {"c": "Huang, Malhamé & Caines (2006)", "t": "Large population stochastic dynamic games: closed-loop McKean–Vlasov systems and the Nash certainty equivalence principle", "n": "在控制论框架下独立提出同一思想，给出纳什确定性等价原理，并证明基于极限解构造的策略在有限 N 时构成 ε-纳什均衡。它为工程应用提供了直接依据。", "k": 1, "v": "Communications in Information and Systems"}, {"c": "Cardaliaguet, Delarue, Lasry & Lions (2019)", "t": "The master equation and the convergence problem in mean field games", "n": "引入测度空间上的主方程并用它证明有限 N 人博弈的纳什均衡收敛到平均场解。它解决了该领域最重要的基础问题——极限的合法性。", "k": 1, "v": "Annals of Mathematics Studies（Princeton University Press）"}, {"c": "Carmona & Delarue (2018)", "t": "Probabilistic Theory of Mean Field Games with Applications", "n": "用前后向随机微分方程系统建立平均场博弈的概率论方法，并明确区分竞争型与合作型。它是该领域的标准参考书。", "v": "Springer（两卷本专著）"}, {"c": "Guo, Hu, Xu & Zhang (2019)", "t": "Learning mean-field games", "n": "给出模型未知时求解平均场均衡的强化学习算法与收敛性证明，是把平均场博弈学习化的开创工作。", "k": 1, "v": "NeurIPS 2019"}, {"c": "Perrin, Perolat, Laurière, Geist, Elie & Pietquin (2020)", "t": "Fictitious play for mean field games: continuous time analysis and applications", "n": "证明连续时间虚拟博弈在单调性条件下收敛到平均场均衡，给出第一个有全局收敛保证的学习算法。", "v": "NeurIPS 2020"}, {"c": "Perolat et al. (2022)", "t": "Scaling mean field games by online mirror descent", "n": "用在线镜像下降求解平均场均衡，收敛更快且能与深度网络结合，使平均场方法可用于大规模问题。", "v": "AAMAS 2022"}, {"c": "Yang, Luo, Li, Zhou, Zhang & Wang (2018)", "t": "Mean field multi-agent reinforcement learning", "n": "把每个主体与所有其他主体的交互近似为与邻居平均动作的交互，使多智能体 Q 学习的复杂度不随主体数增长。它是平均场思想在深度多智能体强化学习中的代表实现。", "k": 1, "v": "ICML 2018"}, {"c": "Parise & Ozdaglar (2023)", "t": "Graphon games: a statistical framework for network games and interventions", "n": "用图元刻画异质的网络交互结构，把平均场从全对全推广到任意稠密图极限，并研究干预设计。它放松了同质全连接这一最强的假设。", "v": "Econometrica"}, {"c": "Laurière, Perrin, Geist & Pietquin (2022)", "t": "Learning mean field games: a survey", "n": "系统梳理平均场博弈的学习方法（虚拟博弈、镜像下降、Q 学习、深度方法）及其收敛条件。它是进入这一交叉领域的标准入口。", "v": "arXiv 预印本"}], "people": [{"n": "Pierre-Louis Lions（Collège de France，菲尔兹奖）& Jean-Michel Lasry", "r": "平均场博弈的创立；测度空间上的微分与主方程"}, {"n": "Peter Caines & Minyi Huang（McGill／Carleton）", "r": "纳什确定性等价原理；有限 N 下的 ε-纳什性质"}, {"n": "René Carmona & François Delarue（Princeton／Nice）", "r": "平均场博弈的概率论方法与两卷本专著"}, {"n": "Pierre Cardaliaguet（Paris Dauphine）", "r": "主方程与收敛问题的解决"}, {"n": "Xin Guo（Berkeley）", "r": "平均场博弈与平均场控制的强化学习理论"}, {"n": "Olivier Pietquin、Matthieu Geist & Julien Perolat（DeepMind）", "r": "平均场博弈的可扩展学习算法（虚拟博弈、镜像下降）"}, {"n": "杨耀东 Yaodong Yang（北京大学）", "r": "平均场多智能体强化学习——把平均场近似引入深度 MARL"}, {"n": "Asuman Ozdaglar（MIT）", "r": "图元博弈——异质网络交互的极限刻画"}]}, {"id": "C2", "p": "C", "num": "2", "name": "系统稳定性与临界行为理论", "kind": "group", "pillar": "iii", "summary": "研究多主体学习系统何时保持稳定，以及何时出现突变、振荡或失稳。", "extra": "如果说上一组问「会收敛到哪里」，这一组问「会不会收敛、以及不收敛时是什么样子」。三个子方向依次是：把学习算法当作动力系统分析其不动点与稳定性；环境本身随时间变化时能否跟踪移动的均衡；以及参数变化如何导致系统从稳定经由分岔进入周期振荡与混沌。这一组的结论对 AI 安全最具警示性——不稳定不是工程缺陷，而是多主体学习的内在属性。"}, {"id": "C21", "p": "C2", "num": "2.1", "name": "学习动力学稳定性与收敛理论", "kind": "leaf", "pillar": "iii", "summary": "研究多主体策略更新所形成的动力系统是否收敛，以及它收敛到的不动点是否真的是均衡、是否稳定。", "why": "关键结构性发现是：多主体的梯度场一般不是任何函数的梯度，因此不存在可以单调下降的势函数。把博弈的雅可比矩阵分解后，对称部分对应可以下降的势博弈成分，反对称部分对应产生旋转的哈密顿成分——后者正是训练振荡的来源。更严重的是，梯度动力学的稳定吸引子可能根本不是纳什均衡，也就是说算法会稳定地停在一个没人满意的点上。", "phases": [{"t": "演化博弈动力学（1978–2003）", "d": "复制动力学被提出，把策略频率的演化写成常微分方程，并与演化稳定策略建立联系。此后发展出一整套population games的动力学理论，明确了势博弈、稳定博弈等可保证收敛的类别，以及一般博弈中循环与混沌的存在。"}, {"t": "随机逼近的桥梁（1990s–2000s）", "d": "证明带衰减步长的随机学习算法其渐近行为由对应的常微分方程的极限集决定。这使得离散的、随机的学习算法可以用连续动力系统的工具分析，是整个方向的方法论基础。"}, {"t": "局部均衡的微分刻画（2013–2016）", "d": "在连续动作空间上给出微分纳什均衡的一阶与二阶条件，使「均衡」成为可以用雅可比与海森矩阵检验的局部概念。这为后续把博弈学习当作动力系统分析铺平了道路。"}, {"t": "生成对抗训练推动的爆发（2017–2020）", "d": "GAN 训练不稳定使这一理论进入机器学习主流。博弈梯度场的哈密顿—势分解被提出，明确了旋转成分的来源并据此设计出抑制旋转的算法。同期证明梯度动力学的稳定吸引子未必是纳什均衡，揭示了一类此前未被认识的失败模式。"}, {"t": "可保证收敛的结构类（2021– ）", "d": "研究转向寻找具有良好收敛性的结构化子类：马尔可夫势博弈中独立策略梯度被证明全局收敛；单调博弈中乐观方法有最后迭代收敛率。思路是既然一般情形不可能，就刻画清楚哪些系统是可控的。"}], "papers": [{"c": "Taylor & Jonker (1978)", "t": "Evolutionarily stable strategies and game dynamics", "n": "提出复制动力学，把策略比例的演化写成微分方程并与演化稳定策略联系起来。它开创了用动力系统研究博弈的传统。", "k": 1, "v": "Mathematical Biosciences"}, {"c": "Hofbauer & Sigmund (2003)", "t": "Evolutionary game dynamics", "n": "系统梳理复制动力学、最优反应动力学等的收敛与不收敛结果，明确哪些博弈类别可保证收敛。它是该方向公认的权威综述。", "v": "Bulletin of the AMS"}, {"c": "Benaïm (1999)", "t": "Dynamics of stochastic approximation algorithms", "n": "证明随机逼近算法的渐近行为由对应常微分方程的内链回复集刻画。它把离散随机学习与连续动力系统严格连接，是整套分析方法的基础。", "k": 1, "v": "Séminaire de Probabilités XXXIII（Springer LNM）"}, {"c": "Ratliff, Burden & Sastry (2016)", "t": "On the characterization of local Nash equilibria in continuous games", "n": "给出微分纳什均衡的一阶与二阶充分条件，使连续博弈中的局部均衡可用雅可比与海森矩阵检验。它把博弈均衡变成可计算的局部性质。", "k": 1, "v": "IEEE Transactions on Automatic Control"}, {"c": "Mescheder, Nowozin & Geiger (2017)", "t": "The numerics of GANs", "n": "把 GAN 训练视为向量场的数值积分，用雅可比矩阵的特征值分析解释训练振荡，并提出一致最优化方法。它开启了用动力系统工具分析对抗训练的路线。", "v": "NeurIPS 2017"}, {"c": "Balduzzi, Racanière, Martens, Foerster, Tuyls & Graepel (2018)", "t": "The mechanics of n-player differentiable games", "n": "把博弈梯度场的雅可比分解为对称（势博弈）与反对称（哈密顿）两部分，指出后者产生旋转，并据此设计辛梯度调整算法。这是理解多主体不收敛最重要的结构性结果。", "k": 1, "v": "ICML 2018"}, {"c": "Letcher, Balduzzi, Racanière, Martens, Foerster, Tuyls & Graepel (2019)", "t": "Differentiable game mechanics", "n": "把上述分解发展为完整理论，给出各类算法在分解视角下的统一比较与收敛分析。", "v": "JMLR"}, {"c": "Mazumdar, Ratliff & Sastry (2020)", "t": "On gradient-based learning in continuous games", "n": "证明梯度动力学的稳定吸引子集合与纳什均衡集合一般不重合，存在稳定但非纳什的吸引子。它揭示了一类新的失败模式：算法稳定地收敛到没人满意的点。", "k": 1, "v": "SIAM Journal on Mathematics of Data Science"}, {"c": "Daskalakis & Panageas (2018)", "t": "The limit points of (optimistic) gradient descent in min-max optimization", "n": "刻画普通与乐观梯度下降在极小极大问题上的极限点集合，证明乐观版本排除了一大类非均衡吸引子。", "v": "NeurIPS 2018"}, {"c": "Leonardos, Overman, Panageas & Piliouras (2022)", "t": "Global convergence of multi-agent policy gradient in Markov potential games", "n": "证明在马尔可夫势博弈这一结构化类别中，独立策略梯度全局收敛到纳什均衡。它给出了「什么样的多智能体系统是可控的」的正面答案。", "k": 1, "v": "ICLR 2022"}], "people": [{"n": "Josef Hofbauer & Karl Sigmund（Vienna）", "r": "演化博弈动力学的系统理论"}, {"n": "William Sandholm（Wisconsin）", "r": "population games 与演化动力学的统一框架"}, {"n": "Michel Benaïm（Neuchâtel）", "r": "随机逼近的动力系统理论——离散学习与 ODE 的桥梁"}, {"n": "S. Shankar Sastry & Lillian Ratliff（Berkeley／UW）", "r": "微分纳什均衡的刻画；梯度动力学存在非纳什稳定吸引子"}, {"n": "David Balduzzi、Karl Tuyls & Thore Graepel（DeepMind）", "r": "可微博弈的哈密顿—势分解与辛梯度调整"}, {"n": "Constantinos Daskalakis & Ioannis Panageas", "r": "乐观方法的极限点刻画与最后迭代收敛"}, {"n": "Georgios Piliouras", "r": "马尔可夫势博弈中策略梯度的全局收敛；学习动力学的全局分析"}]}, {"id": "C22", "p": "C2", "num": "2.2", "name": "时变博弈与非平稳多主体学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究环境和其他主体持续变化时，系统能否跟踪不断移动的动态均衡，以及跟踪误差如何随变化速度增长。", "why": "这是「非平稳性是多智能体学习根本困难」这一直觉的严格版本。单体在线学习早已建立动态后悔理论——与逐时刻最优比较而非与固定最优比较，且最优率由环境的累积变化量决定。把它推广到博弈需要新的概念：不再是跟踪一个移动的最优点，而是跟踪一个移动的均衡集合，而均衡本身可能不唯一甚至不存在。", "phases": [{"t": "单体动态后悔的建立（2003–2018）", "d": "在线凸优化中提出动态后悔概念；随后引入变差预算刻画环境变化量并给出极小极大最优率；再进一步给出无需预知变化量的自适应算法与通用动态后悔的最优界。这套工具是整个方向的基础。"}, {"t": "时变博弈的形式化（2018–2023）", "d": "把博弈本身的收益函数设为随时间变化，定义均衡跟踪问题，证明当均衡的累积漂移次线性增长时，无悔学习能够跟踪到均衡序列，并给出跟踪误差与漂移量的定量关系。同期在对抗变化的零和博弈中提出以纳什值为基准的后悔概念。"}, {"t": "多智能体非平稳性的系统化（2017– ）", "d": "把「其他主体在学习」造成的非平稳性单独作为研究对象，梳理出建模对手、元学习、经验博弈分析等应对路线，并明确指出单体强化学习的收敛性证明在此全部失效。"}, {"t": "与非平稳强化学习合流（2021– ）", "d": "单体非平稳强化学习给出了无需预知变化预算的最优动态遗憾算法，这些技术正被移植到博弈设定。同时对时变博弈中无悔动力学的最后迭代行为与收敛速率给出更精细的刻画。"}, {"t": "大模型智能体生态（2023– ）", "d": "持续在线、互相影响、不断被更新的智能体群体是典型的时变博弈；模型的部署本身改变数据与用户行为（表演性效应）使非平稳性内生化。目前尚无适配这一设定的理论。"}], "papers": [{"c": "Zinkevich (2003)", "t": "Online convex programming and generalized infinitesimal gradient ascent", "n": "提出在线梯度下降并同时引入动态后悔概念——与逐时刻最优比较。它是所有非平稳在线学习与时变博弈研究的起点。", "k": 1, "v": "ICML 2003"}, {"c": "Besbes, Gur & Zeevi (2015)", "t": "Non-stationary stochastic optimization", "n": "引入变差预算刻画环境的累积变化量，给出动态后悔的极小极大率。它确立了「跟踪能力由变化速度决定」这一定量框架。", "k": 1, "v": "Operations Research"}, {"c": "张利军, 卢帅 & 周志华 (2018)", "t": "Adaptive online learning in dynamic environments", "n": "给出通用动态后悔的极小极大最优界，且算法无需事先知道变化量。它解决了此前方法必须预知变差预算这一实用障碍。", "k": 1, "v": "NeurIPS 2018"}, {"c": "Cardoso, Abernethy, Wang & Xu (2019)", "t": "Competing against Nash equilibria in adversarially changing zero-sum games", "n": "在收益矩阵被对抗性改变的零和博弈中，提出以每轮纳什值为基准的后悔概念并给出次线性算法。它是时变博弈中第一个恰当的性能度量。", "k": 1, "v": "ICML 2019"}, {"c": "Duvocelle, Mertikopoulos, Staudigl & Vermeulen (2023)", "t": "Multiagent online learning in time-varying games", "n": "定义均衡跟踪问题，证明当均衡序列的累积漂移次线性时无悔学习可跟踪到均衡，并给出跟踪误差的定量界。这是该方向的核心理论论文。", "k": 1, "v": "Mathematics of Operations Research"}, {"c": "Hernandez-Leal, Kaisers, Baarslag & de Cote (2017)", "t": "A survey of learning in multiagent environments: dealing with non-stationarity", "n": "系统梳理多智能体非平稳性的来源与应对策略，指出单体强化学习收敛保证在此全部失效。它是这一问题意识的标准参考。", "v": "arXiv 预印本"}, {"c": "Wei & Luo (2021)", "t": "Non-stationary reinforcement learning without prior knowledge: an optimal black-box approach", "n": "给出把任意平稳强化学习算法转为非平稳最优算法的黑箱归约，无需预知变化预算。它是单体非平稳强化学习的最优解，并可迁移到博弈设定。", "k": 1, "v": "COLT 2021"}, {"c": "Anagnostides, Panageas, Farina & Sandholm (2022)", "t": "On last-iterate convergence beyond zero-sum games", "n": "把最后迭代收敛的分析推广到零和之外的博弈类别，给出收敛速率。它填补了时变与一般博弈中轨迹行为的理论空白。", "v": "ICML 2022"}, {"c": "Mertikopoulos & Zhou (2019)", "t": "Learning in games with continuous action sets and unknown payoff functions", "n": "在连续动作空间与未知收益的设定下给出对偶平均类算法的收敛条件，是把博弈学习推向现实信息条件的关键工作。", "v": "Mathematical Programming"}, {"c": "赵鹏, 张宇辉, 张利军 & 周志华 (2020, 2024)", "t": "Dynamic regret of convex and smooth functions / Non-stationary online learning: a comprehensive survey", "n": "把动态后悔从一般凸推广到光滑函数与赌博机反馈，并系统化整个非平稳在线学习的理论体系。它是该方向目前最完整的综述。", "v": "NeurIPS 2020 / arXiv 综述 2024"}], "people": [{"n": "Martin Zinkevich", "r": "在线凸优化与动态后悔概念"}, {"n": "Omar Besbes（Columbia）", "r": "变差预算下非平稳优化的极小极大率"}, {"n": "周志华、张利军、赵鹏（南京大学 LAMDA）", "r": "通用动态后悔的最优界与自适应算法——该方向的世界主要中心"}, {"n": "Panayotis Mertikopoulos（CNRS）", "r": "时变博弈中的均衡跟踪理论"}, {"n": "Jacob Abernethy（Georgia Tech）", "r": "对抗变化零和博弈中的纳什后悔概念"}, {"n": "Chen-Yu Wei & Haipeng Luo（Virginia／USC）", "r": "非平稳强化学习的最优黑箱归约"}, {"n": "Tuomas Sandholm & Gabriele Farina（CMU／MIT）", "r": "一般博弈中无悔动力学的最后迭代收敛速率"}, {"n": "Karl Tuyls（DeepMind）", "r": "多智能体非平稳性的系统化与经验博弈论分析"}]}, {"id": "C23", "p": "C2", "num": "2.3", "name": "非平衡、分岔与混沌学习动力学", "kind": "leaf", "pillar": "iii", "summary": "研究参数（学习率、主体数、耦合强度）变化是否导致系统从稳定状态发生相变、周期振荡或混沌，以及这种不可预测性有多普遍。", "why": "这个方向给出了整棵树上对 AI 安全最有警示意义的结论：在随机生成的多人博弈中，随着主体数增加，混沌是常态而非例外；即使最简单的两人博弈配上最简单的学习规则，增大学习率也会经由倍周期分岔进入混沌。这意味着大规模智能体系统的长期行为在原理上不可预测，可控性必须建立在别的机制上，而不能指望系统自己收敛。", "phases": [{"t": "发现混沌（2002）", "d": "证明两个玩家用最简单的强化学习反复玩一个类似石头剪刀布的博弈就会产生混沌轨道，且轨道的李雅普诺夫指数为正。这个极简反例说明混沌不需要复杂的模型或大量主体。"}, {"t": "复杂博弈中的普遍性（2013）", "d": "在随机生成的复杂博弈中系统研究学习动力学，发现当收益的耦合与不对称程度增大时，混沌成为主导行为，收敛反而是特例。这把混沌从奇异反例提升为一般现象。"}, {"t": "学习率导致的分岔（2017–2020）", "d": "证明在拥塞博弈中乘性权重算法随着步长增大依次经历收敛、极限环、倍周期分岔直到李–约克混沌。这个结果的意义在于：混沌不是博弈的性质而是学习算法参数的性质，同一个系统调大学习率就会失稳。"}, {"t": "守恒结构与回复（2018）", "d": "证明零和博弈中连续时间正则化学习保有一个守恒量，因而轨迹呈庞加莱回复——永远回到初始状态附近而不收敛。这从结构上解释了对抗训练的持续振荡。"}, {"t": "主体数与混沌的普遍性（2018–2023）", "d": "在随机多人博弈中证明玩家数增多时混沌的出现概率趋近于一，且这一结论对多种学习规则稳健。最终一般性的不可能性定理证明：没有任何满足自然性质的动力学能在所有博弈中收敛。"}], "papers": [{"c": "Sato, Akiyama & Farmer (2002)", "t": "Chaos in learning a simple two-person game", "n": "证明两个主体用最简单的强化学习玩非零和的石头剪刀布类博弈即产生混沌。这个极简反例说明不可预测性不需要复杂系统，是该方向的引爆点。", "k": 1, "v": "PNAS"}, {"c": "Galla & Farmer (2013)", "t": "Complex dynamics in learning complicated games", "n": "在随机生成的复杂博弈中系统刻画学习动力学的相图，发现收益耦合与不对称增大时混沌成为主导。它把混沌从个例提升为普遍现象。", "k": 1, "v": "PNAS"}, {"c": "Palaiopanos, Panageas & Piliouras (2017)", "t": "Multiplicative weights update with constant step-size in congestion games: convergence, limit cycles and chaos", "n": "证明同一个拥塞博弈中，随着学习率增大系统依次经历收敛、极限环、倍周期分岔到李–约克混沌。它说明失稳可以纯粹由算法超参数引起。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Mertikopoulos, Papadimitriou & Piliouras (2018)", "t": "Cycles in adversarial regularized learning", "n": "证明零和博弈的连续时间正则化学习是保守系统，存在守恒量因而轨迹庞加莱回复。它给出对抗训练不收敛的结构性解释。", "k": 1, "v": "SODA 2018"}, {"c": "Bailey & Piliouras (2018)", "t": "Multiplicative weights update in zero-sum games", "n": "证明离散时间乘性权重在零和博弈中发散到单纯形边界，与连续时间的回复行为形成对照。它说明离散化本身引入了额外的不稳定。", "v": "ACM EC 2018"}, {"c": "Sanders, Farmer & Galla (2018)", "t": "The prevalence of chaotic dynamics in games with many players", "n": "证明在随机生成的多人博弈中，玩家数增加时出现混沌的概率趋于一。它是「大规模智能体系统会自发稳定」这一直觉最强的反驳。", "k": 1, "v": "Scientific Reports"}, {"c": "Chotibut, Falniowski, Misiurewicz & Piliouras (2020)", "t": "The route to chaos in routing games", "n": "在路由博弈中精确刻画从稳定到混沌的完整分岔路径，并给出解析的分岔点。它把混沌的出现变成可以定量预测的现象。", "v": "NeurIPS 2020"}, {"c": "Pangallo, Heinrich & Farmer (2019)", "t": "Best reply structure and equilibrium convergence in generic games", "n": "证明最优反应图的循环结构决定了学习是否收敛，给出可从收益矩阵直接判断的指标。它为「哪些博弈会失稳」提供了可操作的判据。", "v": "Science Advances"}, {"c": "Milionis, Papadimitriou, Piliouras & Spendlove (2023)", "t": "An impossibility theorem in game dynamics", "n": "用微分拓扑证明任何满足自然性质的博弈动力学都必然在某些博弈中不收敛到纳什均衡。它把此前的具体反例提升为一般定理。", "k": 1, "v": "PNAS"}, {"c": "Skyrms (1992)", "t": "Chaos and the explanatory significance of equilibrium", "n": "从科学哲学角度提出：如果学习动力学不收敛，用均衡解释和预测行为的整套方法论就需要重新审视。这个警告先于技术结果三十年。", "v": "PSA: Philosophy of Science Association"}], "people": [{"n": "J. Doyne Farmer（Oxford INET）", "r": "博弈学习中的混沌；随机博弈中混沌的普遍性；复杂经济学"}, {"n": "Tobias Galla（Manchester／IFISC）", "r": "用统计物理方法刻画复杂博弈中学习动力学的相图"}, {"n": "Georgios Piliouras（SUTD／DeepMind）", "r": "学习率导致的倍周期分岔与混沌；庞加莱回复；博弈动力学不可能性定理"}, {"n": "Ioannis Panageas（UC Irvine）", "r": "乘性权重的极限环与混沌分析"}, {"n": "Christos Papadimitriou（Columbia）", "r": "博弈动力学的一般不可能性定理"}, {"n": "Yuzuru Sato（北海道大学）", "r": "最早构造出学习博弈中的混沌反例"}, {"n": "Marco Pangallo（Sant'Anna）", "r": "最优反应结构与收敛性的判据"}]}, {"id": "C3", "p": "C", "num": "3", "name": "系统风险约束与安全调控理论", "kind": "group", "pillar": "iii", "summary": "研究如何通过风险约束和控制机制，避免动态智能系统进入危险状态。", "extra": "前两组是描述性的——说明系统会怎样演化；这一组是规范性的——如何施加约束使它不进入危险区域。四个子方向对应四种「危险」的定义：违反显式的成本上限（约束强化学习）、尾部损失过大（风险敏感）、模型本身就有偏差（鲁棒）、以及群体分布整体偏移到坏区域（平均场控制）。它是整棵树上离控制工程最近、也最可能直接落地的一块。"}, {"id": "C31", "p": "C3", "num": "3.1", "name": "约束强化学习与安全决策理论", "kind": "leaf", "pillar": "iii", "summary": "研究在最大化长期收益的同时严格满足成本或安全约束，包括约束马尔可夫决策过程的对偶理论、原始对偶算法的收敛性，以及训练过程中能否做到零违反。", "why": "把安全写成约束而非奖励中的惩罚项，好处是不需要人为设定权重，且约束的含义可以被独立地审计与调整。理论上最重要的事实是：约束马尔可夫决策过程虽然在策略参数上非凸，但在占用测度空间上是线性规划，因此对偶间隙为零——这使拉格朗日方法有严格依据，而不只是启发式。", "phases": [{"t": "约束马尔可夫决策过程的奠基（1999）", "d": "系统建立约束 MDP 的理论：用占用测度把问题写成线性规划，证明最优策略一般是随机的（这与无约束 MDP 存在确定性最优策略截然不同），并给出对偶方法的基本框架。"}, {"t": "深度约束强化学习（2017–2019）", "d": "把信赖域策略优化推广到带约束情形，给出每次更新近似满足约束的保证；也出现用拉格朗日乘子自适应调节惩罚强度的方法，以及基于李雅普诺夫函数构造安全策略集的做法。同期出现标准基准，使方法可比较。"}, {"t": "理论保证的建立（2019–2021）", "d": "证明约束强化学习的对偶间隙为零，为拉格朗日方法提供了严格依据；随后给出自然策略梯度原始对偶方法的收敛速率，以及探索阶段的遗憾与约束违反的双重界。「学习过程中是否可能零违反」被证明需要额外的安全基线策略或可行性假设。"}, {"t": "硬约束与形式化方法（2018– ）", "d": "引入运行时屏蔽：用形式化验证得到的安全自动机在动作执行前拦截不安全动作，从而在整个学习过程中提供硬保证。控制屏障函数与李雅普诺夫方法把控制论的安全工具引入学习系统。"}, {"t": "大模型对齐（2023– ）", "d": "把有用性与无害性建模为约束优化而非加权求和，使二者的权衡可以被显式控制而不是隐藏在超参数里。这是约束强化学习进入大模型对齐的直接应用。"}], "papers": [{"c": "Altman (1999)", "t": "Constrained Markov Decision Processes", "n": "系统建立约束 MDP 理论：占用测度线性规划表述、最优策略的随机性、对偶方法框架。它是整个方向的奠基专著。", "k": 1, "v": "CRC Press（专著）"}, {"c": "Achiam, Held, Tamar & Abbeel (2017)", "t": "Constrained policy optimization", "n": "把信赖域策略优化推广到带约束情形，给出每次更新后约束违反量的上界。它是第一个在深度强化学习中提供近似约束保证的算法。", "k": 1, "v": "ICML 2017"}, {"c": "Chow, Nachum, Duenez-Guzman & Ghavamzadeh (2018)", "t": "A Lyapunov-based approach to safe reinforcement learning", "n": "用李雅普诺夫函数构造一个保证可行的策略集合，在其中做策略改进从而保持安全。它把控制论的稳定性工具引入约束强化学习。", "v": "NeurIPS 2018"}, {"c": "Tessler, Mankowitz & Mannor (2019)", "t": "Reward constrained policy optimization", "n": "用拉格朗日乘子自适应调节惩罚强度，避免手工设定权重，并给出收敛性分析。它是实践中最常用的基线方法。", "v": "ICLR 2019"}, {"c": "Paternain, Chamon, Calvo-Fullana & Ribeiro (2019)", "t": "Constrained reinforcement learning has zero duality gap", "n": "证明尽管在策略参数上非凸，约束强化学习的对偶间隙为零。这为一切拉格朗日方法提供了严格依据，是该方向最重要的理论结果。", "k": 1, "v": "NeurIPS 2019"}, {"c": "Efroni, Mannor & Pirotta (2020)", "t": "Exploration-exploitation in constrained MDPs", "n": "给出学习过程中的遗憾与累积约束违反的双重界，并分析零违反在什么条件下可能。它把约束从「最终满足」推进到「全程满足」。", "k": 1, "v": "arXiv 预印本"}, {"c": "Ding, Zhang, Başar & Jovanović (2020)", "t": "Natural policy gradient primal-dual method for constrained MDPs", "n": "证明自然策略梯度原始对偶方法的全局收敛率，给出最优性差距与约束违反的显式界。它是深度约束强化学习理论化的关键一步。", "k": 1, "v": "NeurIPS 2020"}, {"c": "Alshiekh, Bloem, Ehlers, Könighofer, Niekum & Topcu (2018)", "t": "Safe reinforcement learning via shielding", "n": "用形式化方法综合出一个屏蔽器，在动作执行前拦截会导致违反时序逻辑规范的动作，从而在整个学习过程中提供硬安全保证。它是形式化方法与强化学习结合的代表。", "k": 1, "v": "AAAI 2018"}, {"c": "Ray, Achiam & Amodei (2019)", "t": "Benchmarking safe exploration in deep reinforcement learning (Safety Gym)", "n": "给出标准化的安全探索基准与评测协议，使不同约束方法可以公平比较。它规范了整个子领域的实证研究。", "v": "OpenAI 技术报告"}, {"c": "Dai, Pan, Sun, Ji, Xu, Liu, Wang & 杨耀东 (2024)", "t": "Safe RLHF: safe reinforcement learning from human feedback", "n": "把有用性与无害性解耦为目标与约束，用拉格朗日方法在训练中动态平衡二者。它把约束强化学习理论直接用于大模型对齐。", "k": 1, "v": "ICLR 2024"}], "people": [{"n": "Eitan Altman（INRIA）", "r": "约束马尔可夫决策过程的奠基性理论与专著"}, {"n": "Joshua Achiam & Pieter Abbeel（OpenAI／Berkeley）", "r": "约束策略优化（CPO）；Safety Gym 基准"}, {"n": "Shie Mannor（Technion）", "r": "约束与风险敏感强化学习的系统性贡献；探索阶段的约束违反界"}, {"n": "Mohammad Ghavamzadeh（Amazon／Google）", "r": "基于李雅普诺夫的安全强化学习"}, {"n": "Alejandro Ribeiro & Santiago Paternain（Penn／RPI）", "r": "约束强化学习零对偶间隙定理"}, {"n": "Tamer Başar & Mihailo Jovanović（UIUC／USC）", "r": "自然策略梯度原始对偶方法的收敛率"}, {"n": "Ufuk Topcu（UT Austin）", "r": "运行时屏蔽——把形式化方法用于学习系统的硬安全保证"}, {"n": "杨耀东 Yaodong Yang（北京大学）", "r": "Safe RLHF——把约束强化学习用于大模型对齐"}]}, {"id": "C32", "p": "C3", "num": "3.2", "name": "风险敏感强化学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究不只优化平均收益，而是显式控制尾部风险、方差与灾难性损失，包括风险测度的选择、时间一致性问题与分布强化学习。", "why": "期望值对灾难不敏感：一个千分之一概率的毁灭性结果只让期望下降一点点。风险敏感强化学习要处理的核心数学困难是时间一致性——大多数静态风险测度（如条件风险价值）在序贯决策中不满足动态规划原理，今天认为最优的计划明天会想反悔。解决这一点需要重新构造风险测度本身，这是该方向最深刻的理论内容。", "phases": [{"t": "指数效用与风险敏感控制（1972–2002）", "d": "用指数效用函数刻画风险偏好，得到风险敏感的贝尔曼方程；这类熵风险测度的好处是天然满足时间一致性，因而动态规划直接适用。缺点是风险态度只能由单一参数控制，表达能力有限。"}, {"t": "一致风险测度与时间一致性（1999–2010）", "d": "提出风险测度应满足的四条公理（单调、平移不变、正齐次、次可加），条件风险价值成为标准选择。随后指出静态风险测度在序贯问题中不满足动态规划原理，必须构造马尔可夫风险测度这一逐步复合的形式，才能同时保持一致性与可解性。"}, {"t": "CVaR 优化的算法化（2014–2017）", "d": "给出条件风险价值的策略梯度与采样估计方法，并证明它与一类鲁棒马尔可夫决策过程等价——对最坏 α 分位情形优化，等同于对某个分布不确定集做鲁棒优化。这条对偶把风险与鲁棒两个分支连了起来。"}, {"t": "分布强化学习（2017–2020）", "d": "提出学习回报的完整分布而非期望，用分位数回归等方法参数化分布。它在实践中显著提升性能，并使各类风险测度可直接从学到的分布中读出。随后在小鼠多巴胺神经元中发现分布式价值编码的证据，成为 AI 理论反哺神经科学的著名案例。"}, {"t": "遗憾理论（2020– ）", "d": "给出指数效用与条件风险价值下的遗憾界，明确了风险敏感相对于风险中性要付出的额外样本代价，把这一方向纳入现代强化学习理论的标准框架。"}], "papers": [{"c": "Howard & Matheson (1972)", "t": "Risk-sensitive Markov decision processes", "n": "用指数效用刻画风险偏好并推导风险敏感的贝尔曼方程，得到一个天然时间一致的框架。它是风险敏感序贯决策的起点。", "k": 1, "v": "Management Science"}, {"c": "Artzner, Delbaen, Eber & Heath (1999)", "t": "Coherent measures of risk", "n": "提出风险测度应满足的四条公理，证明方差不是一致风险测度而条件风险价值是。它规定了此后所有风险敏感研究使用什么目标函数。", "k": 1, "v": "Mathematical Finance"}, {"c": "Ruszczyński (2010)", "t": "Risk-averse dynamic programming for Markov decision processes", "n": "指出静态风险测度在序贯决策中不满足动态规划原理，并构造马尔可夫风险测度使贝尔曼方程重新成立。这是该方向最重要的理论修正。", "k": 1, "v": "Mathematical Programming"}, {"c": "Chow, Tamar, Mannor & Pavone (2015)", "t": "Risk-sensitive and robust decision-making: a CVaR optimization approach", "n": "证明条件风险价值优化与一类鲁棒马尔可夫决策过程等价，并给出值迭代算法。它把风险敏感与鲁棒决策统一在一个对偶关系下。", "k": 1, "v": "NeurIPS 2015"}, {"c": "Tamar, Glassner & Mannor (2015)", "t": "Optimizing the CVaR via sampling", "n": "给出条件风险价值的采样式策略梯度估计与收敛性，使风险敏感目标可以用标准的策略优化流程求解。", "v": "AAAI 2015"}, {"c": "Bellemare, Dabney & Munos (2017)", "t": "A distributional perspective on reinforcement learning", "n": "提出学习回报的完整分布而非期望，给出分布贝尔曼算子及其在 Wasserstein 度量下的压缩性。它开创了分布强化学习并显著提升了实践性能。", "k": 1, "v": "ICML 2017"}, {"c": "Dabney, Ostrovski, Silver & Munos (2018)", "t": "Implicit quantile networks for distributional reinforcement learning", "n": "用隐式分位数网络参数化回报分布，使任意扭曲风险测度都能直接从中导出，从而统一处理各种风险偏好。", "k": 1, "v": "ICML 2018"}, {"c": "Dabney, Kurth-Nelson, Uchida, Starkweather, Hassabis, Munos & Botvinick (2020)", "t": "A distributional code for value in dopamine-based reinforcement learning", "n": "在小鼠多巴胺神经元中发现不同细胞编码不同乐观程度的价值预测，与分布强化学习的理论预测一致。它是机器学习理论反哺神经科学的标志性成果。", "k": 1, "v": "Nature"}, {"c": "Fei, Yang, Chen & Wang (2021)", "t": "Exponential Bellman equation and improved regret bounds for risk-sensitive reinforcement learning", "n": "给出指数效用下的遗憾界并改进其对风险参数的依赖，明确了风险敏感相对风险中性的样本代价。", "v": "NeurIPS 2021"}, {"c": "Greenberg, Chow, Ghavamzadeh & Mannor (2022)", "t": "Efficient risk-averse reinforcement learning", "n": "解决 CVaR 优化中因只用尾部样本导致的效率低下问题，用交叉熵式的采样提高数据利用率。", "v": "NeurIPS 2022"}], "people": [{"n": "Ronald Howard（Stanford）", "r": "风险敏感马尔可夫决策过程与指数效用框架"}, {"n": "Philippe Artzner & Freddy Delbaen", "r": "一致风险测度的公理化——确立 CVaR 的标准地位"}, {"n": "Andrzej Ruszczyński（Rutgers）", "r": "马尔可夫风险测度与风险规避动态规划的时间一致性"}, {"n": "Shie Mannor & Aviv Tamar（Technion）", "r": "CVaR 强化学习的算法与理论；风险与鲁棒的对偶"}, {"n": "Marco Pavone（Stanford）", "r": "风险敏感规划与其在自动驾驶中的应用"}, {"n": "Marc Bellemare、Will Dabney & Rémi Munos（DeepMind）", "r": "分布强化学习；在多巴胺系统中发现分布式价值编码"}, {"n": "王昭然 Zhaoran Wang & 杨卓然 Zhuoran Yang（Northwestern／Yale）", "r": "风险敏感强化学习的遗憾理论"}]}, {"id": "C33", "p": "C3", "num": "3.3", "name": "鲁棒与分布鲁棒强化学习理论", "kind": "leaf", "pillar": "iii", "summary": "研究环境动力学存在模型误差或分布变化时如何仍能保证决策性能，即在一个转移概率的不确定集上做最坏情况优化。", "why": "仿真到现实的差距、非平稳环境、估计误差都表现为转移核的偏差。这个方向的关键技术条件是矩形性——不确定集必须能按状态动作分解，鲁棒贝尔曼方程才成立；一旦允许跨状态耦合的不确定集，问题立刻变成 NP 难。这个条件既是理论可行的边界，也是建模时最需要小心的假设。", "phases": [{"t": "鲁棒马尔可夫决策过程的奠基（2005）", "d": "两组作者同年独立提出鲁棒 MDP：把转移概率放进一个不确定集，对最坏情况做优化。关键贡献是识别出矩形性假设——不确定性按状态动作独立分解时，鲁棒贝尔曼算子仍是压缩映射，动态规划成立。"}, {"t": "复杂性边界与推广（2010–2013）", "d": "证明非矩形不确定集下鲁棒 MDP 是 NP 难的，从而确定了矩形性不只是技术方便而是必要条件。同时提出分布鲁棒版本：不确定集不是转移核的集合而是其分布的集合，用先验信息缩小保守性。"}, {"t": "深度鲁棒强化学习（2017–2020）", "d": "用对抗性扰动环境训练策略，把鲁棒性建模为智能体与环境扰动者的零和博弈；工程上更常用的是域随机化——在大量随机变化的仿真环境中训练。后者极其有效但没有保证，这一理论与实践的落差长期存在。"}, {"t": "样本复杂度理论（2021–2023）", "d": "给出分布鲁棒强化学习在生成模型下的极小极大样本复杂度，并发现一个反直觉的结论：在某些不确定集下，鲁棒问题的样本复杂度不高于甚至低于标准问题，因为鲁棒值函数对模型误差更不敏感。这修正了「鲁棒必然更贵」的直觉。"}, {"t": "与离线强化学习结合（2022– ）", "d": "离线数据本身就带有分布偏移，鲁棒性与悲观主义在数学上高度相关。研究转向刻画不同不确定集（KL、χ²、Wasserstein）下的最优率，以及离线数据覆盖条件如何影响鲁棒策略的可学性。"}], "papers": [{"c": "Iyengar (2005)", "t": "Robust dynamic programming", "n": "提出鲁棒马尔可夫决策过程，识别出矩形性条件并证明在此条件下鲁棒贝尔曼算子是压缩映射。它奠定了整个方向的数学基础。", "k": 1, "v": "Mathematics of Operations Research"}, {"c": "Nilim & El Ghaoui (2005)", "t": "Robust control of Markov decision processes with uncertain transition matrices", "n": "同年独立给出等价框架，并针对似然与相对熵型不确定集给出高效的内层求解方法。两篇共同确立了鲁棒 MDP。", "k": 1, "v": "Operations Research"}, {"c": "Xu & Mannor (2010)", "t": "Distributionally robust Markov decision processes", "n": "把不确定集从转移核集合推广到转移核的分布集合，用先验信息显著降低保守性。它是分布鲁棒强化学习的起点。", "k": 1, "v": "NeurIPS 2010 / Mathematics of Operations Research 2012"}, {"c": "Wiesemann, Kuhn & Rustem (2013)", "t": "Robust Markov decision processes", "n": "证明非矩形不确定集下鲁棒 MDP 是 NP 难的，同时给出更一般的可解结构（s-矩形与 s,a-矩形的区分）。它精确划定了可解性的边界。", "k": 1, "v": "Mathematics of Operations Research"}, {"c": "Pinto, Davidson, Sukthankar & Gupta (2017)", "t": "Robust adversarial reinforcement learning", "n": "把鲁棒性建模为智能体与施加扰动的对手之间的零和博弈，用对抗训练获得对环境变化不敏感的策略。它是深度鲁棒强化学习的代表方法。", "v": "ICML 2017"}, {"c": "Tobin, Fong, Ray, Schneider, Zaremba & Abbeel (2017)", "t": "Domain randomization for transferring deep neural networks from simulation to the real world", "n": "在随机变化的仿真环境中训练，使真实世界成为训练分布的一个样本。它是仿真到现实迁移中最有效的工程方法，但缺乏理论保证。", "v": "IROS 2017"}, {"c": "Zhou, Zhou, Bai, Qiu, Blanchet & Glynn (2021)", "t": "Finite-sample regret bound for distributionally robust offline tabular reinforcement learning", "n": "给出离线分布鲁棒强化学习的有限样本遗憾界，把鲁棒性与离线数据覆盖条件联系起来。", "v": "ICML 2021"}, {"c": "Panaganti & Kalathil (2022)", "t": "Sample complexity of robust reinforcement learning with a generative model", "n": "给出鲁棒强化学习在生成模型下的样本复杂度上界，是这一基础问题的第一批定量结果。", "v": "AISTATS 2022"}, {"c": "Shi, Li, Wei, Chen, Geist & Chi (2023)", "t": "The curious price of distributional robustness in reinforcement learning with a generative model", "n": "给出分布鲁棒强化学习的极小极大样本复杂度，并发现在某些不确定集下鲁棒问题反而比标准问题更省样本。它修正了鲁棒必然昂贵的直觉。", "k": 1, "v": "NeurIPS 2023"}, {"c": "Moos, Hansel, Abdulsamad, Stark, Clever & Peters (2022)", "t": "Robust reinforcement learning: a review of foundations and recent advances", "n": "系统梳理鲁棒强化学习的问题设定（转移、观测、动作、奖励的不确定性）与方法谱系。它是该领域的标准综述。", "v": "Machine Learning and Knowledge Extraction"}], "people": [{"n": "Garud Iyengar（Columbia）", "r": "鲁棒动态规划与矩形性条件"}, {"n": "Laurent El Ghaoui（Berkeley）& Arnab Nilim", "r": "不确定转移矩阵下的鲁棒 MDP 与高效内层求解"}, {"n": "Shie Mannor（Technion）& Huan Xu", "r": "分布鲁棒马尔可夫决策过程"}, {"n": "Daniel Kuhn & Wolfram Wiesemann（EPFL／Imperial）", "r": "鲁棒 MDP 的复杂性刻画；Wasserstein 分布鲁棒优化"}, {"n": "Yuejie Chi（CMU／Yale）", "r": "分布鲁棒强化学习的极小极大样本复杂度"}, {"n": "Jose Blanchet（Stanford）", "r": "分布鲁棒优化的对偶理论与在强化学习中的应用"}, {"n": "Pieter Abbeel & Lerrel Pinto（Berkeley／NYU）", "r": "对抗鲁棒强化学习与域随机化"}]}, {"id": "C34", "p": "C3", "num": "3.4", "name": "平均场控制理论", "kind": "leaf", "pillar": "iii", "summary": "研究如何从系统层面对大规模主体群体的状态分布进行整体调控，即以概率测度本身作为被控对象。", "why": "与平均场博弈的关键区别在于优化与取极限的顺序：博弈是每个主体先各自最优再取极限（竞争、纳什），控制是先对群体整体做最优再取极限（合作、社会最优）。两者一般不相等，这个差距正是「个体理性导致集体非理性」的数学表述。对 AI 安全而言，这一方向给出的是最直接的调控语言——不试图控制每个智能体，而是控制群体分布的演化。", "phases": [{"t": "与平均场博弈的分野（2013）", "d": "明确区分 McKean–Vlasov 控制（合作、社会最优）与平均场博弈（竞争、纳什），证明两者的解一般不同，并刻画了差异的来源。这个区分是整个方向存在的前提。"}, {"t": "测度空间上的动态规划（2014–2019）", "d": "在 Wasserstein 空间上定义值函数与导数，建立相应的 HJB 方程与粘性解理论，使动态规划原理在以分布为状态的问题上成立。这是技术上最困难的部分。"}, {"t": "学习化（2019–2023）", "d": "当模型未知时，把 Q 学习推广到概率测度空间：以群体分布为状态、以分布上的策略为动作，证明相应算子的压缩性与算法收敛性。也出现能同时求解博弈与控制两种解概念的统一算法。"}, {"t": "离散化与深度方法（2021– ）", "d": "连续测度空间不可直接计算，于是发展有限主体近似、分布的离散化表示与深度网络参数化，并给出近似误差随主体数的收敛速率。这使平均场控制开始能用于实际规模的问题。"}, {"t": "应用与 AI 安全含义（2020– ）", "d": "典型应用包括电网充电调度、交通流引导、机器人集群与流行病干预。在智能体大规模部署的语境下，它提供了一种可行的治理数学：把监管目标写成对群体分布的约束，而不是对每个智能体的规则。"}], "papers": [{"c": "Carmona, Delarue & Lachapelle (2013)", "t": "Control of McKean–Vlasov dynamics versus mean field games", "n": "严格区分合作型的 McKean–Vlasov 控制与竞争型的平均场博弈，证明两者解一般不同并刻画差异来源。这是该方向的定义性论文。", "k": 1, "v": "Mathematics and Financial Economics"}, {"c": "Bensoussan, Frehse & Yam (2013)", "t": "Mean Field Games and Mean Field Type Control Theory", "n": "系统给出平均场型控制的随机最大值原理与 HJB 方程，是最早把两类问题并置处理的专著。", "v": "SpringerBriefs in Mathematics"}, {"c": "Pham & Wei (2018)", "t": "Bellman equation and viscosity solutions for mean-field stochastic control problem", "n": "在 Wasserstein 空间上建立动态规划原理与 HJB 方程的粘性解理论，解决了以分布为状态时值函数的正则性问题。它是技术上的关键突破。", "k": 1, "v": "ESAIM: Control, Optimisation and Calculus of Variations"}, {"c": "Carmona & Delarue (2018)", "t": "Probabilistic Theory of Mean Field Games with Applications I–II", "n": "两卷本系统处理平均场博弈与平均场控制的概率方法，包含前后向随机微分方程与主方程。它是该领域的标准参考书。", "v": "Springer（两卷本专著）"}, {"c": "Carmona, Laurière & Tan (2023)", "t": "Model-free mean-field reinforcement learning: mean-field MDP and mean-field Q-learning", "n": "把马尔可夫决策过程提升到概率测度空间，定义平均场 MDP 与相应的 Q 学习并证明收敛。它给出了无模型平均场控制的理论基础。", "k": 1, "v": "Annals of Applied Probability"}, {"c": "Gu, Guo, Wei & Xu (2021)", "t": "Mean-field controls with Q-learning for cooperative MARL: convergence and complexity analysis", "n": "给出合作型多智能体问题的平均场 Q 学习算法、收敛性与复杂度分析，并给出有限主体近似的误差率。它把理论与多智能体强化学习实践连接起来。", "k": 1, "v": "SIAM Journal on Mathematics of Data Science"}, {"c": "Motte & Pham (2022)", "t": "Mean-field Markov decision processes with common noise and open-loop controls", "n": "处理存在共同噪声（所有主体共享的随机冲击）的情形并给出动态规划刻画。共同噪声是金融与流行病等现实系统的关键特征。", "v": "Annals of Applied Probability"}, {"c": "Angiuli, Fouque & Laurière (2022)", "t": "Unified reinforcement Q-learning for mean field game and control problems", "n": "用两个时间尺度的 Q 学习统一求解平均场博弈与平均场控制，只需调整学习率之比即可在两种解概念间切换。它清晰地展示了二者的关系。", "k": 1, "v": "Mathematics of Control, Signals, and Systems"}, {"c": "Cui & Koeppl (2021)", "t": "Approximately solving mean field games via entropy-regularized deep reinforcement learning", "n": "用熵正则化改善平均场问题中不动点迭代的稳定性，并给出深度实现。它解决了平均场学习中常见的振荡问题。", "v": "AISTATS 2021"}, {"c": "Laurière, Perrin, Élie, Pérolat, Pietquin et al. (2022)", "t": "Scalable deep reinforcement learning algorithms for mean field games", "n": "给出可扩展的深度算法（虚拟博弈与镜像下降的深度版本）及其收敛依据，使平均场方法能处理高维状态空间。", "v": "ICML 2022"}], "people": [{"n": "René Carmona & François Delarue（Princeton／Nice）", "r": "平均场控制与平均场博弈的严格区分；概率论方法的系统建立"}, {"n": "Pierre-Louis Lions（Collège de France）", "r": "测度空间上的导数概念，使 Wasserstein 空间上的 HJB 方程成为可能"}, {"n": "Huyên Pham（Paris Cité）", "r": "Wasserstein 空间上的动态规划与粘性解理论"}, {"n": "Xin Guo（Berkeley）", "r": "平均场控制的 Q 学习理论、收敛性与有限主体近似误差"}, {"n": "Mathieu Laurière（NYU 上海）", "r": "无模型平均场强化学习；统一求解博弈与控制的算法"}, {"n": "Alain Bensoussan（UT Dallas）", "r": "平均场型控制的最大值原理与早期系统化"}, {"n": "Jean-Pierre Fouque（UCSB）", "r": "两时间尺度 Q 学习统一平均场博弈与控制"}, {"n": "Heinz Koeppl & Kai Cui（TU Darmstadt）", "r": "熵正则化的深度平均场学习"}]}];
(function () {
  var SVGNS = "http://www.w3.org/2000/svg";
  var X = [14, 140, 366, 608], W = [112, 206, 224, 258];
  var ROW = 38, TOP = 26, NH = 28;

  var byid = {}, kids = {};
  NODES.forEach(function (n) {
    byid[n.id] = n;
    (kids[n.p] = kids[n.p] || []).push(n.id);
  });
  NODES.forEach(function (n) {
    var d = 0, p = n.p;
    while (p) { d++; p = byid[p].p; }
    n._d = d;
  });
  var LEAVES = NODES.filter(function (n) { return n.kind === "leaf"; }).map(function (n) { return n.id; });

  var IDX = {};
  NODES.forEach(function (n) {
    var s = [n.num, n.name, n.summary, n.why, n.extra].join(" ");
    (n.phases || []).forEach(function (x) { s += " " + x.t + " " + x.d; });
    (n.papers || []).forEach(function (x) { s += " " + x.c + " " + x.t + " " + x.v + " " + x.n; });
    (n.people || []).forEach(function (x) { s += " " + x.n + " " + x.r; });
    IDX[n.id] = { raw: s, low: s.toLowerCase() };
  });

  var collapsed = {}, current = null, filter = null;
  var svg = document.getElementById("tree");
  var panel = document.getElementById("panel");
  var box = document.getElementById("q");

  function up(node, test) { while (node && node !== svg) { if (test(node)) return node; node = node.parentNode; } return null; }
  function el(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function layout() {
    var Y = {}, cur = TOP;
    (function walk(id) {
      var ch = kids[id] || [];
      if (!ch.length || collapsed[id]) { Y[id] = cur + ROW / 2; cur += ROW; return Y[id]; }
      var ys = ch.map(walk);
      Y[id] = (ys[0] + ys[ys.length - 1]) / 2;
      return Y[id];
    })("root");
    return { Y: Y, H: cur + 20 };
  }

  function draw() {
    var L = layout(), Y = L.Y, width = X[3] + W[3] + 14;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("viewBox", "0 0 " + width + " " + L.H);
    svg.setAttribute("width", width);
    svg.setAttribute("height", L.H);

    var g0 = el("g", {});
    Object.keys(Y).forEach(function (id) {
      var n = byid[id];
      if (!n.p || Y[n.p] === undefined) return;
      var pd = byid[n.p]._d, d = n._d;
      var px = X[pd] + W[pd], py = Y[n.p], x = X[d], y = Y[id], mx = (px + x) / 2;
      g0.appendChild(el("path", {
        "class": "lnk lnk--" + n.pillar,
        d: "M" + px + " " + py + " C" + mx + " " + py + " " + mx + " " + y + " " + x + " " + y
      }));
    });
    svg.appendChild(g0);

    Object.keys(Y).forEach(function (id) {
      var n = byid[id], d = n._d, x = X[d], w = W[d], y = Y[id];
      var cls = "node node--" + n.pillar + " node--d" + d;
      if (id === current) cls += " on";
      if (filter && filter.indexOf(id) < 0) cls += " dim";
      if (filter && filter.indexOf(id) >= 0) cls += " hit";
      var g = el("g", { "class": cls, "data-id": id, tabindex: "0", role: "button" });
      g.appendChild(el("rect", { "class": "box", x: x, y: y - NH / 2, width: w, height: NH, rx: 6 }));
      var t = el("text", { x: x + 11, y: y + 4.4, "font-size": [14.5, 13.5, 13.2, 12.8][d] });
      if (n.num) {
        var a = el("tspan", { "class": "nn" }); a.textContent = n.num; t.appendChild(a);
        var b = el("tspan", { dx: 7 }); b.textContent = n.name; t.appendChild(b);
      } else t.textContent = n.name;
      g.appendChild(t);
      if ((kids[id] || []).length) {
        var cx = x + w + 1, tg = el("g", { "class": "tog", "data-tog": id });
        tg.appendChild(el("circle", { cx: cx, cy: y, r: 6.5 }));
        tg.appendChild(el("path", { d: "M" + (cx - 3.2) + " " + y + " H" + (cx + 3.2) }));
        if (collapsed[id]) tg.appendChild(el("path", { d: "M" + cx + " " + (y - 3.2) + " V" + (y + 3.2) }));
        g.appendChild(tg);
      }
      svg.appendChild(g);
    });
  }

  function sec(h, inner) { return '<section class="sec"><h3 class="sec-h">' + h + "</h3>" + inner + "</section>"; }

  function render(id) {
    var n = byid[id];
    if (!n) return;
    current = id;
    panel.setAttribute("data-p", n.pillar);
    var path = [], p = n.p;
    while (p) { path.unshift(p); p = byid[p].p; }

    var h = "";
    if (path.length) h += '<p class="crumb">' + path.map(function (q) {
      var m = byid[q]; return esc((m.num ? m.num + " " : "") + m.name);
    }).join(" › ") + "</p>";
    var kind = { leaf: "研究方向", group: "方向组", branch: "分支", root: "总纲" }[n.kind];
    if (n.num) h += '<p class="p-num">' + esc(n.num) + "</p>";
    h += '<h2 class="p-title">' + esc(n.name) + ' <span class="p-kind">' + kind + "</span></h2>";

    if (n.summary) h += sec(n.kind === "leaf" ? "研究内容" : "方向说明", "<p>" + esc(n.summary) + "</p>");
    if (n.why) h += sec("要点", '<div class="why"><p>' + esc(n.why) + "</p></div>");
    if (n.extra) h += sec("补充说明", "<p>" + esc(n.extra) + "</p>");

    if (n.phases) h += sec("发展脉络", '<ol class="phl">' + n.phases.map(function (x) {
      return '<li class="ph"><span class="ph-t">' + esc(x.t) + '</span><span class="ph-d">' + esc(x.d) + "</span></li>";
    }).join("") + "</ol>");

    if (n.papers) h += sec("代表性论文", '<ol class="ppl">' + n.papers.map(function (x) {
      return '<li class="pp' + (x.k ? " key" : "") + '">' +
        '<span class="pp-c">' + esc(x.c) + "</span>" +
        '<span class="pp-v">' + esc(x.v) + "</span>" +
        '<span class="pp-t">' + esc(x.t) + "</span>" +
        '<p class="pp-n">' + esc(x.n) + "</p></li>";
    }).join("") + "</ol>");

    if (n.people) h += sec("代表学者与代表性结果", '<ul class="pel">' + n.people.map(function (x) {
      return '<li class="pe"><span class="pe-n">' + esc(x.n) + '</span><span class="pe-r">' + esc(x.r) + "</span></li>";
    }).join("") + "</ul>");

    var ch = kids[id] || [];
    if (ch.length) h += sec("下级节点", '<div class="kids">' + ch.map(function (c) {
      var q = byid[c];
      return '<button class="kid" type="button" data-go="' + c + '">' +
        (q.num ? '<span class="kn">' + esc(q.num) + "</span>" : "") + esc(q.name) + "</button>";
    }).join("") + "</div>");

    var li = LEAVES.indexOf(id);
    var prev = li > 0 ? LEAVES[li - 1] : null;
    var next = li >= 0 ? (li < LEAVES.length - 1 ? LEAVES[li + 1] : null) : LEAVES[0];
    h += '<nav class="nav">' +
      '<button type="button" data-go="' + (prev || "") + '"' + (prev ? "" : " disabled") + '>← ' +
      (prev ? esc((byid[prev].num || "") + " " + byid[prev].name) : "") + "</button>" +
      '<button type="button" data-go="' + (next || "") + '"' + (next ? "" : " disabled") + '>' +
      (next ? esc((byid[next].num || "") + " " + byid[next].name) : "") + " →</button></nav>";

    panel.innerHTML = h;
    panel.scrollTop = 0;
    if (history.replaceState) history.replaceState(null, "", "#" + id);
  }

  function snippet(id, q) {
    var raw = IDX[id].raw, i = IDX[id].low.indexOf(q);
    if (i < 0) return "";
    var a = Math.max(0, i - 32), b = Math.min(raw.length, i + q.length + 56);
    return (a > 0 ? "…" : "") + raw.slice(a, b).replace(/\s+/g, " ") + (b < raw.length ? "…" : "");
  }

  function showResults(q) {
    var hits = filter.map(function (id) {
      var n = byid[id], path = [], p = n.p;
      while (p) { path.unshift(byid[p].name); p = byid[p].p; }
      return '<li class="rs"><button type="button" data-go="' + id + '">' +
        '<span class="rs-p">' + esc(path.join(" › ")) + "</span>" +
        '<span class="rs-n">' + esc((n.num ? n.num + " " : "") + n.name) + "</span>" +
        '<span class="rs-s">' + esc(snippet(id, q)) + "</span></button></li>";
    }).join("");
    panel.setAttribute("data-p", "root");
    panel.innerHTML = '<p class="p-num">检索</p><h2 class="p-title">' + esc(box.value) +
      ' <span class="p-kind">' + filter.length + " 个节点命中</span></h2>" +
      (filter.length ? '<ul class="rsl">' + hits + "</ul>" : '<p class="none">没有匹配的节点。</p>');
    panel.scrollTop = 0;
  }

  function search() {
    var q = box.value.trim().toLowerCase();
    if (!q) { filter = null; draw(); if (current) render(current); return; }
    filter = NODES.filter(function (n) { return IDX[n.id].low.indexOf(q) >= 0; }).map(function (n) { return n.id; });
    collapsed = {};
    draw();
    showResults(q);
  }

  function expandTo(id) { var p = byid[id].p; while (p) { delete collapsed[p]; p = byid[p].p; } }
  function pick(id) {
    if (!byid[id]) return;
    expandTo(id); render(id); draw();
    if (window.matchMedia("(max-width:1240px)").matches) panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  svg.addEventListener("click", function (e) {
    var tg = up(e.target, function (x) { return x.getAttribute && x.getAttribute("data-tog"); });
    if (tg) {
      var tid = tg.getAttribute("data-tog");
      if (collapsed[tid]) delete collapsed[tid]; else collapsed[tid] = 1;
      draw(); return;
    }
    var g = up(e.target, function (x) { return x.getAttribute && x.getAttribute("data-id"); });
    if (g) pick(g.getAttribute("data-id"));
  });
  svg.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var g = up(e.target, function (x) { return x.getAttribute && x.getAttribute("data-id"); });
    if (g) { e.preventDefault(); pick(g.getAttribute("data-id")); }
  });
  panel.addEventListener("click", function (e) {
    var b = e.target;
    while (b && b !== panel && !(b.getAttribute && b.getAttribute("data-go"))) b = b.parentNode;
    if (b && b !== panel && b.getAttribute("data-go")) pick(b.getAttribute("data-go"));
  });
  document.addEventListener("keydown", function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    var li = LEAVES.indexOf(current);
    if (e.key === "ArrowDown") { e.preventDefault(); pick(li < 0 ? LEAVES[0] : LEAVES[Math.min(li + 1, LEAVES.length - 1)]); }
    if (e.key === "ArrowUp" && li > 0) { e.preventDefault(); pick(LEAVES[li - 1]); }
  });
  box.addEventListener("input", search);
  box.addEventListener("keydown", function (e) { if (e.key === "Escape") { box.value = ""; search(); } });

  document.getElementById("expandAll").addEventListener("click", function () { collapsed = {}; draw(); });
  document.getElementById("groupsOnly").addEventListener("click", function () {
    collapsed = {};
    NODES.forEach(function (n) { if (n._d === 2 && (kids[n.id] || []).length) collapsed[n.id] = 1; });
    draw();
  });
  document.getElementById("collapseAll").addEventListener("click", function () {
    collapsed = {};
    NODES.forEach(function (n) { if (n._d === 1 && (kids[n.id] || []).length) collapsed[n.id] = 1; });
    draw();
  });

  var start = (location.hash || "").slice(1);
  if (!byid[start]) start = "root";
  expandTo(start); render(start); draw();
})();

</script>
</body></html>
