<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人工智能安全理论分类树</title>
<style>
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --surface2:#FAFBF9;
  --ink:#141816; --ink2:#39423D; --muted:#5D6762; --faint:#8C968F;
  --hair:#D7DCD5; --hair2:#E7EBE5;
  --i:#2C5B4B;   --i-tint:#E6EFE9;  --i-line:#98BEAF;
  --ii:#3A4C78;  --ii-tint:#E6EAF3; --ii-line:#A1AECD;
  --iii:#7A4A2E; --iii-tint:#F3E9E2; --iii-line:#CFAA92;
  --root:#5A5560;--root-tint:#EDEBEF;--root-line:#B4AFBB;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0F1211; --surface:#171B19; --surface2:#1C211F;
  --ink:#E6EAE5; --ink2:#C7CEC8; --muted:#98A29B; --faint:#6E7873;
  --hair:#2A302D; --hair2:#222724;
  --i:#7FBBA1;   --i-tint:#1A2923;  --i-line:#3C6353;
  --ii:#95AADE;  --ii-tint:#1A2030; --ii-line:#404E72;
  --iii:#D0996F; --iii-tint:#2A1F18; --iii-line:#6A4B36;
  --root:#B0A8B8;--root-tint:#232128;--root-line:#4B4652;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:1680px;margin:0 auto;padding:0 22px 46px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:24px 0 14px;border-bottom:1px solid var(--hair)}
.top h1{margin:0;font-size:1.4rem;font-weight:700}
.tag{margin:.28rem 0 0;color:var(--muted);font-size:.82rem}
.tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.77rem;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:3px;display:block}
.lg--i i{background:var(--i)} .lg--ii i{background:var(--ii)} .lg--iii i{background:var(--iii)}
.btns{display:flex;gap:7px}
.btns button{font:inherit;font-size:.76rem;cursor:pointer;background:var(--surface);border:1px solid var(--hair);border-radius:5px;padding:3px 11px;color:var(--muted)}
.btns button:hover{border-color:var(--ink2);color:var(--ink)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:24px;align-items:start;padding-top:18px}
.treebox{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:8px 4px}
.treescroll{overflow-x:auto}
#tree{display:block;margin:0 auto;max-width:100%;height:auto}

.lnk{fill:none;stroke-width:1.4}
.lnk--root{stroke:var(--root-line)} .lnk--i{stroke:var(--i-line)} .lnk--ii{stroke:var(--ii-line)} .lnk--iii{stroke:var(--iii-line)}
.node{cursor:pointer}
.node rect.box{fill:var(--surface2);stroke-width:1.3;transition:fill .12s}
.node text{fill:var(--ink2)}
.node .nn{font-family:var(--mono);font-size:.76em;fill:var(--faint)}
.node--root rect.box{stroke:var(--root-line)}
.node--i rect.box{stroke:var(--i-line)}
.node--ii rect.box{stroke:var(--ii-line)}
.node--iii rect.box{stroke:var(--iii-line)}
.node--d0 text,.node--d1 text{font-weight:700}
.node--d2 text{font-weight:600}
.node:hover rect.box{fill:var(--hair2)}
.node:focus{outline:none}
.node:focus-visible rect.box{stroke-width:2.6}
.node.on rect.box{stroke-width:2.4}
.node--root.on rect.box{fill:var(--root-tint);stroke:var(--root)}
.node--i.on rect.box{fill:var(--i-tint);stroke:var(--i)}
.node--ii.on rect.box{fill:var(--ii-tint);stroke:var(--ii)}
.node--iii.on rect.box{fill:var(--iii-tint);stroke:var(--iii)}
.node--root.on text,.node--root.on .nn{fill:var(--root)}
.node--i.on text,.node--i.on .nn{fill:var(--i)}
.node--ii.on text,.node--ii.on .nn{fill:var(--ii)}
.node--iii.on text,.node--iii.on .nn{fill:var(--iii)}
.tog circle{fill:var(--surface);stroke-width:1.2}
.node--root .tog circle{stroke:var(--root-line)} .node--i .tog circle{stroke:var(--i-line)}
.node--ii .tog circle{stroke:var(--ii-line)} .node--iii .tog circle{stroke:var(--iii-line)}
.tog path{stroke-width:1.5;stroke-linecap:round;fill:none}
.node--root .tog path{stroke:var(--root)} .node--i .tog path{stroke:var(--i)}
.node--ii .tog path{stroke:var(--ii)} .node--iii .tog path{stroke:var(--iii)}
.tog:hover circle{fill:var(--hair2)}

.panel{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:22px 24px 26px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto}
.panel:focus{outline:none}
.panel[data-p="i"]{--ac:var(--i);--ac-tint:var(--i-tint)}
.panel[data-p="ii"]{--ac:var(--ii);--ac-tint:var(--ii-tint)}
.panel[data-p="iii"]{--ac:var(--iii);--ac-tint:var(--iii-tint)}
.panel[data-p="root"]{--ac:var(--root);--ac-tint:var(--root-tint)}
.crumb{font-size:.73rem;color:var(--faint);margin:0 0 8px;line-height:1.6}
.p-num{font-family:var(--mono);font-size:.79rem;color:var(--ac);letter-spacing:.1em}
.p-title{margin:.1rem 0 4px;font-size:1.28rem;font-weight:700;line-height:1.35;color:var(--ink)}
.p-kind{display:inline-block;font-size:.67rem;letter-spacing:.09em;color:var(--ac);border:1px solid var(--ac);border-radius:20px;padding:1px 9px;vertical-align:3px;margin-left:3px;font-weight:400}
.sec{margin-top:19px}
.sec-h{font-size:.7rem;font-weight:700;letter-spacing:.16em;color:var(--ac);margin:0 0 7px}
.sec p{margin:0 0 8px;color:var(--ink2);font-size:.885rem;line-height:1.86}
.sec p:last-child{margin-bottom:0}
.why{background:var(--ac-tint);border-left:3px solid var(--ac);border-radius:0 4px 4px 0;padding:9px 13px}
.why p{margin:0;font-size:.865rem}

.ph{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--hair2)}
.ph:last-child{border-bottom:0}
.ph-t{flex:0 0 auto;width:9.2rem;font-size:.75rem;font-weight:700;color:var(--ac);line-height:1.65;padding-top:2px}
.ph-d{flex:1 1 auto;font-size:.85rem;line-height:1.8;color:var(--ink2)}

.pp{padding:9px 0;border-bottom:1px dashed var(--hair2)}
.pp:last-child{border-bottom:0}
.pp-c{color:var(--ink);font-weight:700;font-size:.86rem}
.pp-t{display:block;color:var(--muted);font-size:.795rem;line-height:1.55;margin:1px 0 4px;font-style:italic}
.pp-n{font-size:.83rem;line-height:1.78;color:var(--ink2);margin:0}
.star{color:var(--ac);font-size:.8rem;margin-right:3px}
.pp.key .pp-c{color:var(--ac)}
.note{margin:9px 0 0;font-size:.71rem;color:var(--faint)}

.pe{padding:7px 0;border-bottom:1px dashed var(--hair2)}
.pe:last-child{border-bottom:0}
.pe-n{font-weight:700;font-size:.855rem;color:var(--ink)}
.pe-r{display:block;font-size:.82rem;line-height:1.72;color:var(--ink2);margin-top:1px}

.kids{display:flex;flex-wrap:wrap;gap:7px}
.kid{font:inherit;font-size:.815rem;cursor:pointer;background:var(--surface2);border:1px solid var(--hair);border-radius:5px;padding:4px 11px;color:var(--ink2)}
.kid:hover{border-color:var(--ac);color:var(--ac)}
.kid .kn{font-family:var(--mono);font-size:.76em;color:var(--faint);margin-right:5px}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:13px;border-top:1px solid var(--hair2)}
.nav button{font:inherit;font-size:.78rem;cursor:pointer;background:none;border:1px solid var(--hair);border-radius:5px;padding:5px 11px;color:var(--muted);max-width:47%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}
.nav button:disabled{opacity:.35;cursor:default}
.foot{margin-top:20px;padding-top:13px;border-top:1px solid var(--hair);font-size:.74rem;color:var(--faint)}

@media (max-width:1240px){
  .stage{grid-template-columns:minmax(0,1fr);gap:16px}
  .panel{position:static;max-height:none}
}
@media (max-width:640px){
  .wrap{padding:0 11px 32px}
  .top h1{font-size:1.16rem}
  .panel{padding:17px 15px 21px}
  .ph{flex-direction:column;gap:1px}
  .ph-t{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- search + list refinements --- */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:4px 11px}
.search svg{flex:0 0 auto;opacity:.55}
.search input{font:inherit;font-size:.83rem;border:0;background:none;color:var(--ink);width:15rem;outline:none;padding:2px 0}
.search input::placeholder{color:var(--faint)}
.node.dim{opacity:.22}
.node.hit rect.box{stroke-width:2}
.rsl{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.rs button{display:block;width:100%;text-align:left;font:inherit;cursor:pointer;background:var(--surface2);border:1px solid var(--hair);border-radius:6px;padding:9px 12px}
.rs button:hover{border-color:var(--ink2)}
.rs-p{display:block;font-size:.7rem;color:var(--faint);line-height:1.5}
.rs-n{display:block;font-size:.9rem;font-weight:700;color:var(--ink);margin:1px 0 3px}
.rs-s{display:block;font-size:.775rem;color:var(--muted);line-height:1.6}
.none{color:var(--muted);font-size:.87rem;margin:14px 0 0}
.phl,.ppl,.pel{list-style:none;margin:0;padding:0}
.ph{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--hair2)}
.ph:last-child{border-bottom:0}
.ph-t{flex:0 0 auto;width:9.2rem;font-size:.75rem;font-weight:700;color:var(--ac);line-height:1.65;padding-top:2px}
.ph-d{flex:1 1 auto;font-size:.85rem;line-height:1.8;color:var(--ink2)}
.pp{padding:10px 0;border-bottom:1px dashed var(--hair2)}
.pp:last-child{border-bottom:0}
.pp-c{font-weight:700;font-size:.865rem;color:var(--ink)}
.pp.key .pp-c{color:var(--ac)}
.pp-v{display:inline-block;margin-left:7px;font-size:.7rem;line-height:1.5;padding:1px 7px;border-radius:3px;background:var(--ac-tint);color:var(--ac);vertical-align:1px;white-space:nowrap}
.pp-t{display:block;color:var(--muted);font-size:.79rem;line-height:1.55;margin:3px 0 4px;font-style:italic}
.pp-n{font-size:.83rem;line-height:1.78;color:var(--ink2);margin:0}
.pe{padding:7px 0;border-bottom:1px dashed var(--hair2)}
.pe:last-child{border-bottom:0}
.sec-h{font-size:.7rem;font-weight:700;letter-spacing:.16em;color:var(--ac);margin:0 0 7px}
.crumb{margin:0 0 8px}
.p-num{margin:0}

<script>
var NODES = [{"id": "root", "p": null, "num": "", "name": "人工智能安全", "kind": "root", "pillar": "root", "summary": "整棵树把「AI 安全」的理论问题按作用对象分成三层：单个模型是否可靠（可信）、模型进入社会后行为是否可被约束（可管）、大量智能体互动形成的系统是否会失稳（可控）。", "extra": "三支的规模逐级放大：可信面对的是「一个模型 + 一个数据分布」，可管面对的是「一个模型 + 一群人」，可控面对的是「一群智能体 + 一个动态系统」。数学工具也随之更换——从统计学习理论，到因果与算法博弈论，再到动力系统与随机控制。三支的失败模式互不覆盖：一个完全可信的模型仍可能不公平，一群各自可信可管的智能体仍可能让系统失稳。"}, {"id": "A", "p": "root", "num": "一", "name": "可信 Trustworthiness", "kind": "branch", "pillar": "i", "summary": "研究单个模型或学习算法本身，在不确定的数据与环境下是否可靠。", "extra": "这一支的提问对象是「模型 + 数据分布」这一对。它被拆成两半：一半问模型为什么能学到可靠规律（机理），另一半问怎么定量判断当前这次预测能不能信（判定与保证）。前者需要打开模型分析，后者原则上把模型当黑盒、只对输出的统计性质提要求——模型越大越不可解析，后者的地位越重要。"}, {"id": "A1", "p": "A", "num": "1", "name": "可信基础机理理论", "kind": "group", "pillar": "i", "summary": "研究模型为什么能够学到可靠规律，以及可靠性的数学来源是什么。", "extra": "三个来源对应三个子方向：可靠性来自模型与算法本身（表达、优化、稳定性）、来自数据编码的真实结构（因果）、来自训练与部署环境的接近程度（泛化与鲁棒）。共同信念是：可信不是事后加装的，而是由这三者共同决定的。"}, {"id": "A11", "p": "A1", "num": "1.1", "name": "模型机理与学习理论", "kind": "leaf", "pillar": "i", "summary": "研究神经网络的表达能力、优化收敛、训练动力学与稳定性。核心三问是：能不能表示 → 能不能找到 → 找到了稳不稳。", "why": "经典学习理论把误差拆成逼近、优化、估计三部分独立分析再相加。深度学习推翻了这种分解——过参数化下有无穷多个零训练误差解，是优化算法的隐式偏好在选解。这意味着可信不是函数类的属性，而是「函数类 + 算法」的联合属性。", "phases": [{"t": "统计学习奠基期（1971–1994）", "d": "VC 维与 PAC 框架确立「学习何时可能」的提问方式，把泛化归结为假设类的组合复杂度。同期通用逼近定理解决了「神经网络能不能表示任意函数」，Barron 进一步给出与维数无关的逼近率，说明高维不必然遭遇维数灾难。"}, {"t": "核方法与凸优化期（1995–2011）", "d": "学界刻意设计凸问题（SVM、Lasso），凸性本身被当作可信性保证——解唯一、可复现。同期稳定性理论建立：换一个训练样本输出变多少，这条不依赖复杂度的泛化路径后来成为分析过参数化模型的唯一工具。"}, {"t": "深度经验爆发期（2012–2016）", "d": "深度网络成功但理论集体失灵。研究先转向损失曲面地貌，证明加噪 SGD 能逃离鞍点、高维下坏局部极小很少，缓解了对非凸的恐惧。2016 年的随机标签实验则直接宣告基于容量的经典泛化界失效。"}, {"t": "深度理论化期（2017–2021）", "d": "三条线同时突破：表达上给出深度分离与 ReLU 最优逼近率；优化上 NTK 把无穷宽训练凸化、平均场给出测度上的梯度流；泛化上确立隐式偏差、双下降、良性过拟合、神经坍缩、频率原则等一批新定律。"}, {"t": "大模型期（2022– ）", "d": "重心移向尺度与推理：标度律与 μP 超参迁移落地；表达力研究改用电路复杂度工具，证明单次前向的 Transformer 受限于 TC⁰、而思维链把它提升到 P；训练动力学研究转向涌现与相变的可预测性。"}], "papers": [{"c": "Vapnik & Chervonenkis (1971)", "t": "On the uniform convergence of relative frequencies of events to their probabilities", "n": "提出 VC 维与均匀收敛，第一次定量回答「学习在什么条件下可能」。它把泛化能力从哲学问题变成组合几何问题，是整个统计学习理论的地基。", "k": 1, "v": "Theory of Probability & Its Applications"}, {"c": "Cybenko (1989)", "t": "Approximation by superpositions of a sigmoidal function", "n": "证明单隐层 sigmoid 网络在紧集上稠密，彻底解决了「神经网络表达力够不够」的疑虑。意义在于把争论从能不能表示转向要多大代价才能表示。", "v": "Mathematics of Control, Signals and Systems"}, {"c": "Barron (1993)", "t": "Universal approximation bounds for superpositions of a sigmoidal function", "n": "给出第一个与维数无关的逼近率 O(1/√n)，条件是目标函数的傅立叶一阶矩有限（后称 Barron 空间）。它说明维数灾难不是必然的，而取决于目标函数所在的函数空间。", "k": 1, "v": "IEEE Transactions on Information Theory"}, {"c": "Bousquet & Elisseeff (2002)", "t": "Stability and generalization", "n": "用均匀稳定性给出不依赖假设类复杂度的泛化界。这条路径在参数量远超样本量时仍然有效，因而成为分析深度模型与差分隐私的共同工具。", "v": "JMLR"}, {"c": "Zhang, Bengio, Hardt, Recht & Vinyals (2017)", "t": "Understanding deep learning requires rethinking generalization", "n": "证明同一个网络能完美拟合随机标签，说明它的容量足以记住一切，基于容量的界必然空洞。这篇论文是此后五年深度学习理论热潮的引信。", "k": 1, "v": "ICLR 2017（最佳论文）"}, {"c": "Jacot, Gabriel & Hongler (2018)", "t": "Neural tangent kernel: convergence and generalization in neural networks", "n": "证明无穷宽极限下训练等价于固定核的核回归，把非凸优化问题凸化，从而第一次给出深度网络全局收敛的严格证明。代价是这一极限下网络不学特征。", "k": 1, "v": "NeurIPS 2018"}, {"c": "Soudry, Hoffer, Nacson, Gunasekar & Srebro (2018)", "t": "The implicit bias of gradient descent on separable data", "n": "证明梯度下降在可分数据上收敛到最大间隔解。它回答了核心悖论：零训练误差解有无穷多个，泛化好是因为算法在其中做了隐式选择。", "k": 1, "v": "ICLR 2018 / JMLR"}, {"c": "Belkin, Hsu, Ma & Mandal (2019)", "t": "Reconciling modern machine-learning practice and the classical bias–variance trade-off", "n": "揭示双下降曲线——参数超过插值阈值后测试误差二次下降。它把「过拟合必然有害」这一教科书结论改写为只在特定参数区间成立。", "v": "PNAS"}, {"c": "Papyan, Han & Donoho (2020)", "t": "Prevalence of neural collapse during the terminal phase of deep learning training", "n": "发现训练末期类内特征坍缩到均值、类均值构成单纯形等角紧框架。这是深度网络表示几何最干净的经验定律，此后催生大量理论工作。", "v": "PNAS"}, {"c": "Merrill & Sabharwal (2023, 2024)", "t": "The parallelism tradeoff / The expressive power of transformers with chain of thought", "n": "证明对数精度 Transformer 的单次前向被 TC⁰ 严格包含，而思维链把表达力提升到 P。它把「推理为什么需要一步一步写出来」变成了可证明的复杂度命题。", "k": 1, "v": "TACL 2023 / ICLR 2024"}], "people": [{"n": "Vladimir Vapnik", "r": "VC 维、结构风险最小化与 SVM——把学习理论建成一门学科"}, {"n": "Andrew Barron（Yale）", "r": "Barron 空间与逼近率，说明规避维数灾难的函数类条件"}, {"n": "Peter Bartlett（Berkeley）", "r": "Rademacher 复杂度、间隔泛化界、线性回归的良性过拟合刻画"}, {"n": "Nathan Srebro（TTIC）", "r": "隐式正则化纲领：矩阵分解偏好最小核范数、GD 偏好最大间隔"}, {"n": "Arthur Jacot（NYU）", "r": "神经正切核（NTK）"}, {"n": "Francis Bach & Lénaïc Chizat", "r": "平均场／Wasserstein 梯度流的全局收敛；提出惰性训练判据，指出 NTK 的局限"}, {"n": "Mikhail Belkin（UCSD）", "r": "双下降与插值学习，重写偏差—方差叙事"}, {"n": "David Donoho & Vardan Papyan", "r": "神经坍缩（NC1–NC4）"}, {"n": "鄂维南 E Weinan（北大／普林斯顿）", "r": "Barron 空间与流诱导函数空间，把逼近—优化—泛化统一在函数空间视角"}, {"n": "许志钦 Zhi-Qin John Xu（上海交大）", "r": "频率原则——网络先拟合低频成分，解释早停有效与简单性偏好"}]}, {"id": "A12", "p": "A1", "num": "1.2", "name": "数据与因果理论", "kind": "leaf", "pillar": "i", "summary": "研究从有限、不完备或有偏的数据中，能否识别真实的因果结构与规律。统一主题是可识别性——目标量能否被唯一确定。", "why": "与其他方向问「误差有多大」不同，这里问「有没有唯一答案」。识别不成立时，再多数据、再大模型都无济于事，这是信息论级别的不可能性。可信 AI 的很多目标（反事实公平、机制不变的泛化、干预后果预测）只有在因果语言里才能被正确表述。", "phases": [{"t": "两套语言并立期（1974–1995）", "d": "统计学派建立潜在结果框架，把因果效应定义为两个平行世界结果之差；人工智能学派建立因果图与 do-演算，把干预定义为图上的手术。流行病学则独立发展 g-方法处理时变混杂。三条线后来被证明本质等价。"}, {"t": "识别问题被封闭（1995–2006）", "d": "后门、前门准则与 do-演算三规则给出识别的操作工具；2006 年证明 do-演算对识别问题是完备的，并给出可判定的 ID 算法。至此「给定因果图，某个干预量能否识别」被彻底解决——这是整棵树上少数几个已封闭的理论问题。"}, {"t": "突破等价类与不完备数据（2006–2018）", "d": "结构学习原本只能恢复马尔可夫等价类，LiNGAM 与加性噪声模型利用非高斯性和非线性实现了完全可识别。同时缺失数据被画进因果图（m-graph），推翻了「MNAR 一律不可识别」的长期误解；近端因果推断则用两个代理变量在未测混杂下实现点识别。"}, {"t": "与机器学习融合（2016–2021）", "d": "Double ML 让任意机器学习模型都能给出 √n 一致、渐近正态的因果效应估计；不变性原则把因果与分布外泛化接通；非线性 ICA 用辅助变量破解不可识别性，因果表征学习正式立纲——因果变量不再假定给定，而要从像素中学出来。"}, {"t": "大模型期（2022– ）", "d": "因果推断的技术被搬进模型内部：因果中介分析与 activation patching 成为机制可解释性的标准方法。同时争论 LLM 的因果推理究竟是推断还是记忆；文本作为混杂因子的识别理论刚起步。"}], "papers": [{"c": "Rubin (1974)", "t": "Estimating causal effects of treatments in randomized and nonrandomized studies", "n": "用潜在结果把因果效应定义为个体在两种处理下结果之差，从而把因果问题变成一个缺失数据问题。这一转换让整个统计学的工具可以直接用于因果推断。", "k": 1, "v": "Journal of Educational Psychology"}, {"c": "Pearl (1995)", "t": "Causal diagrams for empirical research", "n": "提出后门准则、前门准则与 do-演算，给出「哪些变量该调整、哪些不该」的图论判据。它把因果识别从个案技巧变成可机械执行的算法。", "k": 1, "v": "Biometrika"}, {"c": "Spirtes, Glymour & Scheines (1993, 2000)", "t": "Causation, Prediction, and Search", "n": "给出因果发现的公理体系（因果马尔可夫条件加忠实性）与 PC 算法，第一次说明从纯观测数据中恢复因果结构在什么意义上可行、可行到什么程度。", "v": "MIT Press（专著，第 2 版）"}, {"c": "Shpitser & Pearl (2006)", "t": "Identification of joint interventional distributions in recursive semi-Markovian causal models", "n": "证明 do-演算对识别问题完备，并给出可判定的 ID 算法：不可识别时能输出证据（hedge）。它把识别问题彻底封闭。", "k": 1, "v": "AAAI 2006"}, {"c": "Shimizu, Hoyer, Hyvärinen & Kerminen (2006)", "t": "A linear non-Gaussian acyclic model for causal discovery (LiNGAM)", "n": "证明在线性非高斯假设下因果图完全可识别，而不只是等价类。它开辟了「用分布的额外结构换取可识别性」这条至今仍在扩展的路线。", "v": "JMLR"}, {"c": "Rubin (1976)", "t": "Inference and missing data", "n": "定义 MCAR／MAR／MNAR 三分法，并证明 MAR 下缺失机制可忽略。这是所有不完备数据分析的分类学起点。", "v": "Biometrika"}, {"c": "苗旺, 耿直 & Tchetgen Tchetgen (2018)", "t": "Identifying causal effects with proxy variables of an unmeasured confounder", "n": "证明只需两个满足条件的代理（负控制）变量，即可在存在未测量混杂时点识别因果效应。这是近十年识别理论最重要的新工具，由中国学者主导。", "k": 1, "v": "Biometrika"}, {"c": "Chernozhukov et al. (2018)", "t": "Double/debiased machine learning for treatment and structural parameters", "n": "用交叉拟合加 Neyman 正交化，使任意机器学习方法估计的冗余参数不污染因果参数的一阶渐近性。这是 ML 与因果结合最成功、应用最广的成果。", "k": 1, "v": "The Econometrics Journal"}, {"c": "Locatello et al. (2019)", "t": "Challenging common assumptions in the unsupervised learning of disentangled representations", "n": "用不可能性定理加大规模实证证明：无归纳偏置或监督时，解耦表示学习不可能。它终结了一整代基于 VAE 的解耦研究，把领域推向可识别性。", "k": 1, "v": "ICML 2019（最佳论文）"}, {"c": "Schölkopf et al. (2021)", "t": "Toward causal representation learning", "n": "为因果表征学习命名并给出纲领：独立机制原则、稀疏机制偏移假设。它把「因果变量本身要被学出来」确立为一个独立的研究方向。", "v": "Proceedings of the IEEE"}], "people": [{"n": "Judea Pearl（UCLA，图灵奖）", "r": "因果图、do-演算、因果层级；把因果推断变成可计算的图论问题"}, {"n": "Donald B. Rubin（Harvard）", "r": "潜在结果框架、倾向得分、缺失数据三分法"}, {"n": "James Robins（Harvard）", "r": "g-公式、边际结构模型、双重稳健估计——处理时变混杂的标准工具"}, {"n": "Peter Spirtes & Clark Glymour（CMU）", "r": "因果发现的公理化与 PC／FCI 算法"}, {"n": "Ilya Shpitser（JHU）", "r": "ID 算法与 do-演算完备性；MNAR 全律可识别性刻画"}, {"n": "Bernhard Schölkopf（MPI-IS）", "r": "独立机制原则；因果表征学习纲领；把因果引入机器学习主流"}, {"n": "Aapo Hyvärinen（Helsinki）", "r": "ICA 与非线性 ICA 的可识别性——先给出不可能性，再用辅助变量破解"}, {"n": "Victor Chernozhukov（MIT）", "r": "Double／Debiased Machine Learning"}, {"n": "耿直、苗旺（北京大学）", "r": "近端因果推断——用负控制代理在未测混杂下实现点识别"}, {"n": "张坤 Kun Zhang（CMU／MBZUAI）", "r": "后非线性因果模型；时序与领域自适应下的因果表征可识别性"}]}, {"id": "A13", "p": "A1", "num": "1.3", "name": "环境泛化与鲁棒理论", "kind": "leaf", "pillar": "i", "summary": "研究训练分布改变、出现分布外样本或对抗扰动之后，模型是否仍然可靠。四类偏移的数学结构完全不同：自然偏移是平均情形分析，新类是假设检验，对抗扰动是最坏情形分析，时间演化是在线序贯问题。", "why": "这是「可信」最直接的操作定义——换了环境还能不能用。也是理论与现实差距最大的一块：漂亮的界在真实偏移下往往空洞，而这一分支近十年最有价值的产出恰恰是一批把过度乐观的方法证伪的负面结果。", "phases": [{"t": "泛化地基与偏移理论诞生（1971–2010）", "d": "VC 与 Rademacher 复杂度提供 i.i.d. 下的基线。随后协变量偏移被正式提出并配上重要性加权；域适应的 H∆H 散度界给出「目标误差 ≤ 源误差 + 域距离 + 联合最优误差」这一至今仍是全部对抗式域适应算法理论依据的分解。"}, {"t": "对抗样本的发现（2013–2017）", "d": "安全社区先提出测试时逃逸攻击，随后对抗样本被发现并引爆领域。防御与攻击迅速形成闭环：几乎所有早期防御都被自适应攻击攻破，这使该分支成为整棵树上自我纠错最强的一块。"}, {"t": "理论化与集中纠错（2018–2022）", "d": "正面进展包括分布鲁棒优化的统计理论、PGD 对抗训练的鞍点框架、鲁棒性需要更多样本与更多参数的代价定理、OOD 检测的 PAC 可学性刻画。负面结果同样重要：只对齐边缘分布不够、IRM 在非线性下几乎必然失败、公平调参下域泛化方法打不过 ERM。"}, {"t": "大模型期（2022– ）", "d": "偏移的对象从图像风格变成任务、提示、时间。全量微调被证明会破坏预训练特征、损害分布外性能；CLIP 打破了分布内外精度的线性关系但缺乏解释；对抗方面，离散语义空间使基于 ℓp 球的整套理论几乎全部失效，成为当前最大的空白。"}], "papers": [{"c": "Shimodaira (2000)", "t": "Improving predictive inference under covariate shift by weighting the log-likelihood function", "n": "正式提出协变量偏移概念并给出重要性加权修正。它把「训练和测试不同分布」从工程麻烦变成一个有明确解法的统计问题。", "v": "Journal of Statistical Planning and Inference"}, {"c": "Ben-David, Blitzer, Crammer, Kulesza, Pereira & Vaughan (2010)", "t": "A theory of learning from different domains", "n": "给出目标域误差的三项上界，其中域距离用分类器族可区分两域的能力（H∆H 散度）度量。这个界直接催生了对抗式域适应这一整类算法。", "k": 1, "v": "Machine Learning（期刊）"}, {"c": "Peters, Bühlmann & Meinshausen (2016)", "t": "Causal inference by using invariant prediction", "n": "证明跨环境条件分布不变的变量集对应因果父集，从而把「找因果」和「找能泛化的预测器」变成同一件事。它是不变性路线的源头。", "k": 1, "v": "JRSS-B（附讨论）"}, {"c": "Hendrycks & Gimpel (2017)", "t": "A baseline for detecting misclassified and out-of-distribution examples in neural networks", "n": "用最大 softmax 概率作基线，定义了深度 OOD 检测的问题设定与评测协议。它出乎意料地难以击败，成为衡量后续方法的尺子。", "v": "ICLR 2017"}, {"c": "Madry, Makelov, Schmidt, Tsipras & Vladu (2018)", "t": "Towards deep learning models resistant to adversarial attacks", "n": "把对抗鲁棒形式化为鞍点优化问题，并给出 PGD 对抗训练。这个框架至今没有被根本超越，是该方向唯一稳定有效的基线。", "k": 1, "v": "ICLR 2018"}, {"c": "Arjovsky, Bottou, Gulrajani & Lopez-Paz (2019)", "t": "Invariant risk minimization", "n": "提出跨环境同时最优的表示作为泛化目标，是影响最大也最有争议的分布外泛化方法。它的价值一半在于提出问题、一半在于被后续工作严格证伪。", "v": "arXiv 预印本"}, {"c": "Duchi & Namkoong (2021)", "t": "Learning models with uniform performance via distributionally robust optimization", "n": "给出 f-散度球上分布鲁棒优化的完整统计理论，并揭示它与方差正则化的等价性。它把「对最坏分布做优化」从启发式变成有渐近理论的估计方法。", "v": "Annals of Statistics"}, {"c": "Gulrajani & Lopez-Paz (2021)", "t": "In search of lost domain generalization", "n": "在统一的模型选择协议下重测所有域泛化方法，发现没有一个显著优于朴素的 ERM。这次实证打击迫使整个领域重建评测标准。", "k": 1, "v": "ICLR 2021"}, {"c": "Bubeck & Sellke (2021)", "t": "A universal law of robustness via isoperimetry", "n": "用等周不等式证明：在 n 个数据点上平滑地插值至少需要 nd 个参数。它说明鲁棒性必须靠超额过参数化换取，把表达理论与鲁棒理论焊在一起。", "k": 1, "v": "NeurIPS 2021（最佳论文）/ JACM 2023"}, {"c": "Fang, Li, Lu, Dong, Han & Liu (2022)", "t": "Is out-of-distribution detection learnable?", "n": "在 PAC 框架下证明一般情形下 OOD 检测不可学，并给出可学的充要条件。它是这个已有上千篇论文的子领域里第一篇基础性理论工作。", "k": 1, "v": "NeurIPS 2022（杰出论文）"}], "people": [{"n": "Shai Ben-David（Waterloo）", "r": "域适应的 H∆H 散度界；学习理论中一系列不可能性结果"}, {"n": "Jonas Peters & Peter Bühlmann（ETH）", "r": "不变因果预测（ICP）——把因果发现变成跨环境的假设检验"}, {"n": "John Duchi（Stanford）", "r": "分布鲁棒优化的统计理论；局部差分隐私的极小极大率"}, {"n": "Aleksander Mądry（MIT／OpenAI）", "r": "PGD 对抗训练与鞍点框架；对抗样本是非鲁棒特征的观点"}, {"n": "Nicholas Carlini（Anthropic）", "r": "C&W 攻击与 obfuscated gradients——确立防御必须经自适应攻击评估的规范"}, {"n": "Sébastien Bubeck（OpenAI）", "r": "普适鲁棒律：鲁棒性的参数量下界"}, {"n": "Yixuan (Sharon) Li（UW–Madison）", "r": "能量分数 OOD 检测；深度 OOD 检测的方法体系"}, {"n": "Masashi Sugiyama（RIKEN／东大）", "r": "密度比估计与协变量偏移修正；弱监督学习的风险重写框架"}, {"n": "周志华（南京大学）", "r": "开放环境机器学习框架：类别、特征、分布、目标四个变化维度"}, {"n": "崔鹏 Peng Cui（清华大学）", "r": "稳定学习——用样本重加权去除特征间伪相关，连接因果与泛化"}]}, {"id": "A2", "p": "A", "num": "2", "name": "可信判定与保证理论", "kind": "group", "pillar": "i", "summary": "研究如何定量判断当前这次预测到底能不能信，并给出数学保证。", "extra": "三个子方向构成一条递进链：先产生一个表示不确定程度的数，再让这个数具有可验证的统计含义，最后据此采取行动（拒识）并出具可被第三方检验的证书。它与上一组的分工是白盒对黑盒——这里原则上把模型当作任意黑盒，只对输出的统计性质提要求，因此在模型不可解析时仍然有效。"}, {"id": "A21", "p": "A2", "num": "2.1", "name": "不确定性量化理论", "kind": "leaf", "pillar": "i", "summary": "研究模型如何度量自己对预测结果的不确定程度，核心是把总不确定性分解为随机不确定性（数据本身的噪声与歧义，加数据也消不掉）与认知不确定性（对模型参数的无知，数据增加则趋于零）。", "why": "只有认知不确定性才指示「应该拒答、求助或多收数据」。把两者混为一谈是实际系统最常见的错误：高噪声样本被误判为分布外，而真正的分布外样本因为模型过度自信反而被漏检。", "phases": [{"t": "贝叶斯基础期（1992–2006）", "d": "证据框架与变分推断把贝叶斯推断引入神经网络；HMC 使精确后验采样可行，并证明无穷宽贝叶斯网络收敛到高斯过程——这个结论二十年后成为 NTK 的源头。高斯过程同时确立为不确定性量化的黄金标准与比较基准。"}, {"t": "可扩展化（2015–2017）", "d": "重参数化技巧使变分贝叶斯网络可训练；MC Dropout 把已有的 dropout 重新解释为近似贝叶斯推断，零额外成本因而应用最广。而深度集成这一非贝叶斯、极简单的方法却在几乎所有基准上击败所有贝叶斯方法，至今仍是黄金基线。同期 aleatoric／epistemic 分解被正式引入深度学习。"}, {"t": "证据方法的兴衰与现实检验（2018–2022）", "d": "单次前向的 Dirichlet 参数化方法因高效而极流行；但 2022 年被证明：用任何损失最小化来学认知不确定性都无法保证一致性，因为缺少监督信号。同时大规模评测显示，分布偏移下所有方法都变差，深度集成最稳健。"}, {"t": "大模型期（2023– ）", "d": "问题从「预测分布的熵」变成「不同表述是否说了同一件事」。语义熵先对语义等价的采样聚类再算熵，用于幻觉检测并登上 Nature 正刊；同时出现让模型直接自评正确概率的路线。"}], "papers": [{"c": "MacKay (1992)", "t": "A practical Bayesian framework for backpropagation networks", "n": "用证据框架与拉普拉斯近似把贝叶斯推断变成可在神经网络上执行的流程，同时给出自动确定正则化强度的方法。这是贝叶斯神经网络的开山之作。", "v": "Neural Computation"}, {"c": "Neal (1996)", "t": "Bayesian Learning for Neural Networks", "n": "用 HMC 做贝叶斯神经网络的精确推断，并证明无穷宽单隐层网络的先验收敛到高斯过程。后一结论是深度学习理论中罕见的领先二十年的结果。", "k": 1, "v": "Springer, Lecture Notes in Statistics（专著）"}, {"c": "Gal & Ghahramani (2016)", "t": "Dropout as a Bayesian approximation", "n": "证明带 dropout 的网络等价于深度高斯过程的一种变分近似，于是不确定性可以零成本地从已有模型中读出。它让不确定性量化第一次进入普通从业者的工具箱。", "v": "ICML 2016"}, {"c": "Lakshminarayanan, Pritzel & Blundell (2017)", "t": "Simple and scalable predictive uncertainty estimation using deep ensembles", "n": "用几个独立初始化的网络取代复杂的贝叶斯近似，在几乎所有指标上取胜。它的意义是负面的也是正面的：说明当时的贝叶斯近似质量太差，也给了社区一个可靠基线。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Kendall & Gal (2017)", "t": "What uncertainties do we need in Bayesian deep learning for computer vision?", "n": "给出在深度模型中同时估计两类不确定性的可实现形式，并展示二者在视觉任务中的不同用途。这篇论文让 aleatoric／epistemic 这对概念在机器学习界普及。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Depeweg, Hernández-Lobato, Doshi-Velez & Udluft (2018)", "t": "Decomposition of uncertainty in Bayesian deep learning", "n": "用互信息给出严格的分解式：总熵等于认知（互信息）加随机（期望条件熵）。这成为此后所有分解工作的标准定义。", "v": "ICML 2018"}, {"c": "Sensoy, Kaplan & Kandemir (2018)", "t": "Evidential deep learning to quantify classification uncertainty", "n": "用 Dirichlet 分布参数化二阶不确定性，使单次前向传播就能输出认知不确定性。它极大降低了成本，也因此引发了后续关于其理论合法性的争论。", "v": "NeurIPS 2018"}, {"c": "Ovadia et al. (2019)", "t": "Can you trust your model's uncertainty? Evaluating predictive uncertainty under dataset shift", "n": "在分布偏移下系统评测所有主流方法，结论是偏移越大所有方法越差、深度集成最稳健。它把不确定性量化与分布偏移这两个分支正式接通。", "k": 1, "v": "NeurIPS 2019"}, {"c": "Bengs, Hüllermeier & Waegeman (2022)", "t": "Pitfalls of epistemic uncertainty quantification through loss minimisation", "n": "证明用任何损失最小化来学习认知不确定性都不能保证一致性，因为认知不确定性没有可观测的标签。这动摇了整条证据深度学习路线的理论基础。", "k": 1, "v": "NeurIPS 2022"}, {"c": "Farquhar, Kossen, Kuhn & Gal (2024)", "t": "Detecting hallucinations in large language models using semantic entropy", "n": "先把多次采样按语义等价聚类再计算熵，从而区分「模型不知道」与「同一件事有多种说法」。这是不确定性量化在大模型时代的旗舰成果。", "k": 1, "v": "Nature"}], "people": [{"n": "David MacKay（Cambridge，已故）", "r": "贝叶斯证据框架、自动相关性确定"}, {"n": "Radford Neal（Toronto）", "r": "贝叶斯神经网络的 HMC 推断；无穷宽网络与高斯过程的对应"}, {"n": "Zoubin Ghahramani（Cambridge／Google）", "r": "贝叶斯非参数与近似推断的系统化"}, {"n": "Yarin Gal（Oxford OATML）", "r": "MC Dropout；语义熵与大模型幻觉检测"}, {"n": "Balaji Lakshminarayanan（Google DeepMind）", "r": "深度集成；SNGP 距离感知不确定性"}, {"n": "Andrew Gordon Wilson（NYU）", "r": "论证深度集成实为更好的贝叶斯模型平均；深度核学习"}, {"n": "Eyke Hüllermeier（LMU）& Willem Waegeman（Ghent）", "r": "aleatoric／epistemic 概念体系的建构；指出损失最小化学认知不确定性的不一致性"}, {"n": "Alex Kendall（Wayve）", "r": "视觉任务中的两类不确定性建模与多任务加权"}]}, {"id": "A22", "p": "A2", "num": "2.2", "name": "校准与统计保证理论", "kind": "leaf", "pillar": "i", "summary": "研究预测置信度是否与真实正确概率一致（校准），以及如何绕过概率数值直接给出有限样本的统计保证（Conformal Prediction）。", "why": "两条路线哲学不同：校准要求「说 80% 就真的 80% 对」，需要 i.i.d. 与渐近近似；Conformal 只要求数据可交换，就能给出有限样本精确成立的集合覆盖保证。但两者都只给边缘（平均）保证，而用户想要的条件保证在分布无关设定下被证明不可能——这个不可能三角是整个统计侧最深刻的结构性事实。", "phases": [{"t": "气象学起源（1950–1983）", "d": "校准理论的根在天气预报而非机器学习。Brier 分数及其「校准—锐度—不确定性」三项分解至今是所有校准分析的骨架；良好校准的贝叶斯预报者概念也在这一时期建立。"}, {"t": "理论范式确立与引入 ML（1998–2007）", "d": "证明存在无需任何分布假设、即使面对对抗序列也渐近校准的预测策略；恰当评分规则理论确立现代范式——在校准的约束下最大化锐度。同期 Platt 缩放与保序回归把校准作为后处理引入机器学习。同一时期 Conformal Prediction 独立创立，分裂式变体把计算代价降到一次训练，使其真正实用。"}, {"t": "深度校准危机与度量反思（2017–2021）", "d": "发现现代深度网络严重过度自信，温度缩放这一单参数方法却几乎最优；随后证明常用的 ECE 经验估计有偏且常严重低估，并给出可验证的校准误差上界。2021 年结论又被部分反转：更新的架构与更大的模型校准反而更好。"}, {"t": "从边缘走向条件（2018–2022）", "d": "公平性的不可能性定理指出校准与均等错误率不可兼得；多重校准要求在所有可计算识别的子群上同时校准且证明可高效达成，绕开了完全条件校准的不可能性。Conformal 侧则证明分布无关的条件覆盖必然要求无限宽区间，并转向加权可交换性、在线自适应与任意单调风险的控制。"}, {"t": "大模型期（2022– ）", "d": "预训练模型校准良好但 RLHF 后显著变差；生成式任务中「校准」如何定义尚无共识。Conformal 因其黑箱无关性成为最适配大模型的保证工具，被用于生成集合保证、事实性保证与科学推断。"}], "papers": [{"c": "Brier (1950)", "t": "Verification of forecasts expressed in terms of probability", "n": "提出 Brier 分数，第一次给概率预报一个可操作的评分。它使「预报得准不准」从主观判断变成可累计的统计量。", "v": "Monthly Weather Review"}, {"c": "Gneiting, Balabdaoui & Raftery (2007)", "t": "Probabilistic forecasts, calibration and sharpness", "n": "确立现代范式：预报应在满足校准的约束下最大化锐度。这句话此后成为整个概率预测领域的中心原则。", "k": 1, "v": "JRSS-B"}, {"c": "Platt (1999) / Zadrozny & Elkan (2002)", "t": "Probabilistic outputs for SVMs / Transforming classifier scores into probability estimates", "n": "用后处理把任意判别分数映射成概率（参数化的 sigmoid 与非参数的保序回归）。它们确立了「模型归模型、概率归校准器」这一至今通用的分工。", "v": "Advances in Large Margin Classifiers（MIT Press）/ KDD 2002"}, {"c": "Guo, Pleiss, Sun & Weinberger (2017)", "t": "On calibration of modern neural networks", "n": "揭示现代深度网络比 1990 年代的浅网络严重得多的过度自信，并证明单参数的温度缩放几乎最优。它把校准问题带进深度学习主流，是该方向被引最多的论文。", "k": 1, "v": "ICML 2017"}, {"c": "Kumar, Liang & Ma (2019)", "t": "Verified uncertainty calibration", "n": "指出常用的 ECE 经验估计有偏、常严重低估真实校准误差，并给出 scaling-binning 校准器与可验证的误差上界。它把「报一个 ECE 数字」升级为「给出有保证的校准误差界」。", "k": 1, "v": "NeurIPS 2019"}, {"c": "Kleinberg, Mullainathan & Raghavan (2017)", "t": "Inherent trade-offs in the fair determination of risk scores", "n": "证明校准、均等假阴率、均等假阳率三者除平凡情形外不可兼得。它是算法公平领域影响最大的结果，也直接约束了校准能承诺什么。", "k": 1, "v": "ITCS 2017"}, {"c": "Hébert-Johnson, Kim, Reingold & Rothblum (2018)", "t": "Multicalibration: calibration for the (computationally-identifiable) masses", "n": "要求在所有能被某个计算类识别的子群上同时校准，并证明这可以高效达成。它在完全条件校准不可能与边缘校准太弱之间找到了正确的中间地带。", "k": 1, "v": "ICML 2018"}, {"c": "Vovk, Gammerman & Shafer (2005)", "t": "Algorithmic Learning in a Random World", "n": "系统建立 Conformal Prediction：仅凭数据可交换性，就能给任意黑箱模型配上有限样本精确成立的覆盖保证。这是整棵树上假设最弱、保证最硬的结果。", "k": 1, "v": "Springer（专著，第 2 版 2022）"}, {"c": "Romano, Patterson & Candès (2019)", "t": "Conformalized quantile regression", "n": "以分位数回归作为基础分数，使预测区间的宽度自适应于异方差。它解决了 Conformal 早期区间等宽因而在困难区域过窄、简单区域过宽的核心缺陷。", "v": "NeurIPS 2019"}, {"c": "Barber, Candès, Ramdas & Tibshirani (2021)", "t": "The limits of distribution-free conditional predictive inference", "n": "证明在无分布假设下，任何具有非平凡条件覆盖的方法其区间必然无限宽。这个不可能性定理重新定向了整个领域，此后工作都转向近似条件或组条件覆盖。", "k": 1, "v": "Information and Inference（IMA）"}], "people": [{"n": "Tilmann Gneiting（HITS）& Adrian Raftery（UW）", "r": "恰当评分规则理论；校准约束下最大化锐度的范式"}, {"n": "A. Philip Dawid（Cambridge）", "r": "良好校准的贝叶斯预报者概念，校准的贝叶斯基础"}, {"n": "Dean Foster & Rakesh Vohra（Penn）", "r": "渐近校准的存在性——对抗序列下仍可校准"}, {"n": "Kilian Weinberger（Cornell）", "r": "温度缩放；揭示现代网络的校准危机"}, {"n": "Percy Liang & Ananya Kumar（Stanford）", "r": "可验证校准；指出 ECE 估计的系统性偏差"}, {"n": "Omer Reingold、Michael P. Kim、Aaron Roth", "r": "多重校准与 omnipredictor——把校准提升为通用充分统计量"}, {"n": "Vladimir Vovk（Royal Holloway）", "r": "Conformal Prediction 的创立者"}, {"n": "Emmanuel Candès（Stanford）", "r": "把 Conformal 带入主流统计；CQR、协变量偏移下的加权可交换性"}, {"n": "Rina Foygel Barber（Chicago）", "r": "条件覆盖的不可能性定理；非可交换数据下的覆盖退化界"}, {"n": "Michael I. Jordan、Anastasios Angelopoulos & Stephen Bates", "r": "风险控制预测集（RCPS）与 conformal risk control；prediction-powered inference"}]}, {"id": "A23", "p": "A2", "num": "2.3", "name": "可信边界与认证理论", "kind": "leaf", "pillar": "i", "summary": "研究模型在哪些输入区域内可信，何时应当拒绝预测，以及如何给出可被第三方检验的形式化认证。三者是点—域—证的递进：样本级弃权、输入空间级刻画、可交付的数学证书。", "why": "这是可信 AI 从技术属性走向工程凭证与监管接口的地方。前面所有内容产生的是「数」和「保证」，这里把它们变成行动与凭证——证书的价值在于可传递：第三方无需信任生产者，只需检验证书。", "phases": [{"t": "最优拒识的经典理论（1957–1970）", "d": "Chow 证明在已知真实后验概率时，最优规则是按最大后验概率阈值化，并刻画了错误率与拒识率的权衡曲线。此后半个世纪的工作，本质上都在处理「后验估计不准时该怎么办」。"}, {"t": "代理损失与一致性（2006–2016）", "d": "给出对拒识 Fisher 一致的凸代理损失，把拒识纳入统计学习理论的标准框架；随后的双函数框架同时学习预测器与拒识器，并给出泛化界，成为拒识理论最完整的现代形式。"}, {"t": "深度模型上的保证（2017–2019）", "d": "选择性分类给出带 PAC 保证的做法：给定目标风险与置信水平，用二项尾界选阈值。同期形式化验证进入深度学习——SMT 求解器在空中防撞网络上验证安全性质，抽象解释把程序分析工具移植过来。"}, {"t": "可扩展认证与其边界（2018–2021）", "d": "凸松弛的界传播实现了可微的认证训练，分支定界方法成为事实上的最先进验证器；但同时证明所有单神经元凸松弛存在共同精度上限。随机平滑则用高斯噪声加 Neyman–Pearson 引理给出紧的概率认证，且完全模型无关、可扩展到 ImageNet 规模。"}, {"t": "负面结果与战略转移（2020– ）", "d": "发现分布偏移下用模型自身置信度拒识严重失效、拒识会放大群体间差异。大模型上形式化认证基本不可行，主流退到统计保证——这是可信 AI 保证范式最重要的一次转移：从数学证明退到统计证据，从最坏情况退到高概率。"}], "papers": [{"c": "Chow (1970)", "t": "On optimum recognition error and reject tradeoff", "n": "给出已知后验时的最优拒识规则与错误—拒识权衡曲线。它是拒识、选择性预测与 OOD 检测三个方向共同的起点。", "k": 1, "v": "IEEE Transactions on Information Theory"}, {"c": "Steinwart, Hush & Scovel (2005)", "t": "A classification framework for anomaly detection", "n": "把异常检测严格地等同于密度水平集估计，并给出一致性理论。它为「模型在哪片区域可信」提供了现成但至今很少被用到深度模型上的统计工具。", "v": "JMLR"}, {"c": "Bartlett & Wegkamp (2008)", "t": "Classification with a reject option using a hinge loss", "n": "给出对带拒识的分类 Fisher 一致的广义 hinge 损失。它让拒识可以像普通分类一样用凸优化求解，并保留统计最优性。", "v": "JMLR"}, {"c": "Cortes, DeSalvo & Mohri (2016)", "t": "Learning with rejection", "n": "提出预测器与拒识器联合学习的双函数框架，给出一致的代理损失族与泛化界。这是拒识理论最完整的现代框架，此后工作都以它为基准。", "k": 1, "v": "ALT 2016"}, {"c": "Geifman & El-Yaniv (2017)", "t": "Selective classification for deep neural networks", "n": "给定目标风险与置信水平，用二项尾界选择阈值，输出带 PAC 保证的选择性分类器。这是深度模型上第一个有严格保证的拒识方法。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Katz, Barrett, Dill, Julian & Kochenderfer (2017)", "t": "Reluplex: an efficient SMT solver for verifying deep neural networks", "n": "扩展单纯形法处理 ReLU 的分段线性约束，在真实的空中防撞网络上验证安全性质。它标志形式化验证正式进入深度学习，并确立了长期使用的基准。", "k": 1, "v": "CAV 2017（2024 年 CAV 奖）"}, {"c": "Wong & Kolter (2018)", "t": "Provable defenses against adversarial examples via the convex outer adversarial polytope", "n": "用线性规划对偶给出可微的鲁棒误差上界，从而第一次实现在训练时直接优化认证界。认证从事后检验变成训练目标。", "v": "ICML 2018"}, {"c": "Cohen, Rosenfeld & Kolter (2019)", "t": "Certified adversarial robustness via randomized smoothing", "n": "用高斯噪声平滑分类器，并用 Neyman–Pearson 引理证明所得 ℓ₂ 认证半径是紧的。它完全模型无关且可扩展到 ImageNet，是认证方向唯一在大模型尺度可用的路线。", "k": 1, "v": "ICML 2019"}, {"c": "Salman, Yang, Zhang, Hsieh & Zhang (2019)", "t": "A convex relaxation barrier to tight robustness verification", "n": "证明所有基于单神经元凸松弛的验证方法存在共同的精度上限。这个负面结果框定了整条技术路线的天花板，推动了多神经元松弛的发展。", "v": "NeurIPS 2019"}, {"c": "Jones, Sagawa, Koh, Kumar & Liang (2021)", "t": "Selective classification can magnify disparities across groups", "n": "证明拒识在降低整体风险的同时可能提高弱势群体的风险。它揭示了安全机制与公平目标之间一个此前无人察觉的冲突，对高风险部署有直接政策含义。", "k": 1, "v": "ICLR 2021"}], "people": [{"n": "C. K. Chow（IBM）", "r": "最优拒识规则与错误—拒识权衡曲线（1957、1970）"}, {"n": "Peter Bartlett & Marten Wegkamp", "r": "带拒识分类的一致代理损失与极小极大率"}, {"n": "Corinna Cortes & Mehryar Mohri（Google／NYU）", "r": "learning with rejection 的双函数框架与一致性理论"}, {"n": "Ran El-Yaniv & Yonatan Geifman（Technion）", "r": "选择性分类的可学习性理论；带 PAC 保证的深度拒识（SGR、SelectiveNet）"}, {"n": "Guy Katz & Clark Barrett（HUJI／Stanford）", "r": "Reluplex 与 Marabou——神经网络的完备形式化验证"}, {"n": "Martin Vechev（ETH Zurich）", "r": "AI² 与 DeepPoly——把抽象解释用于神经网络验证"}, {"n": "J. Zico Kolter（CMU）", "r": "凸外多面体认证训练；随机平滑的紧界证明"}, {"n": "张欢 Huan Zhang（UIUC）& 谢宗易 Cho-Jui Hsieh（UCLA）", "r": "CROWN 与 α,β-CROWN——连年赢得国际神经网络验证竞赛的最先进验证器"}, {"n": "Clayton Scott（Michigan）", "r": "Neyman–Pearson 分类——在硬约束下学习的正确统计框架"}, {"n": "David Sontag & Hussein Mozannar（MIT）", "r": "learning to defer 的一致估计——拒识后交给人类专家的理论"}]}, {"id": "B", "p": "root", "num": "二", "name": "可管 Regulatability", "kind": "branch", "pillar": "ii", "summary": "研究模型进入社会应用后，其行为是否能够被度量、解释、审计和约束。", "extra": "提问对象从「模型 + 数据分布」变成「模型 + 一群人」。这一支的四个方向对应四种社会要求：对不同人是否一视同仁（公平）、是否泄露个人信息（隐私）、行为能否被外部理解与检查（可解释与可审计）、目标是否真的来自人类意图（价值对齐）。它们共享一个数学特征：几乎每个方向的核心结果都是不可能性定理——多个合理的要求无法同时满足，因此实践中必须显式地做取舍。"}, {"id": "B1", "p": "B", "num": "1", "name": "公平学习理论", "kind": "group", "pillar": "ii", "summary": "研究机器学习决策如何避免对不同个体或群体产生系统性不公平。", "extra": "三个子方向回答三个递进的问题：公平在数学上怎么定义、不同定义能否兼容（度量与相容性）；观察到的差距里有多少是真正的歧视（因果公平）；在给定公平约束下如何训练模型、代价多大（约束学习）。这个领域的成熟标志是它很早就证明了自己的核心不可能性，此后的工作都在这个约束下寻找可行的折中。"}, {"id": "B11", "p": "B1", "num": "1.1", "name": "公平性度量与相容性理论", "kind": "leaf", "pillar": "ii", "summary": "研究如何用数学定义公平，以及不同公平准则能否同时满足。主要有个体公平（相似的人应被相似对待）与群体公平（各群体的统计指标应相等）两大类，后者又分为人口均等、均等几率、预测均等等互不相容的版本。", "why": "这个方向最重要的产出是不可能性定理：校准、均等假阴率、均等假阳率三者除非基率相等或完美预测否则无法兼得。这意味着「公平」不是一个可以同时最大化的目标，而是一个必须公开选择立场的政策问题——技术无法替代这个选择。", "phases": [{"t": "教育测量学前史（1960s–1970s）", "d": "心理测量学界围绕入学考试是否对少数族裔不公展开争论，Cleary 模型（回归公平）与 Thorndike 模型（选拔率公平）已经互相矛盾。当时就已发现不同公平定义在数学上不可兼容，但这一教训在机器学习界被重新发现花了四十年。"}, {"t": "机器学习的形式化（2012–2015）", "d": "个体公平被公理化为对相似度度量的 Lipschitz 条件，同时指出「无视敏感属性」不等于公平（代理变量仍会泄露）。表示学习路线主张学一个抹掉敏感信息的中间表示，把公平推到表示层。"}, {"t": "群体指标与不可能性（2016–2017）", "d": "均等几率与机会均等被定义，并证明只需对已有分数做后处理即可达成，给出几何刻画。紧接着两篇独立工作证明校准与错误率均衡不可兼得，直接介入了美国司法风险评估（COMPAS）的公共辩论。这是算法公平最有影响力的时刻。"}, {"t": "细化与放松（2018–2021）", "d": "发现只在粗粒度群体上满足公平会被「公平操纵」——可以构造出在每个大群体上都公平、却在交叉子群上极不公平的模型。于是转向对指数多子群同时保证的多重校准与多精确度，并把公平视为一个计算受限的可识别性问题。同时出现对主流指标本身的批评。"}, {"t": "大模型期（2022– ）", "d": "分类指标失效：生成模型没有明确的标签与群体，伤害形式变成刻板印象、表征缺失与服务质量差异。评测转向基准探针与人工标注，理论工具尚未跟上，这是该方向当前最大的断层。"}], "papers": [{"c": "Dwork, Hardt, Pitassi, Reingold & Zemel (2012)", "t": "Fairness through awareness", "n": "提出个体公平：相似的个体应得到相似的输出，形式化为对任务相关相似度的 Lipschitz 约束。它同时指出「不看敏感属性」既不必要也不充分，奠定了整个领域的问题设定。", "k": 1, "v": "ITCS 2012"}, {"c": "Zemel, Wu, Swersky, Pitassi & Dwork (2013)", "t": "Learning fair representations", "n": "把公平推到表示层：学一个既保留任务信息又抹掉群体信息的中间表示。这是预处理路线的开创工作，也是后来所有对抗式去偏方法的原型。", "v": "ICML 2013"}, {"c": "Hardt, Price & Srebro (2016)", "t": "Equality of opportunity in supervised learning", "n": "定义均等几率与机会均等，并证明只需对已有分数做后处理（按群体调阈值或随机化）即可精确达成，给出 ROC 曲线上的几何刻画。它让群体公平从概念变成可计算的操作。", "k": 1, "v": "NeurIPS 2016"}, {"c": "Chouldechova (2017)", "t": "Fair prediction with disparate impact: a study of bias in recidivism prediction instruments", "n": "在再犯风险评分的真实背景下证明：当两群基率不同时，校准与错误率均衡在数学上不能同时成立。它把学术结论与 COMPAS 争议直接对接。", "k": 1, "v": "Big Data（期刊）"}, {"c": "Kleinberg, Mullainathan & Raghavan (2017)", "t": "Inherent trade-offs in the fair determination of risk scores", "n": "独立且更一般地证明三个公平条件除平凡情形外互斥。这个不可能性定理确立了此后所有公平研究的边界条件：必须选择放弃哪一个。", "k": 1, "v": "ITCS 2017"}, {"c": "Kearns, Neel, Roth & Wu (2018)", "t": "Preventing fairness gerrymandering: auditing and learning for subgroup fairness", "n": "揭示在粗粒度群体上的公平可被操纵，并给出对指数多子群同时保证公平的博弈论算法与审计归约。它把公平从少数几个受保护群体推广到丰富的子群结构。", "k": 1, "v": "ICML 2018"}, {"c": "Hébert-Johnson, Kim, Reingold & Rothblum (2018)", "t": "Multicalibration: calibration for the (computationally-identifiable) masses", "n": "要求在所有可被某计算类识别的子群上同时校准，并证明可高效达成。它给出了在个体公平（太强）与群体公平（太弱）之间的正确中间概念。", "k": 1, "v": "ICML 2018"}, {"c": "Corbett-Davies & Goel (2018)", "t": "The measure and mismeasure of fairness: a critical review of fair machine learning", "n": "指出主流群体指标存在 infra-marginality 问题——即使风险估计完全正确，指标仍会显示不公。主张回到「准确估计风险 + 公开阈值」的决策论视角。", "v": "arXiv 预印本"}, {"c": "Friedler, Scheidegger & Venkatasubramanian (2016, 2021)", "t": "The (im)possibility of fairness: different value systems require different mechanisms", "n": "指出所有公平定义都隐含了对「构念空间到观测空间」映射的世界观假设：认为观测就是真实，还是认为观测已被扭曲。不同世界观必然导出不同且互斥的公平机制。", "v": "Communications of the ACM"}, {"c": "Barocas & Selbst (2016)", "t": "Big data's disparate impact", "n": "系统梳理歧视如何在目标定义、标签、特征选择、样本采集等每一环节产生，并对应到美国反歧视法的差别影响原则。它是技术与法律之间被引用最多的桥梁。", "v": "California Law Review"}], "people": [{"n": "Cynthia Dwork（Harvard／Microsoft）", "r": "个体公平的公理化；同时也是差分隐私的提出者——两个领域的共同奠基人"}, {"n": "Moritz Hardt（MPI-IS）", "r": "均等几率与机会均等；后处理最优性；策略性分类"}, {"n": "Jon Kleinberg（Cornell）& Sendhil Mullainathan（Chicago）", "r": "公平指标的不可能性定理"}, {"n": "Alexandra Chouldechova（CMU）", "r": "独立证明校准与错误率均衡不可兼得，并将其与真实司法工具对接"}, {"n": "Michael Kearns & Aaron Roth（Penn）", "r": "子群公平与公平操纵；把公平审计归约为不可知学习"}, {"n": "Omer Reingold（Stanford）& Michael P. Kim", "r": "多重校准与 omnipredictor"}, {"n": "Solon Barocas（Microsoft／Cornell）", "r": "差别影响的技术—法律对应框架"}, {"n": "Suresh Venkatasubramanian & Sorelle Friedler", "r": "公平定义背后的世界观假设；公平的（不）可能性论证"}]}, {"id": "B12", "p": "B1", "num": "1.2", "name": "因果公平理论", "kind": "leaf", "pillar": "ii", "summary": "研究利用因果模型区分真正的歧视效应与表面统计相关。核心工具是把敏感属性对结果的总影响分解到不同因果路径上，只禁止那些被认为不合理的路径。", "why": "纯统计的公平指标无法区分「因为性别被歧视」和「因为选择了不同专业而结果不同」这两种情形（辛普森悖论式的伯克利招生案例）。因果公平提供了唯一能表述这一区分的语言，代价是需要一个因果图，而图本身往往不可验证。", "phases": [{"t": "中介分析的数学基础（1992–2001）", "d": "流行病学与统计学发展出直接效应与间接效应的定义，Pearl 用反事实给出自然直接／间接效应的严格定义与识别条件。这套工具原本用于研究「治疗通过什么机制起作用」，后来被整体搬用到公平上。"}, {"t": "爆发年（2017）", "d": "三篇工作同年出现：反事实公平要求「若反事实地改变个体的敏感属性，预测不变」；因果推理避免歧视把歧视定义为敏感属性经不合理路径的因果影响；路径特定效应被用作可优化的公平约束并纳入识别理论框架。这一年确立了整个子方向。"}, {"t": "分解与放松（2018–2021）", "d": "提出因果解释公式，把观测到的群体差异分解为直接、间接与伪相关三部分并给出识别条件；当因果量不可识别时，转向给出区间而非点值。同时出现路径特定的反事实公平等更精细的判据。"}, {"t": "批评与统一（2021–2023）", "d": "出现本体论层面的批评：种族、性别这类构成性属性在反事实上「改变」意味着什么并不清楚，操纵它们的假设可能不成立。作为回应，出现统一的因果公平分析框架，把各类判据组织为一个标准家族，并明确每种判据需要什么假设。"}, {"t": "大模型期（2023– ）", "d": "因果公平在生成模型上的应用刚起步：反事实数据增强、用反事实提示测量偏见。但语言模型中「因果图」是什么、敏感属性如何干预，都还没有公认的形式化。"}], "papers": [{"c": "Pearl (2001)", "t": "Direct and indirect effects", "n": "用反事实给出自然直接效应与间接效应的严格定义与识别条件，解决了传统回归中「控制中介变量」会引入偏倚的问题。这是所有路径分解式公平判据的数学底座。", "k": 1, "v": "UAI 2001"}, {"c": "Kusner, Loftus, Russell & Silva (2017)", "t": "Counterfactual fairness", "n": "提出：若在反事实世界中改变个体的敏感属性、预测保持不变，则该预测是公平的。它第一次把公平定义在个体的反事实层面，而非群体的统计层面。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Kilbertus, Rojas-Carulla, Parascandolo, Hardt, Janzing & Schölkopf (2017)", "t": "Avoiding discrimination through causal reasoning", "n": "把歧视定义为敏感属性经「不合理路径」传递的因果影响，并给出在给定因果图下判定与消除的准则。它明确指出统计判据无法区分合理与不合理的差异来源。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Nabi & Shpitser (2018)", "t": "Fair inference on outcomes", "n": "用路径特定效应作为约束，并把它放进完整的识别理论框架中，给出不可识别时的处理方式。它是因果公平里技术上最严格的一支。", "v": "AAAI 2018"}, {"c": "Zhang & Bareinboim (2018)", "t": "Fairness in decision-making — the causal explanation formula", "n": "给出因果解释公式，把观测到的总差异精确分解为直接歧视、间接歧视与伪相关三部分，并给出各部分的识别条件。它让「这个差距里有多少是歧视」成为一个可计算的量。", "k": 1, "v": "AAAI 2018"}, {"c": "Chiappa (2019)", "t": "Path-specific counterfactual fairness", "n": "允许指定哪些路径是可接受的，只对不可接受路径施加反事实不变性，并给出深度隐变量模型的推断方法。它把反事实公平从全有全无变成可细调。", "v": "AAAI 2019"}, {"c": "Wu, Zhang, Wu & Tong (2019)", "t": "PC-fairness: a unified framework for measuring causality-based fairness", "n": "统一了此前各类因果公平判据，并在因果量不可识别时给出紧的上下界。它使因果公平在图信息不完整时仍然可用。", "v": "NeurIPS 2019"}, {"c": "Karimi, von Kügelgen, Schölkopf & Valera (2020)", "t": "Algorithmic recourse under imperfect causal knowledge", "n": "处理因果图未知或部分已知时的干预效果推断，用概率保证代替点估计。它直面因果方法最大的软肋——图从哪来。", "v": "NeurIPS 2020"}, {"c": "Kasirzadeh & Smart (2021)", "t": "The use and misuse of counterfactuals in ethical machine learning", "n": "从哲学层面指出：对种族、性别等构成性社会属性做反事实操纵，在本体论上可疑，可能把社会结构问题误置为个体属性问题。这是对整条路线最重要的外部批评。", "v": "FAccT 2021"}, {"c": "Plecko & Bareinboim (2022)", "t": "Causal fairness analysis", "n": "提出统一框架，把各类因果公平判据组织成标准家族，并给出「给定什么假设可以回答什么问题」的对照表。它是目前进入该领域最系统的入口。", "k": 1, "v": "Foundations and Trends in Machine Learning"}], "people": [{"n": "Judea Pearl", "r": "自然直接／间接效应的定义与识别——因果中介分析"}, {"n": "Matt Kusner & Ricardo Silva（UCL）", "r": "反事实公平"}, {"n": "Bernhard Schölkopf & Niki Kilbertus（MPI／TU Munich）", "r": "用因果推理定义与避免歧视；路径层面的公平判据"}, {"n": "Ilya Shpitser & Razieh Nabi（JHU／Emory）", "r": "路径特定效应的公平推断与识别理论"}, {"n": "Elias Bareinboim & Drago Plecko（Columbia）", "r": "因果解释公式；因果公平分析的统一框架"}, {"n": "Silvia Chiappa（DeepMind）", "r": "路径特定反事实公平"}, {"n": "Lu Zhang & Yongkai Wu（Arkansas／Clemson）", "r": "PC-fairness——因果公平判据的统一与界"}, {"n": "Atoosa Kasirzadeh（Edinburgh／CMU）", "r": "对反事实公平的本体论批评"}]}, {"id": "B13", "p": "B1", "num": "1.3", "name": "公平约束学习理论", "kind": "leaf", "pillar": "ii", "summary": "研究在控制预测风险的同时如何满足公平约束，以及这类约束优化的算法、统计一致性、泛化保证与精度代价。", "why": "前两个子方向定义公平，这个子方向负责实现它。核心难点是公平约束通常是不可微、数据依赖甚至非凸的，且在有限样本上满足约束不等于在总体上满足——公平本身需要泛化保证，这一点长期被忽视。", "phases": [{"t": "三类干预路线成型（2013–2017）", "d": "预处理（改数据或表示）、处理中（改目标函数）、后处理（改阈值）三条路线确立。后处理被证明在已有分数最优时即可达到最优公平分类器；处理中路线则用协方差等代理把不可微约束凸化，使标准求解器可用。"}, {"t": "归约与统一（2017–2018）", "d": "证明「先学一个准确模型再修正」的两阶段做法一般不最优，必须联合优化。随后出现归约框架：把满足任意群体公平定义的分类问题化为一系列代价敏感分类问题，用鞍点方法求解，同时给出精度与公平违反度的双重保证。这是该方向最干净的理论成果。"}, {"t": "泛化与统计理论（2018–2020）", "d": "建立公平约束经验风险最小化的一致性与泛化界，说明需要多少样本才能保证总体上也公平；并处理不可微、数据依赖、比例型约束的优化理论。"}, {"t": "代价的量化（2018–2022）", "d": "用代价敏感视角给出公平的精度代价闭式；用最优传输给出公平回归的极小极大最优解及其代价；并证明表示层公平存在信息论下界——只要各群体的标签分布不同，强行对齐表示必然带来无法消除的精度损失。"}, {"t": "稳健性问题（2021– ）", "d": "发现公平性在分布偏移下不保持：在源域满足的公平约束迁移到目标域后普遍失效。这把公平与分布偏移两个分支连了起来，也说明部署时的公平审计不能只做一次。"}], "papers": [{"c": "Hardt, Price & Srebro (2016)", "t": "Equality of opportunity in supervised learning", "n": "证明在已有分数是贝叶斯最优时，最优的均等几率分类器可由逐群体阈值化与随机化得到。它给出后处理路线的最优性依据，也是所有约束方法的比较基准。", "k": 1, "v": "NeurIPS 2016"}, {"c": "Zafar, Valera, Gomez-Rodriguez & Gummadi (2017)", "t": "Fairness constraints: mechanisms for fair classification", "n": "用敏感属性与决策边界距离的协方差作为代理，把不可微的公平约束凸化为可用标准求解器处理的形式。它是处理中路线第一个实用且可扩展的方案。", "v": "AISTATS 2017"}, {"c": "Woodworth, Gunasekar, Ohannessian & Srebro (2017)", "t": "Learning non-discriminatory predictors", "n": "证明「先学最优预测器再做后处理」在一般情形下严格次优，必须在学习阶段就考虑约束；并给出非歧视预测器的样本复杂度分析。", "k": 1, "v": "COLT 2017"}, {"c": "Agarwal, Beygelzimer, Dudík, Langford & Wallach (2018)", "t": "A reductions approach to fair classification", "n": "把满足任意线性群体公平定义的分类问题归约为一系列代价敏感分类，用无悔博弈求解，并给出精度与约束违反的收敛保证。它使任何现成分类器都能被套上公平约束。", "k": 1, "v": "ICML 2018"}, {"c": "Donini, Oneto, Ben-David, Shawe-Taylor & Pontil (2018)", "t": "Empirical risk minimization under fairness constraints", "n": "建立公平约束下 ERM 的一致性与泛化界，明确指出公平本身也需要泛化——训练集上满足约束不蕴含总体上满足。", "k": 1, "v": "NeurIPS 2018"}, {"c": "Cotter, Jiang, Gupta et al. (2019)", "t": "Optimization with non-differentiable constraints with applications to fairness", "n": "用两玩家博弈处理不可微与数据依赖的约束，并给出随机分类器意义下的收敛与泛化保证。它解决了实际公平约束几乎都不可微这一工程障碍。", "v": "JMLR"}, {"c": "Menon & Williamson (2018)", "t": "The cost of fairness in binary classification", "n": "用代价敏感学习的语言给出公平约束带来的精度损失的显式刻画，说明代价如何随群体基率差异变化。它把「公平要付多少钱」变成可计算的量。", "v": "FAT* 2018（现 FAccT）"}, {"c": "Zhao & Gordon (2019, 2022)", "t": "Inherent tradeoffs in learning fair representations", "n": "给出表示层公平的信息论下界：当各群体的标签边缘分布不同时，任何满足人口均等的表示都会带来正的联合误差下界。它解释了对抗式去偏方法为何总是损失精度。", "k": 1, "v": "NeurIPS 2019 / JMLR 2022"}, {"c": "Chzhen, Denis, Hebiri, Oneto & Pontil (2020)", "t": "Fair regression with Wasserstein barycenters", "n": "证明满足人口均等的最优公平回归函数是各群体条件分布的 Wasserstein 重心，并给出精度代价的闭式与极小极大最优估计。这是公平学习中最优美的统计结果之一。", "k": 1, "v": "NeurIPS 2020"}, {"c": "Schrouff et al. (2022)", "t": "Diagnosing failures of fairness transfer across distribution shift in real-world medical settings", "n": "在真实医疗数据上证明源域满足的公平约束迁移到目标域后普遍失效，并分类了失效的机制。它说明一次性的公平认证在部署中不成立。", "v": "NeurIPS 2022"}], "people": [{"n": "Nathan Srebro（TTIC）", "r": "非歧视预测器理论；证明两阶段做法次优"}, {"n": "Alekh Agarwal、Miroslav Dudík & John Langford（Microsoft）", "r": "公平分类的归约框架——把公平约束化为代价敏感分类序列"}, {"n": "Massimiliano Pontil & Michele Donini（UCL／Amazon）", "r": "公平约束 ERM 的一致性与泛化理论"}, {"n": "Robert Williamson & Aditya Menon（Tübingen／Google）", "r": "公平的精度代价的代价敏感刻画"}, {"n": "Philippe Rigollet（MIT）& Jean-Michel Loubes", "r": "公平回归的 Wasserstein 重心解与极小极大最优性"}, {"n": "Han Zhao（UIUC）", "r": "公平表示学习的信息论下界"}, {"n": "Krishna Gummadi & Muhammad Bilal Zafar（MPI-SWS）", "r": "公平约束的凸代理与不同影响／不同处理的区分"}, {"n": "Maya Gupta & Andrew Cotter（Google）", "r": "不可微与数据依赖约束的两玩家优化理论"}]}, {"id": "B2", "p": "B", "num": "2", "name": "隐私保护学习理论", "kind": "group", "pillar": "ii", "summary": "研究机器学习过程中如何限制对训练数据和个人信息的泄露。", "extra": "三个子方向分别回答：怎样严格定义隐私并设计满足它的算法（差分隐私）、为此必须付出多少精度与样本代价（隐私—效用权衡）、以及事后如何撤回某条数据的影响（机器遗忘）。这一支是可信 AI 里数学最成熟的部分——隐私有一个被普遍接受的形式化定义，这在其他方向上都还没做到。"}, {"id": "B21", "p": "B2", "num": "2.1", "name": "差分隐私学习理论", "kind": "leaf", "pillar": "ii", "summary": "研究用严格的概率定义限制单个样本对模型输出的影响：改变数据集中任意一条记录，输出分布的变化被 e^ε 因子界住。核心内容包括机制设计、组合定理、隐私放大与私有学习算法。", "why": "差分隐私之所以成为标准，在于它有三条其他隐私概念不具备的性质：不依赖攻击者的背景知识、对后处理封闭、可组合。这使得复杂系统的隐私损失可以像预算一样被累加与管理，从而第一次让「隐私」成为一个可工程化的量。", "phases": [{"t": "定义与基本机制（2006–2010）", "d": "ε-差分隐私被提出，配合拉普拉斯机制与敏感度概念，给出第一批可证明的算法；随后指数机制把它推广到非数值输出。高级组合定理证明多次访问的隐私损失以根号而非线性增长，使复杂算法在可接受预算内成为可能。"}, {"t": "私有学习的理论框架（2008–2014）", "d": "私有 PAC 学习被定义，并证明本地模型下的私有学习能力恰好等于统计查询学习——这给出了本地差分隐私的能力上限。同期私有经验风险最小化的目标扰动方法给出凸问题上的最优率。"}, {"t": "深度学习的可行化（2016）", "d": "DP-SGD 通过逐样本梯度裁剪加噪声，配合矩会计精确追踪隐私损失，第一次让深度模型的私有训练在可用精度下实现。这是整个方向从理论走向实践的转折点。"}, {"t": "精细会计与新变体（2017–2021）", "d": "Rényi 差分隐私与高斯差分隐私用更适合组合的散度或假设检验权衡函数刻画隐私，得到显著更紧的界；子采样、洗牌与迭代带来的隐私放大被系统化，使同样的噪声换来更强的保证。"}, {"t": "与学习理论的深层连接（2019– ）", "d": "证明私有 PAC 可学等价于有限 Littlestone 维，即等价于在线可学。这是学习理论近十年最漂亮的等价刻画之一，把隐私、在线学习与稳定性统一起来。同时大模型时代的抽取攻击证明无保护的模型确实会逐字泄露训练数据，把差分隐私从可选项推向必需项。"}], "papers": [{"c": "Dwork, McSherry, Nissim & Smith (2006)", "t": "Calibrating noise to sensitivity in private data analysis", "n": "提出 ε-差分隐私定义与拉普拉斯机制，第一次给「隐私」一个不依赖攻击者知识、对后处理封闭且可组合的数学定义。这是整个领域的公理。", "k": 1, "v": "TCC 2006"}, {"c": "McSherry & Talwar (2007)", "t": "Mechanism design via differential privacy", "n": "提出指数机制，把差分隐私从数值查询推广到任意输出空间上的选择问题。它使私有的模型选择、私有的拍卖设计等成为可能。", "v": "FOCS 2007"}, {"c": "Dwork, Rothblum & Vadhan (2010)", "t": "Boosting and differential privacy", "n": "证明高级组合定理：k 次 ε-DP 访问的总隐私损失约为 √k·ε 而非 k·ε。它把隐私预算的消耗速度降低了一个数量级，是复杂私有算法可行的关键。", "k": 1, "v": "FOCS 2010"}, {"c": "Kasiviswanathan, Lee, Nissim, Raskhodnikova & Smith (2011)", "t": "What can we learn privately?", "n": "定义私有 PAC 学习，并证明本地差分隐私下可学的概念类恰为统计查询可学的类。这既给出本地模型的能力上限，也解释了为何本地 DP 在高维上代价巨大。", "k": 1, "v": "SIAM Journal on Computing（FOCS 2008 会议版）"}, {"c": "Chaudhuri, Monteleoni & Sarwate (2011)", "t": "Differentially private empirical risk minimization", "n": "提出目标扰动：向优化目标而非输出加噪，给出凸 ERM 上更优的隐私—效用权衡。它是私有学习算法设计的基本范式之一。", "v": "JMLR"}, {"c": "Abadi, Chu, Goodfellow, McMahan, Mironov, Talwar & Zhang (2016)", "t": "Deep learning with differential privacy", "n": "提出 DP-SGD 与矩会计：逐样本裁剪梯度并加高斯噪声，同时精确追踪隐私损失。它第一次让深度模型的差分隐私训练在可接受的精度下变得可行。", "k": 1, "v": "ACM CCS 2016"}, {"c": "Mironov (2017)", "t": "Rényi differential privacy", "n": "用 Rényi 散度重新表述隐私损失，使高斯机制的多次组合有闭式且更紧的会计。它现在是几乎所有 DP 训练库的默认会计方式。", "v": "IEEE CSF 2017"}, {"c": "Bassily, Smith & Thakurta (2014)", "t": "Private empirical risk minimization: efficient algorithms and tight error bounds", "n": "给出私有凸 ERM 误差的匹配上下界（约 √d/(nε)），确定了这一基本问题的最优率。它是隐私—效用权衡最干净的定量结果。", "k": 1, "v": "FOCS 2014"}, {"c": "Dong, Roth & Su (2022)", "t": "Gaussian differential privacy", "n": "用假设检验的权衡函数刻画隐私，得到在组合下封闭且渐近为高斯型的 f-DP 框架，并给出中心极限定理。它是差分隐私会计理论的当代形态。", "k": 1, "v": "JRSS-B"}, {"c": "Alon, Livni, Malliaris & Moran (2019)", "t": "Private PAC learning implies finite Littlestone dimension", "n": "证明可私有 PAC 学习的概念类必有有限 Littlestone 维，即必然在线可学；后续工作证明反向也成立。这把隐私与在线学习完全等价起来，是学习理论近年最深刻的结果之一。", "k": 1, "v": "STOC 2019"}], "people": [{"n": "Cynthia Dwork（Harvard）", "r": "差分隐私的定义者；高级组合定理；获 Gödel 奖与 Knuth 奖"}, {"n": "Frank McSherry", "r": "指数机制；差分隐私的可组合编程框架"}, {"n": "Kobbi Nissim（Georgetown）& Adam Smith（BU）", "r": "敏感度框架；私有 PAC 学习；重构攻击的理论"}, {"n": "Salil Vadhan（Harvard）", "r": "组合定理与差分隐私的复杂性理论基础"}, {"n": "Aaron Roth（Penn）", "r": "差分隐私与算法公平、自适应数据分析的交叉；f-DP"}, {"n": "Kunal Talwar & Abhradeep Thakurta（Apple／Google）", "r": "私有凸优化的最优率；DP-SGD"}, {"n": "Ilya Mironov", "r": "Rényi 差分隐私"}, {"n": "Shay Moran & Roi Livni（Technion／TAU）", "r": "私有可学与在线可学的等价刻画"}, {"n": "苏炜杰 Weijie Su（Penn）", "r": "高斯差分隐私（f-DP）框架与中心极限定理"}, {"n": "Nicholas Carlini（Anthropic）", "r": "从语言模型中逐字抽取训练数据，证明记忆化的现实风险"}]}, {"id": "B22", "p": "B2", "num": "2.2", "name": "隐私—效用与样本复杂度理论", "kind": "leaf", "pillar": "ii", "summary": "研究达到一定隐私强度必须付出多少精度和样本代价：上界与下界、极小极大率、以及什么任务在给定隐私预算下根本不可学。", "why": "这个方向的结果大多是负面的，但正因如此才有价值——它划定了隐私保护的物理边界。例如本地差分隐私把有效样本量从 n 降到 nε²，在高维下代价是灾难性的；而在无限定义域上，纯差分隐私连最简单的阈值函数都学不了。这些结论直接决定了系统架构该选中心模型还是本地模型。", "phases": [{"t": "隐私的基本定律（2003–2008）", "d": "重构攻击证明：如果对数据库的查询回答得太多太准，攻击者可以近似重构整个数据库。这一结果先于差分隐私出现，并解释了为什么必须加噪——它是隐私领域的第一条不可能性定理，后来被用于分析美国人口普查数据发布。"}, {"t": "私有学习代价的刻画（2011–2015）", "d": "证明本地模型的能力等于统计查询学习；用表示维刻画纯差分隐私学习的样本复杂度；并证明在无限定义域上私有学习阈值函数需要与定义域规模相关的样本量，即纯差分隐私下不可学。这批结果说明隐私的代价有时是定性的而非定量的。"}, {"t": "凸优化与统计估计的紧界（2013–2018）", "d": "私有凸经验风险最小化的误差上下界被匹配；本地差分隐私下的统计极小极大率被系统建立，给出「隐私把有效样本量从 n 变成 nε²」这一简洁而深刻的结论。"}, {"t": "中间模型与放大（2019–2021）", "d": "洗牌模型被证明介于中心与本地之间，能以本地模型的信任假设换取接近中心模型的精度；子采样、迭代与洗牌带来的隐私放大被系统量化，成为实际系统降低代价的主要手段。"}, {"t": "根本冲突与大模型（2020– ）", "d": "证明在长尾分布下，泛化必须依赖对稀有样本的记忆，而记忆正是隐私要防止的——这揭示了隐私与效用之间一个结构性而非技术性的冲突。大模型时代则发现差分隐私微调的效用差距主要来自特征质量，预训练充分时隐私代价显著下降。"}], "papers": [{"c": "Dinur & Nissim (2003)", "t": "Revealing information while preserving privacy", "n": "证明若对数据库回答足够多的近似查询，攻击者可重构几乎全部记录。这条「隐私的基本定律」说明任何有用的数据发布都必须引入足够的噪声。", "k": 1, "v": "PODS 2003"}, {"c": "Kasiviswanathan, Lee, Nissim, Raskhodnikova & Smith (2011)", "t": "What can we learn privately?", "n": "证明本地差分隐私下的私有学习恰等价于统计查询学习，从而给出本地模型能力的精确上限，并解释了它在高维任务上的固有劣势。", "k": 1, "v": "SIAM Journal on Computing"}, {"c": "Beimel, Nissim & Stemmer (2013, 2019)", "t": "Characterizing the sample complexity of pure private learners", "n": "用表示维给出纯 ε-差分隐私学习样本复杂度的刻画，说明它可能远高于非私有学习。它是第一批把「隐私的样本代价」精确化的结果。", "v": "ITCS 2013 / JMLR 2019"}, {"c": "Bassily, Smith & Thakurta (2014)", "t": "Private ERM: efficient algorithms and tight error bounds", "n": "给出私有凸经验风险最小化误差的匹配上下界，确定这一基础问题的最优率。此后所有私有优化算法都以这个界为标尺。", "k": 1, "v": "FOCS 2014"}, {"c": "Duchi, Jordan & Wainwright (2013, 2018)", "t": "Local privacy and statistical minimax rates", "n": "建立本地差分隐私下的统计极小极大理论，给出「隐私把有效样本量从 n 降为 nε²」这一核心结论，并在均值估计、密度估计等问题上给出精确代价。", "k": 1, "v": "JASA（FOCS 2013 会议版）"}, {"c": "Bun, Nissim, Stemmer & Vadhan (2015)", "t": "Differentially private release and learning of threshold functions", "n": "证明私有学习阈值函数的样本复杂度与定义域规模呈 log* 关系，因而在无限定义域上纯差分隐私不可学。这是隐私代价定性化的最著名例子。", "k": 1, "v": "FOCS 2015"}, {"c": "Alon, Livni, Malliaris & Moran (2019)", "t": "Private PAC learning implies finite Littlestone dimension", "n": "证明可私有学习蕴含有限 Littlestone 维。它把「什么能被私有地学」这一问题化归为一个纯组合的在线学习量。", "k": 1, "v": "STOC 2019"}, {"c": "Bun, Livni & Moran (2020)", "t": "An equivalence between private classification and online prediction", "n": "给出反方向：有限 Littlestone 维蕴含可私有学习，从而完成等价刻画。私有可学与在线可学被证明是同一件事。", "k": 1, "v": "FOCS 2020"}, {"c": "Feldman (2020)", "t": "Does learning require memorization? A short tale about a long tail", "n": "证明在长尾分布下，接近最优的泛化必须记住大量只出现一次的样本。这说明隐私与效用的冲突不是算法不够好，而是问题本身的结构性质。", "k": 1, "v": "STOC 2020"}, {"c": "Tramèr & Boneh (2021)", "t": "Differentially private learning needs better features (not more data)", "n": "证明差分隐私深度学习的效用差距主要源自特征表示而非优化或噪声，用好的手工或预训练特征可大幅缩小差距。它改变了该领域的研究重心。", "v": "ICLR 2021"}], "people": [{"n": "Irit Dinur & Kobbi Nissim", "r": "重构攻击——隐私的基本定律"}, {"n": "Adam Smith（BU）", "r": "私有 PAC 学习框架；私有优化的紧界"}, {"n": "Mark Bun（BU）& Uri Stemmer（TAU）", "r": "阈值函数的私有学习下界；私有可学与在线可学的等价"}, {"n": "Shay Moran & Roi Livni", "r": "私有分类与在线预测的等价定理"}, {"n": "John Duchi、Michael I. Jordan & Martin Wainwright（Berkeley／Stanford）", "r": "本地差分隐私的统计极小极大理论"}, {"n": "Raef Bassily & Abhradeep Thakurta", "r": "私有凸 ERM 的匹配上下界"}, {"n": "Vitaly Feldman（Apple）", "r": "证明长尾泛化必须依赖记忆——隐私与效用的结构性冲突"}, {"n": "Florian Tramèr（ETH）", "r": "指出私有深度学习的瓶颈在特征而非噪声；隐私攻击的系统化评估"}]}, {"id": "B23", "p": "B2", "num": "2.3", "name": "机器遗忘理论", "kind": "leaf", "pillar": "ii", "summary": "研究如何让模型有理论保证地消除特定训练数据的影响，使删除后的模型与从未见过该数据训练出的模型不可区分（或近似不可区分），并刻画其计算、存储与精度代价。", "why": "这是被遗忘权在技术上的对应物。它与差分隐私的关键区别在于：差分隐私要求对所有样本一视同仁地保护，代价高昂；遗忘只要求事后撤回被点名的样本，因此原则上可以便宜得多。这个「严格更弱因而更便宜」的关系是该方向存在的理由，也已被严格证明。", "phases": [{"t": "问题的提出（2015–2018）", "d": "最早把「让系统忘记」形式化：如果学习算法能写成统计查询的求和形式，就能通过增量更新精确撤销某条数据。GDPR 的被遗忘权随后使这个学术问题变成了合规需求，需求端推动了整个方向的爆发。"}, {"t": "精确遗忘与定义（2019–2021）", "d": "给出删除操作的形式化定义（删除后模型分布与重训分布相同）与摊还代价下界；工程上提出分片—切片—聚合的架构，把重训代价限制在受影响的分片内。这成为精确遗忘至今的标准方案。"}, {"t": "近似与认证遗忘（2020–2021）", "d": "借用差分隐私的语言定义 (ε,δ)-认证遗忘：删除后的模型与重训模型的分布不可区分。凸模型上用影响函数近似加噪声即可颁发证书；同时给出基于梯度下降的遗忘算法及其在对抗性删除请求序列下的摊还保证。"}, {"t": "可审计性与困难性（2022–2023）", "d": "证明在算法层面定义的遗忘无法被审计——同一个模型参数可以由「删过」和「没删过」两条路径得到，因此遗忘只能在模型分布层面定义。同时出现针对遗忘系统的攻击：精心构造的删除请求可使系统的重训代价爆炸。"}, {"t": "大模型期（2023– ）", "d": "大模型遗忘成为热点（有害知识移除、版权数据移除），出现专门基准。但研究普遍发现：当前方法只是抑制了输出而非移除了知识，被遗忘的内容常能通过上下文、微调或改写提示重新引出。因此严格意义上的 LLM 遗忘目前尚不构成安全保证。"}], "papers": [{"c": "Cao & Yang (2015)", "t": "Towards making systems forget with machine unlearning", "n": "提出机器遗忘概念，指出把学习算法改写为统计查询的求和形式后，删除一条数据只需减去它的贡献。它定义了这个研究方向。", "k": 1, "v": "IEEE S&P 2015"}, {"c": "Ginart, Guan, Valiant & Zou (2019)", "t": "Making AI forget you: data deletion in machine learning", "n": "给出数据删除的形式化定义（删除后与重训同分布）与摊还计算代价的下界，并在 k-means 上给出高效算法。它把遗忘从工程技巧变成有理论的问题。", "k": 1, "v": "NeurIPS 2019"}, {"c": "Bourtoule, Chandrasekaran, Choquette-Choo, Jia, Travers, Zhang, Lie & Papernot (2021)", "t": "Machine unlearning (SISA)", "n": "用分片、切片与聚合的训练架构，使删除只需重训受影响的分片，把精确遗忘的代价降到可接受范围。它是至今工程上最被采用的方案。", "k": 1, "v": "IEEE S&P 2021"}, {"c": "Guo, Goldstein, Hannun & van der Maaten (2020)", "t": "Certified data removal from machine learning models", "n": "借差分隐私的语言定义认证移除，用牛顿步近似加噪声，在凸模型上给出与重训不可区分的证书。它开创了近似遗忘这一更实用的路线。", "k": 1, "v": "ICML 2020"}, {"c": "Neel, Roth & Sharifi-Malvajerdi (2021)", "t": "Descent-to-delete: gradient-based methods for machine unlearning", "n": "给出基于梯度下降的遗忘算法，并首次考虑对抗性构造的删除请求序列，给出摊还的精度与计算保证。它把遗忘放进了在线对抗的框架。", "v": "ALT 2021"}, {"c": "Sekhari, Acharya, Kamath & Suresh (2021)", "t": "Remember what you want to forget: algorithms for machine unlearning", "n": "从泛化而非经验风险的角度分析遗忘，给出在不损失总体精度前提下可删除样本数的上界，并证明遗忘严格弱于差分隐私因而可以更便宜。", "k": 1, "v": "NeurIPS 2021"}, {"c": "Gupta, Jung, Neel, Roth, Sharifi-Malvajerdi & Waites (2021)", "t": "Adaptive machine unlearning", "n": "处理删除请求依赖于已发布模型（自适应）的情形，给出仍然成立的保证。这是现实场景——用户看到模型输出后才决定要求删除。", "v": "NeurIPS 2021"}, {"c": "Thudi, Jia, Shumailov & Papernot (2022)", "t": "On the necessity of auditable algorithmic definitions for machine unlearning", "n": "证明任何在算法层面定义的遗忘都无法被审计：同一组参数可由删过与未删过两条路径得到。因此遗忘必须在模型分布层面定义。", "k": 1, "v": "USENIX Security 2022"}, {"c": "Maini, Feng, Schwarzschild, Lipton & Kolter (2024)", "t": "TOFU: a task of fictitious unlearning for LLMs", "n": "用虚构人物的合成传记构造可控的遗忘评测基准，避免了「模型是否本来就不知道」的混淆。它使 LLM 遗忘第一次可以被公平比较。", "v": "COLM 2024"}, {"c": "Shumailov, Hayes, Triantafillou et al. (2024)", "t": "UnUnlearning: unlearning is not sufficient for content regulation in advanced generative AI", "n": "证明被遗忘的知识可通过上下文重新引入，因而参数层面的遗忘不能作为内容管控的手段。它给当前 LLM 遗忘研究划定了能力边界。", "k": 1, "v": "arXiv 预印本"}], "people": [{"n": "Yinzhi Cao（JHU）", "r": "提出机器遗忘问题与统计查询形式的撤销"}, {"n": "James Zou & Gregory Valiant（Stanford）", "r": "数据删除的形式化定义与摊还代价下界"}, {"n": "Nicolas Papernot（Toronto／Vector）", "r": "SISA 分片遗忘架构；证明算法层遗忘定义不可审计"}, {"n": "Aaron Roth & Seth Neel（Penn／Harvard）", "r": "descent-to-delete；自适应与对抗性删除请求下的保证"}, {"n": "Ayush Sekhari & Ananda Theertha Suresh", "r": "遗忘的泛化理论；证明遗忘严格弱于差分隐私"}, {"n": "Chuan Guo & Laurens van der Maaten（Meta）", "r": "认证数据移除"}, {"n": "Zico Kolter & Zachary Lipton（CMU）", "r": "TOFU——LLM 遗忘的可控评测基准"}, {"n": "Ilia Shumailov & Eleni Triantafillou（DeepMind）", "r": "证明参数层遗忘不足以实现内容管控"}]}, {"id": "B3", "p": "B", "num": "3", "name": "可解释与可审计学习理论", "kind": "group", "pillar": "ii", "summary": "研究如何从模型的输入输出行为中理解、验证和检查黑箱模型。", "extra": "三个子方向对应三种不同的追问：为什么是这个结果（特征归因）、要改变什么才能得到别的结果（反事实与补救）、以及外部第三方能否在有限访问下验证模型确实满足某项性质（审计与性质检验）。前两者面向被决策的个人，后者面向监管者。这一支的近年主旋律是自我批评——多个曾被广泛采用的解释方法被证明并不比随机猜测更能揭示模型行为。"}, {"id": "B31", "p": "B3", "num": "3.1", "name": "特征归因理论", "kind": "leaf", "pillar": "ii", "summary": "研究如何严格量化不同输入特征对模型预测的贡献。主要路线是博弈论的 Shapley 值分配、梯度与路径积分的公理化方法，以及局部代理模型。", "why": "归因的困难不在于计算，而在于「贡献」本身没有唯一定义：必须先规定「特征缺席」是什么意思（用什么基线、按边缘还是条件分布积分），而不同规定给出不同答案。这个方向近五年最重要的结果是一系列不可能性与失效证明，说明许多广泛使用的归因图对模型参数并不敏感。", "phases": [{"t": "博弈论基础（1953）", "d": "Shapley 值被证明是唯一同时满足有效性、对称性、虚拟性与可加性的合作博弈收益分配方案。半个世纪后它被直接搬来做特征贡献分配——特征即玩家，预测值即总收益。"}, {"t": "深度模型的归因方法（2013–2017）", "d": "梯度显著图、逐层相关性传播、DeepLIFT 相继出现，但缺乏统一标准。随后两条主线确立：积分梯度用路径积分同时满足完备性、敏感性与实现不变性；SHAP 证明 LIME、DeepLIFT、LRP 等方法都可纳入 Shapley 加性解释的统一框架，并给出高效近似。"}, {"t": "失效检验（2018–2019）", "d": "发现许多显著图在模型权重被随机化后几乎不变，说明它们更像边缘检测器而非模型解释；也发现对输入做常数平移会使归因剧变。同期在 NLP 中证明注意力权重与模型实际依赖不一致。这批工作让社区从「造方法」转向「验方法」。"}, {"t": "理论化与不唯一性（2020–2021）", "d": "证明 Shapley 值在模型解释中不唯一：按条件期望还是边缘期望定义缺席、选什么基线，会给出实质不同甚至矛盾的归因，且没有原则性的理由偏好某一种。同时归因方法被统一为「移除特征再看差异」这一大类并给出统计分析。"}, {"t": "不可能性与转向机制（2022– ）", "d": "证明满足完备性与线性性的整类归因方法，在推断模型行为（如反事实结果）这一任务上不优于随机猜测。研究重心随之从「哪个特征重要」转向机制可解释性——用因果中介、激活修补去定位承担特定功能的内部电路。"}], "papers": [{"c": "Shapley (1953)", "t": "A value for n-person games", "n": "证明存在唯一满足四条公理的合作博弈收益分配。它给「贡献」一个不依赖具体算法的规范定义，是所有归因方法的公理来源。", "k": 1, "v": "Contributions to the Theory of Games II（Princeton University Press）"}, {"c": "Ribeiro, Singh & Guestrin (2016)", "t": "Why should I trust you? Explaining the predictions of any classifier (LIME)", "n": "提出在待解释样本邻域内拟合一个稀疏线性代理模型。它把解释形式化为「局部保真 + 自身可理解」的优化问题，并对任何黑箱适用。", "k": 1, "v": "KDD 2016"}, {"c": "Sundararajan, Taly & Yan (2017)", "t": "Axiomatic attribution for deep networks (Integrated Gradients)", "n": "先提出归因应满足的公理（敏感性、实现不变性、完备性），证明朴素梯度违反它们，再构造沿基线到输入路径积分梯度的方法唯一地满足它们。这是归因方法公理化的范本。", "k": 1, "v": "ICML 2017"}, {"c": "Lundberg & Lee (2017)", "t": "A unified approach to interpreting model predictions (SHAP)", "n": "证明 LIME、DeepLIFT、LRP 等方法在特定参数下都是 Shapley 加性解释的实例，并给出针对树模型的精确高效算法。它统一了碎片化的方法生态。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Adebayo, Gilmer, Muelly, Goodfellow, Hardt & Kim (2018)", "t": "Sanity checks for saliency maps", "n": "提出用模型参数随机化与标签随机化做对照，发现多数显著图在模型被彻底破坏后几乎不变。这是该领域最重要的负面结果，直接淘汰了一批方法。", "k": 1, "v": "NeurIPS 2018"}, {"c": "Kindermans et al. (2019)", "t": "The (un)reliability of saliency methods", "n": "证明对输入做与预测无关的常数平移会使多种归因方法给出完全不同的结果，说明它们缺乏基本的输入不变性。", "v": "Explainable AI（Springer LNCS）"}, {"c": "Jain & Wallace (2019)", "t": "Attention is not explanation", "n": "证明存在与原注意力分布差异很大、却给出相同预测的替代注意力，因而注意力权重不能作为模型依据的解释。它纠正了 NLP 中一个流行的误用。", "v": "NAACL 2019"}, {"c": "Sundararajan & Najmi (2020)", "t": "The many Shapley values for model explanation", "n": "系统比较基于条件期望与边缘期望的多种 Shapley 变体，证明它们互不一致且各自违反某些直觉性质，没有原则性的最优选择。它揭示了归因的本质不唯一性。", "k": 1, "v": "ICML 2020"}, {"c": "Covert, Lundberg & Lee (2021)", "t": "Explaining by removing: a unified framework for model explanation", "n": "把二十余种解释方法统一为「如何移除特征、用什么模型行为、如何汇总」三个维度的组合，并给出统计性质。它是理解整个归因方法空间的地图。", "v": "JMLR"}, {"c": "Bilodeau, Jaques, Koh & Kim (2024)", "t": "Impossibility theorems for feature attribution", "n": "证明任何满足完备性与线性性的归因方法，在推断模型对未见输入的行为这一任务上，其表现不优于随机猜测。它给整类方法划定了能力上限。", "k": 1, "v": "PNAS"}], "people": [{"n": "Lloyd Shapley（诺贝尔经济学奖）", "r": "Shapley 值的公理化唯一性"}, {"n": "Scott Lundberg & Su-In Lee（华盛顿大学）", "r": "SHAP——归因方法的统一框架与高效树算法"}, {"n": "Mukund Sundararajan（Google）", "r": "积分梯度；揭示 Shapley 式解释的不唯一性"}, {"n": "Marco Tulio Ribeiro & Carlos Guestrin", "r": "LIME 局部代理解释；Anchors 规则解释"}, {"n": "Been Kim（Google DeepMind）", "r": "TCAV 概念激活向量；显著图的合理性检验；归因的不可能性定理"}, {"n": "Julius Adebayo（MIT）", "r": "显著图的参数随机化检验"}, {"n": "Cynthia Rudin（Duke）", "r": "主张高风险场景应直接用可解释模型而非事后解释；可解释模型的最优化理论"}, {"n": "Ian Covert（Stanford）", "r": "移除式解释的统一框架与统计分析"}]}, {"id": "B32", "p": "B3", "num": "3.2", "name": "反事实解释与算法补救理论", "kind": "leaf", "pillar": "ii", "summary": "研究最小改变哪些可操作因素能够改变模型决策，以及这种建议是否真的可行、可实施、在模型更新后是否仍然有效。", "why": "这个方向的核心洞察是：离决策边界最近的那个点，通常不是当事人能真正达到的状态。改变收入会连带改变储蓄，改变学历会连带改变工作年限——因此有效的补救建议必须建立在结构因果模型上，是干预问题而非距离问题。这一区分把该方向从最优化问题变成了因果推断问题。", "phases": [{"t": "提出与法律动因（2017–2019）", "d": "反事实解释被提出作为 GDPR 意义下无需打开黑箱的解释形式：给出最近的、能翻转决策的输入。随后指出解释必须限制在可操作特征上（不能建议改变年龄或种族），并用整数规划给出可行补救的计算与「补救是否可达」的审计。"}, {"t": "因果转向（2020–2021）", "d": "明确区分反事实解释（找一个点）与算法补救（做一次干预）：由于特征间存在因果依赖，把某个特征改到目标值会连带改变下游特征，因此最近的反事实点往往既非最省力也非可达。补救被重述为在结构因果模型上求最小代价干预，并给出因果图不完整时的概率保证版本。"}, {"t": "鲁棒性问题（2021–2023）", "d": "发现给出的补救在模型微小更新或数据轻微偏移后大量失效——当事人按建议努力后，决策仍未翻转。于是出现对模型变化鲁棒的补救算法，把补救的有效性作为一个需要保证的性质而非一次性输出。"}, {"t": "与策略性行为合流（2016– ，2020 后加速）", "d": "策略性分类研究个体为通过而操纵特征，补救研究如何指导个体改变——两者是同一枚硬币的两面。关键区分是操纵（改变特征但不改变真实结果）与改进（真实结果确实变好），而这个区分只有因果模型能做出。这条线把公平、因果与激励设计连了起来。"}, {"t": "大模型期（2023– ）", "d": "自然语言形式的反事实解释易于生成却难以验证：模型给出的「如果你当时……就会……」缺乏可检验的因果基础，可能是流畅的编造。如何为生成式解释建立忠实性标准是当前的开放问题。"}], "papers": [{"c": "Wachter, Mittelstadt & Russell (2017)", "t": "Counterfactual explanations without opening the black box", "n": "提出用「最近的能翻转决策的输入」作为解释，并论证这满足 GDPR 对自动化决策说明的要求而无需公开模型。它开创了这一方向并确立了它的法律动因。", "k": 1, "v": "Harvard Journal of Law & Technology"}, {"c": "Ustun, Spangher & Liu (2019)", "t": "Actionable recourse in linear classification", "n": "把补救限制在当事人真正能改变的特征上，用整数规划求最小代价的可行改变，并提出对整个人群做「补救可达性」审计。它引入了 actionability 这一关键约束。", "k": 1, "v": "FAT* 2019（现 FAccT）"}, {"c": "Hardt, Megiddo, Papadimitriou & Wootters (2016)", "t": "Strategic classification", "n": "把分类建模为决策者与被分类者之间的博弈：个体会按已知规则操纵特征。它给出斯塔克尔伯格均衡下的最优分类器，是补救问题的镜像。", "k": 1, "v": "ITCS 2016"}, {"c": "Karimi, Schölkopf & Valera (2021)", "t": "Algorithmic recourse: from counterfactual explanations to interventions", "n": "证明由于特征间的因果依赖，最近的反事实点一般不对应可实施的最小干预，必须在结构因果模型上求解。这是该方向最重要的概念澄清。", "k": 1, "v": "FAccT 2021"}, {"c": "Karimi, von Kügelgen, Schölkopf & Valera (2020)", "t": "Algorithmic recourse under imperfect causal knowledge: a probabilistic approach", "n": "在因果图或机制未知时，用贝叶斯平均给出以高概率生效的补救建议。它让因果补救在图不可得的现实条件下仍然可用。", "v": "NeurIPS 2020"}, {"c": "Miller, Milli & Hardt (2020)", "t": "Strategic classification is causal modeling in disguise", "n": "证明区分「操纵」与「真实改进」在数学上等价于识别因果结构：只有知道哪些特征因果地影响结果，才能设计出鼓励改进而非博弈的规则。", "k": 1, "v": "ICML 2020"}, {"c": "Rawal, Kamar & Lakkaraju (2021)", "t": "Algorithmic recourse in the wild: understanding the impact of data and model shifts", "n": "系统证明补救建议在模型重训或数据偏移后大量失效，并刻画失效与偏移幅度的关系。它把鲁棒性提为补救的必要性质。", "v": "arXiv 预印本"}, {"c": "Upadhyay, Joshi & Lakkaraju (2021)", "t": "Towards robust and reliable algorithmic recourse (ROAR)", "n": "用极小极大优化生成对模型参数扰动鲁棒的补救，给出在一类模型变化下仍然有效的保证。", "v": "NeurIPS 2021"}, {"c": "von Kügelgen, Karimi, Bhatt, Valera, Weller & Schölkopf (2022)", "t": "On the fairness of causal algorithmic recourse", "n": "指出即使预测本身满足公平判据，不同群体达成补救所需的代价仍可能悬殊，并给出补救层面的公平定义。它把公平从预测扩展到救济。", "v": "AIES 2022"}, {"c": "Barocas, Selbst & Raghavan (2020)", "t": "The hidden assumptions behind counterfactual explanations and principal reasons", "n": "梳理反事实解释隐含的假设（特征可独立改变、代价可度量、模型稳定），指出多数在现实中不成立。它是该方向最有分量的批评性综述。", "v": "FAccT 2020"}], "people": [{"n": "Sandra Wachter & Brent Mittelstadt（Oxford）", "r": "反事实解释；GDPR 语境下的技术—法律对接"}, {"n": "Berk Ustun（UCSD）", "r": "actionable recourse——可操作性约束与整数规划求解"}, {"n": "Isabel Valera（Saarland）& Amir-Hossein Karimi", "r": "算法补救的因果理论：从反事实解释到最小代价干预"}, {"n": "Bernhard Schölkopf（MPI-IS）", "r": "把结构因果模型引入补救与公平救济"}, {"n": "Moritz Hardt（MPI-IS）", "r": "策略性分类；证明区分操纵与改进等价于因果建模"}, {"n": "Himabindu Lakkaraju（Harvard）", "r": "补救的鲁棒性；解释方法的对抗脆弱性"}, {"n": "Solon Barocas（Microsoft）", "r": "反事实解释隐含假设的系统梳理"}]}, {"id": "B33", "p": "B3", "num": "3.3", "name": "黑箱审计与性质检验理论", "kind": "leaf", "pillar": "ii", "summary": "研究仅通过有限次查询能否判断模型是否满足公平、安全等指定性质，包括查询复杂度、统计推断的严格性，以及被审计方能否察觉并规避审计。", "why": "这是可管这一支唯一直接面向监管者的方向。它的特殊困难在于对抗性：被审计者知道自己在被审计，可以在审计样本上表现良好而在真实流量上不然。因此审计不只是估计问题，还是一个博弈问题——这使它与统计估计有本质区别。", "phases": [{"t": "性质检验的理论根源（1996–2000s）", "d": "计算机科学中的性质检验研究：用亚线性的查询次数判断一个对象具有某性质还是远离该性质。它提供了「有限访问下能验证什么」的一般框架，也确立了查询复杂度这一度量。"}, {"t": "早期算法审计（2014–2018）", "d": "提出通过干预输入分布来量化各特征对输出的影响，作为透明度报告的技术手段；并出现针对间接影响（敏感属性通过代理泄露）的黑箱检测方法。这一阶段主要是把解释方法改造成审计工具。"}, {"t": "审计的形式化归约（2018–2021）", "d": "证明「在指数多个子群上检查公平」可归约为不可知学习问题，从而审计的难度有了明确的学习理论刻画，也说明审计与学习一样受计算与样本的限制。同时出现无法获得敏感属性时用代理进行审计的理论。"}, {"t": "对抗性审计（2020–2024）", "d": "构造性地证明被审计方可以通过精心挑选提交给审计者的样本，在保持真实歧视的同时通过公平审计。随后系统论证仅有黑箱访问不足以支撑严格审计，需要不同层级的访问权限（权重、训练数据、内部激活）。这把审计从技术问题变成了制度设计问题。"}, {"t": "统计严格化与大模型（2022– ）", "d": "用同时置信界与多重检验，把审计变成对众多子群公平差距的严格统计推断，控制整体错误率；主动学习被用来降低审计所需的标注查询量。大模型时代新增困难：评测数据污染、模型可识别评测环境、以及危险能力评估缺乏统计学基础。"}], "papers": [{"c": "Goldreich, Goldwasser & Ron (1998)", "t": "Property testing and its connection to learning and approximation", "n": "建立性质检验框架：用远少于读取全部数据的查询次数，区分「具有性质」与「远离性质」。它是所有有限访问验证问题的理论母体。", "k": 1, "v": "Journal of the ACM"}, {"c": "Datta, Sen & Zick (2016)", "t": "Algorithmic transparency via quantitative input influence", "n": "通过对输入分布做干预来量化单个或一组特征对输出的因果影响，并给出可用于透明度报告的度量。它是审计工具化的早期代表。", "v": "IEEE S&P 2016"}, {"c": "Kearns, Neel, Roth & Wu (2018)", "t": "Preventing fairness gerrymandering", "n": "把在指数多子群上审计公平归约为不可知学习问题，给出可用的算法与样本复杂度。它使子群审计第一次有了严格的复杂度刻画。", "k": 1, "v": "ICML 2018"}, {"c": "Bastani, Zhang & Solar-Lezama (2019)", "t": "Probabilistic verification of fairness properties via concentration", "n": "用集中不等式给出「模型以高概率满足某公平性质」的形式化验证，把程序验证的思路引入公平审计。", "v": "OOPSLA 2019（PACMPL）"}, {"c": "Fukuchi, Hara & Maehara (2020)", "t": "Faking fairness via stealthily biased sampling", "n": "构造性地证明被审计方可以挑选一个看似随机、实则精心偏置的样本集提交审计，从而在真实歧视存在时仍通过审计。它揭示审计的对抗本质。", "k": 1, "v": "AAAI 2020"}, {"c": "Diana, Gill, Kearns, Kenthapadi, Roth & Sharifi-Malvajerdi (2022)", "t": "Multiaccurate proxies for downstream fairness", "n": "在无法直接获得敏感属性时，用多精确度代理进行公平估计与保证。它解决了审计中最常见的现实障碍——法律往往禁止收集敏感属性。", "v": "FAccT 2022"}, {"c": "Yan & Zhang (2022)", "t": "Active fairness auditing", "n": "用主动学习选择最有信息量的查询，给出达到给定审计精度所需查询次数的上下界。它把审计成本作为一个可优化的量。", "k": 1, "v": "NeurIPS 2022"}, {"c": "Cherian & Candès (2023)", "t": "Statistical inference for fairness auditing", "n": "用自助法与多重检验给出对大量子群公平差距的同时置信界，控制族错误率。它把审计从点估计升级为严格的统计推断，是该方向近年最重要的方法论进展。", "k": 1, "v": "JASA"}, {"c": "Raji, Smart, White, Mitchell, Gebru, Hutchinson, Smith-Loud, Theron & Barnes (2020)", "t": "Closing the AI accountability gap: defining an end-to-end framework for internal algorithmic auditing", "n": "给出组织内部算法审计的完整流程框架（范围界定、映射、制品收集、测试、反思）。它虽非数学工作，却定义了审计作为一种实践的形态。", "v": "FAccT 2020"}, {"c": "Casper et al. (2024)", "t": "Black-box access is insufficient for rigorous AI audits", "n": "系统论证仅有黑箱查询无法支撑严格审计，并给出白箱、外框（训练数据、方法）等不同访问层级各自能支持的审计结论。它为监管访问权限的设计提供了技术依据。", "k": 1, "v": "FAccT 2024"}], "people": [{"n": "Oded Goldreich、Shafi Goldwasser & Dana Ron", "r": "性质检验框架——有限查询下的验证理论"}, {"n": "Anupam Datta（CMU）", "r": "量化输入影响（QII）——干预式的透明度度量"}, {"n": "Michael Kearns & Aaron Roth（Penn）", "r": "子群公平审计归约为不可知学习；无敏感属性下的代理审计"}, {"n": "Emmanuel Candès（Stanford）", "r": "公平审计的同时置信界与多重检验框架"}, {"n": "Chicheng Zhang（Arizona）", "r": "主动公平审计的查询复杂度界"}, {"n": "Kazuto Fukuchi & Satoshi Hara", "r": "构造性证明公平审计可被隐蔽偏置采样欺骗"}, {"n": "Deborah Raji & Timnit Gebru", "r": "端到端算法审计框架；把审计确立为一种制度实践"}, {"n": "Stephen Casper & Dylan Hadfield-Menell（MIT）", "r": "论证黑箱访问不足以支撑严格审计，提出访问层级方案"}]}, {"id": "B4", "p": "B", "num": "4", "name": "偏好学习与价值对齐理论", "kind": "group", "pillar": "ii", "summary": "研究如何从人类反馈中学习目标，使模型行为符合人类偏好和规范。", "extra": "三个子方向沿着一条技术链展开：目标能不能从行为或比较中被唯一恢复（可识别性）、只靠偏好反馈学策略要多少样本与多大遗憾（基于偏好的强化学习）、能否跳过奖励模型直接优化策略（直接偏好优化）。第一个问题是整条链的地基——如果奖励本身不可识别，后面的效率讨论就失去意义；而现有理论恰恰表明，多数反馈形式下奖励只能部分识别。"}, {"id": "B41", "p": "B4", "num": "4.1", "name": "奖励与偏好可识别性理论", "kind": "leaf", "pillar": "ii", "summary": "研究从有限的行为演示或比较数据中，能否唯一恢复真实的奖励函数与偏好结构，以及不可识别时能确定到什么程度（部分识别）。", "why": "这是价值对齐的地基问题，而结论从一开始就是负面的：逆强化学习被提出的同一篇论文就指出奖励不可识别——常数偏移、正比例缩放、以及势函数整形都不改变最优策略。这意味着从行为反推目标在原理上有多解，对齐失败常常不是算法不够好，而是数据里根本没有足够信息。", "phases": [{"t": "提出与不可识别性（1998–2000）", "d": "逆强化学习被正式提出：给定专家行为反推其奖励。同一批工作立刻指出该问题严重欠定——存在退化解（全零奖励使一切策略最优），而势函数整形给出了一整族保持最优策略不变的奖励变换。这个等价类是不可识别性的结构性来源。"}, {"t": "用额外原则消歧（2004–2010）", "d": "最大间隔方法要求专家策略优于其他策略一个间隔；最大熵方法在匹配特征期望的所有分布中选熵最大者，从而挑出唯一解；贝叶斯方法则用先验表达偏好。这些都不是恢复了可识别性，而是引入了额外的假设来选择一个代表元。"}, {"t": "目标的表达边界（2017–2021）", "d": "提出设计者给出的奖励只是真实目标在训练环境中的证据，应作贝叶斯推断而非照单执行，直接催生了奖励误设研究。随后证明许多自然任务根本无法用马尔可夫奖励表示，说明问题不只是识别，还有表达能力的上限。"}, {"t": "部分可识别性的系统刻画（2021–2023）", "d": "给出何时可识别的条件（例如需要多个折扣因子或多个环境），并系统刻画各类反馈（专家策略、轨迹比较、演示）各自把奖励确定到多大的等价类。奖励黑客也被形式化：当代理奖励与真实奖励的序关系不一致时，优化必然在某点开始损害真实目标。"}, {"t": "RLHF 时代（2023– ）", "d": "发现 Bradley–Terry 偏好模型在人群偏好异质时会隐式地做 Borda 计数式聚合，导致学到的既非任何个体的偏好也非合理的社会选择，并可被策略性操纵。人类反馈的可识别性成为对齐研究的核心议题。"}], "papers": [{"c": "Ng & Russell (2000)", "t": "Algorithms for inverse reinforcement learning", "n": "提出逆强化学习问题，同时指出它严重欠定：多个奖励函数能解释同一最优策略，包括平凡的全零解。这既开创了方向，也定义了它此后二十五年的核心困难。", "k": 1, "v": "ICML 2000"}, {"c": "Ng, Harada & Russell (1999)", "t": "Policy invariance under reward transformations: theory and application to reward shaping", "n": "证明基于势函数的奖励整形不改变最优策略，且这是唯一具有此性质的变换族。它精确刻画了奖励不可识别性的结构来源。", "k": 1, "v": "ICML 1999"}, {"c": "Abbeel & Ng (2004)", "t": "Apprenticeship learning via inverse reinforcement learning", "n": "绕开恢复奖励本身，只要求学到的策略在特征期望上匹配专家，从而给出有性能保证的算法。它把不可识别性从障碍变成可以回避的问题。", "v": "ICML 2004"}, {"c": "Ziebart, Maas, Bagnell & Dey (2008)", "t": "Maximum entropy inverse reinforcement learning", "n": "在所有匹配专家特征期望的轨迹分布中选熵最大者，从而唯一确定解并自然处理次优演示。最大熵原则至今是逆强化学习的默认消歧方式。", "k": 1, "v": "AAAI 2008"}, {"c": "Hadfield-Menell, Milli, Abbeel, Russell & Dragan (2017)", "t": "Inverse reward design", "n": "提出设计者写下的奖励只是真实目标在训练环境下的证据，应对真实目标做贝叶斯推断并在不确定时保守行动。它把奖励误设从工程事故变成一个推断问题。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Hadfield-Menell, Dragan, Abbeel & Russell (2016)", "t": "Cooperative inverse reinforcement learning", "n": "把价值对齐建模为人与机器的合作博弈，机器不知道奖励而必须从人的行为中推断，同时人也知道机器在学。它给出对齐问题的第一个博弈论形式化。", "v": "NeurIPS 2016"}, {"c": "Cao, Cohen & Szpruch (2021)", "t": "Identifiability in inverse reinforcement learning", "n": "给出奖励可识别的充分条件，例如观察到同一专家在多个折扣因子或多个环境下的行为。它是第一批正面的可识别性结果。", "v": "NeurIPS 2021"}, {"c": "Abel, Dabney, Harutyunyan, Ho, Littman, Precup & Singh (2021)", "t": "On the expressivity of Markov reward", "n": "证明存在大量自然任务（如某些行为约束与偏序目标）无法用任何马尔可夫奖励函数表示。它说明对齐的困难不止于识别，还在于奖励这一表达形式本身有界。", "k": 1, "v": "NeurIPS 2021（杰出论文）"}, {"c": "Skalse, Howe, Krasheninnikov & Krueger (2022)", "t": "Defining and characterizing reward hacking", "n": "形式化定义奖励黑客（优化代理奖励导致真实奖励下降），并给出不可黑客的充要条件——结论是除非极强的条件，否则黑客不可避免。", "k": 1, "v": "NeurIPS 2022"}, {"c": "Siththaranjan, Laidlaw & Hadfield-Menell (2024)", "t": "Distributional preference learning: understanding and accounting for hidden context in RLHF", "n": "证明当标注者群体偏好异质时，标准 RLHF 隐式地在做 Borda 计数式聚合，因而结果既不代表任何个体也不具备好的社会选择性质，并给出可检测该问题的方法。", "k": 1, "v": "ICLR 2024"}], "people": [{"n": "Stuart Russell（Berkeley）", "r": "逆强化学习的提出；合作逆强化学习与价值对齐纲领"}, {"n": "Andrew Ng（Stanford）", "r": "IRL 算法与不可识别性；势函数整形的唯一性定理"}, {"n": "Brian Ziebart & Drew Bagnell（CMU）", "r": "最大熵逆强化学习"}, {"n": "Anca Dragan & Dylan Hadfield-Menell（Berkeley／MIT）", "r": "逆奖励设计；合作逆强化学习；RLHF 中的隐藏上下文"}, {"n": "Pieter Abbeel（Berkeley）", "r": "学徒学习——绕开奖励恢复的特征期望匹配"}, {"n": "David Abel & Michael Littman & Satinder Singh", "r": "马尔可夫奖励的表达边界（奖励假设的边界）"}, {"n": "Joar Skalse & David Krueger（Oxford／Cambridge）", "r": "奖励黑客的形式化；各类反馈下奖励的部分可识别集刻画"}, {"n": "Alessandro Abate（Oxford）", "r": "逆强化学习可识别性的正面条件"}]}, {"id": "B42", "p": "B4", "num": "4.2", "name": "基于偏好的强化学习理论", "kind": "leaf", "pillar": "ii", "summary": "研究只依赖偏好（成对或多元比较）反馈来学习策略时的样本复杂度、遗憾界与收敛性质，以及它与使用数值奖励的标准强化学习相比难在哪里。", "why": "人类给数值分数不可靠但做比较很可靠，因此偏好反馈是对齐的现实接口。理论要回答的是：放弃数值信息要付出多少代价。目前的结论较为乐观——多数设定下偏好反馈的样本复杂度与标准强化学习同阶；但当人群偏好非传递时，奖励最大化本身就不是正确的解概念，需要换成博弈的均衡。", "phases": [{"t": "决斗赌博机（2009–2015）", "d": "最早的形式化出现在赌博机设定：每轮选两个臂做比较、只观察谁更好，目标是最小化与最优臂的遗憾。这一时期建立了比较反馈下的遗憾下界与近最优算法，并处理了偏好可能非传递的情形。"}, {"t": "偏好强化学习的提出（2012–2017）", "d": "把比较反馈推广到序贯决策：从轨迹比较中学奖励模型再做强化学习。深度版本用极少量人类比较训练出复杂行为，成为后来 RLHF 的技术原型。这一阶段以经验为主，理论几乎空白。"}, {"t": "理论化（2020–2023）", "d": "给出轨迹偏好下的遗憾界与一般函数逼近下的样本复杂度；在离线设定中证明悲观最大似然估计的次优性界，并指出关键量是数据对最优策略的覆盖系数。同时给出归约，说明在多数标准设定下偏好反馈并不比数值奖励更难。"}, {"t": "非传递偏好与博弈解（2023– ）", "d": "当人群偏好不满足传递性时，不存在与之一致的奖励函数，Bradley–Terry 模型必然误设。正确的解概念被改为偏好博弈的纳什均衡，出现了以极小极大而非奖励最大化为目标的算法。这是该方向近年最重要的概念转变。"}], "papers": [{"c": "Yue, Broder, Kleinberg & Joachims (2012)", "t": "The K-armed dueling bandits problem", "n": "提出只观察成对比较结果的赌博机模型，给出遗憾下界与近最优算法。它是所有偏好学习理论的原型问题。", "k": 1, "v": "Journal of Computer and System Sciences（COLT 2009 会议版）"}, {"c": "Wirth, Akrour, Neumann & Fürnkranz (2017)", "t": "A survey of preference-based reinforcement learning methods", "n": "系统梳理偏好反馈的类型（动作、状态、轨迹偏好）与三类学习范式，统一了此前分散的工作。它是进入该领域的标准入口。", "v": "JMLR"}, {"c": "Christiano, Leike, Brown, Martic, Legg & Amodei (2017)", "t": "Deep reinforcement learning from human preferences", "n": "用不到千次人类比较训练奖励模型再做强化学习，在复杂控制任务上学到难以手写奖励的行为。它是 RLHF 的直接技术原型，深刻影响了后来的大模型对齐。", "k": 1, "v": "NeurIPS 2017"}, {"c": "Pacchiano, Saha & Lee (2021)", "t": "Dueling RL: reinforcement learning with trajectory preferences", "n": "给出轨迹偏好设定下的算法与遗憾界，第一次把决斗赌博机的理论推广到有状态转移的序贯决策。", "k": 1, "v": "AISTATS 2023"}, {"c": "Chen, Zhong, Yang, Wang & Wang (2022)", "t": "Human-in-the-loop: provably efficient preference-based RL with general function approximation", "n": "在一般函数逼近下给出偏好强化学习的样本复杂度，把理论从表格情形推进到深度模型适用的设定。", "v": "ICML 2022"}, {"c": "Zhu, Jordan & Jiao (2023)", "t": "Principled reinforcement learning with human feedback from pairwise or K-wise comparisons", "n": "分析 RLHF 中最大似然奖励估计加悲观策略优化的统计性质，给出次优性界，并指出关键在数据覆盖而非样本量。它是 RLHF 第一篇严格的统计分析。", "k": 1, "v": "ICML 2023"}, {"c": "Zhan, Uehara, Kallus, Lee & Sun (2023)", "t": "Provable offline preference-based reinforcement learning", "n": "给出离线偏好强化学习可行的条件（单策略集中性），说明什么样的历史数据足以支撑对齐，什么样的不行。", "v": "NeurIPS 2023"}, {"c": "Wang, Liu & Jin (2023)", "t": "Is RLHF more difficult than standard RL? A theoretical perspective", "n": "通过归约证明在多数标准设定下，偏好反馈的样本复杂度与数值奖励同阶。它给出了「放弃数值信息代价有多大」这一问题的乐观答案。", "k": 1, "v": "ICML 2023"}, {"c": "Munos et al. (2023)", "t": "Nash learning from human feedback", "n": "指出当偏好非传递时不存在一致的奖励函数，应把对齐目标改为偏好博弈的纳什均衡，并给出求解算法。这是解概念层面的转变。", "k": 1, "v": "arXiv 2023 / ICML 2024"}, {"c": "Swamy, Dann, Kidambi, Wu & Agarwal (2024)", "t": "A minimaximalist approach to reinforcement learning from human feedback (SPO)", "n": "用自博弈求解偏好博弈的极小极大解，无需奖励模型也无需对手网络，并给出收敛保证。它是 Nash 路线的简洁实现。", "v": "ICML 2024"}], "people": [{"n": "Thorsten Joachims & Yisong Yue（Cornell／Caltech）", "r": "决斗赌博机——比较反馈学习的原型模型与遗憾理论"}, {"n": "Paul Christiano & Jan Leike", "r": "深度偏好强化学习——RLHF 的技术原型"}, {"n": "Michael I. Jordan、Jiantao Jiao & Banghua Zhu（Berkeley）", "r": "RLHF 的统计理论：悲观 MLE 的次优性界与覆盖条件"}, {"n": "金驰 Chi Jin（Princeton）", "r": "证明 RLHF 在多数设定下不比标准强化学习更难"}, {"n": "Rémi Munos（DeepMind／Meta）", "r": "Nash learning from human feedback——非传递偏好下的均衡解"}, {"n": "Aldo Pacchiano & Aadirupa Saha", "r": "轨迹偏好强化学习的遗憾界"}, {"n": "Wen Sun & Nathan Kallus（Cornell）", "r": "离线偏好强化学习的可行性条件"}, {"n": "Eyke Hüllermeier & Johannes Fürnkranz", "r": "偏好学习的早期系统化与分类"}]}, {"id": "B43", "p": "B4", "num": "4.3", "name": "直接偏好优化理论", "kind": "leaf", "pillar": "ii", "summary": "研究无需显式奖励模型时，直接利用偏好数据优化策略的统计与优化性质：与经典 RLHF 的等价条件、过优化机制、对数据覆盖的敏感性、以及各类目标函数变体的差异。", "why": "关键洞察是：在 KL 约束下，最优策略与奖励函数一一对应，因此奖励可以被参数化为策略与参考策略的对数比，整个 RLHF 就塌缩成一个分类损失。这个变换在数学上是精确的，但它成立的前提（无限数据、完美覆盖）在实践中不满足，由此产生的偏差正是这个方向此后全部理论工作的对象。", "phases": [{"t": "前身：KL 正则策略优化（2010–2022）", "d": "带 KL 约束的策略优化有闭式最优解这一事实早在相对熵策略搜索与优势加权回归中被使用。标准 RLHF 采用监督微调、奖励建模、近端策略优化三段式，工程复杂且训练不稳定，这是直接方法出现的动因。"}, {"t": "直接偏好优化（2023）", "d": "利用 KL 约束下奖励与策略的一一对应，把奖励重参数化为对数比，从而把偏好学习变成一个二分类问题，完全去掉奖励模型与在线采样。方法极简且效果好，迅速成为开源模型对齐的默认做法。"}, {"t": "变体爆发与理论分析（2024）", "d": "指出当偏好接近确定时目标会无界外推，从而给出有界的替代目标与统一的理论范式；也出现用前景理论效用替代 Bradley–Terry、去掉参考模型、加入长度归一化等变体。同时理论与实证都发现：离线偏好数据的覆盖不足会使直接方法给分布外响应分配过高概率。"}, {"t": "回到在线（2024– ）", "d": "共识逐渐形成：直接方法的主要弱点是离线，解决办法是迭代或在线地用当前策略采样并重新标注偏好，从而在保持简洁的同时恢复覆盖。同时奖励过优化的标度律被推广到直接对齐算法上，说明它并未消除过优化，只是换了形式。"}], "papers": [{"c": "Rafailov, Sharma, Mitchell, Ermon, Manning & Finn (2023)", "t": "Direct preference optimization: your language model is secretly a reward model", "n": "证明 KL 约束下最优策略与奖励一一对应，从而把 RLHF 重写为对策略参数的二分类损失，去掉奖励模型与强化学习循环。它是近年对齐领域影响最大的单篇方法论文。", "k": 1, "v": "NeurIPS 2023"}, {"c": "Azar, Guo, Piot, Munos, Rowland, Valko & Calandriello (2024)", "t": "A general theoretical paradigm to understand learning from human preferences (IPO)", "n": "给出涵盖 RLHF 与 DPO 的统一目标族，并指出 DPO 在偏好接近确定时因对数比无界而过拟合，提出有界的 IPO 目标。这是该方向最重要的理论分析。", "k": 1, "v": "AISTATS 2024"}, {"c": "Ethayarajh, Xu, Muennighoff, Jurafsky & Kiela (2024)", "t": "KTO: model alignment as prospect theoretic optimization", "n": "用前景理论的人类效用函数替代 Bradley–Terry 假设，使方法只需二元的好／坏标注而非成对比较，大幅降低数据成本。", "v": "ICML 2024"}, {"c": "Zhao, Joshi, Liu, Khalman, Saleh & Liu (2023)", "t": "SLiC-HF: sequence likelihood calibration with human feedback", "n": "用序列似然校准的排序损失做对齐，是与 DPO 同期独立提出的直接方法，说明这一思路的收敛性。", "v": "arXiv 预印本"}, {"c": "Xu, Fu, Gao et a
